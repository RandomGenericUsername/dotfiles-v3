# The single AGS app list and ownership source (AD-31/AD-32).
#
# Final all-standalone topology: every AGS app is installed by the generic
# `ags_apps_units` role from its own immutable tag at
# <install>/apps/<installDir>/<tag>/ and resolves the ONE shared
# <install>/apps/node_modules/ags-platform shortcut. The retired `ags_apps`
# monorepo role/pin no longer exists, so a `legacy` entry would have no
# installer.
#
# The contracts repo owns the schema (v0.3.0,
# schemas/ags-apps-install-list.schema.json). `make deploy-coverage` validates
# this file against the same structural rules and the fixture set, then checks
# the final surfaces against the pinned engine's `ags_apps_units` and `verify`
# roles.
#
# Field notes:
#   app          manifest app id (one lowercase path segment)
#   installDir   per-app install dir: <install>/apps/<installDir>/<tag>
#   owner        standalone = the only owner (`ags_apps_units`)
#   repo, tag    immutable app repo + annotated tag
#   instance     AGS bus name (`ags list`)
#   configDir    deployed config dir / manifest configDir
#   configLink   config-link basename (must equal configDir)
#   spineLink    link basename under <install>/config
#   xdgLink      link basename under $XDG_CONFIG_HOME
#   binLink      optional app-owned command in the user bin dir
#   launcher     optional provisioned launcher command
#   autostart    autostart identity in the assets-owned autostart.lua
#   launch       always = installer-started; on-demand = launcher starts it
#   cutoverId    the per-app cutover ticket/epoch
apps:
  - app: bar
    installDir: bar
    owner: standalone
    repo: https://github.com/RandomGenericUsername/ags-bar.git
    tag: v0.1.2
    instance: ags
    configDir: ags
    configLink: ags
    spineLink: ags
    xdgLink: ags
    autostart: ags
    launch: always
    barPalettePointer: true
    cutoverId: REQ-015

  - app: notifications
    installDir: notifications
    owner: standalone
    repo: https://github.com/RandomGenericUsername/ags-notifications.git
    tag: v0.1.0
    instance: notifications
    configDir: ags-notifications
    configLink: ags-notifications
    spineLink: ags-notifications
    xdgLink: ags-notifications
    autostart: notifications
    launch: always
    cutoverId: REQ-012

  - app: capture
    installDir: capture
    owner: standalone
    repo: https://github.com/RandomGenericUsername/ags-capture-tool.git
    tag: v0.1.0
    instance: capture
    configDir: ags-capture
    configLink: ags-capture
    spineLink: ags-capture
    xdgLink: ags-capture
    binLink: capture-tool
    launcher: capture-ui
    autostart: capture
    launch: on-demand
    cutoverId: REQ-011

  - app: clipboard
    installDir: clipboard
    owner: standalone
    repo: https://github.com/RandomGenericUsername/ags-clipboard.git
    tag: v0.1.0
    instance: clipboard
    configDir: ags-clipboard
    configLink: ags-clipboard
    spineLink: ags-clipboard
    xdgLink: ags-clipboard
    launcher: clipboard-ui
    autostart: clipboard
    launch: on-demand
    cutoverId: REQ-009

  - app: wallpaper-selector
    installDir: wallpaper-selector
    owner: standalone
    repo: https://github.com/RandomGenericUsername/ags-wallpaper-selector.git
    tag: v0.1.0
    instance: wallpaper-selector
    configDir: ags-wallpaper-selector
    configLink: ags-wallpaper-selector
    spineLink: ags-wallpaper-selector
    xdgLink: ags-wallpaper-selector
    launcher: wallpaper-selector-ui
    launch: on-demand
    cutoverId: REQ-013

  - app: icme
    installDir: icme
    owner: standalone
    repo: https://github.com/RandomGenericUsername/ags-icme.git
    tag: v0.1.0
    instance: icon-color-mapping-editor
    configDir: ags-icme
    configLink: ags-icme
    spineLink: ags-icme
    xdgLink: ags-icme
    launcher: icon-color-mapping-editor
    launch: on-demand
    cutoverId: REQ-014

  - app: btop-theme-studio
    installDir: btop-theme-studio
    owner: standalone
