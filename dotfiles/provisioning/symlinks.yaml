# Symlinks from repo dotfiles/config/* to ~/.config/*.
#
# Only EXISTING config dirs (verified, plan §2): nvim, starship, wlogout, zsh.
# hypr/hyprpaper/waybar are NOT listed — those dirs land in Story 2.8; the
# verify playbook's symlink check requires every entry to resolve to a real file.
kind: symlinks
entries:
  - name: nvim
    target: nvim
  - name: starship
    target: starship
  - name: wlogout
    target: wlogout
  - name: zsh
    target: zsh
