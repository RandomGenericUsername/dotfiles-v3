# Desired logical package set (verified, plan §2/SPEC assumption).
#
# The verified set is distro-agnostic: per-manager package names (pacman/apt)
# resolve in Ansible group_vars (Story 2.2/2.3) — NFR-3 distro isolation lives
# in Ansible, never in this manifest or bootstrap.sh.
#
# The csg/weg/itr CLIs are NOT packages — they install via `uv tool install`
# and are listed in cli-tools.yaml.
kind: packages
entries:
  # Core Hyprland
  - name: hyprland
  - name: hyprpaper
  - name: ags
  - name: astal-hyprland      # Hyprland IPC + workspace tracking (AGS bar)
  - name: astal-battery       # UPower battery monitoring (AGS bar)
  - name: astal-network       # NetworkManager wrapper (AGS bar)
  - name: networkmanager      # Network backend for astal-network (bar) + NM stack
  - name: nm-connection-editor  # NM GUI connection editor (AGS Wi-Fi Settings footer target)
  - name: wifitui             # WiFi TUI (impala-style) on NetworkManager (bar click)
  - name: uwsm                # systemd-managed Wayland session launcher (fixes SDDM session bounce race)
  - name: fonts

  # Must-have utilities (from Hyprland wiki)
  - name: librsvg             # SVG rendering (gdk-pixbuf loader) for AGS bar icons
  - name: dunst              # Notification daemon
  - name: hyprpolkitagent    # Polkit authentication agent
  - name: xdg-desktop-portal-hyprland  # XDG Desktop Portal backend (XDPH)
  - name: xdg-desktop-portal-gtk      # File picker for XDPH (XDPH lacks one)
  # xdg-mime: the desktop default handlers. Provisioning sets one explicitly
  # (gui_tools: inode/directory -> thunar) instead of relying on the mime
  # database's resolution order, which otherwise picked kitty-open.desktop and
  # made the capture tool's "Show in folder" open a terminal.
  - name: xdg-utils
  - name: wl-clipboard       # Wayland clipboard utilities
  - name: grim               # Screenshot utility
  - name: slurp              # Region selection for screenshots

  # Screen / video capture stack
  - name: ffmpeg             # GIF conversion and general media tooling
  - name: pipewire           # Audio capture backend for recordings
  - name: wireplumber        # Audio device management for PipeWire
  - name: pipewire-audio     # BlueZ/A2DP SPA — Bluetooth audio sinks (settings panel)
  - name: pipewire-pulse     # PulseAudio-compatibility server (pavucontrol + Pulse clients)
  - name: pavucontrol        # Conventional GUI mixer — debugging/reference surface for the AGS audio popup
  - name: gpu-screen-recorder # Preferred Wayland recording backend with pause/resume
  - name: wf-recorder        # Fallback Wayland-native recorder
  # vainfo — VA-API codec probe. gpu-screen-recorder names it verbatim in its
  # own "your gpu does not support 'vpX'" failure, so the capture tool can tell a
  # hardware codec limit (WebM's gsr default is VP8) from a missing VA driver.
  - name: libva-utils
  - name: rofi               # Application launcher
  - name: thunar             # File manager (GTK-based)

  # System monitor (AGS bar icon launcher)
  - name: btop

  # Mail client (AGS bar icon launcher)
  - name: thunderbird

  # Music streaming client (rofi launcher; AUR-only on Arch — see
  # `aur_packages` in roles/packages/vars/arch.yml)
  - name: tidal-hifi

  # Portable power management (defacto: power-options-gtk)
  - name: power-options-gtk
  - name: hyprmod             # Hyprland module manager (GTK4/libadwaita)

  # Fn-key controllers (XF86 binds in keybindings.lua)
  - name: brightnessctl     # screen backlight
  - name: playerctl         # media transport (MPRIS)

  # AGS settings panel (settings-panel-provisioning gate). The AstalWp binding
  # is AUR-only on Arch (see `aur_packages` in roles/packages/vars/arch.yml):
  # astal-wp -> AstalWp (audio routing). Bluetooth is driven directly over BlueZ
  # D-Bus by the panel's own bluetooth-service.ts (no Astal Bluetooth binding);
  # bluez/bluez-utils ship the BlueZ daemon + bluetoothctl, and provisioning
  # enables bluetooth.service.
  #
  # blueman is the FULL Bluetooth GUI and the target of the panel's
  # "Bluetooth Settings" row. It is not the panel's dependency — the panel
  # drives BlueZ over D-Bus directly — but it is what makes a PIN/passkey
  # pairing completable, because the panel's own agent registers with the
  # `NoInputNoOutput` capability (Just Works) and cannot satisfy a PIN
  # request. Blueman supplies a `KeyboardDisplay` agent, so BlueZ can fall
  # back to it for the methods the panel cannot answer. Deliberately NOT
  # autostarted: its tray applet would sit in the bar owning a second agent
  # role for a GUI the user only opens deliberately.
  - name: astal-wp           # AstalWp — WirePlumber audio (settings panel volume)
  - name: bluez              # Bluetooth stack / bluetoothd
  - name: bluez-utils        # bluetoothctl + the bluetooth.service unit
  - name: blueman            # GTK Bluetooth manager — the "Bluetooth Settings" target

  # Additional useful tools
  # hyprcursor is deliberately NOT listed: hyprland Depends On it directly
  # (pacman -Qi hyprland -> Depends On: ... hyprcursor libhyprcursor.so=0-64),
  # so it arrives transitively with the hyprland package below, and nothing in
  # this repo configures a hyprcursor theme (cursor.lua only sets
  # no_hardware_cursors; XCURSOR_THEME is a plain Xcursor name). Listing it as
  # a standalone provision entry would duplicate a transitive dependency and
  # imply a consumer that does not exist.
  - name: hyprlock           # Screen locker
  - name: hypridle           # Idle management
  - name: wlogout            # Logout menu (AGS power-menu action)
  - name: speedtest          # Ookla speedtest CLI (network speed measurements)

  # AI development tools (provision-ai-ides-and-clis). All five are AUR-only
  # on Arch (see `aur_packages` in roles/packages/vars/arch.yml) and are
  # therefore mapped ONLY in group_vars/arch.yml — a Debian-family host does
  # not receive them (documented scope, not drift). Each IDE is made
  # rofi-launchable by a user-scoped desktop-entry override from the PINNED
  # `dotfiles-assets` desktop class (compositor_configs_desktop_entries, S4);
  # the two CLIs get kitty terminal launchers so they appear in rofi's drun
  # mode too.
  #
  #   windsurf -> devin-desktop: Windsurf (Codeium) was rebranded "Devin
  #   Desktop"; there is no `windsurf` AUR package any more. The logical key
  #   stays `windsurf` (the user's term) while the value tracks the upstream
  #   rebrand.
  #   vscode -> visual-studio-code-bin: the Microsoft build (Marketplace +
  #   Copilot). It conflicts with the OSS `code` package, which is not listed.
  - name: antigravity-ide    # Google Antigravity IDE (VS Code fork)
  - name: windsurf           # Windsurf / Devin Desktop (Codeium rebrand)
  - name: vscode             # Visual Studio Code (Microsoft build)
  - name: copilot-cli        # GitHub Copilot CLI (the new @github/copilot)
  - name: codex-cli          # OpenAI Codex CLI
