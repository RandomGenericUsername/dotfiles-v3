# One program tuple per install (AD-31/AD-34).
#
# The final all-standalone generation: every app repo and the composition build
# against these exact tags. The engine installs the shared `ags-platform` unit
# from this record; apps resolve it through the one
# <install>/apps/node_modules/ags-platform shortcut. A tuple bump is a
# program-wide revalidation event, never part of a single-app cutover.
#
# The contracts repo owns the schema (v0.3.0,
# schemas/program-tuple.schema.json) and `make deploy-coverage` validates the
# shape plus the engine/assets pin agreement.
schemaVersion: 1
ags-platform: v0.3.0
contracts: v0.3.0
dotfiles-assets: v0.6.2
