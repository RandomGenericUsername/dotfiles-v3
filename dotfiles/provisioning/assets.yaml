# Assets to deploy into the install spine (verified repo inventory, plan §5).
#
# `assets:` is the PINNED CORPUS (spine AD-6): the repository, the exact tag,
# and the destination class map. The assets role clones repo@tag ONCE into
# <install>/assets/<tag>/ and every corpus entry below reads from that checkout;
# nothing reads a composition-repo tree. A pin bump edits `assets.tag` AND the
# four checkout sources below (the role + verify mirrors are parity-locked by
# tests, and the sources are checked against `assets.tag`).
#
# Each entry is tagged with an AssetKind; `AssetKind.spine_segment()` resolves
# the deploy target under $XDG_DATA_HOME/dotfiles/. `source` is the path Ansible
# copies FROM: an ABSOLUTE install-spine path into the pinned assets checkout,
# or into a pinned CLI checkout for the template catalog (`tpr-templates` from
# tpr — spine AD-10). csg's template catalog is no longer deployed: the runtime
# accepts only the tpr palette producer, so there is no csg config dir or
# template set to populate. `skins` is the sixth corpus class: data only,
# mirrored to `<install>/skins` (the runtime's first skin root), never rendered
# or reconciled here. Rich keys are validated by
# YamlManifestReader but not captured into the domain view — Ansible reads the
# full YAML directly.
kind: assets

assets:
  repo: https://github.com/RandomGenericUsername/dotfiles-assets
  tag: v0.15.2
  classes:
    icons:     { dest: icons,     schema: icons/schema.json }
    templates: { dest: templates, schema: "**/*.vars.schema.json" }
    configs:   { dest: configs,   schema: null }
    content:   { dest: content,   schema: null }
    desktop:   { dest: desktop,   schema: desktop/desktop.yaml }
    skins:     { dest: skins,     schema: skins/schema.json }

entries:
  - name: wallpapers
    kind: wallpaper
    source: "{{ install_dir | trim }}/assets/v0.15.2/content/wallpapers/wallpapers.tar.gz"
  - name: icon-templates
    kind: icon-template
    source: "{{ install_dir | trim }}/assets/v0.15.2/icons/templates/"
  - name: icon-mappings
    kind: icon-mapping
    source: "{{ install_dir | trim }}/assets/v0.15.2/icons/mappings/"
  - name: skins
    kind: skins
    # ROOT-LEVEL DATA: the `skins` class is mirrored to `<install>/skins`, the
    # runtime's FIRST skin root (`derive._skin_roots`). Provisioning never
    # renders or reconciles it; the runtime reads the v2 manifests and publishes
    # the composed `current/appearance` generation from it.
    source: "{{ install_dir | trim }}/assets/v0.15.2/skins/"
  - name: tpr-templates
    kind: tpr-template
    # Mirror of the engine's `assets_checkout_copies` entry: the palette
    # producer's projection catalog is read from ITS pinned checkout (the
    # cli_tools role clones tpr before this role runs) and deployed into the
    # theme-producer config dir the runtime's TprAdapter reads.
    source: "{{ install_dir | trim }}/cli-tools/tpr/{{ cli_tools_tags.tpr }}/src/theme_producer/defaults/templates"
  - name: weg-effects
    kind: weg-effects
