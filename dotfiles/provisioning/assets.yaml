# Assets to deploy into the install spine (verified repo inventory, plan §5).
#
# `assets:` is the PINNED CORPUS (spine AD-6): the repository, the exact tag,
# and the destination class map. The assets role clones repo@tag ONCE into
# <install>/assets/<tag>/ and every corpus entry below reads from that checkout;
# nothing reads a composition-repo tree. A pin bump edits `assets.tag` AND the
# three checkout sources below (the role + verify mirrors are parity-locked by
# tests, and the sources are checked against `assets.tag`).
#
# Each entry is tagged with an AssetKind; `AssetKind.spine_segment()` resolves
# the deploy target under $XDG_DATA_HOME/dotfiles/. `source` is the path Ansible
# copies FROM: an ABSOLUTE install-spine path into the pinned assets checkout
# (or, for `csg-templates`, into the pinned csg checkout — spine AD-10). Rich
# keys are validated by YamlManifestReader but not captured into the domain view
# — Ansible reads the full YAML directly.
kind: assets

assets:
  repo: https://github.com/RandomGenericUsername/dotfiles-assets
  tag: v0.6.2
  classes:
    icons:     { dest: icons,     schema: icons/schema.json }
    templates: { dest: templates, schema: "**/*.vars.schema.json" }
    configs:   { dest: configs,   schema: null }
    content:   { dest: content,   schema: null }
    desktop:   { dest: desktop,   schema: desktop/desktop.yaml }

entries:
  - name: wallpapers
    kind: wallpaper
    source: "{{ install_dir | trim }}/assets/v0.6.2/content/wallpapers/wallpapers.tar.gz"
  - name: icon-templates
    kind: icon-template
    source: "{{ install_dir | trim }}/assets/v0.6.2/icons/templates/"
  - name: icon-mappings
    kind: icon-mapping
    source: "{{ install_dir | trim }}/assets/v0.6.2/icons/mappings/"
  - name: csg-templates
    kind: csg-template
    # ABSOLUTE install-spine path INTO the pinned csg checkout (spine AD-10):
    # csg is consumed from its pinned repo, so its template catalog is no
    # longer a repo tree. The cli_tools role clones csg at the pin into
    # <install>/cli-tools/csg/<tag>/ and cli-tools.yaml runs BEFORE assets.yaml
    # (bootstrap order, locked by the dependency-order test). The role mirrors
    # this path in `assets_csg_templates_source` (+ the `assets_csg_pinned_tag`
    # mirror of this tag), and the parity test fails if they drift.
    source: "{{ install_dir | trim }}/cli-tools/csg/v0.2.1/src/color_scheme_generator/defaults/templates"
  - name: weg-effects
    kind: weg-effects
