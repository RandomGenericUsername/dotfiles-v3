source = {{ compositor_configs_xdg_config_home }}/hypr/colors.conf

# Hyprland skeleton config (Story 2.8) — FIRST-BOOT MINIMAL.
# Colors come from the sourced colors.conf fragment (Story 2.7 / 2.9), which
# exposes $background, $foreground, $cursor, $accent and $color0..15.
# Phase 2 owns rich theming; do not gold-plate this file.

monitor = ,preferred,auto,1

general {
    col.active_border = $color1
    col.inactive_border = $background
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    layout = dwindle
}

decoration {
    rounding = 8
    active_opacity = 1.0
    inactive_opacity = 0.9
    # `shadow` bare option is deprecated (0.56); the shadow controls now live
    # under the `shadow:*` sub-options inside `decoration`.
    shadow:enabled = 0
}

animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 4, myBezier
    animation = workspaces, 1, 4, default
}

input {
    kb_layout = us
    follow_mouse = 1
}

# Minimal-but-usable keybindings (the skeleton was missing these entirely —
# without binds, super+enter etc. do nothing and the session feels frozen).
$mod = SUPER
# Terminal
bind = $mod, Return, exec, xfce4-terminal
# Window management
bind = $mod, Q, killactive
bind = $mod, F, fullscreen
bind = $mod, M, exit
# Focus / move
bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, K, movefocus, u
bind = $mod, J, movefocus, d
# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5

# Cursor (hyprcursor present; a visible, working cursor needs this)
cursor {
    no_hardware_cursors = true
}

exec-once = hyprpaper
exec-once = ags run
