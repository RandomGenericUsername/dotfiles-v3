# Bar-facing microphone indicator. Kept separate from the capture-tool group
# because the bar-icon contrast guard retargets group-level COLOR_FOREGROUND of
# bar groups only; capture-tool renders on its own dark panel and must stay
# byte-identical. Two states: `mic-on` (idle/active) and `mic-off` (muted).
microphone:
  color_mappings:
    COLOR_FOREGROUND: foreground
  variants:
    - name: mic-on
      template: microphone/default/mic-on.svg
      output: microphone-mic-on.svg
    - name: mic-off
      template: microphone/default/mic-off.svg
      output: microphone-mic-off.svg

