ui:
  color_mappings:
    COLOR_FOREGROUND: color15
    COLOR_ACCENT: color12
  variants:
    - name: search
      template: ui/search/default/icon.svg
      output: ui-search.svg
      # The magnifier sits on the SOLID search field (`@color_01`), not directly
      # on the wallpaper, so it must follow the palette foreground like the
      # entry text. Variant-level mappings are exempt from the bar-icon contrast
      # guard (it only retargets group-level placeholders), which otherwise
      # recolours this glyph against the wallpaper and can wash it out on the
      # field. See gui-unification-ux-spec §4/§5.
      color_mappings:
        COLOR_FOREGROUND: color15
    - name: text
      template: ui/text/default/icon.svg
      output: ui-text.svg
    - name: image
      template: ui/image/default/icon.svg
      output: ui-image.svg
    - name: link
      template: ui/link/default/icon.svg
      output: ui-link.svg
    - name: code
      template: ui/code/default/icon.svg
      output: ui-code.svg
    - name: color
      template: ui/color/default/icon.svg
      output: ui-color.svg
    - name: emoji
      template: ui/emoji/default/icon.svg
      output: ui-emoji.svg

settings:
  color_mappings:
    COLOR_FOREGROUND: foreground
  variants:
    - name: default
      template: status-bar/settings/default/icon.svg
      output: status-bar-settings.svg

  bar_mappings:
    widget: settings
    icon_size: 24
    states:
      default: default

settings-panel:
  color_mappings:
    COLOR_FOREGROUND: foreground
  variants:
    # The capability glyphs bake their own on/off tint through ITR (accent when
    # on, muted when off) so the panel renders bare glyphs — no CSS filter, no
    # background box. Variant-level mappings win over the group's foreground.
    - name: wifi
      template: settings-panel/wifi/default/icon.svg
      output: settings-panel-wifi.svg
      color_mappings:
        COLOR_FOREGROUND: color13
    # The off variants use the neutral foreground token (NOT a second palette
    # hue): on some wallpapers color11 and color13 are near-identical, so hue
    # cannot carry the state. The panel dims the off glyph via opacity, matching
    # the GUI family's disabled treatment — brightness, not hue, carries "off".
    - name: wifi-off
      template: settings-panel/wifi/default/icon.svg
      output: settings-panel-wifi-off.svg
      color_mappings:
        COLOR_FOREGROUND: foreground
    - name: bluetooth
      template: settings-panel/bluetooth/default/icon.svg
      output: settings-panel-bluetooth.svg
      color_mappings:
        COLOR_FOREGROUND: color13
    - name: bluetooth-off
      template: settings-panel/bluetooth/default/icon.svg
      output: settings-panel-bluetooth-off.svg
      color_mappings:
        COLOR_FOREGROUND: foreground
    # Hyprmod is a stateless action, so it inherits the group foreground.
    - name: hyprmod
      template: settings-panel/hyprmod/default/icon.svg
      output: settings-panel-hyprmod.svg

