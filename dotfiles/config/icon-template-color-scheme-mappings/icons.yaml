capture-tool:
  color_mappings:
    COLOR_FOREGROUND: foreground
    COLOR_ACCENT: color13
  variants:
    - name: camera
      template: capture-tool/default/camera.svg
      output: capture-tool-camera.svg
    - name: video
      template: capture-tool/default/video.svg
      output: capture-tool-video.svg
    - name: region
      template: capture-tool/default/region.svg
      output: capture-tool-region.svg
    - name: monitor
      template: capture-tool/default/monitor.svg
      output: capture-tool-monitor.svg
    - name: window
      template: capture-tool/default/window.svg
      output: capture-tool-window.svg
    - name: clipboard
      template: capture-tool/default/clipboard.svg
      output: capture-tool-clipboard.svg
    - name: save
      template: capture-tool/default/save.svg
      output: capture-tool-save.svg
    - name: speaker
      template: capture-tool/default/speaker.svg
      output: capture-tool-speaker.svg
    # The mic art is single-sourced from the bar-facing `microphone` group
    # (microphone/default/mic-on.svg); this variant re-exports it under the
    # capture tool's frozen variant name so the capture UI keeps resolving
    # `capture-tool/mic` without its own copy of the artwork.
    - name: mic
      template: microphone/default/mic-on.svg
      output: capture-tool-mic.svg
    - name: info
      template: capture-tool/default/info.svg
      output: capture-tool-info.svg
    - name: warning
      template: capture-tool/default/warning.svg
      output: capture-tool-warning.svg
    - name: pause
      template: capture-tool/default/pause.svg
      output: capture-tool-pause.svg
    - name: play
      template: capture-tool/default/play.svg
      output: capture-tool-play.svg
    - name: stop
      template: capture-tool/default/stop.svg
      output: capture-tool-stop.svg
    # Notification tints: the same glyphs recoloured per outcome so the cards
    # read at a glance (success = the accent used across the capture stack,
    # failure = the caution slot). Variant-level color_mappings win over the
    # group's, so these render as tinted copies while the base variants stay
    # foreground-coloured for the capture window and bar.
    - name: camera-accent
      template: capture-tool/default/camera.svg
      output: capture-tool-camera-accent.svg
      color_mappings:
        COLOR_FOREGROUND: color6
    - name: video-accent
      template: capture-tool/default/video.svg
      output: capture-tool-video-accent.svg
      color_mappings:
        COLOR_FOREGROUND: color6
    - name: warning-caution
      template: capture-tool/default/warning.svg
      output: capture-tool-warning-caution.svg
      color_mappings:
        COLOR_FOREGROUND: color3

