battery:
  color_mappings:
    COLOR_ACCENT: color13
    COLOR_FOREGROUND: color15
  variants:
    - name: battery-0
      template: status-bar/battery/battery-0/default/icon.svg
      output: battery-0.svg
    - name: battery-25
      template: status-bar/battery/battery-25/default/icon.svg
      output: battery-25.svg
    - name: battery-50
      template: status-bar/battery/battery-50/default/icon.svg
      output: battery-50.svg
    - name: battery-75
      template: status-bar/battery/battery-75/default/icon.svg
      output: battery-75.svg
    - name: battery-100
      template: status-bar/battery/battery-100/default/icon.svg
      output: battery-100.svg
    - name: battery-0-charging
      template: status-bar/battery/battery-0-charging/default/icon.svg
      output: battery-0-charging.svg
    - name: battery-25-charging
      template: status-bar/battery/battery-25-charging/default/icon.svg
      output: battery-25-charging.svg
    - name: battery-50-charging
      template: status-bar/battery/battery-50-charging/default/icon.svg
      output: battery-50-charging.svg
    - name: battery-75-charging
      template: status-bar/battery/battery-75-charging/default/icon.svg
      output: battery-75-charging.svg
    - name: battery-100-charging
      template: status-bar/battery/battery-100-charging/default/icon.svg
      output: battery-100-charging.svg
    - name: plugged
      template: status-bar/battery/plugged/default/icon.svg
      output: plugged.svg

      color_mappings:
        COLOR_FOREGROUND: color15
  bar_mappings:
    widget: battery
    icon_size: 24
    states:
      discharging-0: battery-0
      discharging-25: battery-25
      discharging-50: battery-50
      discharging-75: battery-75
      discharging-100: battery-100
      charging-0: battery-0-charging
      charging-25: battery-25-charging
      charging-50: battery-50-charging
      charging-75: battery-75-charging
      charging-100: battery-100-charging
      plugged: plugged

