version = "1.0"

[output]
verbosity = 1
directory = "/tmp/color-scheme"
default_formats = ["json", "sh"]
overwrite = false

[generation]
backend = "pywal"
default_params = {}



[runtime]
mode = "local"

[container]
engine = "docker"
image_prefix = "csg"
image_tag = "latest"
timeout_seconds = 300
memory_limit = "512m"
mount_timeout_seconds = 30
