custom:
  description: "Custom backend using scikit-learn KMeans clustering"
  display_name: "Custom"
  parameters:
    - key: saturation
      param_type: float
      default: 1.0
      description: "Saturation adjustment factor"
      required: false
    - key: n_clusters
      param_type: int
      default: 16
      description: "Number of color clusters to extract"
      required: false
    - key: algorithm
      param_type: str
      default: kmeans
      choices:
        - kmeans
      description: "Clustering algorithm"
      required: false

pywal:
  description: "pywal color extraction backend"
  display_name: "Pywal"
  parameters:
    - key: saturation
      param_type: float
      default: 1.0
      description: "Saturation adjustment factor"
      required: false
    - key: algorithm
      param_type: str
      default: wal
      choices:
        - auto
        - thief
        - color
        - haishoku
        - colorthief
        - wal
      description: "Color extraction algorithm"
      required: false

wallust:
  description: "wallust color extraction backend"
  display_name: "Wallust"
  parameters:
    - key: saturation
      param_type: float
      default: 1.0
      description: "Saturation adjustment factor"
      required: false
    - key: algorithm
      param_type: str
      default: fastresize
      choices:
        - full
        - resized
        - wal
        - thumb
        - fastresize
        - kmeans
      description: "Color extraction algorithm"
      required: false
