[project]
name = "color-scheme-generator"
version = "0.1.0"
description = "Extract color palettes from wallpaper images for desktop theming"
requires-python = ">=3.14"
dependencies = [
    "typer>=0.12",
    "config-assembler-engine",
    "pydantic>=2.0",
    "jinja2>=3.1",
    "rich>=13.0",
]

[project.scripts]
csg = "color_scheme_generator.cli.main:app"

[project.optional-dependencies]
custom = ["pillow>=11", "numpy>=2", "scikit-learn>=1.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/color_scheme_generator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.uv.sources]
config-assembler-engine = { path = "../../shared/config-assembler-engine", editable = true }

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]
ignore = ["B905"]

[tool.ruff.format]
quote-style = "double"
