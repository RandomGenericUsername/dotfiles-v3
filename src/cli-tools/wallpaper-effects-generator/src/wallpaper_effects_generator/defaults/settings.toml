version = "1.0"

[execution]
parallel = true
strict = true
max_workers = 4

[output]
verbosity = 1
directory = "/tmp/wallpaper-effects"

[processing]
temp_dir = "/tmp/.wallpaper-effects-tmp"

[backend]
binary = "magick"

[runtime]
mode = "local"

[container]
engine = "docker"
image_name = "weg"
image_tag = "latest"
image_registry = ""
