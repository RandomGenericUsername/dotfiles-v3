version: '1.0'
parameter_types:
  blur_geometry:
    type: string
    description: Blur geometry in format RADIUSxSIGMA (e.g., 0x8)
    pattern: ^\d+x\d+$
    default: '0x8'
  percent:
    type: integer
    description: Percentage value (-100 to 100)
    default: 0
    min: -100
    max: 100
  color_hex:
    type: string
    description: 'Hex color code (e.g., #ff5500)'
    pattern: ^#[0-9a-fA-F]{6}$
    default: '#000000'
  opacity:
    type: float
    description: Opacity value (0.0 to 1.0)
    default: 0.5
effects:
- name: blur
  description: Apply Gaussian blur
  command: magick "{{input}}" -blur "{{blur}}" "{{output}}"
  item_type: effect
  parameters:
    blur:
      type: blur_geometry
      cli_flag: --blur
      description: Blur geometry (RADIUSxSIGMA)
- name: blackwhite
  description: Convert to grayscale
  command: magick "{{input}}" -grayscale Average "{{output}}"
  item_type: effect
- name: negate
  description: Invert colors
  command: magick "{{input}}" -channel RGB -negate +channel "{{output}}"
  item_type: effect
- name: brightness
  description: Adjust brightness/contrast
  command: magick "{{input}}" -brightness-contrast "{{brightness}}"% "{{output}}"
  item_type: effect
  parameters:
    brightness:
      type: percent
      cli_flag: --brightness
      description: Brightness adjustment percentage
      default: -20
- name: contrast
  description: Adjust contrast
  command: magick "{{input}}" -brightness-contrast 0x"{{contrast}}"% "{{output}}"
  item_type: effect
  parameters:
    contrast:
      type: percent
      cli_flag: --contrast
      description: Contrast adjustment percentage
      default: 20
- name: saturation
  description: Adjust color saturation
  command: magick "{{input}}" -modulate 100,"{{saturation}}",100 "{{output}}"
  item_type: effect
  parameters:
    saturation:
      type: integer
      cli_flag: --saturation
      description: Saturation level (100 = normal, 0 = grayscale, 200 = double)
      default: 100
      min: 0
      max: 200
- name: sepia
  description: Apply sepia tone effect
  command: magick "{{input}}" -sepia-tone 80% "{{output}}"
  item_type: effect
- name: vignette
  description: Apply vignette effect
  command: magick "{{input}}" -vignette 0x"{{strength}}" "{{output}}"
  item_type: effect
  parameters:
    strength:
      type: integer
      cli_flag: --strength
      description: Vignette strength
      default: 50
      min: 0
      max: 100
- name: color_overlay
  description: Apply color overlay
  command: magick "{{input}}" -fill {{color}} -colorize {{opacity}}% "{{output}}"
  item_type: effect
  parameters:
    color:
      type: color_hex
      cli_flag: --color
      description: Overlay color
      default: '#000000'
    opacity:
      type: integer
      cli_flag: --opacity
      description: Overlay opacity percentage (0-100)
      default: 30
      min: 0
      max: 100
composites:
- name: blur-brightness80
  description: Blur then dim to 80% brightness
  steps:
  - effect_name: blur
    parameters:
      blur: '0x8'
  - effect_name: brightness
    parameters:
      brightness: '-20'
- name: blackwhite-blur
  description: Convert to grayscale then blur
  steps:
  - effect_name: blackwhite
  - effect_name: blur
    parameters:
      blur: '0x8'
- name: blackwhite-brightness80
  description: Convert to grayscale then dim
  steps:
  - effect_name: blackwhite
  - effect_name: brightness
    parameters:
      brightness: '-20'
- name: negate-brightness80
  description: Invert colors then adjust brightness
  steps:
  - effect_name: negate
  - effect_name: brightness
    parameters:
      brightness: '20'
presets:
- name: dark_blur
  description: Dark blurred background for overlays
  effects:
  - blur
  - brightness
  parameters:
    blur: '0x8'
    brightness: '-20'
- name: subtle_blur
  description: Gentle blur effect
  effects:
  - blur
  parameters:
    blur: '0x4'
- name: dim
  description: Slightly dimmed image
  effects:
  - brightness
  parameters:
    brightness: '-30'
- name: high_contrast
  description: High contrast effect
  effects:
  - contrast
  parameters:
    contrast: '40'
- name: desaturated
  description: Reduced color saturation
  effects:
  - saturation
  parameters:
    saturation: '50'
- name: warm_overlay
  description: Warm orange tint
  effects:
  - color_overlay
  parameters:
    color: '#ff8800'
    opacity: '20'
- name: cool_overlay
  description: Cool blue tint
  effects:
  - color_overlay
  parameters:
    color: '#0088ff'
    opacity: '20'
