[project]
name = "wallpaper-effects-generator"
version = "0.1.0"
description = "Wallpaper effects generator with hexagonal architecture"
requires-python = ">=3.12"
dependencies = [
    "cli-invocation-contract",
    "cli-output>=0.1.0",
    "config-assembler-engine>=0.1.0",
    "oci-runtime>=0.3.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "typer>=0.27.0",
    "rich>=13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wallpaper_effects_generator"]

[project.scripts]
weg = "wallpaper_effects_generator.cli.main:app"

[tool.uv.sources]
cli-invocation-contract = { git = "https://github.com/RandomGenericUsername/contracts", tag = "v0.1.0" }
cli-output = { git = "https://github.com/RandomGenericUsername/cli-output", tag = "v0.1.0" }
config-assembler-engine = { git = "https://github.com/RandomGenericUsername/config-assembler-engine", tag = "v0.1.0" }
oci-runtime = { git = "https://github.com/RandomGenericUsername/oci-runtime", tag = "v0.5.0" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]
ignore = ["B905"]

[tool.ruff.format]
quote-style = "double"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.0",
    "ruff>=0.15",
]
