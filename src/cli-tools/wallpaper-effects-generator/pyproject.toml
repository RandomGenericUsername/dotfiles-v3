[project]
name = "wallpaper-effects-generator"
version = "0.1.0"
description = "Wallpaper effects generator with hexagonal architecture"
requires-python = ">=3.12"
dependencies = [
    "config-assembler-engine>=0.1.0",
    "oci-runtime>=0.3.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "typer[all]>=0.9.0",
    "rich>=13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wallpaper_effects_generator"]

[tool.hatch.build.targets.wheel.force-include]
"src/wallpaper_effects_generator/defaults" = "wallpaper_effects_generator/defaults"

[project.scripts]
weg = "wallpaper_effects_generator.cli.main:app"

[tool.uv.sources]
config-assembler-engine = { path = "../../src/shared/config-assembler-engine", editable = true }
oci-runtime = { path = "../../src/shared/oci-runtime", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]
ignore = ["B905"]

[tool.ruff.format]
quote-style = "double"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.0",
    "ruff>=0.15",
]
