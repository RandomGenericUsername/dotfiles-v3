[project]
name = "icon-templates-renderer"
version = "0.1.0"
description = "SVG icon template renderer for color schemes"
requires-python = ">=3.14"
dependencies = [
    "typer>=0.12",
    "config-assembler-engine",
    "cli-output",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.scripts]
itr = "icon_templates_renderer.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = [
    "src/icon_templates_renderer/**",
]

[tool.hatch.build.targets.wheel]
packages = ["src/icon_templates_renderer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = ["--strict-markers", "-rxX"]

[tool.uv.sources]
cli-output = { path = "../../shared/cli-output", editable = true }
config-assembler-engine = { path = "../../shared/config-assembler-engine", editable = true }

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]
ignore = ["B905"]

[tool.ruff.format]
quote-style = "double"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
