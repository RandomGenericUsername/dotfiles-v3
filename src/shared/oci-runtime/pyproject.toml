[project]
name = "oci-runtime"
version = "0.4.0"
description = "Runtime-agnostic OCI container management with hexagonal architecture"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.0",
    "ruff>=0.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oci_runtime"]

[tool.uv.sources]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "docker_required: test requires Docker to be installed",
    "podman_required: test requires Podman to be installed",
    "runtime_required: test requires any container runtime (docker or podman)",
    "smoke: quick smoke test that proves the system works end-to-end",
    "functional: multi-step user workflow test",
    "slow: test that requires real CLI output or is slow to run",
]
