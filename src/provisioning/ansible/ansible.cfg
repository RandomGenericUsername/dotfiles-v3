# Ansible configuration for the dotfiles provisioning scaffold.
#
# Discovery note: ansible-core 2.21 has NO playbook-relative discovery
# (search order is ANSIBLE_CONFIG → CWD → HOME → /etc/ansible). The executor
# therefore passes ANSIBLE_CONFIG pointing at THIS file (see
# adapters/ansible_executor.py `_ansible_env`). Relative paths here resolve
# relative to this cfg file's own directory — verified against ansible-core
# 2.21 — regardless of CWD.
[defaults]
inventory = inventory/localhost.yaml
roles_path = roles
# remote_tmp: Ansible defaults task temp files to ~/.ansible/tmp under the
# INVOKING user. When the packages role runs become_user: aur_builder as root
# (e.g. inside a root container, or a root apply), the staged temp files under
# /root are unreadable by the unprivileged become user and Ansible aborts with
# the temp-file ownership guard. /tmp is world-sticky + writable, so the
# become_user transition works regardless of the invoking user. Fixes the
# filed deferred-work 3-2 defect #2; the group_vars discovery half was already
# resolved by the inventory/group_vars symlink (commit 57063f5).
remote_tmp = /tmp/dotfiles-ansible
