# Ansible configuration for the dotfiles provisioning scaffold.
#
# Discovery note: ansible-core 2.21 has NO playbook-relative discovery
# (search order is ANSIBLE_CONFIG → CWD → HOME → /etc/ansible). The executor
# therefore passes ANSIBLE_CONFIG pointing at THIS file (see
# adapters/ansible_executor.py `_ansible_env`). Relative paths here resolve
# relative to this cfg file's own directory — verified against ansible-core
# 2.21 — regardless of CWD.
[defaults]
inventory = inventory/localhost.yaml
roles_path = roles
