# Bootstrap playbook (Story 2.12) — the AGGREGATE run (FR-4): imports every
# per-role playbook in dependency order so one `ansible-playbook bootstrap.yaml`
# (or `dotfiles-provision bootstrap`) provisions the whole machine, then
# verifies it (done-criteria 1-10).
#
# Dependency order rationale (plan §11 step 7, story 2.12 AC 4, Epic 4):
#   packages → cli_tools → filesystem → assets →
#   compositor_configs → config_copies → settings → zsh_tools → zsh_config →
#   wlogout_config → config_links → runtime-seed → display_manager →
#   gloview-plugin → verify
# `packages` first (it installs the system packages everything else assumes —
# including the cmake build deps the gloview Hyprland plugin compiles
# against), `verify` last (it asserts every done-criterion after all roles
# placed their outputs). `gloview-plugin` runs after display_manager so the
# full desktop stack exists, and before verify: it synchronizes the hyprpm
# headers and rebuilds/reloads GloView, which backs the provision-owned
# touchpad gestures (dotfiles/config/hypr/{input,gloview}.lua). Without it in
# the chain, the first Hyprland upgrade after install silently kills every
# gesture until a manual `hyprpm update`.
# icons roles — the runtime-seed step (`dotfiles-runtime wallpaper set
# <install>/wallpapers/default.png`) is the single producer of generated
# artifacts (cache entries, current.json, current/ + R2 consumer symlinks).
# The chain's seams are consumed in order: filesystem creates the
# layout, assets populate the spine inputs, compositor_configs +
# config_copies place configs (skeletons only — no palette fragments),
# settings renders the per-tool files, zsh_tools
# provisions the shell clone-tools, zsh_config + wlogout_config RENDER the
# shell templates (zsh .zshrc, wlogout style.css), config_links symlinks the
# managed configs into the XDG home (config-in-spine pattern), runtime-seed
# derives + swaps the desktop state, display_manager provisions the Wayland-friendly
# greetd login (X11-free, no GPU conflict), verify re-checks all of it
# against current-only criteria.
#
# import_playbook semantics: each imported playbook keeps its OWN
# hosts/become/gather_facts/group_by — packages.yaml's two-play structure
# (group_by on the `os_family` seam, then a become:true packages play) works
# unmodified when imported; the user-scoped roles keep NO become. Do NOT
# flatten into one play — mixing become (packages) with user-scoped roles in a
# single play breaks the locked privilege contract.
#
# --check cleanliness (dry-run must be dry): packages' `package` module reports
# would-change (no mutation); cli_tools/assets use command/creates tasks
# skipped under --check; compositor_configs/config_copies gate
# their state-touching tasks; settings' template has full check-mode support;
# runtime-seed's wallpaper-set command is check-gated; the aggregate therefore
# completes cleanly without mutation.
#
# Seam extra-vars a direct run must pass (`-e install_dir=...` and
# `-e os_family=arch|debian-family`): the orchestrator provides both via
# --extra-vars (use_cases `_seam_extra_vars`). `os_family` is REQUIRED because
# packages.yaml group_by's on it and its guard asserts the value matches the
# host fact. NOTE: this file is imports-only — every top-level entry below is
# an `import_playbook` statement; there is no play (no hosts/roles/tasks).
- import_playbook: packages.yaml
- import_playbook: cli-tools.yaml
- import_playbook: filesystem.yaml
- import_playbook: assets.yaml
- import_playbook: compositor-configs.yaml
- import_playbook: config-copies.yaml
- import_playbook: settings.yaml
- import_playbook: zsh-tools.yaml
- import_playbook: zsh-config.yaml
- import_playbook: wlogout-config.yaml
- import_playbook: config-links.yaml
- import_playbook: runtime-seed.yaml
- import_playbook: display-manager.yaml
- import_playbook: gloview-plugin.yaml
- import_playbook: verify.yaml
