# Config-links playbook (Story 3.4 / config-in-spine pattern) — one-per-role
# playbook; aggregation into bootstrap.yaml is Story 2.12.
#
# Symlinks every managed config dir at its native XDG location into the spine:
# ~/.config/<name> -> <install>/config/<name>. The writing roles (assets,
# compositor_configs, config_copies, settings) populated <install>/config/
# BEFORE this role runs — it only creates the links + the backup/migration
# guard. See docs/02-config-in-spine-pattern.md.
#
# User-scoped playbook: NO become (the links live under the user's config
# home; running as root would link the wrong home).
#
# Distro-agnostic: symlinking is identical on Arch and Debian-family and the
# role consumes no group_vars — so unlike packages.yaml there is NO group_by
# distro-selection mechanism.
#
# gather_facts: true is REQUIRED — vars/main.yml derives
# config_links_xdg_config_home from {{ ansible_facts.env.HOME }} and
# {{ ansible_facts.env.XDG_CONFIG_HOME }}, which are only populated after the
# fact-gathering setup module runs.
- name: Link managed configs into the XDG config home
  hosts: localhost
  gather_facts: true
  roles:
    - config_links
