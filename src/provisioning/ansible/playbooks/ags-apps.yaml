# ags-apps playbook (spine AD-1/AD-17/AD-23) — one-per-role playbook; aggregation
# into bootstrap.yaml is the sibling roles' pattern.
#
# User-scoped playbook: NO become (the unit, the resolution shortcut, and the
# live-bar link all land under the user's install_dir; running as root would
# diverge from the intended user's layout).
#
# Distro-agnostic: a git clone + symlinks are identical on Arch and
# Debian-family, so unlike packages.yaml there is NO group_by distro-selection
# mechanism.
#
# gather_facts: true is REQUIRED — the role derives its install-root and config
# paths from {{ install_dir }} and (like the sibling roles) the playbook must
# gather facts so any env-derived value resolves. It also keeps the playbook
# shape identical to compositor-configs.yaml / ags-platform.yaml.
- name: Install the AGS bar as one versioned unit and deploy it as the live bar
  hosts: localhost
  gather_facts: true
  roles:
    - ags_apps
