# Zsh-config playbook (Story 3.4 / shell wiring) — one-per-role playbook.
#
# Renders the user's .zshrc from the pinned assets corpus template
# (templates/zsh/.zshrc.j2 in dotfiles-assets, read from
# <install>/assets/<tag>/ since S3) into <install>/config/zsh/.zshrc, resolving
# every template variable to the provisioned path. Runs AFTER packages + zsh_tools (plugins + clone tools
# exist) and BEFORE config_links (which symlinks ~/.config/zsh).
#
# User-scoped: the role escalates ONLY for the login-shell mutation, and only
# after an unprivileged `getent passwd` probe proves the shell differs from
# /usr/bin/zsh (an already-zsh host needs no sudo password). Distro-agnostic at
# the play level (plugin paths resolve inside the role via ansible_os_family).
# gather_facts: true REQUIRED — vars derive ansible_facts + the seam.
- name: Render user zsh config
  hosts: localhost
  gather_facts: true
  roles:
    - zsh_config
