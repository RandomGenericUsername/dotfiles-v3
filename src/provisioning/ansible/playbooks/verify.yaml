# Verify playbook (Story 2.12) — one-per-role playbook; the last import of the
# aggregate bootstrap.yaml.
#
# Assert the ten done-criteria (plan §8, SPEC.md CAP-3) against PROVISIONED
# locations only — the user config home and the install spine. This is the
# "machine, not repo" hardening: the gate must never go green because the repo
# still exists while the machine is unprovisioned.
#
# User-scoped playbook: NO become (everything checked lives under the user's
# config home and install_dir; running as root would check the wrong layout).
#
# Distro-agnostic: verifying the done-criteria is identical on Arch and
# Debian-family and the role consumes no group_vars — so unlike packages.yaml
# there is NO group_by distro-selection mechanism.
#
# gather_facts: true is REQUIRED — vars/main.yml derives verify_xdg_config_home
# and verify_cli_bin_dir from {{ ansible_facts.env.HOME }} and
# {{ ansible_facts.env.XDG_CONFIG_HOME }}, and the tasks read
# {{ ansible_facts.env.PATH }}, which are only populated after the
# fact-gathering setup module runs. The first role task asserts this fails
# loudly.
#
# install_dir seam contract: the role asserts the install-spine paths from the
# install_dir seam extra-var. The second role task asserts it is provided as an
# absolute, non-empty path (hardened form); direct runs pass -e install_dir=...
#
# Real-verify vs --check semantics: `dotfiles-provision verify` runs this
# playbook with check=False — that is the authoritative gate. Under
# `bootstrap.yaml --check` every existence/isdir/rc assert is skipped
# (`when: not ansible_check_mode` in the role) so the dry run stays clean and
# mutation-free while the real verify enforces the ten criteria.
- name: Assert the ten done-criteria hold
  hosts: localhost
  gather_facts: true
  roles:
    - verify
