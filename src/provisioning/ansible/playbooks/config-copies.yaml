# Config copies playbook (Story 2.10, pivot 2026-08-12) — one-per-role
# playbook; aggregation into bootstrap.yaml is Story 2.12.
#
# Runtime independence (pivot): the role COPIES repo config dirs into the user
# config home — nothing in the repo is referenced at runtime, so the machine
# keeps working after the repo is deleted.
#
# User-scoped playbook: NO become (everything the role writes lives under the
# user's config home; running as root would diverge from the intended user's
# layout).
#
# Distro-agnostic: config copying is identical on Arch and Debian-family and
# the role consumes no group_vars — so unlike packages.yaml there is NO
# group_by distro-selection mechanism.
#
# gather_facts: true is REQUIRED — vars/main.yml derives
# config_copies_xdg_config_home from {{ ansible_facts.env.HOME }} and
# {{ ansible_facts.env.XDG_CONFIG_HOME }}, which are only populated after the
# fact-gathering setup module runs. The first task asserts this fails loudly.
- name: Copy configs into XDG config home
  hosts: localhost
  gather_facts: true
  roles:
    - config_copies
