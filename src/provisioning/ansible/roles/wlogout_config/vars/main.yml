# Wlogout-config role vars (Story 3.4 / shell wiring).

# wlogout_config_spine_dir: where the rendered style.css lands
#   (config-in-spine home). Trim lock.
wlogout_config_spine_dir: "{{ install_dir | trim }}/config/wlogout"

