# Compositor configs role vars (Story 2.9).
#
# The role copies the static skeletons authored by Story 2.8 from
# dotfiles/config/{hypr,hyprpaper,waybar}/ into the user config dirs the
# filesystem role (2.5) created, and copies the palette fragments the
# default_palette role (2.7) generated (<install>/generated/palettes/) into
# the user config (FR-19, chaining-spine.md). The skeletons NEVER change on
# re-run; the fragment files are the ONLY overwrite candidates (AC 5, 7).
#
# Mirror-and-adapt discipline (Epic 1 retro action item) — what differs from
# each mirror:
#   (a) vs 2.7 default_palette (fragment consumer + install_dir seam +
#       check-gating): 2.7 GENERATES the palette (command), 2.9 COPIES the
#       fragments (copy). 2.9 inherits only the first-task install_dir assert,
#       the `not ansible_check_mode` gating on fragment-touching tasks, and the
#       stat+assert direct-run prerequisite pattern — NO csg/weg presence
#       checks, NO container-engine detection, NO env overrides.
#   (b) vs 2.6 assets (copy + repo_root): 2.6 copies from
#       <repo>/dotfiles/assets/** into the install spine; 2.9 copies from
#       <repo>/dotfiles/config/{hypr,hyprpaper,waybar}/ into the user config
#       dirs and from the install spine into the user config (fragments).
#       `remote_src: true` + trailing-`/` src applies to the skeleton copies.
#   (c) vs 2.5 filesystem (XDG config home): 2.5 CREATES the dirs; 2.9 COPIES
#       into them. Share the exact XDG derivation — do not duplicate logic with
#       a different result.

# compositor_configs_repo_root: repo root derived from this playbook's
#   location. The skeleton sources live at
#   <repo>/dotfiles/config/{hypr,hyprpaper,waybar}/, so
#   <repo> = {{ playbook_dir }}/../../../.. (mirror assets_repo_root /
#   cli_tools_repo_root exactly).
compositor_configs_repo_root: "{{ playbook_dir }}/../../../.."

# compositor_configs_xdg_config_home: the target config home the filesystem
#   role (2.5) used when creating the compositor config dirs. Identical
#   derivation: honors $XDG_CONFIG_HOME with the spec default
#   {{ ansible_facts.env.HOME }}/.config. Uses ansible_facts.env.* (NOT the
#   deprecated top-level ansible_env fact — F4 lock, hard-breaks on
#   ansible-core >= 2.24).
compositor_configs_xdg_config_home: "{{ ansible_facts.env.XDG_CONFIG_HOME | default(ansible_facts.env.HOME | default(ansible_facts.user_dir) + '/.config', true) }}"

# compositor_configs_config_dirs: the three compositor config dirs under the
#   XDG config home. Re-ensured as directories before the copies (copy does NOT
#   create dest parents for file sources); the filesystem role (2.5) already
#   created them on the bootstrap chain, this keeps the role self-contained on
#   a direct run (mirror of the 2.6 "Ensure asset deploy targets exist" pattern).
compositor_configs_config_dirs:
  - "{{ compositor_configs_xdg_config_home }}/hypr"
  - "{{ compositor_configs_xdg_config_home }}/hyprpaper"
  - "{{ compositor_configs_xdg_config_home }}/waybar"

# compositor_configs_skeleton_copies: the three skeleton dirs authored by 2.8
#   (AC 2). Every `source` ENDS WITH `/` so copy's contents-into-dest semantics
#   land the files directly in the target (no accidental nested dir). The copy
#   tasks carry `force: false` (AC 5) — a placed skeleton is NEVER re-touched
#   by this role on any re-run, so a user's hand edits survive.
compositor_configs_skeleton_copies:
  - { name: hypr, source: dotfiles/config/hypr/, dest: "{{ compositor_configs_xdg_config_home }}/hypr" }
  - { name: hyprpaper, source: dotfiles/config/hyprpaper/, dest: "{{ compositor_configs_xdg_config_home }}/hyprpaper" }
  - { name: waybar, source: dotfiles/config/waybar/, dest: "{{ compositor_configs_xdg_config_home }}/waybar" }

# compositor_configs_fragment_copies: the palette fragments generated by the
#   default_palette role (2.7) copied into the user config (AC 3, 4). These are
#   the ONLY overwrite candidates (AC 5, 7) — the default `force: true` means a
#   regenerated palette (FR-18) propagates on the next apply. The Waybar source
#   is `colors.gtk.css` (review finding 2026-08-12: CSG's `gtk.css` format
#   emits `@define-color` the Waybar skeleton consumes; the `css` format emits
#   browser custom props GTK/Waybar cannot read) renamed to `colors.css` on
#   copy — the 2.8 skeleton imports `colors.css` and done-criterion 7 checks
#   `~/.config/waybar/colors.css`. Trim lock: sources consume the same
#   validated `{{ install_dir | trim }}` value the fail-loud assert enforces.
compositor_configs_fragment_copies:
  - { name: colors-conf, source: "{{ install_dir | trim }}/generated/palettes/colors.conf", dest: "{{ compositor_configs_xdg_config_home }}/hypr/colors.conf" }
  - { name: waybar-colors-css, source: "{{ install_dir | trim }}/generated/palettes/colors.gtk.css", dest: "{{ compositor_configs_xdg_config_home }}/waybar/colors.css" }
