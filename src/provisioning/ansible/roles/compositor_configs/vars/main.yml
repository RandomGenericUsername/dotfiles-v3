# Compositor configs role vars (Story 2.9 / AGS-for-Waybar swap 2026-08-18,
# Epic 4 single-source).
#
# The role copies the static skeletons authored in dotfiles/config/
# {hypr,hyprpaper,ags}/ into the config-in-spine dirs. It NO LONGER copies
# palette fragments: the runtime seeder owns the consumer palette paths
# (R2 symlinks → current/, rt-4-2) and `wallpaper set` keeps them current.
# Skeletons are repo-authoritative (force:true per owner decision 2026-08-26).
#
# Mirror-and-adapt discipline (Epic 1 retro action item) — what differs from
# each mirror:
#   (a) vs 2.6 assets (copy + repo_root): 2.6 copies from
#       <repo>/dotfiles/assets/** into the install spine; 2.9 copies from
#       <repo>/dotfiles/config/{hypr,hyprpaper,ags}/ into the spine config
#       dirs. `remote_src: true` + trailing-`/` src applies to the skeleton copies.
#   (b) vs 2.5 filesystem (XDG config home): 2.5 CREATES the dirs; 2.9 COPIES
#       into them. Share the exact XDG derivation — do not duplicate logic with
#       a different result.

# compositor_configs_repo_root: repo root derived from this playbook's
#   location. The skeleton sources live at
#   <repo>/dotfiles/config/{hypr,hyprpaper,ags}/, so
#   <repo> = {{ playbook_dir }}/../../../.. (mirror assets_repo_root /
#   cli_tools_repo_root exactly).
compositor_configs_repo_root: "{{ playbook_dir }}/../../../.."

# compositor_configs_xdg_config_home: the target config home the filesystem
#   role (2.5) used when creating the compositor config dirs. Identical
#   derivation: honors $XDG_CONFIG_HOME with the spec default
#   {{ ansible_facts.env.HOME }}/.config. Uses ansible_facts.env.* (NOT the
#   deprecated top-level ansible_env fact — F4 lock, hard-breaks on
#   ansible-core >= 2.24).
compositor_configs_xdg_config_home: "{{ ansible_facts.env.XDG_CONFIG_HOME | default(ansible_facts.env.HOME | default(ansible_facts.user_dir) + '/.config', true) }}"

# compositor_configs_xdg_state_home: the XDG state home the runtime seeder
#   (Story 1.11) owns ($XDG_STATE_HOME, spec default ~/.local/state). The
#   don't-clobber guard (Story 1.12) READS it for classification ONLY —
#   provisioning never writes under $XDG_STATE_HOME/dotfiles/ (AD-5). Identical
#   non-deprecated env-fact derivation to verify_xdg_state_home
#   (roles/verify/vars/main.yml) / filesystem_xdg_state_home. Uses
#   ansible_facts.env.* (NOT the deprecated top-level ansible_env fact — F4
#   lock, hard-breaks on ansible-core >= 2.24).
compositor_configs_xdg_state_home: "{{ ansible_facts.env.XDG_STATE_HOME | default(ansible_facts.env.HOME | default(ansible_facts.user_dir) + '/.local/state', true) }}"

# compositor_configs_xdg_bin_home: the user bin dir for desktop helper
#   scripts (toggle-touchpad, called by the XF86TouchpadToggle bind). Same
#   fallback chain the assets/cli_tools roles use for uv's bin dir:
#   $UV_TOOL_BIN_DIR -> $XDG_BIN_HOME -> $HOME/.local/bin. Uses
#   ansible_facts.env (F4 lock: never the deprecated ansible_env).
compositor_configs_xdg_bin_home: >-
  {{ ansible_facts.env.UV_TOOL_BIN_DIR
     | default(ansible_facts.env.XDG_BIN_HOME | default(ansible_facts.env.HOME + '/.local/bin', true), true) }}

# compositor_configs_state_current_dir: the runtime-owned current dir
#   (<state>/dotfiles/current/, AD-5). Retained for documentation and for
#   any future guard that classifies runtime symlinks; the fragment-copy
#   guard that consumed it was removed in Epic 4 (the runtime seeder owns
#   the R2 consumer symlinks, rt-4-2 — provisioning no longer copies
#   palette fragments anywhere).
#   Trim lock: XDG values may carry stray whitespace (Story 1.11 lesson).
compositor_configs_state_current_dir: "{{ compositor_configs_xdg_state_home | trim }}/dotfiles/current"

# compositor_configs_spine_config_dir: the config-in-spine destination root
#   (<install>/config/). The skeletons + fragments are placed into
#   <install>/config/{hypr,hyprpaper,ags}/; the config-links role symlinks
#   each ~/.config/<compositor> -> <install>/config/<compositor>, so the
#   compositors read their configs at their native XDG locations while the
#   spine is the single home. Trim lock: consumes the same validated
#   {{ install_dir | trim }} value the fail-loud first-task assert enforces.
compositor_configs_spine_config_dir: "{{ install_dir | trim }}/config"

# compositor_configs_config_dirs: the three compositor config dirs under the
#   config-in-spine home. Re-ensured as directories before the copies (copy does
#   NOT create dest parents for file sources); the filesystem role (2.5)
#   already created them on the bootstrap chain, this keeps the role
#   self-contained on a direct run (mirror of the 2.6 "Ensure asset deploy
#   targets exist" pattern).
compositor_configs_config_dirs:
  - "{{ compositor_configs_spine_config_dir }}/hypr"
  - "{{ compositor_configs_spine_config_dir }}/hyprpaper"
  - "{{ compositor_configs_spine_config_dir }}/ags"
  - "{{ compositor_configs_spine_config_dir }}/ags/lib"
  - "{{ compositor_configs_spine_config_dir }}/ags/bar"
  - "{{ compositor_configs_spine_config_dir }}/ags/bar/widgets"
  - "{{ compositor_configs_spine_config_dir }}/rofi"
  - "{{ compositor_configs_spine_config_dir }}/rofi/launcher"

# compositor_configs_skeleton_files: the skeleton FILES authored by 2.8 (AC 2),
#   one entry per file with the explicit target path. Per-file entries (not
#   directory sources) are REQUIRED: `copy` with a directory `src` +
#   `force: false` + a pre-existing dest dir is a silent no-op (review finding
#   2026-08-12), so the role copies each file individually. The tasks render
#   these via `ansible.builtin.template` with `force: true` (repo-authoritative
#   per owner decision 2026-08-26).
compositor_configs_skeleton_files:
  - { name: hyprland-lua, source: dotfiles/config/hypr/hyprland.lua, dest: "{{ compositor_configs_spine_config_dir }}/hypr/hyprland.lua" }
  - { name: keybindings-lua, source: dotfiles/config/hypr/keybindings.lua, dest: "{{ compositor_configs_spine_config_dir }}/hypr/keybindings.lua" }
  - { name: gloview-lua, source: dotfiles/config/hypr/gloview.lua, dest: "{{ compositor_configs_spine_config_dir }}/hypr/gloview.lua" }
  - { name: monitors-lua, source: dotfiles/config/hypr/monitors.lua, dest: "{{ compositor_configs_spine_config_dir }}/hypr/monitors.lua" }
  - { name: general-lua, source: dotfiles/config/hypr/general.lua, dest: "{{ compositor_configs_spine_config_dir }}/hypr/general.lua" }
  - { name: autostart-lua, source: dotfiles/config/hypr/autostart.lua, dest: "{{ compositor_configs_spine_config_dir }}/hypr/autostart.lua" }
  - { name: window-rules-lua, source: dotfiles/config/hypr/window-rules.lua, dest: "{{ compositor_configs_spine_config_dir }}/hypr/window-rules.lua" }
  - { name: animations-lua, source: dotfiles/config/hypr/animations.lua, dest: "{{ compositor_configs_spine_config_dir }}/hypr/animations.lua" }
  - { name: input-lua, source: dotfiles/config/hypr/input.lua, dest: "{{ compositor_configs_spine_config_dir }}/hypr/input.lua" }
  - { name: decoration-lua, source: dotfiles/config/hypr/decoration.lua, dest: "{{ compositor_configs_spine_config_dir }}/hypr/decoration.lua" }
  - { name: colors-lua, source: dotfiles/config/hypr/colors.lua, dest: "{{ compositor_configs_spine_config_dir }}/hypr/colors.lua" }
  - { name: cursor-lua, source: dotfiles/config/hypr/cursor.lua, dest: "{{ compositor_configs_spine_config_dir }}/hypr/cursor.lua" }
  - { name: env-variables-lua, source: dotfiles/config/hypr/env-variables.lua, dest: "{{ compositor_configs_spine_config_dir }}/hypr/env-variables.lua" }
  - { name: hyprpaper-conf, source: dotfiles/config/hyprpaper/hyprpaper.conf, dest: "{{ compositor_configs_spine_config_dir }}/hyprpaper/hyprpaper.conf" }
  - { name: ags-app-tsx, source: dotfiles/config/ags/app.tsx, dest: "{{ compositor_configs_spine_config_dir }}/ags/app.tsx" }
  - { name: ags-style-css, source: dotfiles/config/ags/style.css, dest: "{{ compositor_configs_spine_config_dir }}/ags/style.css" }
  - { name: ags-icon-registry, source: dotfiles/config/ags/lib/icon-registry.ts, dest: "{{ compositor_configs_spine_config_dir }}/ags/lib/icon-registry.ts" }
  - { name: ags-bar-tsx, source: dotfiles/config/ags/bar/Bar.tsx, dest: "{{ compositor_configs_spine_config_dir }}/ags/bar/Bar.tsx" }
  - { name: ags-workspaces, source: dotfiles/config/ags/bar/widgets/workspaces.tsx, dest: "{{ compositor_configs_spine_config_dir }}/ags/bar/widgets/workspaces.tsx" }
  - { name: ags-clock, source: dotfiles/config/ags/bar/widgets/clock.tsx, dest: "{{ compositor_configs_spine_config_dir }}/ags/bar/widgets/clock.tsx" }
  - { name: ags-battery, source: dotfiles/config/ags/bar/widgets/battery.tsx, dest: "{{ compositor_configs_spine_config_dir }}/ags/bar/widgets/battery.tsx" }
  - { name: ags-network, source: dotfiles/config/ags/bar/widgets/network.tsx, dest: "{{ compositor_configs_spine_config_dir }}/ags/bar/widgets/network.tsx" }
  - { name: ags-power-menu, source: dotfiles/config/ags/bar/widgets/power-menu.tsx, dest: "{{ compositor_configs_spine_config_dir }}/ags/bar/widgets/power-menu.tsx" }
  - { name: ags-btop, source: dotfiles/config/ags/bar/widgets/btop.tsx, dest: "{{ compositor_configs_spine_config_dir }}/ags/bar/widgets/btop.tsx" }
  - { name: ags-thunderbird, source: dotfiles/config/ags/bar/widgets/thunderbird.tsx, dest: "{{ compositor_configs_spine_config_dir }}/ags/bar/widgets/thunderbird.tsx" }
  - { name: ags-recording, source: dotfiles/config/ags/bar/widgets/recording.tsx, dest: "{{ compositor_configs_spine_config_dir }}/ags/bar/widgets/recording.tsx" }
  - { name: ags-tray, source: dotfiles/config/ags/bar/widgets/tray.tsx, dest: "{{ compositor_configs_spine_config_dir }}/ags/bar/widgets/tray.tsx" }
  - { name: rofi-launcher-config-rasi, source: dotfiles/config/rofi/launcher/config.rasi, dest: "{{ compositor_configs_spine_config_dir }}/rofi/launcher/config.rasi" }

# compositor_configs_bin_scripts: executable desktop helpers the XF86 binds in
#   keybindings.lua call (deployed to the user's XDG bin dir, 0755). These are
#   provision-owned so a fresh machine gets working Fn keys with zero manual
#   steps (owner decision 2026-09-02).
compositor_configs_bin_scripts:
  - { name: toggle-touchpad, source: dotfiles/scripts/toggle-touchpad, dest: "{{ compositor_configs_xdg_bin_home }}/toggle-touchpad" }

# The icon mappings are authored once under icon-mappings and converted to the
# JSON shape consumed by AGS during provisioning.
compositor_configs_icon_manifest_source: "{{ install_dir | trim }}/icon-mappings/icons.yaml"
compositor_configs_icon_manifest_dest: "{{ compositor_configs_spine_config_dir }}/ags/icons.json"