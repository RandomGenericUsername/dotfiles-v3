# Compositor configs role (Story 2.9 / AGS-for-Waybar swap 2026-08-18) —
# copies the static skeletons from dotfiles/config/{hypr,hyprpaper,ags}/ into
# the user config dirs the filesystem role (2.5) created, and copies the
# palette fragments into the user config: colors.conf -> ~/.config/hypr/colors.conf and
# colors.gtk.css -> ~/.config/ags/colors.css (FR-19, chaining-spine.md).
#
# Design (locked in Story 2.9 Dev Notes — updated per owner decision
# 2026-08-26: skeletons are repo-authoritative, force:true):
# - The FIRST task is the fail-loud install_dir seam assert, copied verbatim
#   from the filesystem/assets/default_palette roles: install_dir is
#   deliberately never defaulted (group_vars/all.yml), so an undefined spine
#   root must abort with a friendly message before any task evaluates.
# - Skeletons are repo-authoritative (`force: true`, idempotent): every
#   bootstrap converges to the repo, n runs give the same result. A legacy
#   cleanup task removes superseded same-name files (e.g. hypr/hyprland.conf
#   → hypr/hyprland.lua). Fragments remain the palette overwrite target
#   (AC 7, force:true). NO `creates:` on either.
# - Skeleton placement uses `ansible.builtin.template` with PER-FILE entries
#   (compositor_configs_skeleton_files), NOT a directory source: review finding
#   2026-08-12 proved `copy` with a directory `src` + `force: false` + a
#   pre-existing dest dir is a SILENT NO-OP (nothing is ever placed). Per-file
#   copy is the only shape where force: false means "transfer if absent".
#   Templating also renders the hyprland.lua source lines from the resolved
#   compositor_configs_xdg_config_home (P1 decision) so the fragment reference
#   stays correct when $XDG_CONFIG_HOME is set.
# - template module check-mode support is FULL (action plugin predicts changed
#   without writing) — the skeleton placements need NO `not ansible_check_mode`
#   gate. The fragment copies ARE gated `when: not ansible_check_mode`: under
#   --check the default_palette generate is skipped, so the fragment sources
#   are legitimately absent on a fresh target (dry-run must be dry, 2.7/2.8
#   discipline).
# - Fragment sources must exist before the copy (fail-loud direct-run
#   prerequisite): a stat + assert PAIR on the two fragment sources, both gated
#   `when: not ansible_check_mode` (an assert alone cannot check file
#   existence), with a fail_msg naming the default-palette playbook. The
#   fragment ordering/verify guarantee is owned by 2.9 + 2.12 + 3.2/3.3; the
#   deferred "default colors fallback" is a Phase 2 concern, NOT added here.
# - Don't-clobber guard (Story 1.12): fragments remain the palette overwrite
#   target — overwrite UNLESS the destination is a runtime symlink into
#   state_root/current (don't-clobber guard, Story 1.12). A read-only
#   classification stat pass (`follow: false` — a plain stat resolves through
#   the link and hides it) runs UNGATED immediately before the copy so
#   plan/--check predicts correctly, and the copy skips per-item any dest that
#   exists as a symlink whose raw target starts with
#   compositor_configs_state_current_dir (or contains /current/, covering
#   seeder-written relative targets). Provisioning READS state_root for
#   classification only — zero writes under $XDG_STATE_HOME/dotfiles/ (AD-5).
#   The fragment-source stat+assert pair stays unchanged: bootstrap.yaml runs
#   default_palette BEFORE compositor_configs, and provisioning keeps writing
#   generated/palettes/ post-runtime, so a missing source is a genuine failure
#   in every reachable state.
# - copy does NOT create dest parents for file sources — the config dirs are
#   re-ensured first (mirror of the 2.6 "Ensure asset deploy targets exist"
#   pattern) so a direct compositor-configs.yaml run is self-contained.
# - No manifest parity: there is NO dotfiles/provisioning/compositor-configs.yaml
#   manifest — the five manifests are locked in Story 2.1; the compositor
#   content contract lives in the skeleton files (2.8) + fragment names (2.7)
#   and is locked by the structural test.
# - User-scoped privilege context: NO become/become_user anywhere.
# - No absolute repo paths: every source is {{ compositor_configs_repo_root }}/...

- name: Assert install_dir seam is provided
  ansible.builtin.assert:
    that: install_dir is defined and install_dir | trim | length > 0
    fail_msg: >-
      install_dir is undefined or empty — the compositor_configs role requires
      the install_dir seam extra-var (the orchestrator resolves
      $XDG_DATA_HOME/dotfiles/; direct runs pass -e install_dir=...)

- name: Ensure compositor config dirs exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
  loop: "{{ compositor_configs_config_dirs }}"

- name: Place compositor skeleton files
  ansible.builtin.template:
    src: "{{ compositor_configs_repo_root }}/{{ item.source }}"
    dest: "{{ item.dest }}"
    force: true
  loop: "{{ compositor_configs_skeleton_files }}"

- name: Remove legacy hyprland.conf skeleton (superseded by hyprland.lua)
  ansible.builtin.file:
    path: "{{ compositor_configs_spine_config_dir }}/hypr/hyprland.conf"
    state: absent
  when: not ansible_check_mode

- name: Check palette fragment sources exist
  ansible.builtin.stat:
    path: "{{ item.source }}"
  loop: "{{ compositor_configs_fragment_copies }}"
  register: compositor_configs_fragment_check
  when: not ansible_check_mode

- name: Assert palette fragment sources are present
  ansible.builtin.assert:
    that: compositor_configs_fragment_check.results | selectattr('stat.isreg') | list | length == compositor_configs_fragment_copies | length
    fail_msg: >-
      palette fragments missing from {{ install_dir | trim }}/generated/palettes/
      (expected colors.conf and colors.gtk.css) — the default_palette role
      (Story 2.7) generates them at apply time; run the default-palette
      playbook first (direct-run prerequisite, AC 3/4)
  when: not ansible_check_mode

- name: Classify palette fragment destinations (runtime-symlink guard)
  ansible.builtin.stat:
    path: "{{ item.dest }}"
    follow: false
  loop: "{{ compositor_configs_fragment_copies }}"
  register: compositor_configs_fragment_stats

- name: Place palette color fragments
  ansible.builtin.copy:
    src: "{{ item.source }}"
    dest: "{{ item.dest }}"
    remote_src: true
  loop: "{{ compositor_configs_fragment_copies }}"
  loop_control:
    index_var: compositor_configs_frag_idx
  when:
    - not ansible_check_mode
    - not (compositor_configs_fragment_stats.results[compositor_configs_frag_idx].stat.exists
           and compositor_configs_fragment_stats.results[compositor_configs_frag_idx].stat.islnk
           and (compositor_configs_fragment_stats.results[compositor_configs_frag_idx].stat.lnk_target | default('') is match('^' ~ compositor_configs_state_current_dir)
                or '/current/' in (compositor_configs_fragment_stats.results[compositor_configs_frag_idx].stat.lnk_target | default(''))))
