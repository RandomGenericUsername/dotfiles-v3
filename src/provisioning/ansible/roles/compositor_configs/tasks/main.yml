# Compositor configs role (Story 2.9 / AGS-for-Waybar swap 2026-08-18,
# Epic 4 single-source; pinned corpus since S2) — renders the static skeletons
# from the PINNED assets `configs/` class (`<install>/assets/<tag>/configs/
# {hypr,hyprpaper,rofi}/`, the checkout the assets role materialized) into the
# config-in-spine dirs.
# The AGS bar is NOT placed here: the `ags_apps` role installs it as ONE
# versioned unit and deploys it as the live <install>/config/ags symlink
# (ags-apps-bar-first slice 2, AD-17). This role still GENERATES the bar's
# icons.json through that link and runs the unit's `ags-bar-validate` CLI as
# the strict install gate, so it runs AFTER ags-apps in bootstrap order.
# Palette fragments are NOT copied here: the runtime seeder owns the
# consumer palette paths (R2 symlinks → current/, rt-4-2) and
# `wallpaper set` keeps them current (FR-19, chaining-spine.md).
#
# Design (locked in Story 2.9 Dev Notes — updated per owner decision
# 2026-08-26: skeletons are repo-authoritative, force:true):
# - The FIRST task is the fail-loud install_dir seam assert, copied verbatim
#   from the filesystem/assets roles: install_dir is
#   deliberately never defaulted (group_vars/all.yml), so an undefined spine
#   root must abort with a friendly message before any task evaluates.
# - Skeletons are repo-authoritative (`force: true`, idempotent): every
#   bootstrap converges to the repo, n runs give the same result. Legacy
#   cleanup tasks remove superseded same-name files (e.g. hypr/hyprland.conf
#   → hypr/hyprland.lua) and relocated directories (the old settings-panel
#   services dir → ags/services, extract-ags-shared-components). NO `creates:`.
# - Skeleton placement uses `ansible.builtin.template` with PER-FILE entries
#   (compositor_configs_skeleton_files), NOT a directory source: review finding
#   2026-08-12 proved `copy` with a directory `src` + `force: false` + a
#   pre-existing dest dir is a SILENT NO-OP (nothing is ever placed). Per-file
#   copy is the only shape where force: false means "transfer if absent".
#   `template` (not `copy`) because `hypr/hyprland.lua` carries one render-time
#   token — the module include dir, resolved from the host's XDG config home.
#   The other 14 skeletons have no Jinja and render byte-identically.
# - S2: the skeleton sources are the PINNED assets corpus
#   (compositor_configs_assets_configs_dir), so a stat+assert on the pinned
#   `configs/` class runs before the placements: a missing or mis-pinned
#   checkout must fail loud and named, not per-file with "Could not find".
# - template module check-mode support is FULL (action plugin predicts changed
#   without writing) — the skeleton placements need NO `not ansible_check_mode`
#   gate.
# - The icon-manifest generation (icons.yaml → icons.json) stays: it converts
#   authored INPUTS (icon-mappings), not generated output.
# - User-scoped privilege context: NO become/become_user anywhere.
# - No absolute repo paths: the bin scripts and desktop entries are
#   {{ compositor_configs_repo_root }}/... ; the skeleton sources are absolute
#   paths into the pinned checkout ({{ compositor_configs_assets_configs_dir }}).
#   The deferred "default colors fallback" is a Phase 2 concern, NOT added here.
# - Don't-clobber guard (Story 1.12, RETIRED in Epic 4): the guard used to
#   protect runtime R2 symlinks from fragment-copy overwrites. The fragment
#   copies are deleted (rt-4-1) and the R2 symlinks are created by the
#   runtime seeder itself (rt-4-2), so there is nothing left to guard —
#   provisioning never writes palette fragments anywhere. The
#   compositor_configs_state_current_dir var is retained for documentation.
# - copy does NOT create dest parents for file sources — the config dirs are
#   re-ensured first (mirror of the 2.6 "Ensure asset deploy targets exist"
#   pattern) so a direct compositor-configs.yaml run is self-contained.
# - No manifest parity: there is NO dotfiles/provisioning/compositor-configs.yaml
#   manifest — the five manifests are locked in Story 2.1; the compositor
#   content contract lives in the skeleton files (2.8)
#   and is locked by the structural test.

- name: Assert install_dir seam is provided
  ansible.builtin.assert:
    that: install_dir is defined and install_dir | trim | length > 0
    fail_msg: >-
      install_dir is undefined or empty — the compositor_configs role requires
      the install_dir seam extra-var (the orchestrator resolves
      $XDG_DATA_HOME/dotfiles/; direct runs pass -e install_dir=...)

- name: Ensure compositor config dirs exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
  loop: "{{ compositor_configs_config_dirs }}"

- name: Check deployed icon manifest exists
  ansible.builtin.stat:
    path: "{{ compositor_configs_icon_manifest_source }}"
  register: compositor_configs_icon_manifest_check
  when: not ansible_check_mode

- name: Assert deployed icon manifest is present
  ansible.builtin.assert:
    that:
      - compositor_configs_icon_manifest_check.stat.exists
      - not compositor_configs_icon_manifest_check.stat.isdir
    fail_msg: >-
      deployed icon manifest missing at {{ compositor_configs_icon_manifest_source }}
      — the assets role must run first so icons.yaml is available for AGS manifest
      generation
  when: not ansible_check_mode

- name: Read deployed icon manifest
  ansible.builtin.slurp:
    src: "{{ compositor_configs_icon_manifest_source }}"
  register: compositor_configs_icon_manifest
  when: not ansible_check_mode

- name: Generate AGS JSON manifest from icon mappings
  ansible.builtin.copy:
    content: "{{ (compositor_configs_icon_manifest.content | b64decode | from_yaml) | combine({'schemaVersion': compositor_configs_icon_manifest_schema_version}) | to_nice_json(indent=2) }}\n"
    dest: "{{ compositor_configs_icon_manifest_dest }}"
    force: true
    mode: "0644"
  when: not ansible_check_mode

- name: Generate capture AGS JSON manifest from icon mappings
  ansible.builtin.copy:
    content: "{{ (compositor_configs_icon_manifest.content | b64decode | from_yaml) | combine({'schemaVersion': compositor_configs_icon_manifest_schema_version}) | to_nice_json(indent=2) }}\n"
    dest: "{{ compositor_configs_capture_icon_manifest_dest }}"
    force: true
    mode: "0644"
  when: not ansible_check_mode

- name: Check the pinned assets configs class exists
  ansible.builtin.stat:
    path: "{{ compositor_configs_assets_configs_dir }}"
  register: compositor_configs_assets_configs_check

- name: Assert the pinned assets configs class is present
  ansible.builtin.assert:
    that: compositor_configs_assets_configs_check.stat.isdir | default(false)
    fail_msg: >-
      the pinned assets configs class is missing at
      {{ compositor_configs_assets_configs_dir }} — the assets role clones
      dotfiles-assets at {{ compositor_configs_assets_pinned_tag }} before this
      role runs (bootstrap order), so a missing checkout means the pin is wrong
      or the clone failed; rendering from a missing source would deploy nothing
  when: not ansible_check_mode

- name: Place compositor skeleton files
  ansible.builtin.template:
    src: "{{ item.source }}"
    dest: "{{ item.dest }}"
    force: true
  loop: "{{ compositor_configs_skeleton_files }}"
  # --check on a machine that has never fetched the corpus: the assets role's
  # clone is check-gated, so the checkout does not exist yet and there is
  # nothing to render. Skip (no mutation, no false prediction) instead of
  # failing the dry run; a REAL run reaches the assert above first and fails
  # loud on a bad pin. A provisioned machine still predicts every change.
  when: not ansible_check_mode or compositor_configs_assets_configs_check.stat.isdir | default(false)

- name: Install desktop helper scripts (touchpad toggle for XF86 binds)
  ansible.builtin.copy:
    src: "{{ compositor_configs_repo_root }}/{{ item.source }}"
    dest: "{{ item.dest }}"
    force: true
    mode: "0755"
  loop: "{{ compositor_configs_bin_scripts }}"

# App desktop-entry overrides (e.g. TIDAL's Electron /dev/shm flag). The dest
# parent is not created by copy, so it is ensured first — and it must exist
# anyway for the entry to be discoverable by rofi's drun mode.
- name: Ensure XDG data applications dir exists
  ansible.builtin.file:
    path: "{{ compositor_configs_xdg_data_home }}/applications"
    state: directory

- name: Install application desktop entry overrides
  ansible.builtin.copy:
    src: "{{ compositor_configs_repo_root }}/{{ item.source }}"
    dest: "{{ item.dest }}"
    force: true
    mode: "0644"
  loop: "{{ compositor_configs_desktop_entries }}"

- name: Remove legacy hyprland.conf skeleton (superseded by hyprland.lua)
  ansible.builtin.file:
    path: "{{ compositor_configs_spine_config_dir }}/hypr/hyprland.conf"
    state: absent
  when: not ansible_check_mode

# The `ags-bar-validate` strict install gate (spine AD-15;
# ags-bar-validation task 2.1): run the deployed validator over the DEPLOYED
# artifacts and fail the install on any rule error. Placement is LAST on
# purpose — the gate reads the deployed `validate-cli.ts` + `icons.json`, so
# it must run after the manifest generation above AND after the `ags_apps`
# role deploys the live bar: the CLI it runs is the UNIT's own
# (<install>/config/ags is the live-bar symlink into the pinned
# <install>/ags-apps/<tag>/bar/), and the icons.json it validates is the one
# just generated through that same link. Bootstrap order guarantees the unit
# is installed first (ags-apps.yaml precedes compositor-configs.yaml); a
# direct compositor-configs.yaml run without the unit fails the gate on the
# missing CLI, which is the honest outcome. A gate placed earlier would
# validate a missing or stale CLI.
#
# Design (mirrors the role's existing check-gating, but STRICT):
# - There is NO `bar.json` in the repo today (no user/runtime layout override
#   exists yet), so no `--layout` is passed: the gate validates the deployed
#   `icons.json` plus the repo-default layout (the CLI's always-non-null
#   floor, AD-9/AD-18). Validating the default IS the gate until an override
#   exists — do NOT invent a runtime `bar.json` to satisfy it; pass
#   `--layout <deployed bar.json>` the day one appears.
# - `--expect-schema-version` passes the role's OWNED
#   `compositor_configs_icon_manifest_schema_version` (the single owner), so a
#   stale deployed artifact fails against the current expectation. (The
#   `icons-json-drift` gate that also consumed this version was retired with the
#   in-repo bar bridge and now lives in `ags-apps`.) A version mismatch is a
#   WARNING (task 2.3: warn and degrade, never crash) and does NOT fail the
#   install; only rule errors do.
# - STRICT means no `failed_when: false` and no `ignore_errors`: a non-zero
#   validator exit fails the install by default ansible semantics. (The
#   gui_tools `ags quit` tasks carry `failed_when: false` because a missing
#   live session is a no-op there; here a bad artifact is exactly what must
#   be loud.)
# - `changed_when: false`: the gate writes nothing, so it must never count
#   as changed. `when: not ansible_check_mode` mirrors the generation tasks:
#   the deployed files the gate reads do not exist yet under `--check`.
# - Runner: plain `node` (type-stripping runs the deployed `.ts` directly —
#   the same runner `make ags-test` hard-requires on PATH). If node is absent
#   the task fails with ansible's "Failed to find required executable", which
#   is the honest outcome: the install cannot prove the bar artifacts valid.
# - REALPATH, not the live-bar link: node resolves a module's own URL to its
#   REAL path (`import.meta.url`) but leaves `process.argv[1]` as the path it
#   was handed. The deployed CLI's `invokedAsMain` guard compares the two
#   (`resolve(process.argv[1]) === join(HERE, "validate-cli.ts")`), so invoking
#   it through the <install>/config/ags SYMLINK makes the guard FALSE: the CLI
#   no-ops, exits 0, and the "strict" gate would pass WITHOUT validating
#   anything. (Regression-guarded by
#   test_gate_fails_the_install_on_a_bad_icons_artifact, which failed exactly
#   this way before the resolution task below.) The command therefore runs
#   `node` on the `readlink -f`-resolved path — the unit's own file — so the
#   guard matches and a bad artifact actually fails the install.
- name: Resolve the deployed bar validator's real path
  ansible.builtin.command:
    argv:
      - readlink
      - -f
      - "{{ compositor_configs_spine_config_dir }}/ags/bar/validate-cli.ts"
  register: compositor_configs_bar_validate_cli
  changed_when: false
  when: not ansible_check_mode

- name: Validate the deployed bar artifacts (strict install gate)
  ansible.builtin.command:
    argv:
      - node
      - "{{ compositor_configs_bar_validate_cli.stdout }}"
      - --icons
      - "{{ compositor_configs_icon_manifest_dest }}"
      - --expect-schema-version
      - "{{ compositor_configs_icon_manifest_schema_version }}"
  changed_when: false
  when: not ansible_check_mode
