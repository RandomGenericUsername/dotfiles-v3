# Filesystem role vars (Story 2.5).
#
# The role creates the machine layout the assets (2.6), default_palette (2.7),
# compositor_configs (2.9), and settings (2.11) roles will write into (FR-16,
# chaining-spine.md). It deploys NOTHING — only directories and the XDG base
# dirs.
#
# The desired node list lives in dotfiles/provisioning/filesystem.yaml (Story
# 2.1): a flat `entries` list whose `{name}`-only schema is locked by
# yaml_manifest_reader.py. Ansible does NOT read manifests — the role mirrors
# the manifest and a structural test locks parity (the Story 2.1 deferred
# item, resolved here). The flat manifest names partition into three
# semantically-typed groups:
#
#   - XDG base dirs (config/state/cache)  -> filesystem_xdg_{config,state,cache}_home
#   - install-spine dirs                  -> filesystem_spine_dirs
#   - file nodes (weg-effects.yaml)       -> filesystem_file_nodes

# XDG base dirs (AC 2, XDG base-directory spec). Each honors the corresponding
# $XDG_*_HOME env var with the spec default fallback. Uses ansible_facts.env.*
# (NOT the deprecated top-level ansible_env fact injected via
# INJECT_FACTS_AS_VARS, which hard-breaks on ansible-core >= 2.24).
filesystem_xdg_config_home: "{{ ansible_facts.env.XDG_CONFIG_HOME | default(ansible_facts.env.HOME | default(ansible_facts.user_dir) + '/.config', true) }}"
filesystem_xdg_state_home: "{{ ansible_facts.env.XDG_STATE_HOME | default(ansible_facts.env.HOME | default(ansible_facts.user_dir) + '/.local/state', true) }}"
filesystem_xdg_cache_home: "{{ ansible_facts.env.XDG_CACHE_HOME | default(ansible_facts.env.HOME | default(ansible_facts.user_dir) + '/.cache', true) }}"

# Compositor config dirs under the XDG config home (AC 3).
filesystem_compositor_dirs:
  - "{{ filesystem_xdg_config_home }}/hypr"
  - "{{ filesystem_xdg_config_home }}/hyprpaper"
  - "{{ filesystem_xdg_config_home }}/ags"

# Install-spine dirs relative to install_dir (AC 4, parity-locked to the
# manifest).
#
# Epic 4 single-source: provisioning deploys INPUTS ONLY. The `generated/`
# tree (palettes/effects/icons/.weg-tmp) is gone — the runtime owns all
# derived artifacts under $XDG_STATE_HOME/dotfiles/cache/ + current/.
# Orphaned generated/ trees from earlier provisions are left in place
# (never rm -rf user state) and ignored by every gate.
#
# config-in-spine (2026-08-16): the `config/` subtree hosts ALL managed
# configs (tool dirs + the csg-templates/effects relocations); the
# config-links role symlinks each ~/.config/<name> -> <install>/config/<name>.
# csg-templates moved to config/color-scheme-generator/templates (CSG tool
# config); weg-effects.yaml moved to config/weg/effects.yaml (WEG tool config).
# gt-3-1: the GTK consumer dirs (config/gtk-3.0, config/gtk-4.0) join the
# spine so the config-links role can migrate+symlink ~/.config/gtk-{3,4}.0.
# Provisioning creates the DIRS only — never the colors.css pointers inside
# them (the runtime seeder owns those, gt-2-2).
filesystem_spine_dirs:
  - wallpapers
  - icon-templates
  - icon-mappings
  - config
  - config/color-scheme-generator
  - config/color-scheme-generator/templates
  - config/hypr
  - config/hyprpaper
  - config/ags
  - config/ags-capture
  - config/nvim
  - config/starship
  - config/wlogout
  - config/zsh
  - config/weg
  - config/itr
  - config/gtk-3.0
  - config/gtk-4.0

# File nodes (AC 4). weg-effects.yaml is a FILE emitted by the assets role
# (Story 2.6) via `weg dump-effects` into the config-in-spine home
# (<install>/config/weg/effects.yaml); this role only guarantees its parent
# (config/weg), which the spine task creates. It never creates the file
# itself.
filesystem_file_nodes:
  - weg-effects.yaml
