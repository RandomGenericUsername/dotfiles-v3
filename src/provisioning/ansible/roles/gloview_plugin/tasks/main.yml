---
# GloView via the rewritten hyprpm — privilege architecture (read before touching):
#
# - State lives in /var/cache/hyprpm/<user>/ and EVERY write (mkdir, .so
#   install, state files) escalates internally via sudo (password prompt).
#   hyprpm ABORTS when run as root ("Don't run hyprpm as a superuser"), so no
#   task here may use become — except the sudoers authoring below.
# - The first task grants the invoking user passwordless sudo for EXACTLY
#   hyprpm's helper surface (mkdir/install/rm confined to /var/cache/hyprpm*,
#   plus the fixed timestamp-priming echo), so steady-state add/update/enable
#   runs unattended. This mirrors the aur_builder NOPASSWD pacman precedent.
# - DEFERRED-GREEN (B contract): hyprpm needs a LIVE Hyprland IPC session
#   even for `add`/`update` (verified 2026-09-29: headless `add` fails with
#   "failed to get the current hyprland version", `--force` does not bypass
#   it). A TTY provision therefore cannot build the plugin. When the headers
#   are synced but `hyprctl version` fails, every mutating task below SKIPS
#   with a loud warning (deferred, NOT failed): the first graphical login
#   runs `gloview-activate` (via autostart.lua) with IPC present and does the
#   real add/update/enable/reload, and the re-run *inside* Hyprland asserts
#   green. The trailing verify role does not assert GloView, so a skip stays
#   green by design.
- name: Allow passwordless hyprpm helper escalation
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/20-hyprpm-{{ ansible_facts['user_id'] }}"
    content: |
      {{ ansible_facts['user_id'] }} ALL=(ALL) NOPASSWD: /usr/bin/mkdir -p -m [0-7]* /var/cache/hyprpm*
      {{ ansible_facts['user_id'] }} ALL=(ALL) NOPASSWD: /usr/bin/install -m[0-7]* -o 0 -g 0 * /var/cache/hyprpm/*
      {{ ansible_facts['user_id'] }} ALL=(ALL) NOPASSWD: /usr/bin/rm -fr /var/cache/hyprpm*
      {{ ansible_facts['user_id'] }} ALL=(ALL) NOPASSWD: /usr/bin/echo hyprland
    mode: "0440"
    validate: "visudo -cf %s"
  become: true
  when: not ansible_check_mode

- name: Check whether hyprpm headers are synced
  ansible.builtin.stat:
    path: "/var/cache/hyprpm/{{ ansible_facts['user_id'] }}/headersRoot/share/pkgconfig/hyprland.pc"
  register: gloview_store_check
  changed_when: false

- name: Warn when GloView needs an interactive header sync
  ansible.builtin.debug:
    msg: >-
      hyprpm headers are not synced (fresh machine or Hyprland upgrade) and the
      header sync requires an interactive sudo, so the GloView tasks below are
      SKIPPED. Run `hyprpm update` once in a terminal, then re-run provisioning.
  when: not gloview_store_check.stat.exists

- name: Check for hyprpm
  ansible.builtin.shell: command -v hyprpm
  register: gloview_hyprpm_check
  changed_when: false
  failed_when: false

- name: Ensure hyprpm is available
  ansible.builtin.assert:
    that:
      - gloview_hyprpm_check.rc == 0
      - gloview_hyprpm_check.stdout | length > 0
    fail_msg: hyprpm is required to install GloView and was not found on PATH.
  when: not ansible_check_mode

- name: Remove obsolete Hyprspace repository
  ansible.builtin.command:
    argv:
      - hyprpm
      - remove
      - Hyprspace
  register: gloview_remove_hyprspace
  changed_when: gloview_remove_hyprspace.rc == 0
  failed_when: false
  when:
    - not ansible_check_mode
    - gloview_store_check.stat.exists

- name: Remove obsolete hyprexpo repository
  ansible.builtin.command:
    argv:
      - hyprpm
      - remove
      - hyprexpo
  register: gloview_remove_hyprexpo
  changed_when: gloview_remove_hyprexpo.rc == 0
  failed_when: false
  when:
    - not ansible_check_mode
    - gloview_store_check.stat.exists

- name: Check whether Hyprland IPC is reachable
  ansible.builtin.command:
    argv:
      - hyprctl
      - version
  register: gloview_hyprland_check
  changed_when: false
  failed_when: false

- name: Warn when GloView is deferred (no Hyprland IPC)
  ansible.builtin.debug:
    msg: >-
      Hyprland IPC is not reachable (TTY/X11 provision) and hyprpm requires a
      live compositor even for `add`/`update`, so the GloView add/enable tasks
      below are SKIPPED (DEFERRED, not failed). Log into Hyprland once —
      autostart runs `gloview-activate` with IPC present — then re-run
      provisioning from a terminal inside Hyprland to assert green.
  when:
    - gloview_store_check.stat.exists
    - gloview_hyprland_check.rc != 0

- name: Check whether GloView is already installed
  ansible.builtin.shell: hyprpm list 2>&1 | grep -E -q 'Repository gloview|Plugin gloview'
  register: gloview_installed
  changed_when: false
  failed_when: false
  when:
    - not ansible_check_mode
    - gloview_store_check.stat.exists

- name: Add the GloView repository
  ansible.builtin.command:
    argv:
      - hyprpm
      - add
      - "{{ gloview_repository }}"
  register: gloview_add
  changed_when: gloview_add.rc == 0
  failed_when: false
  when:
    - not ansible_check_mode
    - gloview_store_check.stat.exists
    - gloview_hyprland_check.rc == 0
    - gloview_installed.rc | default(1) != 0

- name: Synchronize hyprpm headers and rebuild stale plugins
  ansible.builtin.command:
    argv:
      - hyprpm
      - update
  register: gloview_update
  changed_when: gloview_update.rc == 0
  failed_when: false
  when:
    - not ansible_check_mode
    - gloview_store_check.stat.exists
    - gloview_hyprland_check.rc == 0

- name: Enable GloView
  ansible.builtin.command:
    argv:
      - hyprpm
      - enable
      - gloview
  register: gloview_enable
  changed_when: gloview_enable.rc == 0
  failed_when: false
  when:
    - not ansible_check_mode
    - gloview_store_check.stat.exists
    - gloview_hyprland_check.rc == 0

- name: Reload Hyprland plugins
  ansible.builtin.command:
    argv:
      - hyprpm
      - reload
  register: gloview_reload
  changed_when: gloview_reload.rc == 0
  failed_when: false
  when:
    - not ansible_check_mode
    - gloview_store_check.stat.exists
    - gloview_hyprland_check.rc == 0

- name: Verify GloView is enabled
  ansible.builtin.shell: "hyprpm list 2>&1 | grep -E -A2 'Repository gloview|Plugin gloview' | grep -q 'enabled:'"
  register: gloview_status
  changed_when: false
  failed_when: false
  when:
    - not ansible_check_mode
    - gloview_store_check.stat.exists
    - gloview_hyprland_check.rc == 0

- name: Verify GloView is loaded in Hyprland
  ansible.builtin.shell: hyprctl plugin list 2>&1 | grep -qi gloview
  register: gloview_loaded
  changed_when: false
  failed_when: false
  when:
    - not ansible_check_mode
    - gloview_store_check.stat.exists
    - gloview_hyprland_check.rc == 0

- name: Assert GloView installed, fresh, and loaded
  ansible.builtin.assert:
    that:
      - gloview_installed.rc == 0 or gloview_add.rc == 0
      - gloview_update.rc == 0
      - gloview_enable.rc == 0
      - gloview_status.rc == 0
      - gloview_reload.rc == 0 and gloview_loaded.rc == 0
    fail_msg: >-
      GloView did not install and load successfully.
      add={{ gloview_add.rc | default('skipped') }},
      update={{ gloview_update.rc }},
      enable={{ gloview_enable.rc }}, reload={{ gloview_reload.rc | default('skipped: no Hyprland IPC') }},
      status={{ gloview_status.rc }}, loaded={{ gloview_loaded.rc | default('skipped: no Hyprland IPC') }}.
      If update failed, check network access and that the hyprpm headers match
      the installed Hyprland (a Hyprland upgrade always requires a rebuild:
      run `hyprpm update` once in a terminal inside Hyprland, then re-run provisioning).
  when:
    - not ansible_check_mode
    - gloview_store_check.stat.exists
    - gloview_hyprland_check.rc == 0
