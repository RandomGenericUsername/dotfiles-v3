---
# GloView via the gloview-git AUR package (no hyprpm).
#
# Rationale (2026-09-30): hyprpm requires a LIVE Hyprland IPC session even
# for `add`/`update` (verified live 2026-09-29 — a TTY provision can never
# provide it), so the whole header-sync + sudoers-helper + deferred-green
# machinery existed only to serve hyprpm. Upstream packages the same plugin
# as a plain cmake build (gloview-git installs /usr/lib/gloview.so, loaded
# at runtime via `hyprctl plugin load`), so provisioning installs the
# package (packages role, aur_packages) and this role only asserts the
# artifact is present — fully headless-checkable, single TTY run to green.
# Loading happens in-session via gloview-activate (autostart.lua), which
# also owns the ABI-stale warning after Hyprland upgrades.
#
# No task here invokes hyprpm. No task needs become except the legacy
# sudoers cleanup below.

# Legacy cleanup: the hyprpm era granted this user passwordless sudo for
# helper binaries writing under /var/cache/hyprpm. Nothing uses them
# anymore — remove the file if a previous provision created it.
- name: Remove legacy hyprpm helper sudoers file
  ansible.builtin.file:
    path: "/etc/sudoers.d/20-hyprpm-{{ ansible_facts['user_id'] }}"
    state: absent
  become: true
  when: not ansible_check_mode

- name: Check GloView plugin artifact from gloview-git
  ansible.builtin.stat:
    path: "{{ gloview_plugin_so_path }}"
    follow: true
  register: gloview_plugin_artifact
  changed_when: false

- name: Assert GloView installed
  ansible.builtin.assert:
    that:
      - gloview_plugin_artifact.stat.exists
      - gloview_plugin_artifact.stat.isreg | default(false)
    fail_msg: >-
      GloView plugin artifact {{ gloview_plugin_so_path }} is missing — the
      gloview-git AUR package did not install it. Re-run provisioning (the
      packages role installs aur_packages via yay); if the yay step failed,
      fix that error first. If the file exists but the plugin does not load
      inside Hyprland, the .so is ABI-stale after a Hyprland upgrade:
      rebuild with `yay -S gloview-git`, then relog.
