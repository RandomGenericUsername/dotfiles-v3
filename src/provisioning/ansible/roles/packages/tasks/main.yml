# Packages role (Story 2.3) — installs the logical package set per distro.
#
# Distro logic lives in vars/{arch,debian}.yml (AC 4): the ONLY place
# ansible_os_family appears is in the two include_vars tasks below. Every
# Arch-specific task after that gates on `packages_use_aur | bool` — a var
# loaded from vars/arch.yml — never on ansible_os_family directly.
#
# Package names never appear here: the group_vars `packages` map (authored in
# Story 2.2) is flattened and handed to ansible.builtin.package, which
# auto-detects pacman/apt (NFR-3).

- name: Load Arch-specific package role vars
  ansible.builtin.include_vars:
    file: arch.yml
  when: ansible_facts['os_family'] == "Archlinux"

- name: Load Debian-specific package role vars
  ansible.builtin.include_vars:
    file: debian.yml
  when: ansible_facts['os_family'] == "Debian"

# - Assemble package list: flatten the group_vars `packages` map, EXCLUDING
#   AUR-only names (correct-course 2026-08-18: AGS = aylurs-gtk-shell-git has no
#   pacman package). `aur_packages` (vars/arch.yml) lists the AUR-only names;
#   they are removed from the pacman/apt install and handed to the
#   kewlfft.aur.aur task below. On Debian-family packages_use_aur is false so
#   the subtraction is a no-op.
- name: Assemble package list
  ansible.builtin.set_fact:
    packages_flat: "{{ packages.values() | list | flatten | reject('equalto', '') | difference(aur_packages) | list }}"

# ansible.cfg sets remote_tmp = /tmp/dotfiles-ansible so the root/container
# --check become_user path avoids the temp-file ownership guard (deferred-work
# 3-2 fix). On a REAL per-user machine that dir is otherwise created root-owned
# 0700 by the first `become: true` task, which then blocks the later
# `become_user: aur_builder` write (Permission denied). Ensure it is sticky +
# world-writable (01777) so BOTH the root connection user and the become_user
# can stage module temp files (VM-verified 2026-08-19).
- name: Ensure ansible remote_tmp is world-writable for become_user
  ansible.builtin.file:
    path: /tmp/dotfiles-ansible
    state: directory
    mode: "01777"
  become: true

# `-Syy` forces a full DB refresh (not `-Sy`) — deliberate: the provisioner
# must reconcile against current mirror state, so a stale local DB is never
# trusted. `failed_when: false` + an explicit fail task turns a command failure
# into a diagnosable message: a bare ansible.builtin.command failure prints only
# "non-zero return code" and, because ansible routes task errors to STDOUT, the
# orchestrator's stderr-based error view would otherwise be blank. The
# registered rc/stdout/stderr is the actual pacman error (e.g. an ENOSPC
# "Failure writing output to destination" or a mirror/keyring error).
- name: Refresh pacman databases before install
  ansible.builtin.command: pacman -Syy --noconfirm
  register: pacman_db_refresh
  failed_when: false
  become: true
  when:
    - ansible_facts['os_family'] == "Archlinux"
    - not ansible_check_mode

- name: Fail with the pacman DB refresh error and likely causes
  ansible.builtin.fail:
    msg: >-
      pacman -Syy failed (rc={{ pacman_db_refresh.rc | default('?') }}).
      stdout: {{ pacman_db_refresh.stdout | default('') | trim }}
      stderr: {{ pacman_db_refresh.stderr | default('') | trim }}
      Likely causes: a stale/held /var/lib/pacman/db.lck (another pacman, pamac,
      paru, yay, or a crashed run); unreachable or empty mirrors
      (/etc/pacman.d/mirrorlist); a broken pacman keyring
      (pacman-key --init/--populate); a corrupted pacman database; or a full
      disk (check `df -h /`). Fix the cause, then re-run.
  when:
    - ansible_facts['os_family'] == "Archlinux"
    - not ansible_check_mode
    - pacman_db_refresh.rc is defined
    - pacman_db_refresh.rc != 0

- name: Install system packages
  ansible.builtin.package:
    name: "{{ packages_flat }}"
    state: "{{ packages_state }}"
  become: true

- name: Install base-devel and git
  ansible.builtin.package:
    name: [base-devel, git]
    state: present
  become: true
  when: packages_use_aur | bool

- name: Create aur_builder user
  ansible.builtin.user:
    name: "{{ aur_builder_user }}"
    group: "{{ aur_builder_group }}"
    create_home: true
  become: true
  when: packages_use_aur | bool

- name: Allow aur_builder to run pacman without password
  ansible.builtin.lineinfile:
    path: "/etc/sudoers.d/11-install-{{ aur_builder_user }}"
    line: "{{ aur_builder_user }} ALL=(ALL) NOPASSWD: /usr/bin/pacman"
    regexp: "^{{ aur_builder_user }} "
    create: true
    mode: "0440"
    validate: "visudo -cf %s"
  become: true
  when: packages_use_aur | bool

- name: Check for existing yay
  ansible.builtin.command: command -v yay
  register: yay_check
  changed_when: false
  failed_when: false
  when: packages_use_aur | bool

- name: Clone yay-bin PKGBUILD
  ansible.builtin.git:
    repo: "{{ yay_repo }}"
    dest: "{{ aur_build_dir }}"
    force: true
  become: true
  become_user: "{{ aur_builder_user }}"
  vars:
    ansible_python_interpreter: /usr/bin/python3
  when:
    - packages_use_aur | bool
    - yay_check.rc != 0
    - not ansible_check_mode

# Build and install yay-bin via makepkg. Gated `when: not ansible_check_mode`
# so a dry-run NEVER builds: under --check Ansible would otherwise stage the
# become_user (aur_builder) temp-file wrapper and abort with the temp-file
# ownership guard in a root/container context — even though makepkg is not
# supposed to run in dry-run. The `creates: /usr/bin/yay` is the real-apply
# idempotency guard (deferred-work 3-2 defect #2 fix).
- name: Build and install yay-bin via makepkg
  ansible.builtin.command: makepkg -si --noconfirm
  args:
    chdir: "{{ aur_build_dir }}"
    creates: /usr/bin/yay
  become: true
  become_user: "{{ aur_builder_user }}"
  vars:
    ansible_python_interpreter: /usr/bin/python3
  when:
    - packages_use_aur | bool
    - not ansible_check_mode

- name: Check for foreign files that would block the AUR install
  ansible.builtin.shell: "test -e '{{ item }}' || { echo ABSENT; exit 0; }; pacman -Qo '{{ item }}' >/dev/null 2>&1 && echo owned || echo FOREIGN"
  loop: "{{ aur_conflict_probe_paths }}"
  register: packages_aur_probe
  changed_when: false
  failed_when: false
  when:
    - packages_use_aur | bool
    - aur_packages | length > 0
    - not ansible_check_mode

- name: Assert no foreign files block the AUR install
  ansible.builtin.assert:
    that: packages_aur_probe.results | selectattr('stdout', 'search', 'FOREIGN') | list | length == 0
    fail_msg: >-
      foreign (non-pacman-owned) files were found that will make the AUR
      install fail with 'conflicting files'. These are stray artifacts (e.g. a
      past `pip install` into the system python) that block pacman deps. Remove
      them with `sudo rm -rf <path>` then re-run. Foreign paths detected:
      {% for r in packages_aur_probe.results if 'FOREIGN' in r.stdout %}{{ r.item }} {% endfor %}
      (configurable via aur_conflict_probe_paths)
  when:
    - packages_use_aur | bool
    - aur_packages | length > 0
    - not ansible_check_mode

- name: Install AUR packages via yay
  kewlfft.aur.aur:
    name: "{{ aur_packages }}"
    state: present
    use: yay
  become: true
  become_user: "{{ aur_builder_user }}"
  vars:
    ansible_python_interpreter: /usr/bin/python3
  when:
    - packages_use_aur | bool
    - aur_packages | length > 0
    - not ansible_check_mode

# NetworkManager is the runtime backend astal-network (the AGS bar) reads
# (libnm). Installing the package alone leaves no daemon running, so the bar
# reports "no network" and the network-click TUI (wifitui/nmtui) exits
# instantly. Enable + start it here so the persistent provisioned state is
# correct — mirror of the display_manager role's service-enable pattern.
- name: Enable and start NetworkManager
  ansible.builtin.systemd:
    name: NetworkManager
    enabled: true
    state: started
  become: true
  when: not ansible_check_mode
