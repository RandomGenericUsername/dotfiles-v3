# Display-manager role vars (Story 3.4 / working Hyprland login).
#
# Greeter selection (2026-08-18):
#   regreet — graphical GTK4 greeter (Arch `extra` package greetd-regreet),
#             hosted inside Cage, a minimal Wayland compositor purpose-built to
#             hold a single fullscreen app. Cage + regreet is the standard,
#             reliable greetd graphical-login path (regreet's PRIMARY mode).
#   tuigreet — TUI/text greeter (greetd-tuigreet). Fallback for distros where
#              regreet is unavailable (e.g. Debian main only ships
#              greetd-tuigreet; regreet is experimental-only there).
# The role ships settings for both and a distro-aware default.

# display_manager_greeter_type: the configured greeter engine. Auto-selects
#   regreet on Arch, tuigreet elsewhere. Overrideable via extra-var/group_vars
#   (e.g. to force tuigreet everywhere).
display_manager_greeter_type: "{{ 'regreet' if ansible_os_family == 'Archlinux' else 'tuigreet' }}"

# display_manager_packages: the greetd session daemon + chosen greeter + (for
#   regreet) Cage, the Wayland compositor that hosts the graphical greeter.
#   Arch: greetd-regreet + cage are in extra. Debian: greetd-tuigreet is in
#   main (regreet/cage are experimental-ish), so use the TUI greeter there.
display_manager_packages_regreet:
  - greetd
  - greetd-regreet
  - cage
display_manager_packages_tuigreet:
  - greetd
  - greetd-tuigreet

# Resolved install list based on the selected greeter.
display_manager_packages: >-
  {{ display_manager_packages_regreet if display_manager_greeter_type == 'regreet' else display_manager_packages_tuigreet }}

# display_manager_greeter_user: the system user greetd runs its greeter as.
#   greetd requires this user to exist; the default 'greeter' is standard.
display_manager_greeter_user: greeter

# display_manager_greeter_shell: the greeter user's login shell. The greeter
#   never gets an interactive login (the greeter launches the session as the
#   LOGGED-IN user, not as 'greeter').
display_manager_greeter_shell: /usr/bin/false

# display_manager_disable_services: X11 display managers that greetd replaces
#   and that this role disables (they grab the GPU and cause the Hyprland
#   freeze). Failed_when: false on the disable so an absent service is a no-op.
display_manager_disable_services:
  - lightdm
  - sddm
