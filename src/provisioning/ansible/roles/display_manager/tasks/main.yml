# Display-manager role (Story 3.4 / working Hyprland login) — provisions a
# Wayland-friendly login manager so a fresh machine boots into Hyprland + the
# AGS bar without an X11-greeter GPU conflict.
#
# Why greetd (2026-08-18 decision):
#   X11 greeters (lightdm, sddm's built-in greeter) launch an Xorg server that
#   GRABS the DRM/GPU. Starting Hyprland (Wayland) on that same GPU afterwards
#   causes modeset contention and a hard freeze (observed: lightdm session
#   froze, TTY-launched Hyprland worked). greetd is a minimal session daemon
#   with NO built-in GUI/GPU grab. Combined with an X11-free greeter (regreet,
#   a GTK4 Wayland greeter, or tuigreet, a TUI greeter), the freeze is gone.
#
# Greeter selection (distro-aware, configurable):
#   regreet  (Arch default) — graphical GTK4 greeter, hosted inside a Hyprland
#            Wayland session (hyprland-greeter.conf runs regreet then exits).
#   tuigreet (Debian default) — text/TUI greeter; regreet is experimental-only
#            there, so TUI is the reliable mainstream fallback.
#
# Role responsibilities (machine-level, become):
#   1. Install greetd + the selected greeter.
#   2. Ensure the greetd "greeter" user exists.
#   3. Render /etc/greetd/config.toml (greeter session per display_manager_
#      greeter_type) + the regreet Hyprland host config when regreet is used.
#   4. Enable greetd + disable the X11 greeters it replaces (lightdm/sddm).
#
# The user-facing session (real login -> Hyprland + AGS bar) is launched by the
# greeter after auth: regreet via accountsservice + the wayland-sessions dir,
# tuigreet via /usr/local/bin/hypr-session (dbus-run-session -> Hyprland).

- name: Assert fact-gathering provided HOME
  ansible.builtin.assert:
    that: ansible_facts.env.HOME is defined and ansible_facts.env.HOME | trim | length > 0
    fail_msg: >-
      ansible_facts.env.HOME is undefined — the display_manager role derives
      nothing from it directly but runs as root; gather_facts must be true

- name: Ensure greetd + the selected greeter are installed
  ansible.builtin.package:
    name: "{{ display_manager_packages }}"
    state: present
  become: true

- name: Ensure the greetd greeter user exists
  ansible.builtin.user:
    name: "{{ display_manager_greeter_user }}"
    shell: "{{ display_manager_greeter_shell }}"
    create_home: true
  become: true

- name: Ensure greetd config directory exists
  ansible.builtin.file:
    path: /etc/greetd
    state: directory
  become: true

- name: Render the regreet Hyprland host config
  ansible.builtin.template:
    src: hyprland-greeter.conf.j2
    dest: "{{ display_manager_hyprland_greeter_conf }}"
    mode: "0644"
  become: true
  when: display_manager_greeter_type == 'regreet'

- name: Ensure regreet state/log dirs exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /var/lib/regreet
    - /var/log/regreet
  become: true
  when: display_manager_greeter_type == 'regreet'

- name: Render greetd session launcher (tuigreet fallback)
  ansible.builtin.template:
    src: hypr-session.j2
    dest: /usr/local/bin/hypr-session
    mode: "0755"
  become: true
  when: display_manager_greeter_type == 'tuigreet'

- name: Render greetd config
  ansible.builtin.template:
    src: config.toml.j2
    dest: /etc/greetd/config.toml
    mode: "0644"
  become: true

- name: Remove the old display-manager.service alias
  ansible.builtin.file:
    path: /etc/systemd/system/display-manager.service
    state: absent
  become: true
  failed_when: false

- name: Enable greetd service
  ansible.builtin.systemd:
    name: greetd
    enabled: true
    daemon_reload: true
  become: true

- name: Disable the superseded X11 display manager
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: false
  loop: "{{ display_manager_disable_services }}"
  become: true
  failed_when: false
