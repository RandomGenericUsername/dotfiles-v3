# Default palette role (Story 2.7) — generates the default palette from the
# 2.6-unpacked default.png at apply time via `csg generate` (FR-18,
# chaining-spine.md), writing conf/css/yaml into the generated/palettes/ spine
# dir the filesystem role (2.5) created. CONSUMER of the assets role's
# default.png; PREREQUISITE for compositor_configs (2.9) and the verify gate
# (2.12, done-criterion 6).
#
# Design (locked in Story 2.7 Dev Notes):
# - The FIRST task is the fail-loud install_dir seam assert, copied verbatim
#   from the filesystem/assets roles (AC 8): install_dir is deliberately never
#   defaulted (group_vars/all.yml), so an undefined spine root must abort with
#   a friendly message before any task evaluates. Do NOT alias install_dir into
#   a var — lazy evaluation could surface a raw undefined-var error instead.
# - The output dir is forced per-process via the env override
#   COLORSCHEME__OUTPUT__DIRECTORY (NOT -o, AC 9), kept symmetric with the
#   mandated COLORSCHEME__OUTPUT__OVERWRITE env override (AC 3). Load-bearing:
#   at default_palette time the rendered CSG settings file does not exist yet
#   (Story 2.11) and CSG's packaged default output dir is /tmp/color-scheme —
#   without the override the palette silently lands in /tmp and done-criterion
#   6 / Story 2.9 / Story 3.3 all fail. The override is scoped to the SINGLE
#   generate task; the rendered settings file (Story 2.11) keeps overwrite =
#   false — THIS ROLE MUST NOT AUTHOR, RENDER, OR MODIFY any settings file
#   (AC 4).
# - Container mode (product decision 2026-08-12): csg runs INSIDE its container
#   image (the host never installs pywal/imagemagick). This role forces the
#   runtime via env COLORSCHEME__RUNTIME__MODE=container and the engine via
#   COLORSCHEME__CONTAINER__ENGINE=<detected engine>, so the generate task does
#   NOT depend on a host-side backend. The engine is DETECTED at runtime
#   (podman preferred, then docker, then FAIL LOUD — see the engine tasks below);
#   podman/docker are DOCUMENTED DEPENDENCIES, not installed by this chain.
#   Precondition: the cli_tools role's image-build task must have built the
#   matching csg-<backend>-<engine> image. Do NOT remove these two env overrides
#   — that silently reverts to local mode and breaks the container-mode
#   decision (the exact defect this chain fixes).
# - Regenerate semantics (AC 7, FR-18): the generate task carries NO
#   `creates:` and is NOT gated on palette-file existence, so replacing
#   wallpapers.tar.gz (re-extracted by 2.6) causes the next apply to
#   regenerate. The task reports `changed` on every apply even when the palette
#   content is identical — this is accepted by design (SPEC §FR-18,
#   chaining-spine.md#23); idempotency means no STATE drift, and the verify
#   gate (2.12) checks the output files, not Ansible changed-counts. Do NOT
#   "fix" this with a creates:/existence gate — that was the exact mistake
#   2.6's review called out for the tarball.
# - Check mode (dry-run must be dry): the generate command + all assertion
#   guards are gated `when: not ansible_check_mode`. command/shell tasks are
#   skipped under --check in current ansible-core (verified 2.20.3), so the
#   ungated generate would NOT write under --check today — but the gate is kept
#   as the locked contract (version-proof + test-locked), NOT removed. The
#   read-only `command -v csg` shell check is likewise skipped under --check; its
#   assert is gated so a dry-run never fails on host-state preconditions.
# - `command -v` is a SHELL BUILTIN → ansible.builtin.shell (review F1), with
#   default_palette_bin_dir prepended to PATH so the guard finds csg in the uv
#   bin dir even when ~/.local/bin is not on the inherited playbook PATH
#   (otherwise the bootstrap chain would FALSE-FAIL right after cli_tools
#   installed csg).
# - default.png presence (AC 6) is a stat + assert PAIR, both gated
#   `when: not ansible_check_mode` (under --check the assets unarchive is
#   skipped so the file is absent on a fresh target; an assert alone cannot
#   check file existence). 2.6's guard is the primary chain guard; this one
#   makes a direct default-palette.yaml run fail loudly with a friendly message
#   instead of a raw `csg` "file not found" traceback.
# - User-scoped privilege context: NO become/become_user anywhere (AC 10).

- name: Assert install_dir seam is provided
  ansible.builtin.assert:
    that: install_dir is defined and install_dir | trim | length > 0
    fail_msg: >-
      install_dir is undefined or empty — the default_palette role requires the
      install_dir seam extra-var (the orchestrator resolves
      $XDG_DATA_HOME/dotfiles/; direct runs pass -e install_dir=...)

- name: Ensure palette output dir exists
  ansible.builtin.file:
    path: "{{ default_palette_output_dir }}"
    state: directory

- name: Check for csg
  ansible.builtin.shell: command -v csg
  register: default_palette_csg_check
  changed_when: false
  failed_when: false
  environment:
    PATH: "{{ default_palette_bin_dir }}:{{ ansible_facts.env.PATH }}"

- name: Ensure csg is available
  ansible.builtin.assert:
    that: default_palette_csg_check.rc == 0 and default_palette_csg_check.stdout | length > 0
    fail_msg: >-
      csg not found on PATH — the default_palette role requires csg, which the
      cli_tools role (Story 2.4) installs via uv tool install into
      ~/.local/bin; run the cli-tools playbook first (direct-run
      prerequisite, AC 9). Note: container mode also requires the cli_tools
      role's image-build task to have run, or `csg generate` fails with a
      missing-container-image error.
  when: not ansible_check_mode

- name: Check default.png was unpacked
  ansible.builtin.stat:
    path: "{{ default_palette_default_image }}"
  register: default_palette_default_png
  when: not ansible_check_mode

- name: Assert default.png is present
  ansible.builtin.assert:
    that: default_palette_default_png.stat.exists
    fail_msg: >-
      {{ default_palette_default_image }} not found — the assets role (Story
      2.6) unpacks default.png from wallpapers.tar.gz; run the assets playbook
      first (direct-run prerequisite, AC 6)
  when: not ansible_check_mode

# Container engine detection (podman preferred, then docker, then FAIL LOUD).
# podman/docker are DOCUMENTED DEPENDENCIES — the generate task's
# COLORSCHEME__CONTAINER__ENGINE must match the engine the cli_tools role
# detected when it built the image, so the generate-time image name resolves.
# The probe is a read-only shell task; under --check command/shell tasks do not
# run (so the set_fact falls back to "none") and the assert is additionally
# gated `when: not ansible_check_mode` (mirror of the csg/weg guard pattern).
# A non-empty default_palette_container_engine_override skips the probe and
# forces the engine (still validated by the assert).

- name: Detect container engine (podman, then docker)
  ansible.builtin.shell: "command -v podman >/dev/null 2>&1 && printf podman || { command -v docker >/dev/null 2>&1 && printf docker || printf none; }"
  register: default_palette_engine_check
  changed_when: false
  failed_when: false
  environment:
    PATH: "{{ default_palette_bin_dir }}:{{ ansible_facts.env.PATH }}"
  when: not default_palette_container_engine_override | default("", true)

- name: Resolve container engine
  ansible.builtin.set_fact:
    default_palette_container_engine: "{{ default_palette_container_engine_override | default('') or default_palette_engine_check.stdout | trim | default('none', true) }}"

- name: Ensure a container engine is available
  ansible.builtin.assert:
    that: default_palette_container_engine in ["podman", "docker"]
    fail_msg: >-
      No usable container engine — resolved '{{ default_palette_container_engine }}'.
      csg generate must run in container mode (product decision 2026-08-12) but
      neither podman nor docker is available. podman/docker are DOCUMENTED
      DEPENDENCIES (not installed by this chain); install one and re-run, or set
      default_palette_container_engine_override to the engine the cli_tools
      role used to build the image
  when: not ansible_check_mode

- name: Generate default palette
  ansible.builtin.command: "csg generate '{{ default_palette_default_image }}' -f {{ default_palette_formats | join(' -f ') }}"
  environment:
    COLORSCHEME__RUNTIME__MODE: "container"
    COLORSCHEME__CONTAINER__ENGINE: "{{ default_palette_container_engine }}"
    COLORSCHEME__OUTPUT__DIRECTORY: "{{ default_palette_output_dir }}"
    COLORSCHEME__OUTPUT__OVERWRITE: "true"
    PATH: "{{ default_palette_bin_dir }}:{{ ansible_facts.env.PATH }}"
  when: not ansible_check_mode

# Post-generate verification (review finding 2026-08-12): csg exits 0 even when
# a template render fails silently (LocalProcessor collects render errors into
# result.stderr and the CLI never raises), so `success` / rc 0 does NOT prove the
# palette was written. The verify gate (Story 2.12, done-criterion 6) checks
# these files later, but this role fails LOUD at the point of failure instead of
# reporting `ok` with zero output files. Both tasks are --check-gated (mirror of
# the default.png stat+assert pair).

- name: Verify generated palette files exist
  ansible.builtin.stat:
    path: "{{ default_palette_output_dir + '/' + item }}"
  loop:
    - colors.conf
    - colors.gtk.css
    - colors.yaml
  register: default_palette_output_check
  when: not ansible_check_mode

- name: Assert generated palette files are present
  ansible.builtin.assert:
    that: default_palette_output_check.results | selectattr('stat.exists') | list | length == 3
    fail_msg: >-
      Palette generation reported success but not all three output files are
      present in {{ default_palette_output_dir }} (expected colors.conf,
      colors.gtk.css, colors.yaml). csg can exit 0 on a silent render failure —
      inspect the generate task output and the container logs, then re-apply
  when: not ansible_check_mode
