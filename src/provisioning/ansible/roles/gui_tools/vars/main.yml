# gui_tools_ags_instances: the AGS process instances this role manages
#   (names as reported by `ags list`). AGS bundles TypeScript at startup and
#   holds the compiled bundle in memory; without a restart the running process
#   keeps serving the old code even after provisioning has overwritten the
#   sources on disk — so every entry is quit after placement. Each entry is a
#   mapping:
#     name      — the instance name on the AGS bus (`ags quit -i <name>`).
#     always_on — true for the session-critical instances the machine must
#                 KEEP running (the status bar `ags`, the notification overlay
#                 `notifications`); false for the keybind-launched tools
#                 (`capture`, `icon-color-mapping-editor`, `hypr-pano`,
#                 `wallpaper-selector`), which provisioning deliberately
#                 leaves quit (§ per-instance lifecycle below).
#     launch    — for always_on entries ONLY: the exact `ags run` command this
#                 role re-issues when the instance is not on the bus (mirror of
#                 the autostart.lua line). On-demand entries carry no launch —
#                 their provisioned keybind launchers (cli_tools) start them.
#   Single source of truth: "which instances are always on" is exactly the
#   always_on flag here (and its derived view below) — never a second list.
#
#   Lifecycle split (owner intent, provisioning-keeps-ags-instances-running):
#   - always_on: quit to re-bundle, then brought back UP on the spot (detached
#     start-if-down below) so a provision run never leaves the session without
#     its status bar or — worse — without any owner of
#     org.freedesktop.Notifications (dunst is masked on purpose, so the overlay
#     is the session's only notification daemon).
#   - on-demand: quit and left down; the provisioned keybind launchers
#     (capture-ui, icon-color-mapping-editor, hypr-pano-ui,
#     wallpaper-selector-ui in cli_tools) start them when the user asks, so
#     provisioning never opens a window nobody requested.
gui_tools_ags_instances:
  - name: ags
    always_on: true
    launch: "ags run"
  - name: capture
    always_on: false
  - name: icon-color-mapping-editor
    always_on: false
  - name: hypr-pano
    always_on: false
  - name: wallpaper-selector
    always_on: false
  # The notification overlay's per-file placement is RETIRED (slice 4 — the
  # app now deploys WHOLE from the ags-apps unit via the ags_apps role's
  # live-notifications link), but this AGS instance entry STAYS: it is the
  # mechanism that STARTS the daemon and restarts it after the quit loop above.
  # It launches from ~/.config/ags-notifications (the config-links symlink to
  # the live-notifications link), never the unit path directly, so a re-provision
  # re-bundles the freshly linked sources. autostart.lua starts the same command
  # at login (same stagger-free log file).
  - name: notifications
    always_on: true
    launch: "ags run -d {{ gui_tools_xdg_config_home }}/ags-notifications --log-file {{ gui_tools_xdg_state_home }}/ags/notifications.log"
  - name: btop-theme-studio
    always_on: false

# gui_tools_ags_always_on_instances: DERIVED view of the always_on entries
#   (the subset the role restarts after the quit loop). Derived, never a
#   hand-maintained list, so the always-on set has exactly one source of truth
#   in gui_tools_ags_instances.
gui_tools_ags_always_on_instances: "{{ gui_tools_ags_instances | selectattr('always_on') | list }}"
