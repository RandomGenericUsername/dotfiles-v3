# GUI tools role vars — standalone desktop GUI applications under
# src/gui-tools/<tool>/, each with its own AGS instance, autostart slot, and
# spine config dir (<install>/config/<app>/, symlinked to ~/.config/<app> by
# the config-links role).
#
# Mirror-and-adapt discipline (Epic 1 retro action item) — what differs from
# the compositor_configs mirror:
#   (a) vs compositor_configs (skeletons for the bar/compositor apps):
#       this role places whole APP dirs (one entry per file, same per-file
#       `template` + `force: true` discipline — `copy` with a directory src
#       + a pre-existing dest dir is a silent no-op, review finding
#       2026-08-12). Each app gets its own spine dir; the role never touches
#       the bar's `ags/` tree.
#   (b) vs cli_tools (backend binaries): cli_tools installs the controller
#       binaries to the user bin dir; this role places the AGS UI sources.
#       The two meet at runtime via $PATH + the instance bus, never on disk.
#
# hypr-pano IS RETIRED AS A GUI-TOOLS APP (ags-apps-bar-first slice 3). The
# clipboard overlay moved into the ags-apps monorepo unit and deploys WHOLE via
# the ags_apps role's live-pano link (<install>/config/ags-hypr-pano ->
# <unit>/hypr-pano), so this role no longer enumerates it per file. The AGS
# instance entry stays in gui_tools_ags_instances below: the app still launches
# from ~/.config/ags-hypr-pano (the config-links symlink to the live-pano link),
# and the quit loop must still restart it after placement. The deploy-coverage
# gate asserts the absence of a stale per-file hypr-pano entry.
#
# notifications IS RETIRED AS A GUI-TOOLS APP TOO (slice 4). The notification
# daemon moved into the same ags-apps monorepo unit and deploys WHOLE via the
# ags_apps role's live-notifications link (<install>/config/ags-notifications ->
# <unit>/notifications), so this role no longer enumerates it per file. The
# always-on AGS instance entry STAYS in gui_tools_ags_instances below: it is the
# mechanism that STARTS the daemon from ~/.config/ags-notifications (the
# config-links symlink to the live-notifications link) and restarts it after the
# quit loop. The deploy-coverage gate asserts the absence of a stale per-file
# notifications entry.
#
# capture-tool IS RETIRED AS A GUI-TOOLS APP (slice 5). The AGS GUI moved into
# the same ags-apps monorepo unit and deploys WHOLE via the ags_apps role's
# live-capture link (<install>/config/ags-capture -> <unit>/capture-tool), so
# this role no longer enumerates it per file and carries no capture app_files
# manifest. The on-demand `capture` AGS instance entry STAYS in
# gui_tools_ags_instances below: it is the mechanism the provisioned `capture-ui`
# launcher (cli_tools) and autostart.lua use to start the GUI from
# ~/.config/ags-capture (the config-links symlink to the live-capture link). The
# Python backend is NOT a GUI-tools concern at all: it stays in-repo and is
# installed by cli_tools. The deploy-coverage gate asserts the absence of a stale
# per-file capture entry.
#
# wallpaper-selector IS RETIRED AS A GUI-TOOLS APP (slice 6). The selector moved
# into the same ags-apps monorepo unit and deploys WHOLE via the ags_apps role's
# live-wallpaper-selector link (<install>/config/ags-wallpaper-selector ->
# <unit>/wallpaper-selector), so this role no longer enumerates it per file and
# carries no selector app_files manifest. The on-demand `wallpaper-selector` AGS
# instance entry STAYS in gui_tools_ags_instances below: it is the mechanism the
# provisioned `wallpaper-selector-ui` launcher (cli_tools) and autostart.lua use
# to start the selector from ~/.config/ags-wallpaper-selector (the config-links
# symlink to the live-wallpaper-selector link). The selector is a whole package —
# unlike capture-tool, nothing stays in-repo. The deploy-coverage gate asserts the
# absence of a stale per-file selector entry.
#
# icme IS RETIRED AS A GUI-TOOLS APP (slice 7). The icon color mapping editor
# moved into the same ags-apps monorepo unit and deploys WHOLE via the ags_apps
# role's live-icme link (<install>/config/ags-icme -> <unit>/icme), so this role
# no longer enumerates it per file and carries no icme app_files manifest. The
# on-demand `icon-color-mapping-editor` AGS instance entry STAYS in
# gui_tools_ags_instances below: it is the mechanism the provisioned
# `icon-color-mapping-editor` launcher (cli_tools) uses to start the editor from
# ~/.config/ags-icme (the config-links symlink to the live-icme link). icme is a
# whole package — nothing stays in-repo. The deploy-coverage gate asserts the
# absence of a stale per-file icme entry.

# gui_tools_repo_root: repo root derived from this playbook's location.
#   Mirror of compositor_configs_repo_root / cli_tools_repo_root exactly.
gui_tools_repo_root: "{{ playbook_dir }}/../../../.."

# gui_tools_xdg_state_home: the XDG state home the app log dir lives under
#   ($XDG_STATE_HOME, spec default ~/.local/state). Identical derivation to
#   the sibling roles (compositor_configs_xdg_state_home et al.): honors
#   $XDG_STATE_HOME with the spec default {{ ansible_facts.env.HOME }} +
#   '/.local/state'. Uses ansible_facts.env.* (F4 lock — never the deprecated
#   top-level ansible_env fact).
gui_tools_xdg_state_home: "{{ ansible_facts.env.XDG_STATE_HOME | default(ansible_facts.env.HOME | default(ansible_facts.user_dir) + '/.local/state', true) }}"

# gui_tools_xdg_config_home: the XDG config home the config_links role symlinks
#   each managed app dir into (~/.config/<app> -> <install>/config/<app>).
#   IDENTICAL derivation to gui_tools_xdg_state_home (and the sibling roles):
#   honors $XDG_CONFIG_HOME with the spec default ~/.config. Used to build the
#   always-on instances' `ags run -d` launch commands — the SAME path autostart
#   uses (via the symlink), never the spine path directly.
gui_tools_xdg_config_home: "{{ ansible_facts.env.XDG_CONFIG_HOME | default(ansible_facts.env.HOME | default(ansible_facts.user_dir) + '/.config', true) }}"

# gui_tools_state_dirs: runtime state dirs the apps need beyond the XDG base
#   homes the filesystem role creates. Currently the AGS per-instance log
#   dir consumed by autostart's --log-file. Owned here (not in autostart):
#   ensuring directories is provisioning's responsibility; the login
#   launcher only starts processes.
gui_tools_state_dirs:
  - "{{ gui_tools_xdg_state_home }}/ags"

# gui_tools_spine_config_dir: the config-in-spine destination root
#   (<install>/config/). Mirror of compositor_configs_spine_config_dir.
#   Trim lock: consumes the same validated {{ install_dir | trim }} value.
gui_tools_spine_config_dir: "{{ install_dir | trim }}/config"

# gui_tools_config_dirs: the standalone app dirs under the config-in-spine
#   home. Re-ensured as directories before the copies (copy does NOT create
#   dest parents for file sources) so a direct gui-tools.yaml run is
#   self-contained.
gui_tools_config_dirs:
  - "{{ gui_tools_spine_config_dir }}/ags-btop-studio"
  - "{{ gui_tools_spine_config_dir }}/ags-btop-studio/ui"
  - "{{ gui_tools_spine_config_dir }}/ags-btop-studio/lib"
  - "{{ gui_tools_spine_config_dir }}/ags-btop-studio/live"

# gui_tools_capture_obsolete and gui_tools_app_files are RETIRED (slice 5).
# The capture-tool AGS GUI moved into the ags-apps unit and deploys WHOLE via
# the ags_apps role's live-capture link (<install>/config/ags-capture ->
# <unit>/capture-tool), so this role carries NO per-file capture manifest and
# no obsolete-path cleanup list. A stale per-file entry would template INTO the
# unit tree through the live-capture link and diverge the live GUI from the
# pinned tag (the deploy-coverage gate asserts its absence). The Python backend
# is not a GUI-tools concern: it stays in-repo, installed by cli_tools.

# gui_tools_icme_app_files is RETIRED (slice 7): the icon color mapping editor
# moved into the ags-apps unit and deploys WHOLE via the ags_apps role's live-icme
# link (<install>/config/ags-icme -> <unit>/icme). No per-file manifest remains,
# no ags-icme/ spine dir is ensured, and no placement task runs — a stale entry
# would template INTO the unit tree through the link and diverge the live editor
# from the pinned tag (the deploy-coverage gate asserts its absence). The
# on-demand `icon-color-mapping-editor` AGS instance entry that STARTS the editor
# stays in gui_tools_ags_instances below, and the provisioned launcher still sets
# ICME_REPO_ROOT for the icon templates/mappings inputs (it does not point at the
# app sources).

# gui_tools_wallpaper_selector_app_files is RETIRED (slice 6): the wallpaper
# selector moved into the ags-apps unit and deploys WHOLE via the ags_apps role's
# live-wallpaper-selector link (<install>/config/ags-wallpaper-selector ->
# <unit>/wallpaper-selector). No per-file manifest remains — a stale entry would
# template INTO the unit tree through the link and diverge the live selector from
# the pinned tag (the deploy-coverage gate asserts its absence). The AGS instance
# entry that STARTS the selector stays in gui_tools_ags_instances below.

# gui_tools_notifications_app_files is RETIRED (slice 4): the notification
# daemon moved into the ags-apps unit and deploys WHOLE via the ags_apps role's
# live-notifications link. No per-file manifest remains — a stale entry would
# template INTO the unit tree through the link and diverge the live daemon from
# the pinned tag (the deploy-coverage gate asserts its absence). The AGS
# instance entry that STARTS the daemon stays in gui_tools_ags_instances below.

# gui_tools_btop_studio_app_files: the btop Theme Studio's app files, deployed
#   into their own ags-btop-studio/ spine dir. RAW COPY (ansible.builtin.copy),
#   NOT `template`: JSX style objects contain literal `{{` sequences that
#   Jinja2 would evaluate and destroy (same reason as icme). The studio imports
#   its pure lib/ modules and the generated key→widget artifact; an
#   unregistered member of either is a bundle that cannot start.
gui_tools_btop_studio_app_files:
  - { name: btop-studio-app-tsx, source: src/gui-tools/btop-theme-studio/app.tsx, dest: "{{ gui_tools_spine_config_dir }}/ags-btop-studio/app.tsx" }
  - { name: btop-studio-style-css, source: src/gui-tools/btop-theme-studio/style.css, dest: "{{ gui_tools_spine_config_dir }}/ags-btop-studio/style.css" }
  - { name: btop-studio-window, source: src/gui-tools/btop-theme-studio/ui/StudioWindow.tsx, dest: "{{ gui_tools_spine_config_dir }}/ags-btop-studio/ui/StudioWindow.tsx" }
  - { name: btop-studio-lib-theme-keys, source: src/gui-tools/btop-theme-studio/lib/theme-keys.ts, dest: "{{ gui_tools_spine_config_dir }}/ags-btop-studio/lib/theme-keys.ts" }
  - { name: btop-studio-lib-btop-conf, source: src/gui-tools/btop-theme-studio/lib/btop-conf.ts, dest: "{{ gui_tools_spine_config_dir }}/ags-btop-studio/lib/btop-conf.ts" }
  - { name: btop-studio-lib-key-map, source: src/gui-tools/btop-theme-studio/lib/key-map.ts, dest: "{{ gui_tools_spine_config_dir }}/ags-btop-studio/lib/key-map.ts" }
  - { name: btop-studio-lib-key-widgets, source: src/gui-tools/btop-theme-studio/lib/key-widgets.generated.ts, dest: "{{ gui_tools_spine_config_dir }}/ags-btop-studio/lib/key-widgets.generated.ts" }
  - { name: btop-studio-lib-schematic, source: src/gui-tools/btop-theme-studio/lib/schematic.ts, dest: "{{ gui_tools_spine_config_dir }}/ags-btop-studio/lib/schematic.ts" }
  - { name: btop-studio-lib-theme-model, source: src/gui-tools/btop-theme-studio/lib/theme-model.ts, dest: "{{ gui_tools_spine_config_dir }}/ags-btop-studio/lib/theme-model.ts" }
  - { name: btop-studio-lib-preview, source: src/gui-tools/btop-theme-studio/lib/preview.ts, dest: "{{ gui_tools_spine_config_dir }}/ags-btop-studio/lib/preview.ts" }
  - { name: btop-studio-lib-targets, source: src/gui-tools/btop-theme-studio/lib/targets.ts, dest: "{{ gui_tools_spine_config_dir }}/ags-btop-studio/lib/targets.ts" }
  - { name: btop-studio-live-engine, source: src/gui-tools/btop-theme-studio/live/btop_live.py, dest: "{{ gui_tools_spine_config_dir }}/ags-btop-studio/live/btop_live.py" }

# gui_tools_ags_instances: the AGS process instances this role manages
#   (names as reported by `ags list`). AGS bundles TypeScript at startup and
#   holds the compiled bundle in memory; without a restart the running process
#   keeps serving the old code even after provisioning has overwritten the
#   sources on disk — so every entry is quit after placement. Each entry is a
#   mapping:
#     name      — the instance name on the AGS bus (`ags quit -i <name>`).
#     always_on — true for the session-critical instances the machine must
#                 KEEP running (the status bar `ags`, the notification overlay
#                 `notifications`); false for the keybind-launched tools
#                 (`capture`, `icon-color-mapping-editor`, `hypr-pano`,
#                 `wallpaper-selector`), which provisioning deliberately
#                 leaves quit (§ per-instance lifecycle below).
#     launch    — for always_on entries ONLY: the exact `ags run` command this
#                 role re-issues when the instance is not on the bus (mirror of
#                 the autostart.lua line). On-demand entries carry no launch —
#                 their provisioned keybind launchers (cli_tools) start them.
#   Single source of truth: "which instances are always on" is exactly the
#   always_on flag here (and its derived view below) — never a second list.
#
#   Lifecycle split (owner intent, provisioning-keeps-ags-instances-running):
#   - always_on: quit to re-bundle, then brought back UP on the spot (detached
#     start-if-down below) so a provision run never leaves the session without
#     its status bar or — worse — without any owner of
#     org.freedesktop.Notifications (dunst is masked on purpose, so the overlay
#     is the session's only notification daemon).
#   - on-demand: quit and left down; the provisioned keybind launchers
#     (capture-ui, icon-color-mapping-editor, hypr-pano-ui,
#     wallpaper-selector-ui in cli_tools) start them when the user asks, so
#     provisioning never opens a window nobody requested.
gui_tools_ags_instances:
  - name: ags
    always_on: true
    launch: "ags run"
  - name: capture
    always_on: false
  - name: icon-color-mapping-editor
    always_on: false
  - name: hypr-pano
    always_on: false
  - name: wallpaper-selector
    always_on: false
  # The notification overlay's per-file placement is RETIRED (slice 4 — the
  # app now deploys WHOLE from the ags-apps unit via the ags_apps role's
  # live-notifications link), but this AGS instance entry STAYS: it is the
  # mechanism that STARTS the daemon and restarts it after the quit loop above.
  # It launches from ~/.config/ags-notifications (the config-links symlink to
  # the live-notifications link), never the unit path directly, so a re-provision
  # re-bundles the freshly linked sources. autostart.lua starts the same command
  # at login (same stagger-free log file).
  - name: notifications
    always_on: true
    launch: "ags run -d {{ gui_tools_xdg_config_home }}/ags-notifications --log-file {{ gui_tools_xdg_state_home }}/ags/notifications.log"
  - name: btop-theme-studio
    always_on: false

# gui_tools_ags_always_on_instances: DERIVED view of the always_on entries
#   (the subset the role restarts after the quit loop). Derived, never a
#   hand-maintained list, so the always-on set has exactly one source of truth
#   in gui_tools_ags_instances.
gui_tools_ags_always_on_instances: "{{ gui_tools_ags_instances | selectattr('always_on') | list }}"
