# GUI tools role vars — standalone desktop GUI applications under
# src/gui-tools/<tool>/, each with its own AGS instance, autostart slot, and
# spine config dir (<install>/config/<app>/, symlinked to ~/.config/<app> by
# the config-links role).
#
# Mirror-and-adapt discipline (Epic 1 retro action item) — what differs from
# the compositor_configs mirror:
#   (a) vs compositor_configs (skeletons for the bar/compositor apps):
#       this role places whole APP dirs (one entry per file, same per-file
#       `template` + `force: true` discipline — `copy` with a directory src
#       + a pre-existing dest dir is a silent no-op, review finding
#       2026-08-12). Each app gets its own spine dir; the role never touches
#       the bar's `ags/` tree.
#   (b) vs cli_tools (backend binaries): cli_tools installs the controller
#       binaries to the user bin dir; this role places the AGS UI sources.
#       The two meet at runtime via $PATH + the instance bus, never on disk.
#
# hypr-pano IS RETIRED AS A GUI-TOOLS APP (ags-apps-bar-first slice 3). The
# clipboard overlay moved into the ags-apps monorepo unit and deploys WHOLE via
# the ags_apps role's live-pano link (<install>/config/ags-hypr-pano ->
# <unit>/hypr-pano), so this role no longer enumerates it per file. The AGS
# instance entry stays in gui_tools_ags_instances below: the app still launches
# from ~/.config/ags-hypr-pano (the config-links symlink to the live-pano link),
# and the quit loop must still restart it after placement. The deploy-coverage
# gate asserts the absence of a stale per-file hypr-pano entry.
#
# notifications IS RETIRED AS A GUI-TOOLS APP TOO (slice 4). The notification
# daemon moved into the same ags-apps monorepo unit and deploys WHOLE via the
# ags_apps role's live-notifications link (<install>/config/ags-notifications ->
# <unit>/notifications), so this role no longer enumerates it per file. The
# always-on AGS instance entry STAYS in gui_tools_ags_instances below: it is the
# mechanism that STARTS the daemon from ~/.config/ags-notifications (the
# config-links symlink to the live-notifications link) and restarts it after the
# quit loop. The deploy-coverage gate asserts the absence of a stale per-file
# notifications entry.

# gui_tools_repo_root: repo root derived from this playbook's location.
#   Mirror of compositor_configs_repo_root / cli_tools_repo_root exactly.
gui_tools_repo_root: "{{ playbook_dir }}/../../../.."

# gui_tools_xdg_state_home: the XDG state home the app log dir lives under
#   ($XDG_STATE_HOME, spec default ~/.local/state). Identical derivation to
#   the sibling roles (compositor_configs_xdg_state_home et al.): honors
#   $XDG_STATE_HOME with the spec default {{ ansible_facts.env.HOME }} +
#   '/.local/state'. Uses ansible_facts.env.* (F4 lock — never the deprecated
#   top-level ansible_env fact).
gui_tools_xdg_state_home: "{{ ansible_facts.env.XDG_STATE_HOME | default(ansible_facts.env.HOME | default(ansible_facts.user_dir) + '/.local/state', true) }}"

# gui_tools_xdg_config_home: the XDG config home the config_links role symlinks
#   each managed app dir into (~/.config/<app> -> <install>/config/<app>).
#   IDENTICAL derivation to gui_tools_xdg_state_home (and the sibling roles):
#   honors $XDG_CONFIG_HOME with the spec default ~/.config. Used to build the
#   always-on instances' `ags run -d` launch commands — the SAME path autostart
#   uses (via the symlink), never the spine path directly.
gui_tools_xdg_config_home: "{{ ansible_facts.env.XDG_CONFIG_HOME | default(ansible_facts.env.HOME | default(ansible_facts.user_dir) + '/.config', true) }}"

# gui_tools_state_dirs: runtime state dirs the apps need beyond the XDG base
#   homes the filesystem role creates. Currently the AGS per-instance log
#   dir consumed by autostart's --log-file. Owned here (not in autostart):
#   ensuring directories is provisioning's responsibility; the login
#   launcher only starts processes.
gui_tools_state_dirs:
  - "{{ gui_tools_xdg_state_home }}/ags"

# gui_tools_spine_config_dir: the config-in-spine destination root
#   (<install>/config/). Mirror of compositor_configs_spine_config_dir.
#   Trim lock: consumes the same validated {{ install_dir | trim }} value.
gui_tools_spine_config_dir: "{{ install_dir | trim }}/config"

# gui_tools_config_dirs: the standalone app dirs under the config-in-spine
#   home. Re-ensured as directories before the copies (copy does NOT create
#   dest parents for file sources) so a direct gui-tools.yaml run is
#   self-contained.
gui_tools_config_dirs:
  - "{{ gui_tools_spine_config_dir }}/ags-capture"
  - "{{ gui_tools_spine_config_dir }}/ags-capture/ui"
  - "{{ gui_tools_spine_config_dir }}/ags-capture/lib"
  - "{{ gui_tools_spine_config_dir }}/ags-capture/domain"
  - "{{ gui_tools_spine_config_dir }}/ags-capture/ports"
  - "{{ gui_tools_spine_config_dir }}/ags-capture/adapters"
  - "{{ gui_tools_spine_config_dir }}/ags-capture/ui/shared"
  - "{{ gui_tools_spine_config_dir }}/ags-capture/ui/classic"
  - "{{ gui_tools_spine_config_dir }}/ags-icme"
  - "{{ gui_tools_spine_config_dir }}/ags-icme/ui"
  - "{{ gui_tools_spine_config_dir }}/ags-icme/lib"
  - "{{ gui_tools_spine_config_dir }}/ags-wallpaper-selector"
  - "{{ gui_tools_spine_config_dir }}/ags-wallpaper-selector/ui"
  - "{{ gui_tools_spine_config_dir }}/ags-wallpaper-selector/lib"
  - "{{ gui_tools_spine_config_dir }}/ags-btop-studio"
  - "{{ gui_tools_spine_config_dir }}/ags-btop-studio/ui"
  - "{{ gui_tools_spine_config_dir }}/ags-btop-studio/lib"
  - "{{ gui_tools_spine_config_dir }}/ags-btop-studio/live"

# gui_tools_capture_obsolete: spine paths the capture app no longer ships, which
# MUST be actively removed rather than left to rot.
#
# Why this exists: placement is PER-FILE (`gui_tools_app_files`), and per-file
# placement only ever WRITES. It has no notion of "this source no longer
# exists", so a file dropped from the manifest stays on disk forever. The
# capture app's hexagonal refactor retired four spine paths:
#
#   ui/CaptureWindow.tsx   -> split into ui/classic/{ClassicWindow,ScreenshotPage,
#                            RecordingPage,SettingsPage}.tsx
#   ui/RecordingView.tsx   -> dead scaffold stub (deleted in the refactor)
#   ui/ScreenshotView.tsx  -> dead scaffold stub (deleted in the refactor)
#   controllers/           -> four dead scaffold stubs, superseded by
#                             ports/ + adapters/
#
# Left behind they are inert -- app.tsx imports ./ui/classic/ClassicWindow and
# nothing references them -- but they are the exact "parallel, never-exercised
# architecture" the refactor set out to delete, now sitting in derived state
# where no gate can see them (the gates read the repo, never the spine).
# `state: absent` is idempotent, and the sibling legacy-capture removal task is
# the established precedent for this shape.
gui_tools_capture_obsolete:
  - "{{ gui_tools_spine_config_dir }}/ags-capture/ui/CaptureWindow.tsx"
  - "{{ gui_tools_spine_config_dir }}/ags-capture/ui/RecordingView.tsx"
  - "{{ gui_tools_spine_config_dir }}/ags-capture/ui/ScreenshotView.tsx"
  - "{{ gui_tools_spine_config_dir }}/ags-capture/controllers"

# gui_tools_app_files: the app FILES, one entry per file with the explicit
#   target path. Per-file entries (not directory sources) are REQUIRED (see
#   note above). Rendered via `ansible.builtin.template` with `force: true`
#   (repo-authoritative, mirror of the compositor_configs decision
#   2026-08-26).
gui_tools_app_files:
  - { name: capture-app-tsx, source: src/gui-tools/capture-tool/app.tsx, dest: "{{ gui_tools_spine_config_dir }}/ags-capture/app.tsx" }
  - { name: capture-style-css, source: src/gui-tools/capture-tool/style.css, dest: "{{ gui_tools_spine_config_dir }}/ags-capture/style.css" }
  - { name: capture-types, source: src/gui-tools/capture-tool/types.ts, dest: "{{ gui_tools_spine_config_dir }}/ags-capture/types.ts" }
  # The classic layout (refactor-capture-tool-hexagonal A8): the window shell
  # and the three top-level views. One file used to be all four, so an
  # undeployed member of this set is a capture panel that cannot bundle at
  # runtime -- the whole app is reachable only through ClassicWindow's import
  # of the three pages. Per-file placement, so each is listed; ui/classic is in
  # gui_tools_config_dirs above because copy does not create dest parents.
  - { name: capture-classic-window, source: src/gui-tools/capture-tool/ui/classic/ClassicWindow.tsx, dest: "{{ gui_tools_spine_config_dir }}/ags-capture/ui/classic/ClassicWindow.tsx" }
  - { name: capture-classic-screenshot-page, source: src/gui-tools/capture-tool/ui/classic/ScreenshotPage.tsx, dest: "{{ gui_tools_spine_config_dir }}/ags-capture/ui/classic/ScreenshotPage.tsx" }
  - { name: capture-classic-recording-page, source: src/gui-tools/capture-tool/ui/classic/RecordingPage.tsx, dest: "{{ gui_tools_spine_config_dir }}/ags-capture/ui/classic/RecordingPage.tsx" }
  - { name: capture-classic-settings-page, source: src/gui-tools/capture-tool/ui/classic/SettingsPage.tsx, dest: "{{ gui_tools_spine_config_dir }}/ags-capture/ui/classic/SettingsPage.tsx" }
  # The pure domain layer (refactor-capture-tool-hexagonal A3): settings
  # vocabulary/merge/validation and the UI-state shape/merge. No GTK, no GLib,
  # no I/O — which is what lets A4 unit-test them and A5/A6 reuse them from
  # both layouts. Per-file placement like every other capture source.
  - { name: capture-domain-settings, source: src/gui-tools/capture-tool/domain/settings.ts, dest: "{{ gui_tools_spine_config_dir }}/ags-capture/domain/settings.ts" }
  - { name: capture-domain-ui-state, source: src/gui-tools/capture-tool/domain/ui-state.ts, dest: "{{ gui_tools_spine_config_dir }}/ags-capture/domain/ui-state.ts" }
  # The request->argv translator (refactor-capture-tool-hexagonal A6). THE
  # single module in the whole tool that writes an argv literal for
  # `capture-tool screenshot|start`; both capture actions call it, and the next
  # capture layout must call it too rather than re-deriving the flags. It
  # carries the two vocabulary traps the backend's argparse rejects (--size 75
  # not 75%, --audio mic not microphone), so a missing deployment is a capture
  # that silently does not happen. Values + types only: no GTK, no GLib, no
  # execAsync. Per-file placement like every other capture source; domain/ is
  # already in gui_tools_config_dirs above (A3).
  - { name: capture-domain-capture-request, source: src/gui-tools/capture-tool/domain/capture-request.ts, dest: "{{ gui_tools_spine_config_dir }}/ags-capture/domain/capture-request.ts" }
  - { name: capture-domain-cli-args, source: src/gui-tools/capture-tool/domain/cli-args.ts, dest: "{{ gui_tools_spine_config_dir }}/ags-capture/domain/cli-args.ts" }
  # The monitor registry (fix-capture-monitor-lifecycle). PURE: it decides
  # which windows a monitor change means (planSync) and which window a name
  # lookup should reach first (orderedForFocus). That decision is the whole of
  # two deferred bugs, and it lives in domain/ precisely so `node --test` can
  # execute it -- GTK-touching code is untestable here, and app.tsx's own
  # contract forbids logic. Values + types only.
  - { name: capture-domain-monitor-registry, source: src/gui-tools/capture-tool/domain/monitor-registry.ts, dest: "{{ gui_tools_spine_config_dir }}/ags-capture/domain/monitor-registry.ts" }
  # The ports and adapters layers (refactor-capture-tool-hexagonal A5). ports/
  # is interfaces only; adapters/ owns every GLib file read/write, the
  # execAsync spawn and the hide-then-wait-150ms delay. The dialog imports
  # ports/ and receives adapters/ injected by the composition root, so an
  # undeployed member of either layer breaks the bundle at runtime. Per-file
  # placement, so every file is listed; both dirs are in
  # gui_tools_config_dirs above because copy does not create dest parents.
  - { name: capture-ports-settings-store, source: src/gui-tools/capture-tool/ports/settings-store.ts, dest: "{{ gui_tools_spine_config_dir }}/ags-capture/ports/settings-store.ts" }
  - { name: capture-ports-ui-state-store, source: src/gui-tools/capture-tool/ports/ui-state-store.ts, dest: "{{ gui_tools_spine_config_dir }}/ags-capture/ports/ui-state-store.ts" }
  - { name: capture-ports-capture-launcher, source: src/gui-tools/capture-tool/ports/capture-launcher.ts, dest: "{{ gui_tools_spine_config_dir }}/ags-capture/ports/capture-launcher.ts" }
  - { name: capture-ports-backend-probe, source: src/gui-tools/capture-tool/ports/backend-probe.ts, dest: "{{ gui_tools_spine_config_dir }}/ags-capture/ports/backend-probe.ts" }
  - { name: capture-ports-capture-ports, source: src/gui-tools/capture-tool/ports/capture-ports.ts, dest: "{{ gui_tools_spine_config_dir }}/ags-capture/ports/capture-ports.ts" }
  # The two monitor ports (fix-capture-monitor-lifecycle). Interfaces only.
  # monitor-topology is "the monitors that exist, and be told when that
  # changes"; monitor-focus is "which monitor is the user on", which GTK4
  # cannot answer at all (the measured negative result is recorded in the file).
  - { name: capture-ports-monitor-topology, source: src/gui-tools/capture-tool/ports/monitor-topology.ts, dest: "{{ gui_tools_spine_config_dir }}/ags-capture/ports/monitor-topology.ts" }
  - { name: capture-ports-monitor-focus, source: src/gui-tools/capture-tool/ports/monitor-focus.ts, dest: "{{ gui_tools_spine_config_dir }}/ags-capture/ports/monitor-focus.ts" }
  - { name: capture-adapters-glib-settings-store, source: src/gui-tools/capture-tool/adapters/glib-settings-store.ts, dest: "{{ gui_tools_spine_config_dir }}/ags-capture/adapters/glib-settings-store.ts" }
  - { name: capture-adapters-glib-ui-state-store, source: src/gui-tools/capture-tool/adapters/glib-ui-state-store.ts, dest: "{{ gui_tools_spine_config_dir }}/ags-capture/adapters/glib-ui-state-store.ts" }
  - { name: capture-adapters-exec-capture-launcher, source: src/gui-tools/capture-tool/adapters/exec-capture-launcher.ts, dest: "{{ gui_tools_spine_config_dir }}/ags-capture/adapters/exec-capture-launcher.ts" }
  - { name: capture-adapters-exec-backend-probe, source: src/gui-tools/capture-tool/adapters/exec-backend-probe.ts, dest: "{{ gui_tools_spine_config_dir }}/ags-capture/adapters/exec-backend-probe.ts" }
  # The monitor adapters and the window set (fix-capture-monitor-lifecycle).
  # gdk-monitor-topology is the ONLY place that subscribes to monitor hotplug
  # (Gdk.Display has no monitor-added/monitor-removed; the delivery is the
  # Gio.ListModel's items-changed). hyprland-monitor-focus answers "which
  # monitor is focused", which GTK 4.22 cannot do at all. monitor-window-set owns
  # one window per monitor across hotplug AND replaces the name lookup the
  # provisioned `ags toggle capture-window` launcher resolves through, so the
  # panel opens on the focused monitor without a provision run.
  - { name: capture-adapters-gdk-monitor-topology, source: src/gui-tools/capture-tool/adapters/gdk-monitor-topology.ts, dest: "{{ gui_tools_spine_config_dir }}/ags-capture/adapters/gdk-monitor-topology.ts" }
  - { name: capture-adapters-hyprland-monitor-focus, source: src/gui-tools/capture-tool/adapters/hyprland-monitor-focus.ts, dest: "{{ gui_tools_spine_config_dir }}/ags-capture/adapters/hyprland-monitor-focus.ts" }
  - { name: capture-adapters-monitor-window-set, source: src/gui-tools/capture-tool/adapters/monitor-window-set.ts, dest: "{{ gui_tools_spine_config_dir }}/ags-capture/adapters/monitor-window-set.ts" }
  # The capture instance resolves palette-aware icons through its own
  # registry (each GUI app owns its lib/ in src and the role deploys it
  # per-file). The capture registry prefers the instance's
  # own manifest (`../icons.json` → the ags-capture manifest the
  # compositor_configs role generates into the same spine dir) and falls back
  # to the shared bar manifest. Repo-authoritative, force: true.
  - { name: capture-lib-icon-registry, source: src/gui-tools/capture-tool/lib/icon-registry.ts, dest: "{{ gui_tools_spine_config_dir }}/ags-capture/lib/icon-registry.ts" }
  # The shared builder kit (refactor-capture-tool-hexagonal A7): the row
  # builders, the group/selection helpers and the icon resolver that BOTH
  # layouts share. Extracting them before a second layout exists is what stops
  # that layout growing its own divergent row builders. ui/shared is listed in
  # gui_tools_config_dirs above because placement is per-file and `copy` does
  # not create dest parents.
  - { name: capture-ui-shared-rows, source: src/gui-tools/capture-tool/ui/shared/rows.ts, dest: "{{ gui_tools_spine_config_dir }}/ags-capture/ui/shared/rows.ts" }
  - { name: capture-ui-shared-groups, source: src/gui-tools/capture-tool/ui/shared/groups.ts, dest: "{{ gui_tools_spine_config_dir }}/ags-capture/ui/shared/groups.ts" }
  - { name: capture-ui-shared-icons, source: src/gui-tools/capture-tool/ui/shared/icons.ts, dest: "{{ gui_tools_spine_config_dir }}/ags-capture/ui/shared/icons.ts" }

