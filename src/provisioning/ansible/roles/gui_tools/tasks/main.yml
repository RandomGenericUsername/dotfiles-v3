# GUI tools role — places standalone desktop GUI applications from
# src/gui-tools/<tool>/ into their own config-in-spine dirs
# (<install>/config/<app>/). The config-links role symlinks each
# ~/.config/<app> -> <install>/config/<app>, so each app runs via
# `ags run -d ~/.config/<app>` as its own AGS instance.
#
# Design (mirror of the compositor_configs role, trimmed to app placement):
# - The FIRST task is the fail-loud install_dir seam assert, copied verbatim
#   from the sibling roles: install_dir is deliberately never defaulted, so
#   an undefined spine root aborts before any task evaluates.
# - App placement uses `ansible.builtin.template` with PER-FILE entries
#   (gui_tools_app_files), NOT a directory source: review finding 2026-08-12
#   proved `copy` with a directory `src` + a pre-existing dest dir is a
#   SILENT NO-OP. Per-file copy is the only safe shape.
# - Skeletons are repo-authoritative (`force: true`, idempotent): every
#   bootstrap converges to the repo (owner decision 2026-08-26, shared with
#   compositor_configs).
# - template module check-mode support is FULL — no `not ansible_check_mode`
#   gate needed on the placements.
# - copy does NOT create dest parents for file sources — the app dirs are
#   re-ensured first so a direct gui-tools.yaml run is self-contained.
# - User-scoped privilege context: NO become/become_user anywhere.
# - No absolute repo paths: every source is {{ gui_tools_repo_root }}/...

- name: Assert install_dir seam is provided
  ansible.builtin.assert:
    that: install_dir is defined and install_dir | trim | length > 0
    fail_msg: >-
      install_dir is undefined or empty — the gui_tools role requires the
      install_dir seam extra-var (the orchestrator resolves
      $XDG_DATA_HOME/dotfiles/; direct runs pass -e install_dir=...)

- name: Ensure GUI tool app dirs exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
  loop: "{{ gui_tools_config_dirs }}"

- name: Ensure GUI tool runtime state dirs exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop: "{{ gui_tools_state_dirs }}"

- name: Place GUI tool app files
  ansible.builtin.template:
    src: "{{ gui_tools_repo_root }}/{{ item.source }}"
    dest: "{{ item.dest }}"
    force: true
  loop: "{{ gui_tools_app_files }}"

- name: Ensure icon color mapping editor app dirs exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
  loop: "{{ gui_tools_config_dirs }}"
  when: "'ags-icme' in item"

# RAW copy, NOT template: the icme sources contain literal `{{PLACEHOLDER}}`
# sequences (SVG placeholder regexes) that Jinja2 would evaluate and destroy.
# Per-file copy with force: true keeps the editor code repo-authoritative.
- name: Place icon color mapping editor app files (raw copy)
  ansible.builtin.copy:
    src: "{{ gui_tools_repo_root }}/{{ item.source }}"
    dest: "{{ item.dest }}"
    force: true
  loop: "{{ gui_tools_icme_app_files }}"

# The clipboard overlay sources carry no Jinja-sensitive sequences (the role
# test pins that), so they take the same per-file, repo-authoritative template
# placement as the capture app.
- name: Place hypr-pano clipboard overlay app files
  ansible.builtin.template:
    src: "{{ gui_tools_repo_root }}/{{ item.source }}"
    dest: "{{ item.dest }}"
    force: true
  loop: "{{ gui_tools_hypr_pano_app_files }}"

# The wallpaper selector sources carry no Jinja-sensitive sequences (the role
# test pins that), so they take the same per-file, repo-authoritative template
# placement as the capture app and the clipboard overlay.
- name: Place wallpaper selector app files
  ansible.builtin.template:
    src: "{{ gui_tools_repo_root }}/{{ item.source }}"
    dest: "{{ item.dest }}"
    force: true
  loop: "{{ gui_tools_wallpaper_selector_app_files }}"

# The notification overlay sources carry no Jinja-sensitive sequences (the
# role test pins that), so they take the same per-file, repo-authoritative
# template placement as the capture app and the sibling overlays.
- name: Place notifications overlay app files
  ansible.builtin.template:
    src: "{{ gui_tools_repo_root }}/{{ item.source }}"
    dest: "{{ item.dest }}"
    force: true
  loop: "{{ gui_tools_notifications_app_files }}"

- name: Remove legacy capture subtree from the bar spine dir (superseded by ags-capture/)
  ansible.builtin.file:
    path: "{{ gui_tools_spine_config_dir }}/ags/capture"
    state: absent
  when: not ansible_check_mode

# Quit known AGS instances so the next invocation picks up the freshly placed
# sources. AGS bundles TypeScript at startup and holds the result in memory;
# without a restart the running process keeps serving the old bundle even after
# provisioning has overwritten files on disk.
#
# Design notes:
#   - `ags quit -i <instance>` exits non-zero when the instance is not on the
#     bus (no-op for a machine that never ran the app). `failed_when: false`
#     makes the task green in both cases — running (quit) and not-running
#     (no-op).
#   - Skipped under --check: quitting a live process is a state mutation that
#     dry-run must never perform.
#   - `changed_when: false`: the task is idempotent by design — the next
#     SUPER+I / launcher invocation restarts the app transparently; we never
#     want spurious changed-counts from this step.
- name: Quit running AGS instances to pick up updated sources on next launch
  ansible.builtin.command:
    cmd: "ags quit -i {{ item.name }}"
  loop: "{{ gui_tools_ags_instances }}"
  failed_when: false
  changed_when: false
  when: not ansible_check_mode

# The notifications overlay IS the session daemon (it owns
# org.freedesktop.Notifications). dunst ships an enabled systemd user unit that
# otherwise respawns and steals the bus name, leaving the overlay unable to
# serve (verified live: "cannot get proxy: dunst is already running"). Stop and
# mask it — dunst stays installed as a manual fallback (`systemctl --user
# unmask --now dunst`), it just no longer races the overlay for the name.
- name: Stop the dunst user unit so the overlay can own the notification bus
  ansible.builtin.command:
    cmd: "systemctl --user disable --now dunst.service"
  failed_when: false
  changed_when: false
  when: not ansible_check_mode

- name: Mask the dunst user unit (respawn guard)
  ansible.builtin.command:
    cmd: "systemctl --user mask dunst.service"
  failed_when: false
  changed_when: false
  when: not ansible_check_mode

# Restart the always-on instances on the spot (start-if-down), so a provision
# run never leaves the session without its status bar or its notification
# daemon. The quit loop above is what forces AGS to re-bundle the freshly
# placed sources; a restart here satisfies that contract identically (the
# handoff: "a restart on the spot satisfies that at least as well").
#
# Placement AFTER the dunst stop+mask matters: the overlay can only own
# org.freedesktop.Notifications once dunst is out of the way, so it must not be
# (re)started while dunst still holds the name.
#
# Semantics mirror the provisioned cli_tools launchers (capture-ui.j2 et al.):
#   - start-if-down: `ags list | grep -qx <name>` — an instance already on the
#     bus is left untouched, so re-running is a no-op (AGS refuses a second
#     instance with the same name on /run/user/$UID/ags.js).
#   - bounded settle: `ags quit` tears down asynchronously, so wait briefly for
#     a just-quit instance to leave the bus before deciding it is down — an
#     instance still exiting must not be mistaken for a healthy one.
#   - full detachment: `setsid` + redirected stdio + background so the process
#     SURVIVES the playbook (and the SSH/session that launched it) instead of
#     dying with the Ansible connection.
#   - on-demand instances are deliberately NOT started: their keybind launchers
#     own that (starting them here would open windows nobody asked for).
#
# `failed_when: false` keeps provisioning non-brittle on a machine without a
# live AGS session (no wayland/dbus); the verify role's always-on gate is what
# makes a real regression loud.
- name: Ensure always-on AGS instances are running (start-if-down, detached)
  ansible.builtin.shell:
    cmd: |
      name={{ item.name | quote }}
      for _ in $(seq 1 12); do
          ags list 2>/dev/null | grep -qx "$name" || break
          sleep 0.25
      done
      if ags list 2>/dev/null | grep -qx "$name"; then
          exit 0
      fi
      setsid {{ item.launch }} >/dev/null 2>&1 </dev/null &
  loop: "{{ gui_tools_ags_always_on_instances }}"
  failed_when: false
  changed_when: false
  when: not ansible_check_mode

# The capture tool's "Show in folder" action xdg-opens the recording's parent
# DIRECTORY. With no explicit handler the mime database resolves
# inode/directory by its own ordering, which picked kitty-open.desktop — so
# "Show in folder" launched a terminal instead of the file manager (reported
# live). thunar is the provisioned file manager (packages.yaml), so pin it.
# `xdg-mime default` merges the entry into ~/.config/mimeapps.list rather than
# replacing it, so the user's other associations survive; re-running writes the
# same value, hence changed_when: false.
- name: Default the directory handler to the provisioned file manager
  ansible.builtin.command:
    cmd: "xdg-mime default thunar.desktop inode/directory"
  changed_when: false
  when: not ansible_check_mode
