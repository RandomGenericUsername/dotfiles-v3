# ags-platform role tasks (spine AD-17/AD-23) — install the AGS platform as one
# versioned unit and create the shared-ancestor `node_modules/ags-platform`
# shortcut every AGS config resolves the bare specifier through.
#
# Design (dedicated role — single responsibility: provision the platform unit):
# - The FIRST task is the fail-loud install_dir seam assert, copied verbatim
#   from the sibling roles (install_dir is deliberately never defaulted in
#   group_vars/all.yml, so an undefined spine root must abort before any task
#   evaluates).
# - The clone is presence-guarded: a `stat` on the unit's index.ts registers
#   existence and the git clone runs `when: not exists and not
#   ansible_check_mode` (the git module has no `creates:` — mirror of the
#   zsh_tools role). The clone is SHALLOW (`depth: 1`) and ANONYMOUS HTTPS: the
#   repo is public, so no `gh` credential helper is needed.
# - The clone's `.git` is REMOVED: the unit is deployed as a source tree, not a
#   working copy (a stray `.git` under the install spine is neither useful nor
#   wanted). Removal is idempotent (absent -> no change) and runs after a clone.
# - The pin is RECORDED in a one-line file (ags_platform_pin_file) so the
#   installed version is observable on the host and assertable by `verify`.
# - The shortcut is a symlink at the SHARED ANCESTOR (<install>/config/
#   node_modules/ags-platform) so config/ags and every config/ags-* resolve the
#   bare specifier. `force: true` makes a rollback (repoint to another version)
#   a single converged run.
# - User-scoped privilege context: NO become (everything lands under the user's
#   install_dir).
# - Distro-agnostic: git clone is identical on Arch and Debian-family.
# - --check cleanliness: the `command`/`git` clone is check-gated; `file` and
#   `copy` support check mode, so bootstrap.yaml --check stays dry.

- name: Assert install_dir seam is provided
  ansible.builtin.assert:
    that: install_dir is defined and install_dir | trim | length > 0
    fail_msg: >-
      install_dir is undefined or empty — the ags_platform role requires the
      install_dir seam extra-var (the orchestrator resolves
      $XDG_DATA_HOME/dotfiles/; direct runs pass -e install_dir=...)

- name: Ensure the ags-platform install root exists
  ansible.builtin.file:
    path: "{{ ags_platform_install_root }}"
    state: directory
    mode: "0755"

- name: Check whether the pinned ags-platform unit is already installed
  ansible.builtin.stat:
    path: "{{ ags_platform_unit_marker }}"
  register: ags_platform_unit_check

- name: Clone the pinned ags-platform unit (shallow, anonymous HTTPS)
  ansible.builtin.git:
    repo: "{{ ags_platform_repo_url }}"
    dest: "{{ ags_platform_unit_dir }}"
    version: "{{ ags_platform_version }}"
    depth: 1
    single_branch: true
  register: ags_platform_clone
  retries: 3
  delay: 5
  until: ags_platform_clone is succeeded
  when:
    - not ansible_check_mode
    - not ags_platform_unit_check.stat.exists

- name: Remove the clone's .git (deploy the unit as a source tree, not a checkout)
  ansible.builtin.file:
    path: "{{ ags_platform_unit_dir }}/.git"
    state: absent
  when: not ansible_check_mode

- name: Record the pinned framework version
  ansible.builtin.copy:
    content: "{{ ags_platform_version }}\n"
    dest: "{{ ags_platform_pin_file }}"
    mode: "0644"
    force: true

- name: Ensure the shared-ancestor node_modules dir exists
  ansible.builtin.file:
    path: "{{ ags_platform_shortcut_dir }}"
    state: directory
    mode: "0755"

- name: Point the shared-ancestor shortcut at the pinned unit
  ansible.builtin.file:
    src: "{{ ags_platform_unit_dir }}"
    dest: "{{ ags_platform_shortcut }}"
    state: link
    force: true
