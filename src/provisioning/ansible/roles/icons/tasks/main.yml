# Icons role (Story 3.4 / ITR wiring) — renders the resolved SVG icons from the
# deployed icon mappings + templates using the CSG-generated color scheme.
#
# The chain installs itr (cli_tools), deploys icon-mappings/icon-templates
# (assets), generates colors.yaml (default_palette), renders itr settings.toml
# (settings) and symlinks ~/.config/itr (config_links) — but NOTHING ever
# INVOKED `itr render`, so <install>/generated/icons/ stayed empty on a fresh
# install. This role closes that gap (CAP-5: "ITR writes rendered SVGs to
# generated/icons").
#
# Design (config-in-spine 2026-08-16):
# - Runs AFTER assets, default_palette, settings, config_links in bootstrap
#   order (right before verify): it consumes icons.yaml + icon-templates +
#   colors.yaml + itr settings.toml.
# - FIRST task is the fail-loud install_dir seam assert, verbatim from the
#   sibling roles (undefined spine root aborts before anything evaluates).
# - Direct-run prerequisite guards: stat + assert PAIR on the four inputs
#   (icons.yaml, templates dir, colors.yaml, settings.toml), gated
#   `when: not ansible_check_mode` (asserts alone cannot check existence).
# - The render command is gated `when: not ansible_check_mode` (command task;
#   skipped under --check — dry-run must be dry).
# - Itr is a PURE PYTHON renderer — local mode, NO container, NO engine probe
#   (unlike csg/weg container-mode CLIs). No become.
# - No absolute repo paths: every path derives from {{ install_dir | trim }} or
#   {{ icons_itr_bin_dir }} (trim lock / bin-dir mirror).

- name: Assert install_dir seam is provided
  ansible.builtin.assert:
    that: install_dir is defined and install_dir | trim | length > 0
    fail_msg: >-
      install_dir is undefined or empty — the icons role requires the
      install_dir seam extra-var (the orchestrator resolves
      $XDG_DATA_HOME/dotfiles/; direct runs pass -e install_dir=...)

- name: Check icons render inputs exist
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ icons_inputs }}"
  register: icons_input_check
  when: not ansible_check_mode

- name: Assert icons render inputs are present
  ansible.builtin.assert:
    that: icons_input_check.results | selectattr('stat.exists') | list | length == icons_inputs | length
    fail_msg: >-
      one or more icons render inputs missing (expected
      {{ icons_inputs | join(', ') }}) — the assets (icon-mappings +
      icon-templates), default_palette (colors.yaml) and settings (itr
      settings.toml) roles must run first; run those playbooks before the
      icons playbook
  when: not ansible_check_mode

- name: Render resolved SVG icons
  ansible.builtin.command:
    argv:
      - itr
      - render
      - "{{ icons_mappings_file }}"
      - --config
      - "{{ icons_itr_settings }}"
  environment:
    PATH: "{{ icons_itr_bin_dir }}:{{ ansible_facts.env.PATH }}"
  when: not ansible_check_mode
