# runtime_daemon role vars (P5-1-1).
#
# runtime_daemon_bin_dir: where `uv tool install` drops dotfiles-runtime,
#   resolved EXACTLY as uv does ($UV_TOOL_BIN_DIR -> $XDG_BIN_HOME ->
#   $HOME/.local/bin). Mirrors cli_tools_bin_dir (cli_tools role) so the
#   unit's ExecStart points at the binary provisioning actually installed.
runtime_daemon_bin_dir: >-
  {{ ansible_facts.env.UV_TOOL_BIN_DIR
     | default(ansible_facts.env.XDG_BIN_HOME | default(ansible_facts.env.HOME + '/.local/bin', true), true) }}

# runtime_daemon_unit_name: the --user unit file name.
runtime_daemon_unit_name: dotfiles-runtime-daemon.service

# runtime_daemon_activate: opt into live automatic convergence. Observe-only
#   is the shipped default (AD-35/AD-41); setting this true appends
#   `--activate` to the unit's ExecStart. The daemon still ships observe-only
#   for every other invocation (a plain `daemon run`).
runtime_daemon_activate: false

# runtime_daemon_prune_on_reactive: opt into the real AD-30-bounded prune on
#   each reactive converge. Default false: the reactive prune is skipped (no
#   deletion, no `prune` history line) and only the read-only would-be count
#   is logged at INFO. Setting this true appends `--prune-on-reactive` to the
#   unit's ExecStart. Inert while runtime_daemon_activate is false
#   (observe-only never reaches the prune leg).
runtime_daemon_prune_on_reactive: false

# runtime_daemon_run_flags: the optional ExecStart flags as ONE string, so the
#   ExecStart line in the unit template never ENDS with a Jinja `{% ... %}`
#   block tag. Ansible's template env uses trim_blocks=True, which strips the
#   newline after a block tag; an ExecStart line ending in `{% endif %}` then
#   merges the following comment line into the command, making systemd run
#   `daemon run# ...` (typer: `No such command 'run#'`) → start-limit-hit.
#   Keep this as a single-line expression, never a trailing block tag.
runtime_daemon_run_flags: "{{ ' --activate' if runtime_daemon_activate else '' }}{{ ' --prune-on-reactive' if runtime_daemon_prune_on_reactive else '' }}"

# Supervision tuning (P5-1-1 Gate-1 rec 5; AD-33/C4):
# - Type=dbus + BusName means systemd holds "started" until the name is
#   owned; a pre-ownership exit is a start failure, retried per below.
# - Restart=always (NOT on-failure): name loss is a CLEAN stop, so
#   on-failure would never restart the daemon after a bus blip.
# - RestartSec=5s backoff + StartLimit 3/60s: retries heal transients but a
#   persistent failure settles instead of hot-looping.
# - TimeoutStartSec=90s accommodates a cold start (long first converge lands
#   in P5-1-3, non-gating, but the budget is set now).
# - WatchdogSec=30 (P5 follow-up): catches a wedged-but-name-owning daemon
#   that Type=dbus cannot see. The daemon pings WATCHDOG=1 at half this
#   interval (from $WATCHDOG_USEC); a missed ping restarts the unit.
runtime_daemon_restart_sec: 5
runtime_daemon_start_limit_interval_sec: 60
runtime_daemon_start_limit_burst: 3
runtime_daemon_timeout_start_sec: 90
runtime_daemon_watchdog_sec: 30
