# Config copies role vars (Story 2.10, pivot 2026-08-12).
#
# The role COPIES the repo's EXISTING config dirs (dotfiles/config/*) into the
# user config home (FR-20): nvim, starship, wlogout, zsh. The desired copy set
# lives in dotfiles/provisioning/config-copies.yaml (Story 2.1): a
# `kind: config-copies` manifest with `entries: [{name, target}]`. Ansible does
# NOT read manifests — the role mirrors the manifest into config_copies_entries
# and a structural parity test locks them together (single source of truth).
#
# Runtime independence (pivot): configs are COPIED, not symlinked — nothing in
# the repo is referenced at runtime, so the machine keeps working after the
# repo is deleted. The repo is only ever the SOURCE for a provision run.
#
# hypr/hyprpaper/waybar are DELIBERATELY absent: those skeletons land in Story
# 2.8 and are PLACED BY COPY in Story 2.9 (compositor_configs role). The
# icon-template-color-scheme-mappings/ dir is an ASSET deployed to
# <install>/icon-mappings/ (Story 2.6).
#
# Mirror-and-adapt discipline (Epic 1 retro action item) — what differs from
# each mirror:
#   (a) vs 2.5 filesystem (XDG config home): 2.5 CREATES the config dirs;
#       2.10 COPIES INTO them. Share the exact XDG derivation
#       (ansible_facts.env, F4 lock) — do not duplicate logic with a different
#       result.
#   (b) vs 2.9 compositor_configs (dir-ensure + check-gating + runtime exec
#       test): 2.9 copies PER-FILE with force: false (transfer-only-if-absent —
#       a directory src + force: false is a known silent no-op) and its
#       fragment sources are check-gated (apply-time outputs); 2.10 copies
#       DIRECTORIES with the default force: true (idempotent via checksums —
#       Ansible is the state authority, NFR-1) and its sources are STATIC repo
#       content, so the source guard is ungated. 2.10's RESOLVE assert IS
#       check-gated (dests absent under --check).
#   (c) vs 2.6 assets (copy + repo_root): 2.6 copies from
#       <repo>/dotfiles/assets/** into the install spine; 2.10 copies from
#       <repo>/dotfiles/config/* into the user config home. Both use
#       `ansible.builtin.copy` with `remote_src: true` and a trailing-`/` src
#       (contents-into-dest semantics).
#   (d) vs cli_tools (manifest parity): the exact (name, target) set-equality
#       parity test form.

# config_copies_repo_root: repo root derived from this playbook's location.
#   The copy sources live at <repo>/dotfiles/config/<name>, so
#   <repo> = {{ playbook_dir }}/../../../.. (mirror assets_repo_root /
#   compositor_configs_repo_root exactly).
config_copies_repo_root: "{{ playbook_dir }}/../../../.."

# config_copies_xdg_config_home: the target config home the filesystem role
#   (2.5) created. Identical derivation: honors $XDG_CONFIG_HOME with the spec
#   default {{ ansible_facts.env.HOME }}/.config. Uses ansible_facts.env.*
#   (NOT the deprecated top-level ansible_env fact — F4 lock, hard-breaks on
#   ansible-core >= 2.24).
config_copies_xdg_config_home: "{{ ansible_facts.env.XDG_CONFIG_HOME | default(ansible_facts.env.HOME | default(ansible_facts.user_dir) + '/.config', true) }}"

# config_copies_spine_config_dir: the config-in-spine destination root
#   (<install>/config/). The config-links role symlinks each
#   ~/.config/<target> -> <install>/config/<target>, so the machine sees the
#   configs at their native XDG locations while the spine is the single home.
#   Trim lock: consumes the same validated {{ install_dir | trim }} value the
#   fail-loud assert enforces.
config_copies_spine_config_dir: "{{ install_dir | trim }}/config"

# config_copies_entries: the copy set mirroring
#   dotfiles/provisioning/config-copies.yaml EXACTLY (parity-locked by the
#   structural test on (name, target)). `name` is the repo source dir under
#   dotfiles/config/; `target` is the ~/.config/ component. Current data has
#   name == target for all four — do NOT assume they must be equal, and do NOT
#   assume they must differ.
config_copies_entries:
  - { name: nvim, target: nvim }
  - { name: starship, target: starship }
  - { name: wlogout, target: wlogout }
  - { name: zsh, target: zsh }
