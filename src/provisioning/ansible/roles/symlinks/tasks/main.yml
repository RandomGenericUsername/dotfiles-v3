# Symlinks role (Story 2.10) — links the repo's EXISTING config dirs
# (dotfiles/config/{nvim,starship,wlogout,zsh}) into the user config home the
# filesystem role (2.5) created (FR-20, chaining-spine.md). The link set is
# mirrored from dotfiles/provisioning/symlinks.yaml (Story 2.1) via the
# symlinks_links var; a structural parity test locks them together.
#
# Design (locked in Story 2.10 Dev Notes):
# - There is NO install_dir seam assert: this role consumes no install_dir (its
#   sources are the static repo tree, its targets are under the XDG config
#   home) — the FIRST task is the fail-loud SOURCE-presence stat+assert, which
#   aborts BEFORE a dangling link can be created against a missing repo dir.
#   The source stat is ungated (repo content is static and readable at
#   check-time).
# - AC 3 "broken or missing targets are reported as failures" is made concrete
#   by three independent guards:
#     1. Missing repo source — the ungated source stat+assert below (fails the
#        run before any link is created).
#     2. Conflicting dest — the `file` module with `force: false` fails loudly
#        on a real dir/file at the dest ("refusing to convert...") instead of
#        silently clobbering. force: false is LOAD-BEARING: with force: true a
#        pre-existing regular file would be clobbered, violating AC 3 and
#        NFR-8's spine containment. A pre-existing symlink pointing at a
#        different src IS replaced (create-or-change semantics — desired-state
#        authority), self-healing stale/broken links. NO `creates:` — state:
#        link is module-level idempotent (correct re-runs report ok).
#     3. Broken (dangling) or missing link after apply — the resolve-check
#        stat+assert pair, BOTH gated `when: not ansible_check_mode` (dests are
#        absent on a fresh target under --check). The stat module does NOT
#        follow links by default — `follow` must be EXPLICIT: with follow:
#        false a dangling link reports exists: true/islnk: true; with follow:
#        true it reports exists: false. Hence TWO stat loops: islnk (proves it
#        is a symlink, not a copy) then exists (proves it resolves — done
#        criterion 9). Both asserts use the derived `| length` count, never a
#        hardcoded literal.
# - The link create task needs NO `when: not ansible_check_mode` gate: the file
#   module's state: link has FULL check-mode support (predicts changed, writes
#   nothing) — verified against ansible-core 2.20.3.
# - `src` is an ABSOLUTE path: the module resolves a relative src relative to
#   the LINK FILE, not the playbook. The link create uses
#   {{ symlinks_repo_root }}/dotfiles/config/<name>.
# - User-scoped privilege context: NO become/become_user anywhere (mirror of
#   2.5-2.9).
# - No absolute repo paths: every path derives from {{ symlinks_repo_root }}
#   and {{ symlinks_xdg_config_home }}.

- name: Check repo symlink sources exist
  ansible.builtin.stat:
    path: "{{ symlinks_repo_root }}/dotfiles/config/{{ item.name }}"
    follow: true
  loop: "{{ symlinks_links }}"
  register: symlinks_source_check

- name: Assert repo symlink sources are present
  ansible.builtin.assert:
    that: symlinks_source_check.results | selectattr('stat.exists') | list | length == symlinks_links | length
    fail_msg: >-
      one or more symlink sources missing under
      {{ symlinks_repo_root }}/dotfiles/config/ (expected a directory per entry
      in dotfiles/provisioning/symlinks.yaml: nvim, starship, wlogout, zsh) —
      the repo config tree is incomplete; refusing to create dangling links

- name: Ensure XDG config home exists
  ansible.builtin.file:
    path: "{{ symlinks_xdg_config_home }}"
    state: directory

- name: Create symlinks into XDG config home
  ansible.builtin.file:
    src: "{{ symlinks_repo_root }}/dotfiles/config/{{ item.name }}"
    dest: "{{ symlinks_xdg_config_home }}/{{ item.target }}"
    state: link
    force: false
  loop: "{{ symlinks_links }}"

- name: Check link targets are symlinks
  ansible.builtin.stat:
    path: "{{ symlinks_xdg_config_home }}/{{ item.target }}"
    follow: false
  loop: "{{ symlinks_links }}"
  register: symlinks_dest_check_link
  when: not ansible_check_mode

- name: Assert link targets are symlinks
  ansible.builtin.assert:
    that: symlinks_dest_check_link.results | selectattr('stat.islnk') | list | length == symlinks_links | length
    fail_msg: >-
      not every dest under {{ symlinks_xdg_config_home }} is a symlink
      (expected one per dotfiles/provisioning/symlinks.yaml entry) — a real
      file or directory was found; nothing was silently replaced (force: false)
  when: not ansible_check_mode

- name: Check link targets resolve
  ansible.builtin.stat:
    path: "{{ symlinks_xdg_config_home }}/{{ item.target }}"
    follow: true
  loop: "{{ symlinks_links }}"
  register: symlinks_dest_check_resolved
  when: not ansible_check_mode

- name: Assert link targets resolve
  ansible.builtin.assert:
    that: symlinks_dest_check_resolved.results | selectattr('stat.exists') | list | length == symlinks_links | length
    fail_msg: >-
      one or more symlinks under {{ symlinks_xdg_config_home }} are dangling —
      a followed stat reports exists: false; the repo source they point at
      ({{ symlinks_repo_root }}/dotfiles/config/) is missing or broken (done
      criterion 9)
  when: not ansible_check_mode
