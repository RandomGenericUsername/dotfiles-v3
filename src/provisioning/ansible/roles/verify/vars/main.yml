# Verify role vars (Story 2.12).
#
# The role asserts the ten done-criteria (plan §8, SPEC.md CAP-3) against
# PROVISIONED locations — the user config home (~/.config/... via
# verify_xdg_config_home) and the install spine (via install_dir) — so a single
# `verify` run / the aggregate `bootstrap.yaml` can assert all preconditions and
# done-criteria (FR-22, FR-4). It renders NOTHING and writes NOTHING: it is a
# read-only gate.
#
# Mirror-and-adapt discipline (Epic 1 retro action item) — what differs from
# each mirror:
#   (a) vs 2.10 config_copies (fact-gathering assert + real-dir dest check):
#       2.10 COPIES and then verifies its own copies; verify re-checks the SAME
#       targets read-only. verify inherits the fact assert verbatim (the first
#       task) and the `follow: false` + isdir dest check verbatim (criterion 9).
#   (b) vs 2.7 default_palette (command -v + bin-dir PATH-prepend + check-gated
#       assert): verify reuses the pattern for BOTH system binaries (criterion
#       2) and CLI tools (criterion 3); unlike 2.7 it has no csg presence
#       REQUIREMENT per se — the whole point is asserting what provisioning
#       placed.
#   (c) vs 2.11 settings (hardened install_dir assert + spine-target contract):
#       verify consumes the SAME spine targets the settings role renders (the
#       six verify_settings_spine_targets) and inherits the hardened five-
#       condition install_dir assert; verify does NOT render anything.
#   (d) vs 2.5 filesystem (XDG derivations + spine dirs): verify mirrors
#       filesystem_spine_dirs and the three XDG home derivations EXACTLY — a
#       divergence would make verify check the wrong layout. The parity tests
#       lock them.
#   (e) vs 2.6 assets (asset kind → spine-segment mapping): verify re-checks
#       the five deployed asset outcomes (default.png, icon-templates/,
#       icon-mappings/, csg-templates/, weg-effects.yaml) read-only.
#   (f) vs 2.9 compositor_configs (skeleton/fragment target map): verify
#       re-checks the placed skeletons + fragments read-only; the AGS
#       fragment is colors.css (renamed from colors.gtk.css on copy).
#
# Trim lock: every install-spine path derives from {{ install_dir | trim }} and
# every config target derives from {{ verify_xdg_config_home }} — NO hardcoded
# absolute paths anywhere (the test scans vars with the _hardcoded_absolute_path
# regex helper).

# verify_xdg_config_home: the target config home the filesystem role (2.5)
#   created. IDENTICAL derivation to filesystem/compositor_configs/
#   config_copies/settings: honors $XDG_CONFIG_HOME with the spec default
#   {{ ansible_facts.env.HOME }}/.config. Uses ansible_facts.env.* (NOT the
#   deprecated top-level ansible_env fact — F4 lock, hard-breaks on
#   ansible-core >= 2.24).
verify_xdg_config_home: "{{ ansible_facts.env.XDG_CONFIG_HOME | default(ansible_facts.env.HOME | default(ansible_facts.user_dir) + '/.config', true) }}"
verify_xdg_state_home: "{{ ansible_facts.env.XDG_STATE_HOME | default(ansible_facts.env.HOME | default(ansible_facts.user_dir) + '/.local/state', true) }}"

# verify_state_current_dir: the runtime-owned current dir (AD-5:
#   <state>/dotfiles/current/) — done-criterion 6 (Story 1.12) requires each
#   palette file HERE, current-only (Epic 4: the generated/palettes tree is
#   gone and the runtime seed is the single producer; a machine with only an
#   orphaned generated/ tree and no current/ palette fails the gate).
#   Derived from verify_xdg_state_home — NO second XDG resolution is
#   introduced. Trim lock (stray-whitespace XDG values bit Story 1.11).
verify_state_current_dir: "{{ verify_xdg_state_home | trim }}/dotfiles/current"

# verify_bin_scripts: desktop helper scripts the compositor_configs role
#   installs into the user bin dir (toggle-touchpad is called by the
#   XF86TouchpadToggle bind in keybindings.lua). Fails loud if absent so a
#   fresh machine cannot end up with dead Fn keys.
verify_bin_scripts:
  - "{{ verify_cli_bin_dir | trim }}/toggle-touchpad"
  # The capture UI launcher: `capture-ui` (SUPER+PRINT). Installed by the
  # cli_tools role; without it the keybind is a silent no-op, so its presence is
  # asserted here too. The `capture-tool` CLI itself is installed from the
  # ags-apps unit and asserted (symlink + pin) in the ags-apps section below.
  - "{{ verify_cli_bin_dir | trim }}/capture-ui"
  # rofi's toggle launcher: the SUPER+D bind calls `rofi-ui` (open+close), so a
  # missing launcher would leave the key dead.
  - "{{ verify_cli_bin_dir | trim }}/rofi-ui"
verify_xdg_cache_home: "{{ ansible_facts.env.XDG_CACHE_HOME | default(ansible_facts.env.HOME | default(ansible_facts.user_dir) + '/.cache', true) }}"

# verify_xdg_dirs: the three XDG base dirs criterion 8 asserts exist (mirror of
#   filesystem_xdg_{config,state,cache}_home derivations above).
verify_xdg_dirs:
  - "{{ verify_xdg_config_home }}"
  - "{{ verify_xdg_state_home }}"
  - "{{ verify_xdg_cache_home }}"

# verify_install_spine_dirs: the install-spine dirs under install_dir
#   (criterion 1). Parity-EXACT with filesystem_spine_dirs — if the spine
#   changes, verify must change (the test locks the exact set equality).
#   Epic 4 single-source: no generated/ tree (runtime owns all derived
#   artifacts under $XDG_STATE_HOME/dotfiles/).
#   config-in-spine (2026-08-16): the `config/` subtree hosts all managed
#   configs; csg-templates live at config/color-scheme-generator/templates.
verify_install_spine_dirs:
  - wallpapers
  - icon-templates
  - icon-mappings
  - config
  - config/color-scheme-generator
  - config/color-scheme-generator/templates
  - config/hypr
  - config/hyprpaper
  # config/ags is DELIBERATELY absent: it is the ags_apps role's live-bar
  # SYMLINK (<install>/config/ags -> the pinned unit's bar/), asserted
  # separately by verify_ags_apps_live_bar_link. Listing it here made the
  # criterion-1 isdir assert fail on a real bootstrap (stat.isdir is false
  # through a symlink). config/ags-capture is absent for the SAME reason
  # (slice 5): it is the live-capture SYMLINK into the unit's capture-tool/,
  # asserted separately by verify_ags_apps_live_capture_link.
  - config/nvim
  - config/starship
  - config/wlogout
  - config/zsh
  - config/kitty
  - config/weg
  - config/itr
  - config/gtk-3.0
  - config/gtk-4.0
  # btop is deliberately NOT listed here: this list is parity-EXACT with
  # filesystem_spine_dirs (the filesystem role owns the base layout; the
  # btop_config role, not filesystem, creates config/btop/ and its themes/
  # subdir). It is asserted by verify_btop_spine_dir / verify_btop_themes_dir
  # instead.

# verify_install_spine_files: the file node(s) that must exist IN the spine
#   (criterion 1 + 4). weg-effects.yaml is a FILE emitted by the assets role
#   (2.6) via `weg dump-effects` into the config-in-spine home
#   (mirror of filesystem_file_nodes).
verify_install_spine_files:
  - config/weg/effects.yaml
  - icon-mappings/icons.yaml
  - icon-mappings/battery.yaml
  - icon-mappings/defaults.yaml
  - icon-mappings/email-client.yaml
  - icon-mappings/network.yaml
  - icon-mappings/power-menu.yaml
  - icon-mappings/wallpaper-selector.yaml
  - icon-mappings/wlogout.yaml

# verify_derivation_template_dirs: derivation-input DIRECTORIES that must be
#   NON-EMPTY in the spine (R-3/AD-43: `verify` asserts input CONTENT, not just
#   container existence — an empty templates dir silently derives empty output).
verify_derivation_template_dirs:
  - icon-templates
  - config/color-scheme-generator/templates

# verify_csg_template_files: the CSG color-format templates the runtime's
#   csg_adapter requests by name (adapters/csg_adapter.py `--format` args).
#   Non-empty is NOT enough (AD-43): csg silently OMITS a format whose
#   `colors.<fmt>.j2` template is missing, and the runtime then fails a
#   palette entry with "csg did not write expected artifact" (e.g. a missing
#   colors.kitty.j2 leaves current/colors.kitty dangling and kitty never
#   re-themes). Parity-locked to the adapter's requested format set.
verify_csg_template_files:
  - colors.yaml.j2
  - colors.conf.j2
  - colors.gtk.css.j2
  - colors.adw.css.j2
  - colors.sequences.j2
  - colors.rasi.j2
  - colors.kitty.j2

# verify_weg_effects_path: the spine effects catalog the WEG gate must read.
#   The assets role (2.6) emits it via `weg dump-effects --output` to
#   <install>/config/weg/effects.yaml, and the spec (chaining-spine.md) wires
#   the WEG chain to it via env WALLPAPER_EFFECTS_CONFIG_FILE_PATH — NOT the
#   XDG ~/.config/weg/effects.yaml fallback (which the installer never writes).
#   Trim lock, mirror of assets_weg_effects_target.
verify_weg_effects_path: "{{ install_dir | trim }}/config/weg/effects.yaml"

# verify_system_binaries: the compositor/OS binaries on PATH (criterion 2).
#   Fonts are deliberately NOT checked "on PATH" — fonts are fontconfig files,
#   not binaries (see Dev Notes "Fonts in done-criterion 2"); font presence is
#   the packages role's idempotent install concern.
verify_system_binaries:
  - hyprland
  - hyprpaper
  - ags
  - power-options-gtk
  # Audio stack (add-pipewire-audio-control): wpctl is the WirePlumber CLI
  #   (proves wireplumber is installed); pavucontrol is the Pulse-compat GUI
  #   mixer launched by right-clicking the output bar indicator. Both are
  #   packages role-installed, so they belong to the criterion-2 PATH gate.
  - wpctl
  - pavucontrol
  # MPRIS transport (ags-audio-mpris-transport): the AGS service shells out to
  #   playerctl for play/pause/next/prev/seek (actions only — never state reads,
  #   contract I2). A missing binary silently no-ops every transport control, so
  #   it belongs to the criterion-2 PATH gate. Packages-role installed.
  - playerctl
  # Screenshot + clipboard stack (capture-tool + runtime clipboard watcher):
  #   capture-tool shells grim/slurp/wl-copy and the watcher needs
  #   `wl-paste --watch` — absent binaries failed as [Errno 2] at runtime
  #   while the gate stayed green. Packages-role installed (capture key).
  - grim
  - slurp
  - wl-copy
  - wl-paste
  # Session infrastructure (autostart.lua + compositor session): hyprlock /
  #   hypridle (screen lock + idle) ship PATH binaries and belong to this
  #   gate. hyprpolkitagent ships NO PATH binary (it lives at
  #   /usr/lib/hyprpolkitagent/ and runs via its user unit), so it is gated
  #   separately below via `systemctl --user list-unit-files`.
  #   Packages-role installed (lock key + portals key).
  - hyprlock
  - hypridle
  # AI development tools (provision-ai-ides-and-clis): the three IDE binaries
  # and the two CLIs. Installed by the packages role via the AUR channel, so a
  # missing install fails the criterion-2 PATH gate instead of silently leaving
  # a rofi entry that launches nothing. power-options-gtk/pavucontrol are the
  # precedent for GUI app binaries in this list.
  - antigravity-ide
  - code
  - devin-desktop
  - copilot
  - codex

# verify_cli_tools: the uv-tool-installed CLIs on PATH (criterion 3). `itr` IS
#   the icon-renderer console script (no separate binary), mirror of
#   cli_tools.cli_tools.
verify_cli_tools:
  - csg
  - weg
  - itr

# verify_cli_tools_checkout_root / verify_itr_*: the pinned external CLI
#   checkouts (spine AD-10/AD-11). `verify` carries INDEPENDENT literal pins
#   mirroring roles/cli_tools (a parity test locks role == verify == manifest),
#   so a wrong-tag install cannot hide behind a green `command -v`:
#   - the checkout lives under the install-cli-tools root, in an itr dir named
#     by the tag;
#   - <install-cli-tools>/itr/pinned records exactly that tag;
#   - `itr --version` reports `<package-version> contract <contract-version>`,
#     and the contract token must equal the `contracts` tag this repo pins
#     (AD-4: one contract tag, four consumers).
verify_cli_tools_checkout_root: "{{ install_dir | trim }}/cli-tools"
verify_itr_version: v0.2.0
verify_itr_checkout: "{{ verify_cli_tools_checkout_root }}/itr/{{ verify_itr_version }}"
verify_itr_pin_file: "{{ verify_cli_tools_checkout_root }}/itr/pinned"
verify_itr_contract_version: 0.2.0

# verify_weg_*: the same four legs for `weg` (S5), plus the container image.
#   weg is the first container-mode CLI consumed as a pinned repo, so verify
#   additionally asserts the IMAGE exists at the tag-qualified reference
#   (spine AD-7/AD-11). The reference is the CLI's own engine-qualified name —
#   `<image_name>-<engine>:<tag>` (oci_runtime.naming.engine_qualified_image;
#   the rendered settings carry image_name "weg"), with `container_runtime_engine`
#   the same DECLARED value the build used and `verify_weg_version` the pin.
#   A `latest`-only image, or one built at the previous pin, fails this gate.
verify_weg_version: v0.2.0
verify_weg_checkout: "{{ verify_cli_tools_checkout_root }}/weg/{{ verify_weg_version }}"
verify_weg_pin_file: "{{ verify_cli_tools_checkout_root }}/weg/pinned"
verify_weg_contract_version: 0.2.0
verify_weg_image_name: weg
verify_weg_image_reference: >-
  {{ verify_weg_image_name }}-{{ container_runtime_engine }}:{{ verify_weg_version }}

# verify_csg_*: the same four legs for `csg` (S6), plus FOUR images.
#   csg builds one base image plus one per backend (`csg install` with no
#   `--backend` builds all of `Backend`): `base`, `custom`, `pywal`, `wallust`,
#   each engine-qualified — `<prefix>-<suffix>-<engine>:<tag>` via
#   oci_runtime.naming.engine_qualified_image, with `image_prefix` "csg" from
#   the rendered settings and `container_runtime_engine` the same DECLARED
#   value the build used. `verify_csg_image_references` spells all four out so
#   a missing backend is a named failure, not a count. The pin is the manifest
#   `csg.tag` (AD-7/AD-11) — never `latest`; the cli_tools role builds them at
#   this tag by passing `COLORSCHEME__CONTAINER__IMAGE_TAG={{ pin }}`.
verify_csg_version: v0.2.0
verify_csg_checkout: "{{ verify_cli_tools_checkout_root }}/csg/{{ verify_csg_version }}"
verify_csg_pin_file: "{{ verify_cli_tools_checkout_root }}/csg/pinned"
verify_csg_contract_version: 0.2.0
verify_csg_image_prefix: csg
verify_csg_image_references:
  - "{{ verify_csg_image_prefix }}-base-{{ container_runtime_engine }}:{{ verify_csg_version }}"
  - "{{ verify_csg_image_prefix }}-custom-{{ container_runtime_engine }}:{{ verify_csg_version }}"
  - "{{ verify_csg_image_prefix }}-pywal-{{ container_runtime_engine }}:{{ verify_csg_version }}"
  - "{{ verify_csg_image_prefix }}-wallust-{{ container_runtime_engine }}:{{ verify_csg_version }}"

# verify_notifd_binding_packages: the AUR packages backing the AstalNotifd
#   binding the notifications overlay imports (capture-notifications
#   implementation gate — the app is never scaffolded against a missing
#   binding). Checked via `pacman -Q` (importable == installed here: the
#   package ships the GIR + typelib the girepository loader resolves).
#   Mirror of the packages role's `aur_packages` entry.
verify_notifd_binding_packages:
  - libastal-notifd-git

# verify_astal_wp_binding_packages: the AUR package backing the AstalWp
#   binding the settings panel imports for audio routing (settings-panel-
#   provisioning gate — the panel is never scaffolded against a missing
#   binding). Checked via `pacman -Q` (importable == installed here: the
#   package ships the GIR + typelib the girepository loader resolves).
#   Mirror of the packages role's `aur_packages` entry. Bluetooth needs no
#   Astal binding — the panel talks BlueZ D-Bus directly.
verify_astal_wp_binding_packages:
  - libastal-wireplumber-git

# verify_bluetooth_service: the system unit the settings panel's own BlueZ
#   D-Bus service (bluetooth-service.ts) depends on. Installing bluez alone
#   leaves no daemon running, so the packages role enables + starts it; this
#   gate asserts BOTH enabled (survives the next boot) and active (usable now)
#   — a disabled unit would silently drop Bluetooth from the panel after a
#   reboot.
verify_bluetooth_service: bluetooth.service

# verify_bluetooth_rfkill_type: the rfkill type whose SOFT-block state the
#   packages role clears at provision time. A soft block (vendor WMI
#   killswitch / persisted systemd-rfkill state) makes BlueZ refuse to power
#   the controller, and the settings panel's `adapter.powered` setter then
#   fails silently — the toggle looks dead. Gate the unblocked state so a
#   regression is visible (a HARD block is physical and not asserted).
verify_bluetooth_rfkill_type: bluetooth

# verify_bluetooth_audio_packages: the PipeWire package shipping the bluez5 SPA
#   (libspa-bluez5.so). Without it WirePlumber creates NO Bluetooth audio sink,
#   so a connected headset is silently unroutable — installing bluez alone is
#   not enough. Checked via `pacman -Q` (Arch package name; mirror of the
#   AstalNotifd binding gate).
verify_bluetooth_audio_packages:
  - pipewire-audio

# verify_backlight_binary: the CLI the settings panel's Display slider drives
#   (`-m` read, `set <pct>%` write). The packages role installs it and its udev
#   rule grants the session user access; this gate runs the machine-readable
#   read as the user so a slider that would silently no-op fails provisioning.
verify_backlight_binary: brightnessctl

# verify_masked_user_units: systemd --user units that must be MASKED, not just
#   stopped, on a provisioned machine. The notifications overlay owns
#   org.freedesktop.Notifications for the session; dunst's enabled unit
#   respawns at login and steals the bus name, leaving the overlay unable to
#   serve ("cannot get proxy: dunst is already running" — verified live).
#   gui_tools stops and masks it, but both of those tasks are
#   `failed_when: false` so provisioning can never break on a machine without
#   systemd --user — which means a silent failure would ship. This gate makes
#   it loud. Mirror of the gui_tools mask task.
verify_masked_user_units:
  - dunst.service

# verify_ags_always_on_instances: the always-on AGS instances the session must
#   keep running after provisioning — the status bar (`ags`) and the
#   notifications overlay (`notifications`). gui_tools quits EVERY managed AGS
#   instance to force a re-bundle of the freshly placed sources, then restarts
#   this always-on subset (start-if-down, detached). Both the quit and the
#   restart are `failed_when: false` (provisioning must not break on a machine
#   without a live session), so this gate is the only place a regression
#   becomes visible: a missing bar is a hidden status bar, and a missing overlay
#   means nothing owns org.freedesktop.Notifications (dunst is masked on
#   purpose) so every notification is silently dropped. Parity with the
#   gui_tools always_on subset is locked by test.
verify_ags_always_on_instances:
  - ags
  - notifications

# verify_audio_user_units: the systemd --user units that back the audio stack
#   (pipewire + wireplumber for the graph/session, pipewire-pulse for Pulse
#   clients like pavucontrol). The packages role enables them GLOBALLY
#   (`systemctl --global enable`), which writes the system-wide
#   /etc/systemd/user default-target wants — so this gate checks `--global
#   is-enabled` (survives reboot for every user) rather than session state.
#   Why it matters: the AGS settings panel and the new audio bar/popup read the
#   graph through AstalWp over WirePlumber; if the units are not enabled the
#   session comes up with no audio graph and every audio surface is inert. A
#   bare package install alone does NOT enable wireplumber.service (not
#   socket-activated), so a silent failure would ship without this gate. Same
#   "enable survives reboot" rationale as the bluetooth.service gate. The
#   wpctl/pavucontrol binaries are covered by verify_system_binaries above.
verify_audio_user_units:
  - pipewire.socket
  - pipewire-pulse.socket
  - wireplumber.service

# verify_directory_handler: the desktop default handler for directories, which
#   the capture tool's "Show in folder" action relies on (it xdg-opens the
#   recording's parent dir). Without an explicit default the mime database
#   resolved inode/directory to kitty-open.desktop, so the action opened a
#   terminal (reported live). gui_tools pins thunar (the provisioned file
#   manager); this gate catches a machine where that never took effect.
verify_directory_handler: thunar.desktop

# verify_cli_bin_dir: the uv bin dir to prepend to PATH — mirror of
#   cli_tools_bin_dir exactly. The CLIs land here via `uv tool install`
#   ($UV_TOOL_BIN_DIR -> $XDG_BIN_HOME -> $HOME/.local/bin); without the
#   prepend the bootstrap chain would FALSE-FAIL right after cli_tools
#   installed them (mirror of the default_palette/assets PATH-prepend pattern).
verify_cli_bin_dir: >-
  {{ ansible_facts.env.UV_TOOL_BIN_DIR
     | default(ansible_facts.env.XDG_BIN_HOME | default(ansible_facts.env.HOME + '/.local/bin', true), true) }}

# verify_settings_files: the three rendered settings DEST paths (criterion 5
#   part 1). config-in-spine (2026-08-16): the files are rendered into the
#   spine at <install>/config/<tool>/settings.toml; verify checks the SPINE
#   paths (authoritative), and the parse gates (below) read them THROUGH the
#   ~/.config/<tool> symlink — exercising the link too. Parity-EXACT with
#   settings_files dests (the test locks it).
verify_settings_files:
  - { name: csg, dest: "{{ install_dir | trim }}/config/color-scheme-generator/settings.toml" }
  - { name: weg, dest: "{{ install_dir | trim }}/config/weg/settings.toml" }
  - { name: itr, dest: "{{ install_dir | trim }}/config/itr/settings.toml" }

# verify_settings_spine_keys: the TOML keys inside each rendered settings file
#   whose values ARE the spine paths the tool writes through (criterion 5 part
#   2 — the parse ≠ works hardening). The extraction task reads each rendered
#   settings.toml, pulls the value of every listed key, and stats THOSE paths
#   — so a settings file mis-rendered to point at a WRONG-but-existing (or
#   MISSING) path FAILS verify even if the file itself parses. Parity with the
#   settings templates is locked by test (each dotted key must exist as a
#   path-bearing assignment in the matching settings/templates/*.j2).
verify_settings_spine_keys:
  csg:
    - output.directory
  weg:
    - output.directory
    - processing.temp_dir
  itr:
    - output.output_dir
    - templates.dir
    - color_scheme.path

# verify_asset_dirs / verify_asset_files: the five deployed asset outcomes
#   (criterion 4), split by inode type so the assert can check isdir/isreg
#   (review finding 2026-08-13: an exists-only check let a regular FILE satisfy
#   a required DIRECTORY). config-in-spine (2026-08-16): csg-templates live at
#   config/color-scheme-generator/templates; weg-effects.yaml at
#   config/weg/effects.yaml (also in verify_install_spine_files).
verify_asset_dirs:
  - icon-templates
  # The capture tool's icon group: templates for the mode/target/output/audio
  # glyphs (ITR renders them into current/icons/, the AGS registry resolves
  # them). Asserted by group so a missing template tree fails provisioning
  # instead of the UI silently falling back to text labels.
  - icon-templates/capture-tool
  # The audio panel's own transport group (finish-audio-panel-redesign): the
  # round play/pause glyph pair. Asserted by group for the same reason -- the
  # assets role syncs icon-templates/ as a whole, so a group that never lands
  # would otherwise ship a panel whose main transport button renders nothing.
  - icon-templates/media-transport-panel
  - icon-mappings
  - config/color-scheme-generator/templates
verify_asset_files:
  - wallpapers/default.png
  - config/weg/effects.yaml

# verify_palette_files: the runtime palette files that must be present under
#   {{ verify_state_current_dir }}/ (criterion 6, Epic 4 current-only).
#   Mirror of the cache palette artifact names — conf/yaml/gtk.css/adw.css/
#   sequences (gt-2-1 grew the set; merge feat/gtk-theming-consumer).
verify_palette_files:
  - colors.conf
  - colors.yaml
  - colors.gtk.css
  - colors.adw.css
  - colors.sequences
  - colors.kitty

# verify_icons_dir / verify_icons_samples: the runtime icons output
#   (criterion — runtime icons, Epic 4 current-only). The dir is the
#   runtime's current/icons symlink; the samples are known variants from
#   icons.yaml so verify proves a REAL render happened, not just an empty dir.
#   battery-0 predates the settings panel; settings-panel-wifi.svg and
#   volume-low.svg prove the new groups (add-ags-settings-panel) actually
#   rendered. Trim lock (derived from verify_state_current_dir — no second
#   XDG resolution).
verify_icons_dir: "{{ verify_state_current_dir }}/icons"
verify_icons_samples:
  - "{{ verify_state_current_dir }}/icons/battery-0.svg"
  - "{{ verify_state_current_dir }}/icons/settings-panel-wifi.svg"
  - "{{ verify_state_current_dir }}/icons/volume-low.svg"
  - "{{ verify_state_current_dir }}/icons/volume-system-low.svg"
  - "{{ verify_state_current_dir }}/icons/microphone-system-mic-on.svg"
  - "{{ verify_state_current_dir }}/icons/system-battery-100.svg"
  - "{{ verify_state_current_dir }}/icons/settings-panel-signal-good.svg"
