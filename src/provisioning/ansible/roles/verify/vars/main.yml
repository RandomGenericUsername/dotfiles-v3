  - "{{ install_dir | trim }}/config/ags-capture/adapters/gdk-monitor-topology.ts"
  - "{{ install_dir | trim }}/config/ags-capture/adapters/hyprland-monitor-focus.ts"
  - "{{ install_dir | trim }}/config/ags-capture/adapters/monitor-window-set.ts"
  - "{{ install_dir | trim }}/config/ags-icme/lib/event-contract.ts"
