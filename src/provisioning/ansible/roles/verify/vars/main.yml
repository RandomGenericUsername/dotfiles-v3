# Verify role vars (Story 2.12).
#
# The role asserts the ten done-criteria (plan §8, SPEC.md CAP-3) against
# PROVISIONED locations — the user config home (~/.config/... via
# verify_xdg_config_home) and the install spine (via install_dir) — so a single
# `verify` run / the aggregate `bootstrap.yaml` can assert all preconditions and
# done-criteria (FR-22, FR-4). It renders NOTHING and writes NOTHING: it is a
# read-only gate.
#
# Mirror-and-adapt discipline (Epic 1 retro action item) — what differs from
# each mirror:
#   (a) vs 2.10 config_copies (fact-gathering assert + real-dir dest check):
#       2.10 COPIES and then verifies its own copies; verify re-checks the SAME
#       targets read-only. verify inherits the fact assert verbatim (the first
#       task) and the `follow: false` + isdir dest check verbatim (criterion 9).
#   (b) vs 2.7 default_palette (command -v + bin-dir PATH-prepend + check-gated
#       assert): verify reuses the pattern for BOTH system binaries (criterion
#       2) and CLI tools (criterion 3); unlike 2.7 it has no csg presence
#       REQUIREMENT per se — the whole point is asserting what provisioning
#       placed.
#   (c) vs 2.11 settings (hardened install_dir assert + spine-target contract):
#       verify consumes the SAME spine targets the settings role renders (the
#       six verify_settings_spine_targets) and inherits the hardened five-
#       condition install_dir assert; verify does NOT render anything.
#   (d) vs 2.5 filesystem (XDG derivations + spine dirs): verify mirrors
#       filesystem_spine_dirs and the three XDG home derivations EXACTLY — a
#       divergence would make verify check the wrong layout. The parity tests
#       lock them.
#   (e) vs 2.6 assets (asset kind → spine-segment mapping): verify re-checks
#       the five deployed asset outcomes (default.png, icon-templates/,
#       icon-mappings/, csg-templates/, weg-effects.yaml) read-only.
#   (f) vs 2.9 compositor_configs (skeleton/fragment target map): verify
#       re-checks the placed skeletons + fragments read-only; the AGS
#       fragment is colors.css (renamed from colors.gtk.css on copy).
#
# Trim lock: every install-spine path derives from {{ install_dir | trim }} and
# every config target derives from {{ verify_xdg_config_home }} — NO hardcoded
# absolute paths anywhere (the test scans vars with the _hardcoded_absolute_path
# regex helper).

# verify_xdg_config_home: the target config home the filesystem role (2.5)
#   created. IDENTICAL derivation to filesystem/compositor_configs/
#   config_copies/settings: honors $XDG_CONFIG_HOME with the spec default
#   {{ ansible_facts.env.HOME }}/.config. Uses ansible_facts.env.* (NOT the
#   deprecated top-level ansible_env fact — F4 lock, hard-breaks on
#   ansible-core >= 2.24).
verify_xdg_config_home: "{{ ansible_facts.env.XDG_CONFIG_HOME | default(ansible_facts.env.HOME | default(ansible_facts.user_dir) + '/.config', true) }}"
verify_xdg_state_home: "{{ ansible_facts.env.XDG_STATE_HOME | default(ansible_facts.env.HOME | default(ansible_facts.user_dir) + '/.local/state', true) }}"

# verify_state_current_dir: the runtime-owned current dir (AD-5:
#   <state>/dotfiles/current/) — done-criterion 6 (Story 1.12) accepts each
#   palette file under generated/palettes/ (pre-runtime) OR here (post-runtime,
#   the runtime-consumed palette). Derived from verify_xdg_state_home — NO
#   second XDG resolution is introduced. Trim lock (stray-whitespace XDG
#   values bit Story 1.11).
verify_state_current_dir: "{{ verify_xdg_state_home | trim }}/dotfiles/current"

# verify_bin_scripts: desktop helper scripts the compositor_configs role
#   installs into the user bin dir (toggle-touchpad is called by the
#   XF86TouchpadToggle bind in keybindings.lua). Fails loud if absent so a
#   fresh machine cannot end up with dead Fn keys.
verify_bin_scripts:
  - "{{ verify_cli_bin_dir | trim }}/toggle-touchpad"
verify_xdg_cache_home: "{{ ansible_facts.env.XDG_CACHE_HOME | default(ansible_facts.env.HOME | default(ansible_facts.user_dir) + '/.cache', true) }}"

# verify_xdg_dirs: the three XDG base dirs criterion 8 asserts exist (mirror of
#   filesystem_xdg_{config,state,cache}_home derivations above).
verify_xdg_dirs:
  - "{{ verify_xdg_config_home }}"
  - "{{ verify_xdg_state_home }}"
  - "{{ verify_xdg_cache_home }}"

# verify_install_spine_dirs: the install-spine dirs under install_dir
#   (criterion 1). Parity-EXACT with filesystem_spine_dirs — if the spine
#   changes, verify must change (the test locks the exact set equality).
#   Epic 4 single-source: no generated/ tree (runtime owns all derived
#   artifacts under $XDG_STATE_HOME/dotfiles/).
#   config-in-spine (2026-08-16): the `config/` subtree hosts all managed
#   configs; csg-templates live at config/color-scheme-generator/templates.
verify_install_spine_dirs:
  - wallpapers
  - icon-templates
  - icon-mappings
  - config
  - config/color-scheme-generator
  - config/color-scheme-generator/templates
  - config/hypr
  - config/hyprpaper
  - config/ags
  - config/nvim
  - config/starship
  - config/wlogout
  - config/zsh
  - config/weg
  - config/itr

# verify_install_spine_files: the file node(s) that must exist IN the spine
#   (criterion 1 + 4). weg-effects.yaml is a FILE emitted by the assets role
#   (2.6) via `weg dump-effects` into the config-in-spine home
#   (mirror of filesystem_file_nodes).
verify_install_spine_files:
  - config/weg/effects.yaml

# verify_weg_effects_path: the spine effects catalog the WEG gate must read.
#   The assets role (2.6) emits it via `weg dump-effects --output` to
#   <install>/config/weg/effects.yaml, and the spec (chaining-spine.md) wires
#   the WEG chain to it via env WALLPAPER_EFFECTS_CONFIG_FILE_PATH — NOT the
#   XDG ~/.config/weg/effects.yaml fallback (which the installer never writes).
#   Trim lock, mirror of assets_weg_effects_target.
verify_weg_effects_path: "{{ install_dir | trim }}/config/weg/effects.yaml"

# verify_system_binaries: the compositor/OS binaries on PATH (criterion 2).
#   Fonts are deliberately NOT checked "on PATH" — fonts are fontconfig files,
#   not binaries (see Dev Notes "Fonts in done-criterion 2"); font presence is
#   the packages role's idempotent install concern.
verify_system_binaries:
  - hyprland
  - hyprpaper
  - ags
  - power-options-gtk

# verify_cli_tools: the uv-tool-installed CLIs on PATH (criterion 3). `itr` IS
#   the icon-renderer console script (no separate binary), mirror of
#   cli_tools.cli_tools.
verify_cli_tools:
  - csg
  - weg
  - itr

# verify_cli_bin_dir: the uv bin dir to prepend to PATH — mirror of
#   cli_tools_bin_dir exactly. The CLIs land here via `uv tool install`
#   ($UV_TOOL_BIN_DIR -> $XDG_BIN_HOME -> $HOME/.local/bin); without the
#   prepend the bootstrap chain would FALSE-FAIL right after cli_tools
#   installed them (mirror of the default_palette/assets PATH-prepend pattern).
verify_cli_bin_dir: >-
  {{ ansible_facts.env.UV_TOOL_BIN_DIR
     | default(ansible_facts.env.XDG_BIN_HOME | default(ansible_facts.env.HOME + '/.local/bin', true), true) }}

# verify_settings_files: the three rendered settings DEST paths (criterion 5
#   part 1). config-in-spine (2026-08-16): the files are rendered into the
#   spine at <install>/config/<tool>/settings.toml; verify checks the SPINE
#   paths (authoritative), and the parse gates (below) read them THROUGH the
#   ~/.config/<tool> symlink — exercising the link too. Parity-EXACT with
#   settings_files dests (the test locks it).
verify_settings_files:
  - { name: csg, dest: "{{ install_dir | trim }}/config/color-scheme-generator/settings.toml" }
  - { name: weg, dest: "{{ install_dir | trim }}/config/weg/settings.toml" }
  - { name: itr, dest: "{{ install_dir | trim }}/config/itr/settings.toml" }

# verify_settings_spine_keys: the TOML keys inside each rendered settings file
#   whose values ARE the spine paths the tool writes through (criterion 5 part
#   2 — the parse ≠ works hardening). The extraction task reads each rendered
#   settings.toml, pulls the value of every listed key, and stats THOSE paths
#   — so a settings file mis-rendered to point at a WRONG-but-existing (or
#   MISSING) path FAILS verify even if the file itself parses. Parity with the
#   settings templates is locked by test (each dotted key must exist as a
#   path-bearing assignment in the matching settings/templates/*.j2).
verify_settings_spine_keys:
  csg:
    - output.directory
  weg:
    - output.directory
    - processing.temp_dir
  itr:
    - output.output_dir
    - templates.dir
    - color_scheme.path

# verify_asset_dirs / verify_asset_files: the five deployed asset outcomes
#   (criterion 4), split by inode type so the assert can check isdir/isreg
#   (review finding 2026-08-13: an exists-only check let a regular FILE satisfy
#   a required DIRECTORY). config-in-spine (2026-08-16): csg-templates live at
#   config/color-scheme-generator/templates; weg-effects.yaml at
#   config/weg/effects.yaml (also in verify_install_spine_files).
verify_asset_dirs:
  - icon-templates
  - icon-mappings
  - config/color-scheme-generator/templates
verify_asset_files:
  - wallpapers/default.png
  - config/weg/effects.yaml

# verify_palette_files: the runtime palette files that must be present under
#   {{ verify_state_current_dir }}/ (criterion 6, Epic 4 current-only).
#   Mirror of the cache palette artifact names — conf/yaml/gtk.css.
verify_palette_files:
  - colors.conf
  - colors.yaml
  - colors.gtk.css

# verify_icons_dir / verify_icons_sample: the runtime icons output
#   (criterion — runtime icons, Epic 4 current-only). The dir is the
#   runtime's current/icons symlink; the sample is a known variant from
#   icons.yaml (battery-0) so verify proves a REAL render happened, not
#   just an empty dir. Trim lock (derived from verify_xdg_state_home —
#   no second XDG resolution).
verify_icons_dir: "{{ verify_state_current_dir }}/icons"
verify_icons_sample: "{{ verify_state_current_dir }}/icons/battery-0.svg"

# verify_compositor_config_dirs: the three compositor config dirs under the XDG
#   config home (criterion 7). config-in-spine (2026-08-16): these are now
#   SYMLINKS into the spine (~/.config/hypr -> <install>/config/hypr etc.,
#   created by the config-links role) — the 5-layer symlink check applies
#   (criterion 9 machinery). Mirror of compositor_configs_config_dirs.
verify_compositor_config_dirs:
  - "{{ verify_xdg_config_home }}/hypr"
  - "{{ verify_xdg_config_home }}/hyprpaper"
  - "{{ verify_xdg_config_home }}/ags"

# verify_compositor_skeleton_files: the skeleton files that must be present
#   THROUGH the compositor config symlinks (criterion 7), mirror of
#   compositor_configs_skeleton_files dests (which now target the spine).
verify_compositor_skeleton_files:
  - "{{ install_dir | trim }}/config/hypr/hyprland.lua"
  - "{{ install_dir | trim }}/config/hypr/keybindings.lua"
  - "{{ install_dir | trim }}/config/hypr/monitors.lua"
  - "{{ install_dir | trim }}/config/hypr/general.lua"
  - "{{ install_dir | trim }}/config/hypr/autostart.lua"
  - "{{ install_dir | trim }}/config/hypr/window-rules.lua"
  - "{{ install_dir | trim }}/config/hypr/animations.lua"
  - "{{ install_dir | trim }}/config/hypr/input.lua"
  - "{{ install_dir | trim }}/config/hypr/decoration.lua"
  - "{{ install_dir | trim }}/config/hypr/cursor.lua"
  - "{{ install_dir | trim }}/config/hypr/env-variables.lua"
  - "{{ install_dir | trim }}/config/hyprpaper/hyprpaper.conf"
  - "{{ install_dir | trim }}/config/ags/app.tsx"
  - "{{ install_dir | trim }}/config/ags/style.css"
  - "{{ install_dir | trim }}/config/ags/icons.json"
  - "{{ install_dir | trim }}/config/ags/lib/icon-registry.ts"
  - "{{ install_dir | trim }}/config/ags/bar/Bar.tsx"
  - "{{ install_dir | trim }}/config/ags/bar/widgets/workspaces.tsx"
  - "{{ install_dir | trim }}/config/ags/bar/widgets/clock.tsx"
  - "{{ install_dir | trim }}/config/ags/bar/widgets/battery.tsx"
  - "{{ install_dir | trim }}/config/ags/bar/widgets/network.tsx"
  - "{{ install_dir | trim }}/config/ags/bar/widgets/power-menu.tsx"
  - "{{ install_dir | trim }}/config/ags/bar/widgets/btop.tsx"
  - "{{ install_dir | trim }}/config/ags/bar/widgets/thunderbird.tsx"
  - "{{ install_dir | trim }}/config/ags/bar/widgets/recording.tsx"
  - "{{ install_dir | trim }}/config/ags/bar/widgets/tray.tsx"
  - "{{ install_dir | trim }}/config/ags/capture/CaptureWindow.tsx"
  - "{{ install_dir | trim }}/config/ags/capture/RecordingView.tsx"
  - "{{ install_dir | trim }}/config/ags/capture/ScreenshotView.tsx"
  - "{{ install_dir | trim }}/config/ags/capture/types.ts"
  - "{{ install_dir | trim }}/config/ags/capture/controllers/CaptureController.ts"
  - "{{ install_dir | trim }}/config/ags/capture/controllers/RecordingController.ts"
  - "{{ install_dir | trim }}/config/ags/capture/controllers/ScreenshotController.ts"
  - "{{ install_dir | trim }}/config/ags/capture/controllers/TargetResolver.ts"

# verify_consumer_symlinks: the R2 consumer-path symlinks the runtime
#   seeder owns (criterion 7, Epic 4 current-only). The AGS fragment is
#   colors.css → current/colors.gtk.css (renamed on link, same convention
#   as the old copy the compositor_configs role used to place). Checked
#   WITHOUT following (islnk + raw target contains /current/) so a stale
#   provisioning COPY fails the gate. <install>/config/hypr/colors.conf
#   is deliberately absent (nothing sources it — verified: no reference
#   under dotfiles/config/hypr/*.lua).
verify_consumer_symlinks:
  - "{{ install_dir | trim }}/config/ags/colors.css"

# verify_config_copies_targets: mirror of the config-copies.yaml entries EXACTLY
#   (criterion 9). config-in-spine (2026-08-16): each is now a SYMLINK at
#   {{ verify_xdg_config_home }}/<target> pointing at <install>/config/<target>
#   (created by the config-links role) — the 5-layer symlink check applies:
#   islnk AND exact-target AND resolves AND content-through-link. The test locks
#   parity with dotfiles/provisioning/config-copies.yaml.
verify_config_copies_targets:
  - nvim
  - starship
  - wlogout
  - zsh

# verify_config_copy_content: a representative CONTENT FILE inside each config
#   copy (criterion 9, layer 4 — content-through-link). Verified through the
#   ~/.config/<name> symlink so a link to an empty/wrong spine dir fails even
#   though the link itself is valid.
#   NOTE: zsh's managed content is the RENDERED .zshrc (the zsh_config role
#   renders .zshrc.j2 → .zshrc; the .j2 is the source template, not runtime
#   config). wlogout's managed content is the RENDERED style.css (wlogout_config
#   renders style.css.tpl → style.css).
verify_config_copy_content:
  - "{{ verify_xdg_config_home }}/nvim/init.lua"
  - "{{ verify_xdg_config_home }}/starship/starship.toml"
  - "{{ verify_xdg_config_home }}/wlogout/layout"
  - "{{ verify_xdg_config_home }}/wlogout/style.css"
  - "{{ verify_xdg_config_home }}/zsh/.zshrc"

# verify_managed_link_dirs: the FULL set of managed config dirs symlinked by the
#   config-links role (criterion 9 — the 5-layer symlink check). Union of
#   config-copies, compositor, and per-tool config dirs. Parity with
#   config_links_managed_dirs is locked by test.
verify_managed_link_dirs:
  - hypr
  - hyprpaper
  - ags
  - nvim
  - starship
  - wlogout
  - zsh
  - color-scheme-generator
  - weg
  - itr

# verify_managed_link_spine_prefix: the regex prefix each managed symlink target
#   must match (criterion 9, layer 2 — exact-target). Derived from the same
#   {{ install_dir | trim }}/config root the config-links role uses, so a link
#   to the repo, a moved location, or a wrong spine path fails. Trim lock.
verify_managed_link_spine_prefix: "{{ install_dir | trim }}/config"

# verify_itr_list_target: the pinned ITR list gate arg (SPEC.md#51, done-
#   criterion 5) — NOT defaults.yaml (which lacks a `variants` field and is not
#   listable); the deployed icon-mappings/ dir contains icons.yaml (verified).
#   Trim lock.
verify_itr_list_target: "{{ install_dir | trim }}/icon-mappings/icons.yaml"
