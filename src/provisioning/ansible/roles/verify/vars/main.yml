  - "{{ install_dir | trim }}/config/ags-capture/ports/monitor-topology.ts"
  - "{{ install_dir | trim }}/config/ags-capture/ports/monitor-focus.ts"
  # The ports/ and adapters/ layers ClassicWindow and the composition root
  # import (refactor-capture-tool-hexagonal A5). Asserted for the same reason
  # as the rest of the capture set: gui_tools placement is per-file, so an
