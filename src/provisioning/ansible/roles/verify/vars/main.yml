  - "{{ install_dir | trim }}/config/ags-capture/ui/shared/rows.ts"
  - "{{ install_dir | trim }}/config/ags-capture/ui/shared/groups.ts"
  - "{{ install_dir | trim }}/config/ags-capture/ui/shared/icons.ts"
  - "{{ install_dir | trim }}/config/ags-capture/lib/icon-registry.ts"
  # The PURE domain layer ClassicWindow imports (refactor-capture-tool-hexagonal
  # A3). Asserted for the same reason as the rest of the capture set: gui_tools
  # placement is per-file, so an undeployed domain/ module means the dialog
  # cannot even bundle.
  - "{{ install_dir | trim }}/config/ags-capture/domain/settings.ts"
  - "{{ install_dir | trim }}/config/ags-capture/domain/ui-state.ts"
  # The request->argv half of the domain layer (refactor-capture-tool-hexagonal
  # A6) -- the pair the composition root hands to the dialog. Asserted for the
  # same reason as the rest of the capture set: gui_tools placement is per-file,
  # so an undeployed domain/ module means the capture panel cannot even bundle.
  #   capture-request.ts -- the capture intent value objects (target, format,
  #     quality, duration). The dialog builds one and the launcher consumes one,
  #     so it is the seam's type contract; absent, there is nothing to bundle.
  #   cli-args.ts -- THE single module in the whole tool that writes an argv
