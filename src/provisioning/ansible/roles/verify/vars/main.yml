  - "{{ verify_xdg_config_home }}/kitty/kitty.conf"

# verify_managed_link_dirs: the FULL set of managed config dirs symlinked by the
#   config-links role (criterion 9 — the 5-layer symlink check). Union of
#   config-copies, compositor, per-tool config dirs, and the GTK consumer dirs
#   (gt-3-1). Parity with config_links_managed_dirs is locked by test.
verify_managed_link_dirs:
  - hypr
  - hyprpaper
  - ags
  - ags-capture
  - ags-icme
  - ags-hypr-pano
  - ags-wallpaper-selector
  - ags-notifications
  - ags-btop-studio
  - nvim
  - starship
  - wlogout
  - zsh
  - kitty
  - color-scheme-generator
  - weg
  - itr
  - gtk-3.0
  - gtk-4.0
  - rofi
  - btop

# verify_btop_spine_dir: the config-in-spine btop home (provision-btop-config).
#   Derived from the SAME {{ install_dir | trim }}/config root every other spine
#   var uses (trim lock — no second seam read, no hardcoded absolute path).
verify_btop_spine_dir: "{{ install_dir | trim }}/config/btop"

# verify_btop_config_path: the RENDERED btop.conf. Read (not just stat'd) so
#   verify can pin the two settings that matter: color_theme =
#   "colors.btop.theme" and save_config_on_exit = false.
verify_btop_config_path: "{{ verify_btop_spine_dir }}/btop.conf"

# verify_btop_themes_dir: the themes subdirectory btop scans at startup. It is
#   PROVISIONING's to create (the btop_config role `state: directory`s it) —
#   the runtime's repoint_consumer_symlinks skips a pointer whose parent is
#   missing and never mkdirs into the spine. Gating it here is what makes a
#   missing dir fail loudly instead of silently dropping the pointer on
#   the first swap.
verify_btop_themes_dir: "{{ verify_btop_spine_dir }}/themes"

# verify_btop_theme_files: the generated btop theme, by NAME under
#   verify_btop_themes_dir (a Runtime consumer pointer at current/, placed by
#   the seeder). There is ONE theme: an earlier three-variant "difficulty dial"
#   was measured to be non-distinguishable (balanced and full rendered
#   byte-identical frames) and was collapsed.
verify_btop_theme_files:
  - colors.btop.theme

# verify_btop_theme_paths: verify_btop_theme_files resolved under
#   verify_btop_themes_dir (trim lock — the names stay bare so the theme set
#   has one home; the paths are derived, never restated).
verify_btop_theme_paths: >-
  {{ verify_btop_theme_files | map('regex_replace', '^',
     verify_btop_themes_dir ~ '/') | list }}

# verify_btop_default_theme: the theme btop.conf is expected to select when the
#   repo-owned active-theme setting is absent/empty — the generated theme. The
#   active theme is a repo-owned setting (btop-theme-deployment), so verify does
#   NOT pin one filename: it resolves the name from btop.conf and asserts the
#   matching .theme exists in the spine themes dir.
verify_btop_default_theme: colors.btop.theme

# verify_btop_save_config_on_exit: the value verify greps out of the rendered
#   btop.conf. Pinned as a var (not inlined in the task) so the expected value
#   has exactly one home and a test can compare it against the role's template.
verify_btop_save_config_on_exit: "false"

# verify_gtk_skeleton_files: the palette-import skeleton files that must be
#   present THROUGH the ~/.config/gtk-{3,4}.0 symlinks (criterion 9, layer 4
#   for the gtk dirs — gt-3-1). settings.ini is deliberately NOT gated
#   (user-machine state — a fresh machine has none until nwg-look or GTK
#   writes it). The runtime colors.css pointers inside the spine dirs are
#   deliberately NOT gated either (runtime-owned, gt-2-2; provisioning never
#   creates them — their health is the gt-2-2 `inspect status` projection).
verify_gtk_skeleton_files:
  - "{{ verify_xdg_config_home }}/gtk-3.0/gtk.css"
  - "{{ verify_xdg_config_home }}/gtk-4.0/gtk.css"

# verify_managed_link_spine_prefix: the regex prefix each managed symlink target
#   must match (criterion 9, layer 2 — exact-target). Derived from the same
#   {{ install_dir | trim }}/config root the config-links role uses, so a link
#   to the repo, a moved location, or a wrong spine path fails. Trim lock.
verify_managed_link_spine_prefix: "{{ install_dir | trim }}/config"

# verify_itr_list_target: the pinned ITR list gate arg (SPEC.md#51, done-
#   criterion 5) — NOT defaults.yaml (which lacks a `variants` field and is not
#   listable); the deployed icon-mappings/ dir contains icons.yaml (verified).
#   Trim lock.
verify_itr_list_target: "{{ install_dir | trim }}/icon-mappings/icons.yaml"
