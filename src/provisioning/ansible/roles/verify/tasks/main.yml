# Verify role tasks (Story 2.12) — asserts the fourteen done-criteria (plan §8,
# SPEC.md CAP-3) against PROVISIONED locations only (the user config home via
# verify_xdg_config_home and the install spine via {{ install_dir | trim }}).
# It is a read-only gate: it renders nothing, copies nothing, and needs NO
# become/become_user — everything it checks lives under the user's config home
# and install_dir (user-scoped privilege context, mirror of 2.5-2.11).
#
# The fourteen done-criteria map to the tasks below:
#   1. install dir established      → install-dir subtree stat+assert (twenty
#      spine dirs + weg-effects.yaml)
#   2. system binaries on PATH      → command -v hyprland/hyprpaper/ags
#   3. CLI tools on PATH            → command -v csg/weg/itr (with
#      verify_cli_bin_dir on PATH)
#   4. assets deployed              → default.png + icon-templates/ +
#      icon-mappings/ + csg-templates/ + weg-effects.yaml
#   5. settings render and parse    → settings files exist AND spine targets
#      resolve AND csg/weg/itr gates exit 0
#   6. default palette generated    → the runtime-consumed palette at
#      <state>/dotfiles/current/{colors.conf, colors.yaml, colors.gtk.css}
#      (current-only, Epic 4 — the default_palette role is deleted; the
#      runtime seed is the single producer. A dangling runtime symlink
#      still fails — the filesystem is authority.)
#   7. compositor configs placed    → skeletons (the palette fragments
#      colors.conf/colors.css are runtime R2 symlinks, Epic 4 — no copies)
#      + standalone GUI tool apps (gui_tools role: <install>/config/<app>/)
#   8. filesystem structure exists  → XDG config/state/cache dirs
#   9. config copies present        → every managed ~/.config/<name> is a
#      symlink into the spine (5-layer check: islnk, exact target, resolves,
#      content-through-link, functional parse)
#   10. icons rendered              → current/icons/ populated (battery-0.svg
#      through the runtime cache entry — Epic 4 current-only; the icons
#      provisioning role is deleted)
#   11. shell tools cloned          → ~/.oh-my-zsh, ~/.pyenv, ~/.nvm exist
#       (zsh_tools role)
#   12. zsh config rendered+wired   → .zshrc wires starship + colors.sequences
#       (zsh_config role)
#   13. wlogout config rendered+wired → style.css imports the palette
#       (wlogout_config role)
#   14. §12 preconditions           → criteria 2/3 + 4 + 8 + 5 — the whole role;
#       exposed by VerifyCapabilityUseCase (use_cases.py) running verify.yaml
#       with a REAL check, never --check.
#
# Machine, not repo (the core invariant): NOTHING here references the repo
# checkout (no playbook_dir / repo-root var). The gate must never go green
# because the repo still exists while the machine is unprovisioned.
#
# Check-mode gating rationale: `dotfiles-provision verify` runs verify.yaml
# with check=False — that is the authoritative gate. But verify is ALSO the
# last import of bootstrap.yaml, and bootstrap.yaml --check must "complete
# cleanly without mutation" (AC 5). Under --check: stat tasks run and report
# honestly (no mutation — fine ungated); command/shell tasks are SKIPPED by
# ansible-core 2.20.3; so every existence/isdir/rc ASSERT is gated
# `when: not ansible_check_mode` to keep the dry run clean on a
# partially-provisioned host. The authoritative gate is the real
# `dotfiles-provision verify`. Do NOT remove the gates "to make verify
# stricter" — that breaks bootstrap.yaml --check.
#
# The csg-info vacuity note (deferred-work 2026-08-12, Story 2.11 review):
# csg's `info` swallows ConfigResolutionError and exits 0 even on a
# parse-broken file (info_cmd.py:43-44), so the csg parse-gate task is a
# DOCUMENTED WEAK gate. The authoritative CSG parse proof is the dynamic
# spine-target extraction below (reads the RENDERED settings.toml and asserts
# every spine path it references resolves) + Story 3.3's settings-parity. The
# WEG half can actually fail and stays a real gate; the ITR list gate pins
# icons.yaml (SPEC.md#51).
#
# Config-copies symlink check (criterion 9, config-in-spine 2026-08-16): each
# managed ~/.config/<name> must be a symlink into the spine. The 5-layer check
# (islnk → exact spine target → resolves-to-dir → content-through-link →
# functional parse) runs below via layered stat + asserts; a real dir / foreign
# symlink / broken link fails loudly (runtime independence — mirror of
# config_links dest-check).
#
# No hardcoded absolute paths: every install-spine value is
# {{ install_dir | trim }} (trim lock) and every config target derives from
# {{ verify_xdg_config_home }}.

- name: Assert fact-gathering provided HOME
  ansible.builtin.assert:
    that: ansible_facts.env.HOME is defined and ansible_facts.env.HOME | trim | length > 0
    fail_msg: >-
      ansible_facts.env.HOME is undefined — the verify role derives its targets
      from gathered facts; the playbook must run with gather_facts: true
      (vars/main.yml reads ansible_facts.env.XDG_CONFIG_HOME and HOME)

- name: Assert install_dir seam is provided
  ansible.builtin.assert:
    that:
      - install_dir is defined
      - install_dir is not none
      - install_dir is string
      - install_dir | trim | length > 0
      - install_dir | trim | regex_search('^/') is not none
      - install_dir | trim | regex_search('/$') is none
    fail_msg: >-
      install_dir is undefined, null, relative, empty, or ends in a trailing
      slash — the verify role gates rendered files and requires the install_dir
      seam extra-var as an absolute, non-empty path without a trailing slash
      (the orchestrator resolves $XDG_DATA_HOME/dotfiles/; direct runs pass
      -e install_dir=...; the trailing-slash rejection keeps the
      {{ install_dir | trim }}/<child> derivations single-slash)

- name: Assert verify list vars are not empty
  ansible.builtin.assert:
    that:
      - verify_system_binaries | length > 0
      - verify_cli_tools | length > 0
      - verify_install_spine_dirs | length > 0
      - verify_install_spine_files | length > 0
      - verify_palette_files | length > 0
      - verify_settings_files | length > 0
      - verify_compositor_config_dirs | length > 0
      - verify_compositor_skeleton_files | length > 0
      - verify_consumer_symlinks | length > 0
      - verify_xdg_dirs | length > 0
      - verify_config_copies_targets | length > 0
    fail_msg: >-
      a verify list var is empty — a runtime override or a manifest desync
      silently disabled a criterion: every count assert is
      `selectattr(...) | length == <list> | length`, so an emptied list passes
      0 == 0 and the gate goes green on an unprovisioned machine (mirror of the
      config_copies empty-list guard)
  run_once: true

- name: Assert binary and tool names are safe identifiers
  ansible.builtin.assert:
    that:
      - verify_system_binaries | map('regex_search', '^[a-zA-Z0-9_][a-zA-Z0-9_.-]*$') | reject('none') | list | length == verify_system_binaries | length
      - verify_cli_tools | map('regex_search', '^[a-zA-Z0-9_][a-zA-Z0-9_.-]*$') | reject('none') | list | length == verify_cli_tools | length
    fail_msg: >-
      a system-binary or CLI-tool name contains shell metacharacters — the
      `command -v <name>` check interpolates each name into a shell string;
      names must match ^[a-zA-Z0-9_][a-zA-Z0-9_.-]*$ (defense against a
      metacharacter-bearing override executing in the shell)

- name: Check system binaries on PATH
  ansible.builtin.shell: "command -v {{ item }}"
  loop: "{{ verify_system_binaries }}"
  register: verify_system_binary_checks
  changed_when: false
  failed_when: false

- name: Assert system binaries are on PATH
  ansible.builtin.assert:
    that:
      - verify_system_binary_checks.results | selectattr('rc', 'equalto', 0) | list | length == verify_system_binaries | length
      - verify_system_binary_checks.results | map(attribute='stdout') | reject('equalto', '') | list | length == verify_system_binaries | length
    fail_msg: >-
      not every system binary is on PATH (expected hyprland, hyprpaper, ags
      — done-criterion 2). The packages role (Story 2.3) installs them via the
      group_vars package list; run the packages playbook first (direct-run
      prerequisite). Fonts are NOT checked here — fonts are fontconfig files,
      not PATH binaries
  when: not ansible_check_mode

# NetworkManager is the DBus backend astal-network (the AGS bar) reads. A bare
# package install leaves no daemon running, which makes the bar report
# "no network" and the network-click TUI exit instantly. Gate on the service
# being active so a provisioned machine cannot silently lack it.
- name: Check NetworkManager service is active
  ansible.builtin.shell: systemctl is-active NetworkManager
  register: verify_nm_service
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Assert NetworkManager is running
  ansible.builtin.assert:
    that:
      - verify_nm_service.rc == 0
      - verify_nm_service.stdout | trim == "active"
    fail_msg: >-
      NetworkManager is not running — the AGS bar's network widget (astal-network,
      libnm) needs it to report wifi/wired and the network-click TUI (wifitui)
      needs it to connect. The packages role enables+starts it; re-run the
      packages playbook or start it with `systemctl start NetworkManager`
  when: not ansible_check_mode

- name: Check CLI tools on PATH
  ansible.builtin.shell: "command -v {{ item }}"
  loop: "{{ verify_cli_tools }}"
  register: verify_cli_tool_checks
  changed_when: false
  failed_when: false
  environment:
    PATH: "{{ verify_cli_bin_dir }}:{{ ansible_facts.env.PATH }}"

- name: Assert CLI tools are on PATH
  ansible.builtin.assert:
    that:
      - verify_cli_tool_checks.results | selectattr('rc', 'equalto', 0) | list | length == verify_cli_tools | length
      - verify_cli_tool_checks.results | map(attribute='stdout') | reject('equalto', '') | list | length == verify_cli_tools | length
    fail_msg: >-
      not every CLI tool is on PATH (expected csg, weg, itr — done-criterion
      3). The cli_tools role (Story 2.4) installs them via uv tool install
      into {{ verify_cli_bin_dir }}; the check prepends that dir to PATH. Run
      the cli-tools playbook first (direct-run prerequisite)
  when: not ansible_check_mode

- name: Check desktop helper scripts exist (Fn-key binds)
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ verify_bin_scripts }}"
  register: verify_bin_script_checks

- name: Assert desktop helper scripts exist
  ansible.builtin.assert:
    that: verify_bin_script_checks.results | selectattr('stat.exists') | list | length == verify_bin_scripts | length
    fail_msg: >-
      desktop helper script(s) missing (expected {{ verify_bin_scripts | join(', ') }})
      — the compositor_configs role installs them from dotfiles/scripts/ into the
      user bin dir; run the compositor-configs playbook first. Without them the
      XF86TouchpadToggle Fn binding silently does nothing.
  when: not ansible_check_mode

- name: Check install-dir subtree exists
  ansible.builtin.stat:
    path: "{{ install_dir | trim }}/{{ item }}"
  loop: "{{ verify_install_spine_dirs + verify_install_spine_files }}"
  register: verify_spine_checks

- name: Assert install-dir subtree exists with correct types
  ansible.builtin.assert:
    that:
      - verify_spine_checks.results | selectattr('stat.isdir') | list | length == verify_install_spine_dirs | length
      - verify_spine_checks.results | selectattr('stat.isreg') | list | length == verify_install_spine_files | length
    fail_msg: >-
      not every install-spine path exists with the right inode type under
      {{ install_dir | trim }} (expected the nine spine DIRS + weg-effects.yaml
      as a regular FILE — done-criterion 1). The filesystem role (2.5) creates
      the dirs and the assets role (2.6) emits weg-effects.yaml; run the
      filesystem and assets playbooks first
  when: not ansible_check_mode

- name: Check assets deployed
  ansible.builtin.stat:
    path: "{{ install_dir | trim }}/{{ item }}"
  loop: "{{ verify_asset_dirs + verify_asset_files }}"
  register: verify_asset_checks

- name: Assert assets deployed with correct types
  ansible.builtin.assert:
    that:
      - verify_asset_checks.results | selectattr('stat.isdir') | list | length == verify_asset_dirs | length
      - verify_asset_checks.results | selectattr('stat.isreg') | list | length == verify_asset_files | length
    fail_msg: >-
      not every asset outcome is present with the right inode type under
      {{ install_dir | trim }} (expected icon-templates/, icon-mappings/,
      csg-templates/ as DIRS and wallpapers/default.png + weg-effects.yaml as
      regular FILES — done-criterion 4). The assets role (Story 2.6) deploys
      them; run the assets playbook first
  when: not ansible_check_mode

- name: Check runtime palette files exist under the runtime current dir
  ansible.builtin.stat:
    path: "{{ verify_state_current_dir }}/{{ item }}"
    follow: true
  loop: "{{ verify_palette_files }}"
  register: verify_palette_current_checks

- name: Assert runtime palette files are present (current-only)
  ansible.builtin.assert:
    that:
      - verify_palette_current_checks.results | length == verify_palette_files | length
      - verify_palette_current_checks.results | map(attribute='stat.isreg', default=false) | list | select | list | length == verify_palette_files | length
    fail_msg: >-
      not every runtime palette file is present as a regular file under
      {{ verify_state_current_dir }}/ (expected colors.conf, colors.yaml,
      colors.gtk.css — Epic 4 current-only; the default_palette role is
      deleted). A dangling runtime symlink (broken cache entry) also fails —
      the filesystem is authority. Run `dotfiles-runtime wallpaper set
      <install>/wallpapers/default.png` (or investigate the broken runtime
      cache entry). Orphaned <install>/generated/ trees from earlier
      provisions are ignored by every gate.
  when: not ansible_check_mode

- name: Check rendered icons exist under the runtime current dir
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ verify_icons_dir }}"
    - "{{ verify_icons_sample }}"
  register: verify_icons_checks

- name: Assert rendered icons exist
  ansible.builtin.assert:
    that: verify_icons_checks.results | selectattr('stat.exists') | list | length == 2
    fail_msg: >-
      the runtime icons output is missing: expected {{ verify_state_current_dir }}/icons/
      as a directory with at least battery-0.svg present (done-criterion —
      runtime icons, Epic 4 current-only). Run `dotfiles-runtime wallpaper set`
      (needs assets + settings first; the icons provisioning role is deleted)
  when: not ansible_check_mode

- name: Check settings files exist
  ansible.builtin.stat:
    path: "{{ item.dest }}"
  loop: "{{ verify_settings_files }}"
  register: verify_settings_file_checks

- name: Assert settings files exist
  ansible.builtin.assert:
    that: verify_settings_file_checks.results | selectattr('stat.isreg') | list | length == verify_settings_files | length
    fail_msg: >-
      not every rendered settings file exists under {{ verify_xdg_config_home }}
      (expected color-scheme-generator/weg/itr settings.toml — done-criterion 5
      part 1). The settings role (Story 2.11) renders them; run the settings
      playbook first
  when: not ansible_check_mode

# Criterion 5 part 2 — the parse ≠ works gate (review finding 2026-08-13):
# verify READS each rendered settings.toml and asserts every spine path it
# REFERENCES resolves. A static list of expected targets would go green when a
# settings file is mis-rendered to point at a wrong-but-existing (or wrong-and-
# missing) directory; the extraction below pulls the ACTUAL paths from the
# rendered files. tomllib is stdlib (python >= 3.12, the project floor).
# All three extraction commands must succeed (rc == 0): a missing/unparseable
# file or a renamed spine key fails loudly instead of silently dropping paths.

- name: Extract spine paths referenced by rendered settings
  ansible.builtin.command:
    argv:
      - "{{ ansible_python_interpreter | default('python3') }}"
      - -c
      - |
        import sys, tomllib

        def dig(node, dotted):
            for part in dotted.split("."):
                node = node[part]
            return node

        with open(sys.argv[1], "rb") as fh:
            data = tomllib.load(fh)
        for dotted in sys.argv[2].split(","):
            value = dig(data, dotted.strip())
            if isinstance(value, str):
                print(value)
      - "{{ item.dest }}"
      - "{{ verify_settings_spine_keys[item.name] | join(',') }}"
  loop: "{{ verify_settings_files }}"
  register: verify_settings_extracted
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Collect spine paths referenced by rendered settings
  ansible.builtin.set_fact:
    verify_settings_referenced_targets: >-
      {{ verify_settings_extracted.results
         | map(attribute='stdout_lines') | flatten | unique }}
  when: not ansible_check_mode

- name: Check settings-referenced spine paths resolve
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ verify_settings_referenced_targets }}"
  register: verify_settings_target_checks
  when: not ansible_check_mode

- name: Assert settings-referenced spine paths resolve
  ansible.builtin.assert:
    that:
      - verify_settings_extracted.results | selectattr('rc', 'equalto', 0) | list | length == verify_settings_files | length
      - verify_settings_referenced_targets | length > 0
      - verify_settings_target_checks.results | selectattr('stat.exists') | list | length == verify_settings_referenced_targets | length
    fail_msg: >-
      a rendered settings file is missing/unparseable, or references a spine
      path that does NOT resolve (done-criterion 5 part 2 — parse ≠ works:
      verify reads each rendered settings.toml and asserts every spine path it
      references exists). Expected the spine/state targets the settings
      templates render (icon-templates, icon-mappings, current/colors.yaml,
      XDG cache temp dir) — created by the filesystem (2.5) and assets (2.6)
      roles and the runtime seed (Epic 4)
  when: not ansible_check_mode

# Settings parse gate (AC 3, done-criterion 5): the three CLI gates over the
# rendered settings files. NOTE the deferred-work finding (Story 2.11 review):
# csg's `info` swallows ConfigResolutionError and exits 0 even on a
# parse-broken file (info_cmd.py:43-44) — the csg gate below is therefore a
# DOCUMENTED WEAK gate; the authoritative CSG parse proof is the spine-target
# resolution assert above + Story 3.3's settings-parity. The WEG half can
# actually fail and stays a real gate. The ITR list gate pins icons.yaml
# (SPEC.md#51 — NOT defaults.yaml). All three command tasks AND their assert
# are gated `when: not ansible_check_mode` (command tasks are skipped under
# --check in ansible-core 2.20.3; the assert would otherwise fail a
# bootstrap.yaml --check on a partially-provisioned host).

- name: Gate csg settings parse
  ansible.builtin.command:
    argv:
      - csg
      - info
      - --config
      - "{{ verify_xdg_config_home }}/color-scheme-generator/settings.toml"
  environment:
    PATH: "{{ verify_cli_bin_dir }}:{{ ansible_facts.env.PATH }}"
  register: verify_csg_gate
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Gate weg settings parse
  ansible.builtin.command:
    argv:
      - weg
      - info
      - --config
      - "{{ verify_xdg_config_home }}/weg/settings.toml"
  environment:
    WALLPAPER_EFFECTS_CONFIG_FILE_PATH: "{{ verify_weg_effects_path }}"
    PATH: "{{ verify_cli_bin_dir }}:{{ ansible_facts.env.PATH }}"
  register: verify_weg_gate
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Gate itr list against icons.yaml
  ansible.builtin.command:
    argv:
      - itr
      - list
      - "{{ verify_itr_list_target }}"
      - --config
      - "{{ verify_xdg_config_home }}/itr/settings.toml"
  environment:
    PATH: "{{ verify_cli_bin_dir }}:{{ ansible_facts.env.PATH }}"
  register: verify_itr_gate
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Assert settings parse gates exited cleanly
  ansible.builtin.assert:
    that:
      - verify_csg_gate.rc == 0
      - verify_weg_gate.rc == 0
      - verify_itr_gate.rc == 0
    fail_msg: >-
      one of the rendered settings parse gates failed (csg info / weg info /
      itr list icons.yaml) — done-criterion 5. Inspect the registered
      verify_csg_gate/verify_weg_gate/verify_itr_gate results; note the csg
      half is a documented weak gate (see the comment block above)
  when: not ansible_check_mode

- name: Check compositor configs and skeletons
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: true
  loop: "{{ verify_compositor_config_dirs + verify_compositor_skeleton_files }}"
  register: verify_compositor_checks

- name: Assert compositor configs and skeletons are present with correct types
  ansible.builtin.assert:
    that:
      - verify_compositor_checks.results[:verify_compositor_config_dirs | length] | selectattr('stat.isdir') | list | length == verify_compositor_config_dirs | length
      - verify_compositor_checks.results[verify_compositor_config_dirs | length:] | map(attribute='stat') | selectattr('isreg') | list | length == verify_compositor_skeleton_files | length
    fail_msg: >-
      not every compositor config dir or skeleton is present with the
      right inode type under {{ verify_xdg_config_home }} (done-criterion 7).
      The filesystem (2.5) and compositor_configs (2.9) roles place them;
      run those playbooks first
  when: not ansible_check_mode

- name: Check GUI tool app files
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: true
  loop: "{{ verify_gui_tools_app_files }}"
  register: verify_gui_tools_checks

- name: Assert GUI tool app files are present as regular files
  ansible.builtin.assert:
    that:
      - verify_gui_tools_checks.results | map(attribute='stat') | selectattr('isreg') | list | length == verify_gui_tools_app_files | length
    fail_msg: >-
      not every standalone GUI tool app file is present under
      {{ install_dir | trim }}/config/ (done-criterion 7, gui_tools role).
      The gui_tools role places them; run that playbook first
  when: not ansible_check_mode

- name: Check R2 consumer symlinks resolve to current/
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop: "{{ verify_consumer_symlinks }}"
  register: verify_consumer_symlink_checks

- name: Assert R2 consumer symlinks point at current/
  ansible.builtin.assert:
    that:
      - verify_consumer_symlink_checks.results | selectattr('stat.islnk') | list | length == verify_consumer_symlinks | length
      - verify_consumer_symlink_checks.results | map(attribute='stat.lnk_target', default='') | select('search', 'dotfiles/current') | list | length == verify_consumer_symlinks | length
    fail_msg: >-
      not every R2 consumer path is a symlink into the runtime current dir
      (done-criterion 7, Epic 4 — the AGS colors.css must resolve to
      {{ verify_state_current_dir }}/colors.gtk.css). A stale provisioning
      COPY fails this gate by design. Run the runtime seed (the runtime
      seeder owns these links, rt-4-2)
  when: not ansible_check_mode

- name: Check XDG base dirs exist
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ verify_xdg_dirs }}"
  register: verify_xdg_dir_checks

- name: Assert XDG base dirs exist
  ansible.builtin.assert:
    that: verify_xdg_dir_checks.results | selectattr('stat.isdir') | list | length == verify_xdg_dirs | length
    fail_msg: >-
      not every XDG base dir exists as a directory (expected the config/state/
      cache homes — done-criterion 8). The filesystem role (Story 2.5) creates
      them; run the filesystem playbook first
  when: not ansible_check_mode

- name: Check managed config dirs are symlinks into the spine
  ansible.builtin.stat:
    path: "{{ verify_xdg_config_home }}/{{ item }}"
    follow: false
  loop: "{{ verify_managed_link_dirs }}"
  register: verify_managed_link_checks
  when: not ansible_check_mode

- name: Assert managed config dirs are symlinks with the exact spine target
  ansible.builtin.assert:
    that: >-
      verify_managed_link_checks.results
      | selectattr('stat.islnk') | list | length == verify_managed_link_dirs | length
    fail_msg: >-
      not every managed config dir under {{ verify_xdg_config_home }} is a
      symlink (expected {{ verify_managed_link_dirs | join(', ') }} —
      done-criterion 9, config-in-spine pattern). Each must point at
      <install>/config/<name>; the config-links role creates them. Run the
      config-links playbook first
  when: not ansible_check_mode

- name: Assert managed config symlinks point at the exact spine target
  ansible.builtin.assert:
    that: >-
      verify_managed_link_checks.results
      | rejectattr('stat.lnk_target', 'search', '^' + verify_managed_link_spine_prefix)
      | list | length == 0
    fail_msg: >-
      a managed config symlink under {{ verify_xdg_config_home }} points at a
      target OUTSIDE the spine — done-criterion 9, config-in-spine. Every link
      must target <install>/config/<name> ({{ verify_managed_link_spine_prefix }}/);
      a link to the repo, a moved location, or a wrong spine path fails. Re-run
      the config-links playbook
  when: not ansible_check_mode

- name: Check managed config symlinks resolve through the spine
  ansible.builtin.stat:
    path: "{{ verify_xdg_config_home }}/{{ item }}"
    follow: true
  loop: "{{ verify_managed_link_dirs }}"
  register: verify_managed_link_resolve_checks
  when: not ansible_check_mode

- name: Assert managed config symlinks resolve into the spine
  ansible.builtin.assert:
    that: >-
      verify_managed_link_resolve_checks.results
      | selectattr('stat.isdir') | list | length == verify_managed_link_dirs | length
    fail_msg: >-
      a managed config symlink under {{ verify_xdg_config_home }} is BROKEN or
      its spine target is not a directory — done-criterion 9 (config-in-spine).
      A broken link means the spine was wiped (unprovisioned). Re-run apply
  when: not ansible_check_mode

- name: Check config copies resolve through their symlinks
  ansible.builtin.stat:
    path: "{{ verify_xdg_config_home }}/{{ item }}"
    follow: true
  loop: "{{ verify_config_copies_targets }}"
  register: verify_config_copy_checks
  when: not ansible_check_mode

- name: Assert config copies resolve as directories through the symlinks
  ansible.builtin.assert:
    that: verify_config_copy_checks.results | selectattr('stat.isdir') | list | length == verify_config_copies_targets | length
    fail_msg: >-
      not every config-copy target under {{ verify_xdg_config_home }} resolves
      to a real directory (expected one per dotfiles/provisioning/config-copies.yaml:
      nvim, starship, wlogout, zsh — done-criterion 9). A symlink whose spine
      target is missing/wrong breaks runtime independence. The config_copies
      (Story 2.10) + config_links roles place them; run those playbooks first
  when: not ansible_check_mode

- name: Check config copy content is reachable through the symlinks
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: true
  loop: "{{ verify_config_copy_content }}"
  register: verify_config_copy_content_checks
  when: not ansible_check_mode

- name: Assert config copy content files are present through the symlinks
  ansible.builtin.assert:
    that: verify_config_copy_content_checks.results | selectattr('stat.isreg') | list | length == verify_config_copy_content | length
    fail_msg: >-
      not every config-copy content file resolves through its
      {{ verify_xdg_config_home }} symlink into the spine (done-criterion 9,
      layer 4 — content-through-link). The spine copy is missing or the link
      points at an empty/wrong dir. Re-run the config_copies + config_links
      playbooks
  when: not ansible_check_mode

- name: Check rendered zshrc wires starship and the color scheme
  ansible.builtin.command:
    argv:
      - grep
      - -E
      - "starship init|colors.sequences"
      - "{{ verify_xdg_config_home }}/zsh/.zshrc"
  register: verify_zshrc_wiring
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Assert rendered zshrc wires starship and the color scheme
  ansible.builtin.assert:
    that: verify_zshrc_wiring.rc == 0
    fail_msg: >-
      the rendered .zshrc does not wire starship and the color scheme
      (expected both `starship init` and `colors.sequences` — done-criterion
      12, shell wiring). The zsh_config role renders .zshrc.j2 → .zshrc; run the
      zsh-config playbook (needs packages + zsh_tools first)
  when: not ansible_check_mode

- name: Check rendered wlogout style.css imports the palette colors
  ansible.builtin.command:
    argv:
      - grep
      - -E
      - "@import url|@color_1[0-5]"
      - "{{ verify_xdg_config_home }}/wlogout/style.css"
  register: verify_wlogout_wiring
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Assert rendered wlogout style.css imports the palette colors
  ansible.builtin.assert:
    that: verify_wlogout_wiring.rc == 0
    fail_msg: >-
      the rendered wlogout style.css does not import the palette colors
      (expected `@import url(...)` and an @color_1x usage — done-criterion 13,
      shell wiring). The wlogout_config role renders style.css.tpl → style.css;
      run the wlogout-config playbook (needs assets + default_palette first)
  when: not ansible_check_mode

- name: Stat shell-tools clone dirs (zsh_tools)
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ shell.oh_my_zsh_dir }}"
    - "{{ shell.pyenv_dir }}"
    - "{{ shell.nvm_dir }}"
  register: verify_shell_tool_dirs
  when: not ansible_check_mode

- name: Assert shell-tools clones exist (zsh_tools)
  ansible.builtin.assert:
    that:
      - verify_shell_tool_dirs.results | length == 3
      - verify_shell_tool_dirs.results[0].stat.exists
      - verify_shell_tool_dirs.results[1].stat.exists
      - verify_shell_tool_dirs.results[2].stat.exists
      - verify_shell_tool_dirs.results[0].stat.isdir
      - verify_shell_tool_dirs.results[1].stat.isdir
      - verify_shell_tool_dirs.results[2].stat.isdir
    fail_msg: >-
      at least one shell-tool clone is missing (expected
      {{ shell.oh_my_zsh_dir }}, {{ shell.pyenv_dir }},
      {{ shell.nvm_dir }} — done-criterion 11). The zsh_tools role git-clones
      them presence-guarded; run the zsh-tools playbook (needs packages first)
  when: not ansible_check_mode
