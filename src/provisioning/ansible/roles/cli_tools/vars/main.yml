# CLI tools role vars (Story 2.4).
#
# cli_tools_repo_root: repo root derived from this playbook's location.
#   cli-tools.yaml lives at <repo>/src/provisioning/ansible/playbooks/, so
#   <repo> = {{ playbook_dir }}/../../../.. (playbooks -> ansible ->
#   provisioning -> src -> repo root). Overridable if a future user runs the
#   playbooks from a relocated repo.
cli_tools_repo_root: "{{ playbook_dir }}/../../../.."

# cli_tools_bin_dir: uv's executable directory, resolved EXACTLY as uv does,
#   so the PATH prepend + `creates` guard match where `uv tool install` actually
#   drops the binary. Resolution order (uv docs): $UV_TOOL_BIN_DIR ->
#   $XDG_BIN_HOME -> $HOME/.local/bin. The previous value hardcoded
#   $HOME/.local/bin, which under a custom XDG layout ($XDG_DATA_HOME or
#   $XDG_BIN_HOME set — as this project's own provisioning does) pointed at a
#   dir uv never writes, so "Verify csg/weg/itr resolve on PATH" failed after a
#   successful install. Uses ansible_facts.env (not the deprecated top-level
#   ansible_env fact).
cli_tools_bin_dir: >-
  {{ ansible_facts.env.UV_TOOL_BIN_DIR
     | default(ansible_facts.env.XDG_BIN_HOME | default(ansible_facts.env.HOME + '/.local/bin', true), true) }}

# CONTAINER ENGINE — DECLARED, not detected:
# the image-build task runs `<cli> install --container-engine
# {{ container_runtime_engine }}`. The engine is the DECLARED value from
# group_vars/all.yml (shipped default podman; override via
# `-e container_runtime_engine=...` or `DOTFILES_CONTAINER_ENGINE`). This role
# does NOT detect it or pin a private copy: tasks/main.yml validates the
# declared value (domain + presence + usability + capability smoke, all
# fail-loud) and builds for it, so the built image tag and the rendered
# runtime settings can never diverge. podman/docker remain documented external
# dependencies; the packages role provisions podman on fresh machines and
# docker must be operator-provided when declared.
#
# cli_tools_engine_smoke_image: pinned, minimal image for the Layer-4
# capability smoke (run + bind mount + env + --rm). Pinned so the smoke never
# pulls a moving tag and stays tiny over the real CLI images.
cli_tools_engine_smoke_image: "docker.io/library/alpine:3.20"

# cli_tools_image_builds: the container-mode CLIs whose container images this
#   role builds after `uv tool install`. `itr` is deliberately absent (no
#   container mode). `csg` and `weg` both run containerized at runtime
#   (settings.toml renders runtime.mode = "container"); the assets role's
#   `weg dump-effects` is separate and runs locally.
#
#   NOT a second hand-written list of paths/tags: the list SELECTS the named
#   entries out of `cli_tools` (the manifest mirror above), so each build item
#   carries exactly the addressing shape of its manifest entry — since S6 both
#   are pinned `repo`/`tag` entries. The image tag therefore has ONE source:
#   the manifest `tag`. A pin bump edits the manifest (+ this mirror, locked by
#   parity) and the build loop below picks the new tag up — there is no
#   hardcoded tag to miss.
cli_tools_image_build_names:
  - csg
  - weg
cli_tools_image_builds: "{{ cli_tools | selectattr('name', 'in', cli_tools_image_build_names) | list }}"

# cli_tools_image_tag_flag_names: HOW each pinned container-mode CLI receives
#   its image tag (spine AD-7) — the tag value is always the manifest pin; only
#   the TRANSPORT differs, because the two build verbs do not share a flag:
#     - `weg`'s `install` verb takes `--image-tag <tag>` on argv.
#     - `csg`'s `install` verb has NO `--image-tag`: the tag comes from
#       the settings env var `COLORSCHEME__CONTAINER__IMAGE_TAG` (csg's
#       resolution policy prefix is `COLORSCHEME`, key `container.image_tag`).
#       Its build task passes that env var instead of a flag.
#   Both transports read `{{ item.tag }}`, so neither can carry a literal tag.
cli_tools_image_tag_flag_names:
  - weg
cli_tools_image_tag_flag_builds: >-
  {{ cli_tools_image_builds | selectattr('name', 'in', cli_tools_image_tag_flag_names) | list }}
cli_tools_image_tag_env_builds: >-
  {{ cli_tools_image_builds | rejectattr('name', 'in', cli_tools_image_tag_flag_names) | list }}
# The env KEY csg's settings resolver reads for `container.image_tag` is
# `COLORSCHEME__CONTAINER__IMAGE_TAG` (resolution policy prefix COLORSCHEME +
# key container.image_tag). It is written literally in the build task because an
# Ansible `environment:` key cannot be a var without obscuring the wiring;
# `deploy-coverage` asserts that exact key carries `{{ item.tag }}`.

# cli_tools_checkout_root: root of the PINNED external checkouts (spine AD-10).
#   Each repo entry materializes at <install>/cli-tools/<name>/<tag>/ with its
#   pin recorded next to it (<install>/cli-tools/<name>/pinned), so the
#   installed tool can always be traced to the exact tag it came from.
cli_tools_checkout_root: "{{ install_dir | trim }}/cli-tools"

# cli_tools_pinned / cli_tools_source_entries: the two addressing shapes of
#   the manifest, split so each install path is explicit instead of a single
#   loop carrying undefined keys. `cli_tools_pinned` entries are shallow-cloned
#   at their tag and installed FROM the checkout; `cli_tools_source_entries`
#   are installed from `{{ cli_tools_repo_root }}/<source>`. Since S6 the only
#   source entry is `dotfiles-runtime` (this repo still authors the runtime);
#   every CLI is pinned. The door stays open for the runtime's own install
#   path — it is NOT an extraction leftover.
cli_tools_pinned: "{{ cli_tools | selectattr('repo', 'defined') | list }}"
cli_tools_source_entries: "{{ cli_tools | rejectattr('repo', 'defined') | list }}"

# cli_tools: install specs mirroring dotfiles/provisioning/cli-tools.yaml
#   (csg + weg + itr -> pinned repo/tag, plus dotfiles-runtime -> src/runtime).
#   The console-script name is the install target; `itr` IS the icon-renderer
#   (no separate binary). itr has NO container mode and is NOT in
#   cli_tools_image_builds (nor is dotfiles-runtime: host-side
#   reconcile/inspect only).
#   Parity with the manifest is locked by a structural test, including the
#   one-shape-per-entry rule (source XOR repo+tag).
cli_tools:
  - name: csg
    repo: https://github.com/RandomGenericUsername/color-scheme-generator
    tag: v0.2.0
  - name: weg
    repo: https://github.com/RandomGenericUsername/wallpaper-effects-generator
    tag: v0.2.0
  - name: itr
    repo: https://github.com/RandomGenericUsername/icon-templates-renderer
    tag: v0.2.0
  - { name: dotfiles-runtime, source: src/runtime }
