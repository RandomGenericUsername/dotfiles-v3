# CLI tools role vars (Story 2.4).
#
# cli_tools_repo_root: repo root derived from this playbook's location.
#   cli-tools.yaml lives at <repo>/src/provisioning/ansible/playbooks/, so
#   <repo> = {{ playbook_dir }}/../../../.. (playbooks -> ansible ->
#   provisioning -> src -> repo root). Overridable if a future user runs the
#   playbooks from a relocated repo.
cli_tools_repo_root: "{{ playbook_dir }}/../../../.."

# cli_tools_bin_dir: uv's executable directory, resolved EXACTLY as uv does,
#   so the PATH prepend + `creates` guard match where `uv tool install` actually
#   drops the binary. Resolution order (uv docs): $UV_TOOL_BIN_DIR ->
#   $XDG_BIN_HOME -> $HOME/.local/bin. The previous value hardcoded
#   $HOME/.local/bin, which under a custom XDG layout ($XDG_DATA_HOME or
#   $XDG_BIN_HOME set — as this project's own provisioning does) pointed at a
#   dir uv never writes, so "Verify csg/weg/itr resolve on PATH" failed after a
#   successful install. Uses ansible_facts.env (not the deprecated top-level
#   ansible_env fact).
cli_tools_bin_dir: >-
  {{ ansible_facts.env.UV_TOOL_BIN_DIR
     | default(ansible_facts.env.XDG_BIN_HOME | default(ansible_facts.env.HOME + '/.local/bin', true), true) }}

# CONTAINER ENGINE — DECLARED, not detected:
# the image-build task runs `<cli> install --container-engine
# {{ container_runtime_engine }}`. The engine is the DECLARED value from
# group_vars/all.yml (shipped default podman; override via
# `-e container_runtime_engine=...` or `DOTFILES_CONTAINER_ENGINE`). This role
# does NOT detect it or pin a private copy: tasks/main.yml validates the
# declared value (domain + presence + usability + capability smoke, all
# fail-loud) and builds for it, so the built image tag and the rendered
# runtime settings can never diverge. podman/docker remain documented external
# dependencies; the packages role provisions podman on fresh machines and
# docker must be operator-provided when declared.
#
# cli_tools_engine_smoke_image: pinned, minimal image for the Layer-4
# capability smoke (run + bind mount + env + --rm). Pinned so the smoke never
# pulls a moving tag and stays tiny over the real CLI images.
cli_tools_engine_smoke_image: "docker.io/library/alpine:3.20"

# cli_tools_image_builds: the container-mode CLIs whose container images this
#   role builds after `uv tool install`. `itr` is deliberately absent (no
#   container mode). `csg` and `weg` both run containerized at runtime
#   (settings.toml renders runtime.mode = "container"); the assets role's
#   `weg dump-effects` is separate and runs locally. Each entry maps to the
#   CLI's `install` command and names the PACKAGE dir passed as its build
#   context (AD-5/AD-7): the context is the CLI's own repo root, never the
#   dotfiles repo root.
cli_tools_image_builds:
  - { name: csg, source: src/cli-tools/color-scheme-generator }
  - { name: weg, source: src/cli-tools/wallpaper-effects-generator }

# cli_tools: install specs mirroring dotfiles/provisioning/cli-tools.yaml
#   (csg/weg/itr -> repo source paths, plus dotfiles-runtime -> src/runtime).
#   The console-script name is the install target; `itr` IS the icon-renderer
#   (no separate binary). dotfiles-runtime has NO container mode and is NOT
#   in cli_tools_image_builds (host-side reconcile/inspect only).
#   Parity with the manifest is locked by a structural test.
cli_tools:
  - { name: csg, source: src/cli-tools/color-scheme-generator }
  - { name: weg, source: src/cli-tools/wallpaper-effects-generator }
  - { name: itr, source: src/cli-tools/icon-templates-renderer }
  - { name: dotfiles-runtime, source: src/runtime }
