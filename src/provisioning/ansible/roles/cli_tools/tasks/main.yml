# CLI tools role (Story 2.4) — installs csg/weg/itr via `uv tool install`
# against the repo package paths (FR-15, plan §3), then verifies each binary
# resolves on PATH in the run context (AC 3).
#
# Design (locked in Story 2.3 review):
# - uv presence is a SEPARATE concern from install idempotency: a fail-loud
#   assert (real-run precondition only, gated `when: not ansible_check_mode`
#   because command/shell modules never run under --check so uv_check.rc may be
#   undefined there). The install tasks themselves have NO `when:`.
# - `command -v` is a SHELL BUILTIN, not an executable: it must run via
#   ansible.builtin.shell, never ansible.builtin.command (which execs argv
#   directly and would fail with rc=2 — code review F1).
# - The ONLY idempotency/dry-run mechanism on the install loop is `creates:`
#   (AC 4 idempotent; AC 5 check-mode-safe by construction). Never gate on a
#   presence-check rc — under --check a skipped `command -v` registers rc: 0
#   and the task would report `skipped` instead of would-change.
# - User-scoped privilege context: NO become/become_user anywhere. Running as
#   root would install into /root/.local/bin and AC 3 would be silently false.

- name: Check for uv
  ansible.builtin.shell: command -v uv
  register: uv_check
  changed_when: false
  failed_when: false

- name: Ensure uv is available
  ansible.builtin.assert:
    that: uv_check.rc == 0 and uv_check.stdout | length > 0
    fail_msg: >-
      uv not found on PATH — the cli_tools role requires uv
      (bootstrap.sh pre-seeds it; Story 3.1)
  when: not ansible_check_mode

# capture-tool is NOT installed here: from ags-apps v0.4.0 its Python backend
# ships inside the pinned unit (capture-tool/bin/capture-tool), and the ags_apps
# role installs the bin-dir symlink after cloning the unit. This role runs BEFORE
# ags-apps on the bootstrap chain, so it could not install or assert it anyway.

- name: Install the Hyprland session plugin activator
  ansible.builtin.copy:
    src: "{{ cli_tools_repo_root }}/dotfiles/provisioning/scripts/gloview-activate"
    dest: "{{ cli_tools_bin_dir }}/gloview-activate"
    mode: "0755"
    remote_src: true

- name: Install the icon color mapping editor launcher (repo-aware template)
  ansible.builtin.template:
    src: icon-color-mapping-editor.j2
    dest: "{{ cli_tools_bin_dir }}/icon-color-mapping-editor"
    mode: "0755"

# The btop Theme Studio has the same "bundles TS at startup" lifecycle and the
# same toggle/start-if-down contract as icme: provisioning quits the instance
# after placing updated sources, and the SUPER+B bind restarts it on demand.
- name: Install the btop Theme Studio launcher (repo-aware template)
  ansible.builtin.template:
    src: btop-theme-studio.j2
    dest: "{{ cli_tools_bin_dir }}/btop-theme-studio"
    mode: "0755"

# The capture UI is a standalone AGS instance with the same "bundles TS at
# startup" lifecycle as icme. Provisioning (gui_tools role) quits it after
# placing updated sources; this start-if-down/toggle launcher is what the
# SUPER+PRINT keybind now calls, so a quit instance is restarted on demand
# instead of leaving the keybind a silent no-op until the next login.
- name: Install the capture tool UI launcher (toggle/start-if-down template)
  ansible.builtin.template:
    src: capture-ui.j2
    dest: "{{ cli_tools_bin_dir }}/capture-ui"
    mode: "0755"

# The clipboard overlay has the same "bundles TS at startup" lifecycle; its
# keybind entrypoint must restart a quit instance on demand (super+w toggles).
- name: Install the hypr-pano clipboard overlay launcher (toggle/start-if-down template)
  ansible.builtin.template:
    src: hypr-pano-ui.j2
    dest: "{{ cli_tools_bin_dir }}/hypr-pano-ui"
    mode: "0755"

# The wallpaper selector has the same "bundles TS at startup" lifecycle; its
# keybind entrypoint must restart a quit instance on demand (SUPER+W toggles).
- name: Install the wallpaper selector launcher (toggle/start-if-down template)
  ansible.builtin.template:
    src: wallpaper-selector-ui.j2
    dest: "{{ cli_tools_bin_dir }}/wallpaper-selector-ui"
    mode: "0755"

# rofi is not an AGS instance, but the same "one keybind entrypoint" contract
# applies: SUPER+D must toggle it closed as well as open, and the bind must not
# bake in the key. rofi-ui owns both directions (pidfile -> SIGTERM when a live
# rofi is found, fresh launch otherwise).
- name: Install the rofi launcher toggle (single keybind entrypoint)
  ansible.builtin.template:
    src: rofi-ui.j2
    dest: "{{ cli_tools_bin_dir }}/rofi-ui"
    mode: "0755"

# ── Pinned external checkouts (spine AD-10) ──
# A repo entry is addressed as {name, repo, tag}: shallow-clone the tag into
# <install>/cli-tools/<name>/<tag>/, drop the clone's .git (it is deployed as
# a source tree, not a working copy — exactly the ags_apps unit discipline),
# record the tag in <install>/cli-tools/<name>/pinned, then install the tool
# FROM that checkout. Installing from the checkout (not a `git+…@tag` URL) is
# what makes PEP 610 record a tag-bearing path, and it is the shape `verify`
# asserts (checkout path contains the tag, pin file equals it).
#
# Check-mode discipline mirrors ags_apps: the stat probes run under --check,
# every clone/remove/install is gated `when: not ansible_check_mode`, and the
# pin-file `copy` supports check mode (it reports would-change, never writes).
# The checkout-root `file` task also supports check mode and creates nothing
# in a dry run.
- name: Assert install_dir seam is provided for pinned CLI checkouts
  ansible.builtin.assert:
    that: install_dir is defined and install_dir | trim | length > 0
    fail_msg: >-
      install_dir is undefined or empty — the cli_tools role materializes
      pinned checkouts under {{ cli_tools_checkout_root }} (spine AD-10), so it
      requires the install_dir seam extra-var (the orchestrator resolves
      $XDG_DATA_HOME/dotfiles/; direct runs pass -e install_dir=...)
  when: cli_tools_pinned | length > 0

- name: Ensure the pinned CLI checkout root exists
  ansible.builtin.file:
    path: "{{ cli_tools_checkout_root }}"
    state: directory
    mode: "0755"

- name: Check whether each pinned CLI checkout is already present
  ansible.builtin.stat:
    path: "{{ cli_tools_checkout_root }}/{{ item.name }}/{{ item.tag }}/pyproject.toml"
  loop: "{{ cli_tools_pinned }}"
  loop_control:
    label: "{{ item.name }}"
  register: cli_tools_checkouts

- name: Clone each pinned CLI checkout at its tag (shallow, anonymous HTTPS)
  ansible.builtin.git:
    repo: "{{ item.item.repo }}"
    dest: "{{ cli_tools_checkout_root }}/{{ item.item.name }}/{{ item.item.tag }}"
    version: "{{ item.item.tag }}"
    depth: 1
    single_branch: true
  loop: "{{ cli_tools_checkouts.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  register: cli_tools_clone
  retries: 3
  delay: 5
  until: cli_tools_clone is succeeded
  when:
    - not ansible_check_mode
    - not item.stat.exists

- name: Remove the pinned checkouts' .git (deploy as source trees, not working copies)
  ansible.builtin.file:
    path: "{{ cli_tools_checkout_root }}/{{ item.name }}/{{ item.tag }}/.git"
    state: absent
  loop: "{{ cli_tools_pinned }}"
  loop_control:
    label: "{{ item.name }}"
  when: not ansible_check_mode

- name: Record each pinned CLI tag next to its checkout
  ansible.builtin.copy:
    content: "{{ item.tag }}\n"
    dest: "{{ cli_tools_checkout_root }}/{{ item.name }}/pinned"
    mode: "0644"
    force: true
  loop: "{{ cli_tools_pinned }}"
  loop_control:
    label: "{{ item.name }}"

- name: Install the pinned CLIs from their tag-bearing checkouts
  ansible.builtin.command: "uv tool install --force --no-cache '{{ cli_tools_checkout_root }}/{{ item.name }}/{{ item.tag }}'"
  environment:
    # Same pinned bin dir as the source-path installs, the `creates` guard and
    # the verify PATH prepend.
    UV_TOOL_BIN_DIR: "{{ cli_tools_bin_dir }}"
  loop: "{{ cli_tools_pinned }}"
  loop_control:
    label: "{{ item.name }}"
  when: not ansible_check_mode

- name: Install source-path CLIs via uv tool install
  ansible.builtin.command: "uv tool install --no-cache '{{ cli_tools_repo_root }}/{{ item.source }}'"
  args:
    creates: "{{ cli_tools_bin_dir }}/{{ item.name }}"
  environment:
    # Pin UV_TOOL_BIN_DIR to the same cli_tools_bin_dir the `creates` guard and
    # the verify PATH prepend use. Without this, uv resolves the bin dir from
    # $XDG_DATA_HOME / $UV_TOOL_DIR (this project sets a custom XDG layout), so
    # the binary can land somewhere cli_tools_bin_dir never points and the
    # verify task fails after a successful install (fixed 2026-08-19).
    UV_TOOL_BIN_DIR: "{{ cli_tools_bin_dir }}"
  loop: "{{ cli_tools_source_entries }}"
  loop_control:
    label: "{{ item.name }}"

# Upgrade-after-install (2026-09-07): the `creates:` guard above only fires on
# FIRST install, so an already-provisioned machine kept running a stale itr
# forever (this shipped without the `mapping` subcommands). uv tool install
# --force re-pins the tool env from current repo source on every bootstrap;
# it is naturally idempotent (no creates guard wanted) and check-mode safe
# (command modules never run under --check). Pinned entries get the same
# every-run re-pin from their checkout (the install task above already uses
# --force, so a pin bump re-installs instead of being masked by `creates`).
- name: Upgrade source-path CLI tool envs from current repo source
  ansible.builtin.command: "uv tool install --force --no-cache '{{ cli_tools_repo_root }}/{{ item.source }}'"
  environment:
    UV_TOOL_BIN_DIR: "{{ cli_tools_bin_dir }}"
  loop: "{{ cli_tools_source_entries }}"
  loop_control:
    label: "{{ item.name }}"
  when: not ansible_check_mode

- name: Verify csg/weg/itr resolve on PATH
  ansible.builtin.shell: "command -v {{ item.name }}"
  loop: "{{ cli_tools }}"
  environment:
    PATH: "{{ cli_tools_bin_dir }}:{{ ansible_facts.env.PATH }}"
  changed_when: false

# The OpenAI Codex CLI is installed by the packages role (AUR openai-codex-bin
# -> /usr/bin/codex; provision-ai-ides-and-clis). A machine that previously ran
# OpenAI's standalone installer carries a self-updating shadow at
# <bin>/codex (a symlink into ~/.codex/packages/standalone/current/bin/codex)
# which PRECEDES /usr/bin on PATH, so the AUR binary would never be the
# resolved `codex`. Remove the shadow so provisioning owns the binary — but
# ONLY when it is the standalone installer's symlink, never a user's own
# `codex` (a regular file, or a link somewhere else, is left untouched).
#
# User-scoped (no become): this is the user's own bin dir, mirroring the
# "never install into root's home" contract. `stat` does NOT follow symlinks
# by default, so islnk/lnk_target describe the link itself; a dangling link is
# still removed. Check-gated: a dry-run never deletes.
- name: Check for the standalone Codex shadow in the user bin dir
  ansible.builtin.stat:
    path: "{{ cli_tools_bin_dir }}/codex"
  register: cli_tools_codex_shadow

- name: Remove the standalone Codex shadow (the AUR package owns /usr/bin/codex)
  ansible.builtin.file:
    path: "{{ cli_tools_bin_dir }}/codex"
    state: absent
  when:
    - not ansible_check_mode
    - cli_tools_codex_shadow.stat.islnk | default(false)
    - "'/.codex/packages/standalone/' in (cli_tools_codex_shadow.stat.lnk_target | default(''))"

# The standalone installer's payload lives under ~/.codex/packages (releases +
# the `current` pointer). Remove it only when the standalone subtree is really
# there — never touch ~/.codex/config.toml or auth, which hold the user's
# login/state and are shared by the AUR binary.
- name: Check for the standalone Codex packages payload
  ansible.builtin.stat:
    path: "{{ ansible_facts.env.HOME }}/.codex/packages/standalone"
  register: cli_tools_codex_standalone

- name: Remove the standalone Codex packages payload (config/auth preserved)
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.codex/packages"
    state: absent
  when:
    - not ansible_check_mode
    - cli_tools_codex_standalone.stat.exists

# Container image builds for the container-mode CLIs (product decision
# 2026-08-12: csg/weg run in container mode; the host never installs backend
# binaries). `uv tool install` above only installs the host-side launcher —
# `<cli> install` builds the image that does the actual work. The list of CLIs
# is `cli_tools_image_builds` (csg + weg).
#
# Container engine (Option 2b, single DECLARED source of truth):
# - The engine is DECLARED, not detected: `container_runtime_engine` from
#   group_vars/all.yml (shipped default podman; override via
#   `-e container_runtime_engine=...` or DOTFILES_CONTAINER_ENGINE). There is
#   NO fallback-on-detection-failure — if the declared engine is absent or
#   unusable the run FAILS LOUD below. The SAME value feeds the build here and
#   the rendered settings templates, so the built image tag and the runtime
#   lookup can never diverge.
# - The four-layer battery below (domain → presence → usability → capability
#   smoke) validates the declared engine. Layer 1 is ungated (runs under
#   --check too); layers 2-4 use shell/command modules that never run under
#   --check, so their probes AND asserts are gated `when: not
#   ansible_check_mode`.
# - `--context <checkout>` is passed EXPLICITLY so the build context is the
#   CLI's own repo checkout (AD-5), not the dotfiles repo root, and does not
#   depend on the CLI rediscovering its source via PEP 610 metadata
#   (deterministic on the provisioning path; direct_url discovery remains the
#   fallback for ad-hoc/dev runs). `--source-root` is still accepted by the
#   CLIs as a deprecated alias for one minor.
# - `--image-tag <pin>` is passed for a PINNED CLI (AD-7): the image tag is the
#   repo tag from the manifest entry — never `latest` — so a pin bump can never
#   silently reuse the previous image, and the rendered `image_tag` in
#   roles/settings resolves the image this task built. Since S6 BOTH
#   container-mode CLIs are pinned; they differ only in transport (weg takes
#   `--image-tag` on argv, csg reads COLORSCHEME__CONTAINER__IMAGE_TAG from the
#   settings env because its v0.1.0 verb has no such flag). The tag value in
#   both cases is `{{ item.tag }}` — the manifest pin, never a literal.
#   The legacy source-path build task stays for a future in-repo container-mode
#   entry; today its loop selects nothing (dotfiles-runtime has no container
#   mode).
# - NO `creates:` on these tasks: image EXISTENCE does not imply FRESHNESS.
#   A stale image (built before the current CLI source) must be rebuilt, so the
#   task runs every apply; the container engine's content-addressed cache makes
#   an unchanged rebuild cheap and correct. This mirrors the default_palette
#   generate task's accepted-by-design "changed on every apply" semantics
#   (idempotency = no STATE drift, not no CHANGED report). Do NOT reintroduce
#   an existence gate.
# - User-scoped privilege context: NO become — rootless podman builds into the
#   user's storage (AC 10).

# ── Layer 1: domain assert (UNGATED — runs under --check too) ──
# Pure variable state, so it evaluates even in a dry run: a typo'd declared
# engine aborts before any probe. podman|docker are the only engines the
# container-mode CLIs support.
- name: Assert the declared container engine is podman or docker
  ansible.builtin.assert:
    that:
      - container_runtime_engine in ["podman", "docker"]
    fail_msg: >-
      container_runtime_engine is '{{ container_runtime_engine }}' — the
      declared container engine must be 'podman' or 'docker'. Declare it with
      -e container_runtime_engine=podman (or docker), or export
      DOTFILES_CONTAINER_ENGINE=podman (or docker).

# ── Layer 2: presence ──
# `command -v` is a SHELL BUILTIN (no /usr/bin/command executable), so it must
# run via ansible.builtin.shell, never ansible.builtin.command (code review F1).
# Skipped under --check (shell never runs there), hence the gated assert below.
- name: Check the declared container engine is on PATH
  ansible.builtin.shell: "command -v {{ container_runtime_engine }}"
  register: cli_tools_engine_presence
  changed_when: false
  failed_when: false
  environment:
    PATH: "{{ cli_tools_bin_dir }}:{{ ansible_facts.env.PATH }}"
  when: not ansible_check_mode

- name: Assert the declared container engine is present
  ansible.builtin.assert:
    that:
      - cli_tools_engine_presence.rc == 0
      - cli_tools_engine_presence.stdout | length > 0
    fail_msg: >-
      The declared container engine '{{ container_runtime_engine }}' was not
      found on PATH. Install it, or declare a different engine with
      -e container_runtime_engine=podman (or docker), or export
      DOTFILES_CONTAINER_ENGINE=podman (or docker).
  when: not ansible_check_mode

# ── Layer 3: usability (bounded) ──
# A present binary can still be broken (e.g. a stopped docker daemon); `engine
# info` is bounded by a 30s timeout so a hung engine cannot stall the run.
- name: Check the declared container engine is usable
  ansible.builtin.shell: "timeout 30 {{ container_runtime_engine }} info >/dev/null 2>&1"
  register: cli_tools_engine_usability
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Assert the declared container engine is usable
  ansible.builtin.assert:
    that:
      - cli_tools_engine_usability.rc == 0
    fail_msg: >-
      The declared container engine '{{ container_runtime_engine }}' is present
      but not usable (`{{ container_runtime_engine }} info` failed, rc={{
      cli_tools_engine_usability.rc | default('n/a', true) }}). Start it, or
      declare a different engine with -e container_runtime_engine=podman (or
      docker), or export DOTFILES_CONTAINER_ENGINE=podman (or docker).
  when: not ansible_check_mode

# ── Layer 4: capability smoke (run + bind mount + env + --rm, bounded) ──
# Proves the engine can actually run a container with a bind mount + env +
# --rm — the exact capabilities the CLI image builds need. Uses a pinned
# minimal image and a tempfile probe.
- name: Create the container engine smoke probe file
  ansible.builtin.tempfile:
    state: file
    prefix: "weg-container-smoke-"
  register: probe
  when: not ansible_check_mode

- name: Write content into the container engine smoke probe file
  ansible.builtin.copy:
    content: "weg-container-smoke\n"
    dest: "{{ probe.path }}"
    mode: "0644"
  when: not ansible_check_mode

# argv form (NOT shell) so `$WEG_SMOKE` and the inner quoting pass through to
# the in-container `sh -c` untouched and host quoting can never corrupt the
# probe.
- name: Run the container engine capability smoke test
  ansible.builtin.command:
    argv:
      - "timeout"
      - "120"
      - "{{ container_runtime_engine }}"
      - "run"
      - "--rm"
      - "-e"
      - "WEG_SMOKE=ok"
      - "-v"
      - "{{ probe.path }}:/smoke/probe.txt:ro"
      - "{{ cli_tools_engine_smoke_image }}"
      - "sh"
      - "-c"
      - 'test "$WEG_SMOKE" = ok && grep -qx weg-container-smoke /smoke/probe.txt && echo SMOKE_OK'
  register: cli_tools_engine_smoke
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Assert the container engine capability smoke test passed
  ansible.builtin.assert:
    that:
      - "'SMOKE_OK' in (cli_tools_engine_smoke.stdout | default('', true))"
    fail_msg: >-
      The declared container engine '{{ container_runtime_engine }}' failed the
      capability smoke test (run + bind mount + env + --rm), rc={{
      cli_tools_engine_smoke.rc | default('n/a', true) }}. stderr: {{
      cli_tools_engine_smoke.stderr | default('', true) }}
  when: not ansible_check_mode

- name: Remove the container engine smoke probe file
  ansible.builtin.file:
    path: "{{ probe.path }}"
    state: absent
  when: not ansible_check_mode

- name: Build container images for the pinned container-mode CLIs that take the tag on argv (tag = the pin)
  ansible.builtin.command:
    argv:
      - "{{ item.name }}"
      - install
      - --container-engine
      - "{{ container_runtime_engine }}"
      - --context
      - "{{ cli_tools_checkout_root }}/{{ item.name }}/{{ item.tag }}"
      - --image-tag
      - "{{ item.tag }}"
  loop: "{{ cli_tools_image_tag_flag_builds }}"
  loop_control:
    label: "{{ item.name }}"
  environment:
    PATH: "{{ cli_tools_bin_dir }}:{{ ansible_facts.env.PATH }}"
  when: not ansible_check_mode

# csg's `install` verb has no `--image-tag` (v0.1.0): it reads
# `container.image_tag` through its settings resolver, whose env prefix is
# `COLORSCHEME`. Passing the pin as that env var is the SAME AD-7 contract —
# the image tag is the manifest pin, never `latest` — just a different
# transport. `deploy-coverage` asserts this exact key carries `{{ item.tag }}`
# (and that no literal tag appears in the task code), so a renamed key cannot
# quietly let the build fall back to the CLI default `latest`.
- name: Build container images for the pinned CLIs that read the tag from settings env
  ansible.builtin.command:
    argv:
      - "{{ item.name }}"
      - install
      - --container-engine
      - "{{ container_runtime_engine }}"
      - --context
      - "{{ cli_tools_checkout_root }}/{{ item.name }}/{{ item.tag }}"
  loop: "{{ cli_tools_image_tag_env_builds }}"
  loop_control:
    label: "{{ item.name }}"
  environment:
    PATH: "{{ cli_tools_bin_dir }}:{{ ansible_facts.env.PATH }}"
    COLORSCHEME__CONTAINER__IMAGE_TAG: "{{ item.tag }}"
  when: not ansible_check_mode

- name: Build container images for the source-path container-mode CLIs
  ansible.builtin.command:
    argv:
      - "{{ item.name }}"
      - install
      - --container-engine
      - "{{ container_runtime_engine }}"
      - --context
      - "{{ cli_tools_repo_root }}/{{ item.source }}"
  loop: "{{ cli_tools_image_builds | rejectattr('tag', 'defined') | list }}"
  loop_control:
    label: "{{ item.name }}"
  environment:
    PATH: "{{ cli_tools_bin_dir }}:{{ ansible_facts.env.PATH }}"
  when: not ansible_check_mode
