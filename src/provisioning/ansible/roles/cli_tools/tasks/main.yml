# CLI tools role (Story 2.4) — installs csg/weg/itr via `uv tool install`
# against the repo package paths (FR-15, plan §3), then verifies each binary
# resolves on PATH in the run context (AC 3).
#
# Design (locked in Story 2.3 review):
# - uv presence is a SEPARATE concern from install idempotency: a fail-loud
#   assert (real-run precondition only, gated `when: not ansible_check_mode`
#   because command/shell modules never run under --check so uv_check.rc may be
#   undefined there). The install tasks themselves have NO `when:`.
# - `command -v` is a SHELL BUILTIN, not an executable: it must run via
#   ansible.builtin.shell, never ansible.builtin.command (which execs argv
#   directly and would fail with rc=2 — code review F1).
# - The ONLY idempotency/dry-run mechanism on the install loop is `creates:`
#   (AC 4 idempotent; AC 5 check-mode-safe by construction). Never gate on a
#   presence-check rc — under --check a skipped `command -v` registers rc: 0
#   and the task would report `skipped` instead of would-change.
# - User-scoped privilege context: NO become/become_user anywhere. Running as
#   root would install into /root/.local/bin and AC 3 would be silently false.

- name: Check for uv
  ansible.builtin.shell: command -v uv
  register: uv_check
  changed_when: false
  failed_when: false

- name: Ensure uv is available
  ansible.builtin.assert:
    that: uv_check.rc == 0 and uv_check.stdout | length > 0
    fail_msg: >-
      uv not found on PATH — the cli_tools role requires uv
      (bootstrap.sh pre-seeds it; Story 3.1)
  when: not ansible_check_mode

- name: Install the capture-tool controller into the provisioned user bin directory
  ansible.builtin.copy:
    src: "{{ cli_tools_repo_root }}/scripts/capture-tool"
    dest: "{{ cli_tools_bin_dir }}/capture-tool"
    mode: "0755"
    remote_src: true

- name: Install csg/weg/itr via uv tool install
  ansible.builtin.command: "uv tool install --no-cache '{{ cli_tools_repo_root }}/{{ item.source }}'"
  args:
    creates: "{{ cli_tools_bin_dir }}/{{ item.name }}"
  environment:
    # Pin UV_TOOL_BIN_DIR to the same cli_tools_bin_dir the `creates` guard and
    # the verify PATH prepend use. Without this, uv resolves the bin dir from
    # $XDG_DATA_HOME / $UV_TOOL_DIR (this project sets a custom XDG layout), so
    # the binary can land somewhere cli_tools_bin_dir never points and the
    # verify task fails after a successful install (fixed 2026-08-19).
    UV_TOOL_BIN_DIR: "{{ cli_tools_bin_dir }}"
  loop: "{{ cli_tools }}"

- name: Verify capture-tool is on PATH
  ansible.builtin.shell: "command -v capture-tool"
  environment:
    PATH: "{{ cli_tools_bin_dir }}:{{ ansible_facts.env.PATH }}"
  changed_when: false

- name: Verify csg/weg/itr resolve on PATH
  ansible.builtin.shell: "command -v {{ item.name }}"
  loop: "{{ cli_tools }}"
  environment:
    PATH: "{{ cli_tools_bin_dir }}:{{ ansible_facts.env.PATH }}"
  changed_when: false

# Container image builds for the container-mode CLIs (product decision
# 2026-08-12: csg/weg run in container mode; the host never installs backend
# binaries). `uv tool install` above only installs the host-side launcher —
# `csg install` builds the image that does the actual work.
#
# Design (locked in Story 2.8 review):
# - The container engine is a DOCUMENTED DEPENDENCY: detected at runtime below
#   (podman preferred, then docker, then FAIL LOUD). It is NOT pinned to podman
#   and NOT installed by this chain — the packages role (2.3) / bootstrap (3.1)
#   is where one of them should be installed.
# - `--source-root {{ cli_tools_repo_root }}` is passed EXPLICITLY so the build
#   context does not depend on the CLI rediscovering its source via PEP 610
#   metadata (deterministic on the provisioning path; direct_url discovery
#   remains the fallback for ad-hoc/dev runs).
# - NO `creates:` on these tasks: image EXISTENCE does not imply FRESHNESS.
#   A stale image (built before the current CLI source) must be rebuilt, so the
#   task runs every apply; the container engine's content-addressed cache makes
#   an unchanged rebuild cheap and correct. This mirrors the default_palette
#   generate task's accepted-by-design "changed on every apply" semantics
#   (idempotency = no STATE drift, not no CHANGED report). Do NOT reintroduce
#   an existence gate.
# - Check mode: command/shell modules do NOT run under --check (verified
#   ansible-core 2.20.3), so the engine probe is skipped there and
#   `cli_tools_engine_check` is undefined; the `Resolve container engine`
#   set_fact therefore falls back to "none" and the assert + build are gated
#   `when: not ansible_check_mode` (same guard as default_palette) — a `--check`
#   run stays dry and cannot validate engine presence.
# - User-scoped privilege context: NO become — rootless podman builds into the
#   user's storage (AC 10).

- name: Detect container engine (podman, then docker)
  ansible.builtin.shell: "command -v podman >/dev/null 2>&1 && printf podman || { command -v docker >/dev/null 2>&1 && printf docker || printf none; }"
  register: cli_tools_engine_check
  changed_when: false
  failed_when: false
  environment:
    PATH: "{{ cli_tools_bin_dir }}:{{ ansible_facts.env.PATH }}"
  when: not cli_tools_container_engine_override | default("", true)

- name: Resolve container engine
  ansible.builtin.set_fact:
    cli_tools_container_engine: "{{ cli_tools_container_engine_override | default('') or cli_tools_engine_check.stdout | trim | default('none', true) }}"

- name: Ensure a container engine is available
  ansible.builtin.assert:
    that: cli_tools_container_engine in ["podman", "docker"]
    fail_msg: >-
      No usable container engine — resolved '{{ cli_tools_container_engine }}'.
      The cli_tools role needs podman or docker (auto-detected, podman
      preferred) to build the container-mode CLI images. podman/docker are
      DOCUMENTED DEPENDENCIES (not installed by this chain); install one,
      pre-seed it in the bootstrap (Story 3.1), or set
      cli_tools_container_engine_override to a working engine
  when: not ansible_check_mode

- name: Build csg container images
  ansible.builtin.command:
    argv:
      - csg
      - install
      - --container-engine
      - "{{ cli_tools_container_engine }}"
      - --source-root
      - "{{ cli_tools_repo_root }}"
  environment:
    PATH: "{{ cli_tools_bin_dir }}:{{ ansible_facts.env.PATH }}"
  when: not ansible_check_mode
