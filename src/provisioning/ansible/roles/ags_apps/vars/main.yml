# ags-apps role vars — install the AGS bar as ONE versioned unit and deploy
# it as the live bar.
#
# Spine AD-1 (contracts ← ags-platform ← ags-apps: the bar consumes the
# platform, never vice versa), AD-17 (distribution: one unit, shared
# resolution), AD-23 (fresh host: provisioning installs the pinned unit and
# creates the resolution shortcut). Slice 2 of ags-apps-bar-first: dotfiles
# consumes the bar that slice 1 moved into the ags-apps monorepo, mirroring
# the ags-platform consumption shape (precedent:
# openspec/changes/ags-consume-platform/tasks.md 1.1 — pinned shallow
# anonymous clone, .git removed, pin recorded — and 1.2 — resolution shortcut,
# rollback = repoint).
#
# WHY A SYMLINK, NOT A PER-FILE COPY. Provisioning used to enumerate the bar
# per file (compositor_configs_skeleton_files). Every new bar source had to be
# registered or a fresh provision silently undeployed it. The unit is now
# deployed WHOLE: <install>/config/ags is a symlink into the unit's bar/
# subdir, so the live bar is always exactly the pinned tag — no manifest can
# drift. AGENTS.md §2's "register every new bar source" rule is satisfied BY
# CONSTRUCTION for the bar (there are no per-file bar sources anymore); the
# deploy-coverage gate asserts the absence of stale per-file bar entries
# instead. The clipboard overlay (slice 3) deploys the same way:
# <install>/config/ags-hypr-pano is a symlink into the unit's hypr-pano/ subdir,
# and gui_tools no longer enumerates it per file. The notifications overlay
# (slice 4) follows identically: <install>/config/ags-notifications is a symlink
# into the unit's notifications/ subdir, and gui_tools no longer enumerates it
# per file (it keeps only the AGS-instance launch entry that starts the daemon
# from the now-symlinked ~/.config/ags-notifications). The capture-tool GUI
# (slice 5) follows the same shape: <install>/config/ags-capture is a symlink
# into the unit's capture-tool/ subdir, and gui_tools no longer enumerates it per
# file. Unlike the others, capture-tool ships a Python BACKEND as well as the AGS
# GUI; from ags-apps v0.4.0 that backend lives in the unit too
# (<unit>/capture-tool/bin/capture-tool). This role installs a bin-dir SYMLINK to
# it, so the whole app is one self-contained unit and nothing stays in-repo.
# The wallpaper
# selector (slice 6) is the sixth app: <install>/config/ags-wallpaper-selector is
# a symlink into the unit's wallpaper-selector/ subdir, and gui_tools no longer
# enumerates it per file (it keeps only the AGS-instance launch entry that starts
# the selector from the now-symlinked ~/.config/ags-wallpaper-selector). Unlike
# capture-tool the selector is a whole package — nothing stays in-repo. The icon
# color mapping editor (slice 7) is the seventh app: <install>/config/ags-icme is
# a symlink into the unit's icme/ subdir, and gui_tools no longer enumerates it
# per file (it keeps only the on-demand AGS-instance entry; the provisioned
# `icon-color-mapping-editor` launcher starts the editor from the now-symlinked
# ~/.config/ags-icme). Like the selector, icme is a whole package — nothing stays
# in-repo. The btop Theme Studio (slice 8) is the eighth app:
# <install>/config/ags-btop-studio is a symlink into the unit's
# btop-theme-studio/ subdir, and gui_tools no longer enumerates it per file (it
# keeps only the on-demand AGS-instance entry; the provisioned
# `btop-theme-studio` launcher starts the studio from the now-symlinked
# ~/.config/ags-btop-studio). Like the selector and icme, the studio is a whole
# package — nothing stays in-repo. Its Python live preview engine
# (live/btop_live.py) is part of the app tree: the app runs
# `${GLib.get_current_dir()}/live/btop_live.py`, so it stays reachable through
# the live link and needs no separate install.
#
# WHY A RESOLUTION SHORTCUT INSIDE THE UNIT. AGS (v3.1.0) embeds esbuild,
# which resolves a bare specifier (`import { x } from "ags-platform"`) from
# `node_modules/` walking UP from the importing file. esbuild realpaths the
# live-bar symlink, so the bar's real tree is <unit>/bar/ — the
# shared-ancestor <install>/config/node_modules/ags-platform the ags_platform
# role creates is NOT an ancestor of that tree and cannot resolve the bar's
# own platform imports. The role therefore creates a second, per-unit
# shortcut at <unit>/node_modules/ags-platform pointing at the pinned
# platform unit. Deleting it makes `ags bundle <unit>/bar/app.tsx` fail with
# `Could not resolve "ags-platform/..."` — the shortcut is load-bearing, not
# decorative (proven by the negative control in the deploy evidence).
#
# DEVIATION FROM THE PLATFORM LAYOUT (documented, not accidental). The
# platform repo ROOT is its package (index.ts at the top), so the clone lands
# directly in the version dir. ags-apps is a MONOREPO: the repo root holds
# bar/ + future app dirs, and the bar package is the `bar/` SUBDIR. The unit
# dir is therefore the repo checkout (<install>/ags-apps/<tag>/) and the
# deployed bar is <unit>/bar/ (ags_apps_bar_dir), never the unit root.
#
# GENERATED + RUNTIME FILES LAND IN THE UNIT TREE. icons.json (generated by
# the compositor_configs role AFTER this role links the live bar) and
# colors.css (the runtime seeder's R2 consumer symlink) resolve through the
# live-bar symlink into the unit checkout — exactly as they landed in the
# deployed per-file tree before. The presence-guarded clone never re-clones,
# so a re-provision never wipes them. On UPGRADE from the old per-file bridge,
# the legacy <install>/config/ags dir is moved aside (timestamped backup, same
# migrate-then-symlink discipline as the config_links role) and colors.css is
# restored from the backup when present, so the bar never loses its palette
# pointer between provision and the next seed.

# ags_apps_repo_url: the PUBLIC monorepo. Cloned over anonymous HTTPS (no
#   credentials) — like the platform repo, NOT like the private repos AD-23
#   fetches with `gh`.
ags_apps_repo_url: https://github.com/RandomGenericUsername/ags-apps.git

# ags_apps_version: THE PIN. The git tag to install, and the name of the
#   version directory under the install root. The tag names a MONOREPO release
#   (`v0.4.0` carries bar/ + hypr-pano/ + notifications/ + capture-tool/ +
#   wallpaper-selector/ + icme/ + btop-theme-studio/, the notifications app
#   owning org.freedesktop.Notifications, and the capture-tool Python backend at
#   capture-tool/bin/capture-tool): the unit is deployed whole, so one tag
#   moves every app it ships. Bump this to move the live apps forward, point a
#   live link at an older sibling tag dir to roll back. Recorded on the host at
#   ags_apps_pin_file so the installed version is observable without reading
#   this file.
ags_apps_version: v0.4.0

# ags_apps_install_root: the monorepo home (<install>/ags-apps/). Trim lock:
#   consumes the same validated {{ install_dir | trim }} value the sibling
#   roles use.
ags_apps_install_root: "{{ install_dir | trim }}/ags-apps"

# ags_apps_unit_dir: the installed unit for the pinned tag. The unit is the
#   WHOLE monorepo checkout at the tag (bar/ + future app dirs), NOT the bar
#   package itself — see the DEVIATION note above.
ags_apps_unit_dir: "{{ ags_apps_install_root }}/{{ ags_apps_version }}"

# ags_apps_bar_dir: the deployed bar package — the `bar/` subdir of the unit.
#   Slice 1 moved dotfiles/config/ags/ here verbatim (thin consumer of
#   ags-platform); the live-bar link points at this dir.
ags_apps_bar_dir: "{{ ags_apps_unit_dir }}/bar"

# ags_apps_unit_marker: the file whose presence means "the unit is
#   installed". Used as the idempotency guard for the clone (the git module
#   has no `creates:`), mirroring the zsh_tools role's stat guard.
ags_apps_unit_marker: "{{ ags_apps_bar_dir }}/app.tsx"

# ags_apps_pin_file: the recorded pin (<install>/ags-apps/pinned). A
#   one-line file naming the installed tag; `verify` asserts it, and a human
#   reads it to know what is deployed.
ags_apps_pin_file: "{{ ags_apps_install_root }}/pinned"

# ags_apps_spine_config_dir: the config-in-spine root (<install>/config/),
#   whose parent the live-bar link lands in. Identical derivation to
#   compositor_configs_spine_config_dir. The role ensures it (direct-run
#   self-containment, mirror of the 2.6 "Ensure asset deploy targets exist"
#   pattern); on the bootstrap chain the filesystem role already created it.
ags_apps_spine_config_dir: "{{ install_dir | trim }}/config"

# ags_apps_live_bar_link: the live bar. A symlink named `ags` in the spine
#   config root pointing at the unit's bar/ dir, so <install>/config/ags IS
#   the pinned bar. The config-links role exposes it unchanged at
#   ~/.config/ags; the compositor_configs role generates icons.json THROUGH
#   it and runs the unit's `ags-bar-validate` CLI as the strict install gate.
ags_apps_live_bar_link: "{{ ags_apps_spine_config_dir }}/ags"

# ags_apps_state_root / ags_apps_runtime_colors_pointer: the runtime-owned
#   palette consumer pointer the unit bar's colors.css MUST resolve to
#   (<state>/dotfiles/current/colors.gtk.css — the exact target the working
#   v0.3.3 pointer uses; the cache artifact is colors.gtk.css, renamed on
#   link). Derivation mirrors wlogout_config_state_root (one XDG resolution).
#   The role ENSURES <unit>/bar/colors.css is a symlink to this pointer on
#   EVERY deploy (fresh host AND version bump). Without it the live-bar
#   symlink's colors.css dangles, wlogout's @import fails, GTK drops the whole
#   stylesheet, and the bar logs `CSS Error :1:1 Expected a valid selector` —
#   the power icon then opens wlogout with no wallpaper and no icons.
ags_apps_state_root: "{{ ansible_facts.env.XDG_STATE_HOME | default(ansible_facts.env.HOME | default(ansible_facts.user_dir) + '/.local/state', true) }}"
ags_apps_runtime_colors_pointer: "{{ ags_apps_state_root }}/dotfiles/current/colors.gtk.css"

# ags_apps_hypr_pano_dir: the deployed clipboard overlay package — the
#   `hypr-pano/` subdir of the unit (slice 3 moved the in-repo
#   src/gui-tools/hypr-pano/ here as a thin ags-platform consumer); the
#   live-pano link points at this dir. Same monorepo deviation as the bar: the
#   repo root is not the package, the app dir is the package.
ags_apps_hypr_pano_dir: "{{ ags_apps_unit_dir }}/hypr-pano"

# ags_apps_live_pano_link: the live clipboard overlay. A symlink named
#   `ags-hypr-pano` in the spine config root pointing at the unit's hypr-pano/
#   dir, so <install>/config/ags-hypr-pano IS the pinned app. The config-links
#   role exposes it unchanged at ~/.config/ags-hypr-pano; autostart.lua starts
#   it at login and the provisioned `hypr-pano-ui` launcher drives it (cold
#   start `ags run -d ~/.config/ags-hypr-pano`, then `ags request show`; warm
#   `ags request toggle`) through the symlink, never the unit path directly. No
#   per-file copy can drift.
ags_apps_live_pano_link: "{{ ags_apps_spine_config_dir }}/ags-hypr-pano"

# ags_apps_notifications_dir: the deployed notification daemon package — the
#   `notifications/` subdir of the unit (slice 4 moved the in-repo
#   src/gui-tools/notifications/ here as a thin ags-platform consumer); the
#   live-notifications link points at this dir. Same monorepo deviation as the
#   bar: the repo root is not the package, the app dir is the package.
ags_apps_notifications_dir: "{{ ags_apps_unit_dir }}/notifications"

# ags_apps_live_notifications_link: the live notification overlay. A symlink
#   named `ags-notifications` in the spine config root pointing at the unit's
#   notifications/ dir, so <install>/config/ags-notifications IS the pinned
#   app. The config-links role exposes it unchanged at ~/.config/ags-notifications;
#   gui_tools' always-on AGS instance entry starts it at provision time
#   (`ags run -d ~/.config/ags-notifications`) and autostart.lua starts it at
#   login — both THROUGH the symlink, never the unit path directly. It owns
#   org.freedesktop.Notifications for the session. No per-file copy can drift.
ags_apps_live_notifications_link: "{{ ags_apps_spine_config_dir }}/ags-notifications"

# ags_apps_capture_tool_dir: the deployed capture-tool app package — the
#   `capture-tool/` subdir of the unit (slice 5 moved the in-repo GUI here as a
#   thin ags-platform consumer; v0.4.0 moved the Python backend here too); the
#   live-capture link points at this dir. Same monorepo deviation as the bar: the
#   repo root is not the package, the app dir is the package. The Python backend
#   ships in the unit too (bin/capture-tool, ags-apps v0.4.0), so the app is one
#   self-contained component: this role links the backend into the user bin dir
#   (ags_apps_capture_tool_bin_link) and nothing stays in-repo.
ags_apps_capture_tool_dir: "{{ ags_apps_unit_dir }}/capture-tool"

# ags_apps_bin_dir: the user bin dir the capture-tool CLI lands in. Mirror of
#   cli_tools_bin_dir EXACTLY ($UV_TOOL_BIN_DIR -> $XDG_BIN_HOME ->
#   $HOME/.local/bin): the CLI ships in the unit now, but it must be reachable on
#   the same PATH the rest of provisioning uses. A structural test locks the
#   parity, and the role ensures the dir exists before linking (cli_tools also
#   creates it on the bootstrap chain, but ags-apps must stand alone).
ags_apps_bin_dir: >-
  {{ ansible_facts.env.UV_TOOL_BIN_DIR
     | default(ansible_facts.env.XDG_BIN_HOME | default(ansible_facts.env.HOME + '/.local/bin', true), true) }}

# ags_apps_capture_tool_backend: the CLI entry point INSIDE the pinned unit. From
#   ags-apps v0.4.0 the Python backend ships with the app, so the unit is the
#   single source of truth for both the GUI and the controller the GUI shells
#   out to.
ags_apps_capture_tool_backend: "{{ ags_apps_capture_tool_dir }}/bin/capture-tool"

# ags_apps_capture_tool_bin_link: the installed CLI entry point — a SYMLINK in
#   the user bin dir pointing at the unit's backend, exactly mirroring the
#   live-link discipline used for the GUI (`state: link`, `force: true`, so a
#   repoint/rollback converges in one run and a version bump is a repoint, not a
#   copy). `command -v capture-tool` resolves THROUGH it, so the keybind, the
#   AGS GUI and the runtime's notify helper all execute the pinned unit's
#   backend. A pre-existing real file from the retired cli_tools copy is replaced
#   by the link (force).
ags_apps_capture_tool_bin_link: "{{ ags_apps_bin_dir | trim }}/capture-tool"

# ags_apps_live_capture_link: the live capture-tool GUI. A symlink named
#   `ags-capture` in the spine config root pointing at the unit's capture-tool/
#   dir, so <install>/config/ags-capture IS the pinned app. The config-links role
#   exposes it unchanged at ~/.config/ags-capture; the provisioned `capture-ui`
#   launcher (cli_tools) cold-starts it (`ags run -d ~/.config/ags-capture`) and
#   toggles it warm, and autostart.lua starts it at login — all THROUGH the
#   symlink, never the unit path directly. It is an on-demand instance (not
#   always_on), so provisioning quits it and leaves it down. No per-file copy can
#   drift.
ags_apps_live_capture_link: "{{ ags_apps_spine_config_dir }}/ags-capture"

# ags_apps_wallpaper_selector_dir: the deployed wallpaper-selector package — the
#   `wallpaper-selector/` subdir of the unit (slice 6 moved the in-repo
#   src/gui-tools/wallpaper-selector/ here as a thin ags-platform consumer); the
#   live-wallpaper-selector link points at this dir. Same monorepo deviation as
#   the bar: the repo root is not the package, the app dir is the package.
#   Unlike capture-tool the selector is a whole package — no in-repo part
#   survives.
ags_apps_wallpaper_selector_dir: "{{ ags_apps_unit_dir }}/wallpaper-selector"

# ags_apps_live_wallpaper_selector_link: the live wallpaper selector. A symlink
#   named `ags-wallpaper-selector` in the spine config root pointing at the
#   unit's wallpaper-selector/ dir, so <install>/config/ags-wallpaper-selector IS
#   the pinned app. The config-links role exposes it unchanged at
#   ~/.config/ags-wallpaper-selector; the provisioned `wallpaper-selector-ui`
#   launcher (cli_tools) cold-starts it (`ags run -d
#   ~/.config/ags-wallpaper-selector`) and toggles it warm — THROUGH the symlink,
#   never the unit path directly. It is an on-demand instance (not always_on), so
#   provisioning quits it and leaves it down. No per-file copy can drift.
ags_apps_live_wallpaper_selector_link: "{{ ags_apps_spine_config_dir }}/ags-wallpaper-selector"

# ags_apps_icme_dir: the deployed icon color mapping editor package — the
#   `icme/` subdir of the unit (slice 7 moved the in-repo
#   src/gui-tools/icon-color-mapping-editor/ here as a thin ags-platform
#   consumer); the live-icme link points at this dir. Same monorepo deviation as
#   the bar: the repo root is not the package, the app dir is the package. Like
#   the wallpaper selector, icme is a whole package — no in-repo part survives.
ags_apps_icme_dir: "{{ ags_apps_unit_dir }}/icme"

# ags_apps_live_icme_link: the live icon color mapping editor. A symlink named
#   `ags-icme` in the spine config root pointing at the unit's icme/ dir, so
#   <install>/config/ags-icme IS the pinned editor. The config-links role exposes
#   it unchanged at ~/.config/ags-icme; the provisioned
#   `icon-color-mapping-editor` launcher (cli_tools) starts it with
#   `ags run -d ~/.config/ags-icme` and toggles it warm — THROUGH the symlink,
#   never the unit path directly. It is an on-demand instance (not always_on), so
#   provisioning quits it and leaves it down. The launcher's ICME_REPO_ROOT hint
#   is unchanged (it points at this checkout for icon templates/mappings, not at
#   the app sources). No per-file copy can drift.
ags_apps_live_icme_link: "{{ ags_apps_spine_config_dir }}/ags-icme"

# ags_apps_btop_studio_dir: the deployed btop Theme Studio package — the
#   `btop-theme-studio/` subdir of the unit (slice 8 moved the in-repo
#   src/gui-tools/btop-theme-studio/ here as a thin ags-platform consumer); the
#   live-btop-studio link points at this dir. Same monorepo deviation as the bar:
#   the repo root is not the package, the app dir is the package. Like the
#   selector and icme the studio is a whole package — no in-repo part survives,
#   including its Python live preview engine (live/btop_live.py), which the app
#   executes from this tree.
ags_apps_btop_studio_dir: "{{ ags_apps_unit_dir }}/btop-theme-studio"

# ags_apps_live_btop_studio_link: the live btop Theme Studio. A symlink named
#   `ags-btop-studio` in the spine config root pointing at the unit's
#   btop-theme-studio/ dir, so <install>/config/ags-btop-studio IS the pinned
#   studio. The config-links role exposes it unchanged at
#   ~/.config/ags-btop-studio; the provisioned `btop-theme-studio` launcher
#   (cli_tools) cold-starts it (`ags run -d ~/.config/ags-btop-studio`) and
#   toggles it warm — THROUGH the symlink, never the unit path directly. The
#   studio's live-preview engine is resolved as
#   `${GLib.get_current_dir()}/live/btop_live.py`; `ags run -d` re-roots the app
#   into the linked dir (realpathed to this unit subdir), so the engine resolves
#   inside the unit tree — nothing needs to stay in-repo for it. It is an
#   on-demand instance (not always_on), so provisioning quits it and leaves it
#   down. No per-file copy can drift.
ags_apps_live_btop_studio_link: "{{ ags_apps_spine_config_dir }}/ags-btop-studio"

# ags_apps_backup_root: where a displaced legacy bridge dir is preserved.
#   A timestamped subdir per run (mirror of config_links_backup_root): the
#   original is never deleted without preserving it verbatim. Shared by the
#   live-bar link (the retired per-file bar bridge), the live-pano link (the
#   retired per-file clipboard-overlay bridge), the live-notifications link
#   (the retired per-file notification-overlay bridge), the live-capture link
#   (the retired per-file capture-tool GUI bridge), the
#   live-wallpaper-selector link (the retired per-file selector bridge), the
#   live-icme link (the retired per-file editor bridge) and the
#   live-btop-studio link (the retired per-file studio bridge).
ags_apps_backup_root: "{{ ags_apps_install_root }}/bridge-backups"

# ags_apps_platform_version: the pinned platform tag the per-unit resolution
#   shortcut points at. MUST equal ags_platform_version — locked by
#   test_ags_apps_role.py (a platform bump fails loudly until both pins move
#   together). Lives here (not read from the ags_platform role) because roles
#   in different plays share no vars; the structural test is the single
#   source of truth for their equality.
ags_apps_platform_version: v0.2.0

# ags_apps_platform_unit_dir: the pinned platform unit the resolution
#   shortcut resolves the bar's bare `ags-platform` specifier to.
ags_apps_platform_unit_dir: "{{ install_dir | trim }}/ags-platform/{{ ags_apps_platform_version }}"

# ags_apps_resolution_dir: the per-unit node_modules dir — a SIBLING of the
#   bar package, so esbuild's upward walk from <unit>/bar/*.tsx finds it.
#   Lives inside the unit (not under <install>/config/) because the live-bar
#   symlink is realpathed: no <install>/config/ path is an ancestor of the
#   real bar tree.
ags_apps_resolution_dir: "{{ ags_apps_unit_dir }}/node_modules"

# ags_apps_resolution_shortcut: the load-bearing shortcut itself. A symlink
#   named `ags-platform` pointing at the pinned platform unit, so the bar's
#   bare-specifier imports resolve from the realpathed unit tree.
ags_apps_resolution_shortcut: "{{ ags_apps_resolution_dir }}/ags-platform"
