# ags-apps role vars — install the AGS bar as ONE versioned unit and deploy
# it as the live bar.
#
# Spine AD-1 (contracts ← ags-platform ← ags-apps: the bar consumes the
# platform, never vice versa), AD-17 (distribution: one unit, shared
# resolution), AD-23 (fresh host: provisioning installs the pinned unit and
# creates the resolution shortcut). Slice 2 of ags-apps-bar-first: dotfiles
# consumes the bar that slice 1 moved into the ags-apps monorepo, mirroring
# the ags-platform consumption shape (precedent:
# openspec/changes/ags-consume-platform/tasks.md 1.1 — pinned shallow
# anonymous clone, .git removed, pin recorded — and 1.2 — resolution shortcut,
# rollback = repoint).
#
# WHY A SYMLINK, NOT A PER-FILE COPY. Provisioning used to enumerate the bar
# per file (compositor_configs_skeleton_files). Every new bar source had to be
# registered or a fresh provision silently undeployed it. The unit is now
# deployed WHOLE: <install>/config/ags is a symlink into the unit's bar/
# subdir, so the live bar is always exactly the pinned tag — no manifest can
# drift. AGENTS.md §2's "register every new bar source" rule is satisfied BY
# CONSTRUCTION for the bar (there are no per-file bar sources anymore); the
# deploy-coverage gate asserts the absence of stale per-file bar entries
# instead. The clipboard overlay (slice 3) deploys the same way:
# <install>/config/ags-hypr-pano is a symlink into the unit's hypr-pano/ subdir,
# and gui_tools no longer enumerates it per file.
#
# WHY A RESOLUTION SHORTCUT INSIDE THE UNIT. AGS (v3.1.0) embeds esbuild,
# which resolves a bare specifier (`import { x } from "ags-platform"`) from
# `node_modules/` walking UP from the importing file. esbuild realpaths the
# live-bar symlink, so the bar's real tree is <unit>/bar/ — the
# shared-ancestor <install>/config/node_modules/ags-platform the ags_platform
# role creates is NOT an ancestor of that tree and cannot resolve the bar's
# own platform imports. The role therefore creates a second, per-unit
# shortcut at <unit>/node_modules/ags-platform pointing at the pinned
# platform unit. Deleting it makes `ags bundle <unit>/bar/app.tsx` fail with
# `Could not resolve "ags-platform/..."` — the shortcut is load-bearing, not
# decorative (proven by the negative control in the deploy evidence).
#
# DEVIATION FROM THE PLATFORM LAYOUT (documented, not accidental). The
# platform repo ROOT is its package (index.ts at the top), so the clone lands
# directly in the version dir. ags-apps is a MONOREPO: the repo root holds
# bar/ + future app dirs, and the bar package is the `bar/` SUBDIR. The unit
# dir is therefore the repo checkout (<install>/ags-apps/<tag>/) and the
# deployed bar is <unit>/bar/ (ags_apps_bar_dir), never the unit root.
#
# GENERATED + RUNTIME FILES LAND IN THE UNIT TREE. icons.json (generated by
# the compositor_configs role AFTER this role links the live bar) and
# colors.css (the runtime seeder's R2 consumer symlink) resolve through the
# live-bar symlink into the unit checkout — exactly as they landed in the
# deployed per-file tree before. The presence-guarded clone never re-clones,
# so a re-provision never wipes them. On UPGRADE from the old per-file bridge,
# the legacy <install>/config/ags dir is moved aside (timestamped backup, same
# migrate-then-symlink discipline as the config_links role) and colors.css is
# restored from the backup when present, so the bar never loses its palette
# pointer between provision and the next seed.

# ags_apps_repo_url: the PUBLIC monorepo. Cloned over anonymous HTTPS (no
#   credentials) — like the platform repo, NOT like the private repos AD-23
#   fetches with `gh`.
ags_apps_repo_url: https://github.com/RandomGenericUsername/ags-apps.git

# ags_apps_version: THE PIN. The git tag to install, and the name of the
#   version directory under the install root. The tag names a MONOREPO release
#   (`v0.2.0` carries bar/ + hypr-pano/): the unit is deployed whole, so one
#   tag moves every app it ships. Bump this to move the live apps forward,
#   point a live link at an older sibling tag dir to roll back. Recorded on the
#   host at ags_apps_pin_file so the installed version is observable without
#   reading this file.
ags_apps_version: v0.2.0

# ags_apps_install_root: the monorepo home (<install>/ags-apps/). Trim lock:
#   consumes the same validated {{ install_dir | trim }} value the sibling
#   roles use.
ags_apps_install_root: "{{ install_dir | trim }}/ags-apps"

# ags_apps_unit_dir: the installed unit for the pinned tag. The unit is the
#   WHOLE monorepo checkout at the tag (bar/ + future app dirs), NOT the bar
#   package itself — see the DEVIATION note above.
ags_apps_unit_dir: "{{ ags_apps_install_root }}/{{ ags_apps_version }}"

# ags_apps_bar_dir: the deployed bar package — the `bar/` subdir of the unit.
#   Slice 1 moved dotfiles/config/ags/ here verbatim (thin consumer of
#   ags-platform); the live-bar link points at this dir.
ags_apps_bar_dir: "{{ ags_apps_unit_dir }}/bar"

# ags_apps_unit_marker: the file whose presence means "the unit is
#   installed". Used as the idempotency guard for the clone (the git module
#   has no `creates:`), mirroring the zsh_tools role's stat guard.
ags_apps_unit_marker: "{{ ags_apps_bar_dir }}/app.tsx"

# ags_apps_pin_file: the recorded pin (<install>/ags-apps/pinned). A
#   one-line file naming the installed tag; `verify` asserts it, and a human
#   reads it to know what is deployed.
ags_apps_pin_file: "{{ ags_apps_install_root }}/pinned"

# ags_apps_spine_config_dir: the config-in-spine root (<install>/config/),
#   whose parent the live-bar link lands in. Identical derivation to
#   compositor_configs_spine_config_dir. The role ensures it (direct-run
#   self-containment, mirror of the 2.6 "Ensure asset deploy targets exist"
#   pattern); on the bootstrap chain the filesystem role already created it.
ags_apps_spine_config_dir: "{{ install_dir | trim }}/config"

# ags_apps_live_bar_link: the live bar. A symlink named `ags` in the spine
#   config root pointing at the unit's bar/ dir, so <install>/config/ags IS
#   the pinned bar. The config-links role exposes it unchanged at
#   ~/.config/ags; the compositor_configs role generates icons.json THROUGH
#   it and runs the unit's `ags-bar-validate` CLI as the strict install gate.
ags_apps_live_bar_link: "{{ ags_apps_spine_config_dir }}/ags"

# ags_apps_hypr_pano_dir: the deployed clipboard overlay package — the
#   `hypr-pano/` subdir of the unit (slice 3 moved the in-repo
#   src/gui-tools/hypr-pano/ here as a thin ags-platform consumer); the
#   live-pano link points at this dir. Same monorepo deviation as the bar: the
#   repo root is not the package, the app dir is the package.
ags_apps_hypr_pano_dir: "{{ ags_apps_unit_dir }}/hypr-pano"

# ags_apps_live_pano_link: the live clipboard overlay. A symlink named
#   `ags-hypr-pano` in the spine config root pointing at the unit's hypr-pano/
#   dir, so <install>/config/ags-hypr-pano IS the pinned app. The config-links
#   role exposes it unchanged at ~/.config/ags-hypr-pano; autostart.lua and the
#   provisioned `hypr-pano-ui` launcher run `ags run -d ~/.config/ags-hypr-pano`
#   (the symlink), never the unit path directly. No per-file copy can drift.
ags_apps_live_pano_link: "{{ ags_apps_spine_config_dir }}/ags-hypr-pano"

# ags_apps_backup_root: where a displaced legacy bridge dir is preserved.
#   A timestamped subdir per run (mirror of config_links_backup_root): the
#   original is never deleted without preserving it verbatim. Shared by the
#   live-bar link (the retired per-file bar bridge) and the live-pano link (the
#   retired per-file clipboard-overlay bridge).
ags_apps_backup_root: "{{ ags_apps_install_root }}/bridge-backups"

# ags_apps_platform_version: the pinned platform tag the per-unit resolution
#   shortcut points at. MUST equal ags_platform_version — locked by
#   test_ags_apps_role.py (a platform bump fails loudly until both pins move
#   together). Lives here (not read from the ags_platform role) because roles
#   in different plays share no vars; the structural test is the single
#   source of truth for their equality.
ags_apps_platform_version: v0.1.0

# ags_apps_platform_unit_dir: the pinned platform unit the resolution
#   shortcut resolves the bar's bare `ags-platform` specifier to.
ags_apps_platform_unit_dir: "{{ install_dir | trim }}/ags-platform/{{ ags_apps_platform_version }}"

# ags_apps_resolution_dir: the per-unit node_modules dir — a SIBLING of the
#   bar package, so esbuild's upward walk from <unit>/bar/*.tsx finds it.
#   Lives inside the unit (not under <install>/config/) because the live-bar
#   symlink is realpathed: no <install>/config/ path is an ancestor of the
#   real bar tree.
ags_apps_resolution_dir: "{{ ags_apps_unit_dir }}/node_modules"

# ags_apps_resolution_shortcut: the load-bearing shortcut itself. A symlink
#   named `ags-platform` pointing at the pinned platform unit, so the bar's
#   bare-specifier imports resolve from the realpathed unit tree.
ags_apps_resolution_shortcut: "{{ ags_apps_resolution_dir }}/ags-platform"
