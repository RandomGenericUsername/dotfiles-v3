# ags-apps role tasks (spine AD-1/AD-17/AD-23) — install the AGS bar as one
# versioned unit, resolve its platform imports, and deploy it as the live bar.
#
# Design (dedicated role — single responsibility: provision the bar unit):
# - The FIRST task is the fail-loud install_dir seam assert, copied verbatim
#   from the sibling roles (install_dir is deliberately never defaulted in
#   group_vars/all.yml, so an undefined spine root must abort before any task
#   evaluates).
# - The clone is presence-guarded: a `stat` on the unit's bar/app.tsx registers
#   existence and the git clone runs `when: not exists and not
#   ansible_check_mode` (the git module has no `creates:` — mirror of the
#   zsh_tools role). The clone is SHALLOW (`depth: 1`) and ANONYMOUS HTTPS: the
#   repo is public, so no `gh` credential helper is needed.
# - The clone's `.git` is REMOVED: the unit is deployed as a source tree, not a
#   working copy (a stray `.git` under the install spine is neither useful nor
#   wanted). Removal is idempotent (absent -> no change) and runs after a clone.
# - The pin is RECORDED in a one-line file (ags_apps_pin_file) so the installed
#   tag is observable on the host and assertable by `verify`.
# - The resolution shortcut is a per-unit symlink (<unit>/node_modules/
#   ags-platform -> the pinned platform unit). `force: true` makes a repoint
#   converge in one run. It MUST live inside the unit: esbuild realpaths the
#   live-bar symlink, so the shared-ancestor shortcut under <install>/config/
#   is not an ancestor of the real bar tree (see vars/main.yml).
# - The live bar is a symlink (<install>/config/ags -> <unit>/bar/).
#   Upgrading from the old per-file bridge displaces a REAL dir: an empty one
#   (fresh spine, created by the filesystem role) is removed; a non-empty one
#   (the legacy bridge) is moved aside to a timestamped backup — NEVER deleted.
#   The runtime-owned colors.css consumer pointer is then ENSURED on the unit
#   bar (unconditional, idempotent): it is a symlink to the runtime state
#   pointer, inheriting the pre-existing pointer's target when one exists
#   (version bump) and falling back to
#   <state>/dotfiles/current/colors.gtk.css on a fresh host. This runs on EVERY
#   deploy — a version bump repoints the live-bar symlink at a unit dir that
#   never carried the pointer, so a conditional seed leaves it dangling and
#   wlogout's @import (and the bar's own CSS) fails. The pre-existing target is
#   read BEFORE the legacy dir moves so a bump inherits the old palette target.
#   The generated icons.json needs no seed: the compositor_configs role
#   regenerates it through the new link on the SAME run (it runs after this role
#   in bootstrap order).
# - The live clipboard overlay is a symlink too (slice 3):
#   <install>/config/ags-hypr-pano -> <unit>/hypr-pano/. It takes the same
#   backup-then-symlink discipline as the bar (empty real dir removed, non-empty
#   legacy dir moved aside, never deleted) but NO seed step: hypr-pano owns no
#   runtime pointer inside its spine dir (its palette comes from the bar's
#   colors.css through the platform theme adapter).
# - The live notification overlay is a symlink too (slice 4):
#   <install>/config/ags-notifications -> <unit>/notifications/. Identical
#   discipline to the live-pano link (backup-then-symlink, empty real dir
#   removed, non-empty legacy dir moved aside, never deleted, NO seed step —
#   the overlay's palette is applied through the platform theme adapter, which
#   reads the BAR's colors.css). gui_tools keeps only the always-on AGS-instance
#   launch entry that starts the daemon from the now-symlinked
#   ~/.config/ags-notifications.
# - The live capture-tool GUI is a symlink too (slice 5):
#   <install>/config/ags-capture -> <unit>/capture-tool/. Identical discipline to
#   the live-notifications link (backup-then-symlink, empty real dir removed,
#   non-empty legacy dir moved aside, never deleted, NO seed step). gui_tools
#   keeps only the on-demand `capture` AGS-instance entry, which the provisioned
#   `capture-ui` launcher starts from the now-symlinked ~/.config/ags-capture. The
#   Python backend ships in the unit too (ags-apps v0.4.0), and this role links it
#   into the user bin dir, so the app is one self-contained unit.
# - The live wallpaper selector is a symlink too (slice 6):
#   <install>/config/ags-wallpaper-selector -> <unit>/wallpaper-selector/.
#   Identical discipline to the live-capture link (backup-then-symlink, empty
#   real dir removed, non-empty legacy dir moved aside, never deleted, NO seed
#   step). gui_tools keeps only the on-demand `wallpaper-selector` AGS-instance
#   entry, which the provisioned `wallpaper-selector-ui` launcher starts from the
#   now-symlinked ~/.config/ags-wallpaper-selector. The selector is a whole
#   package — nothing stays in-repo (unlike capture-tool's Python backend).
# - The live icon color mapping editor is a symlink too (slice 7):
#   <install>/config/ags-icme -> <unit>/icme/. Identical discipline to the
#   live-wallpaper-selector link (backup-then-symlink, empty real dir removed,
#   non-empty legacy dir moved aside, never deleted, NO seed step). gui_tools
#   keeps only the on-demand `icon-color-mapping-editor` AGS-instance entry,
#   which the provisioned `icon-color-mapping-editor` launcher starts from the
#   now-symlinked ~/.config/ags-icme. The editor is a whole package — nothing
#   stays in-repo.
# - The live btop Theme Studio is a symlink too (slice 8):
#   <install>/config/ags-btop-studio -> <unit>/btop-theme-studio/. Identical
#   discipline to the live-icme link (backup-then-symlink, empty real dir
#   removed, non-empty legacy dir moved aside, never deleted, NO seed step).
#   gui_tools keeps only the on-demand `btop-theme-studio` AGS-instance entry,
#   which the provisioned `btop-theme-studio` launcher starts from the
#   now-symlinked ~/.config/ags-btop-studio. The studio is a whole package: its
#   Python live-preview engine (live/btop_live.py) runs from the unit tree via
#   the app's `${GLib.get_current_dir()}/live/` path, so nothing stays in-repo.
# - User-scoped privilege context: NO become (everything lands under the user's
#   install_dir).
# - Distro-agnostic: a git clone + symlinks are identical on Arch and
#   Debian-family.
# - --check cleanliness: the `command`/`git`/`cp`/`mv` mutations are
#   check-gated; `stat`/`find`/`file` support check mode, so bootstrap.yaml
#   --check stays dry.

- name: Assert install_dir seam is provided
  ansible.builtin.assert:
    that: install_dir is defined and install_dir | trim | length > 0
    fail_msg: >-
      install_dir is undefined or empty — the ags_apps role requires the
      install_dir seam extra-var (the orchestrator resolves
      $XDG_DATA_HOME/dotfiles/; direct runs pass -e install_dir=...)

- name: Ensure the ags-apps install root exists
  ansible.builtin.file:
    path: "{{ ags_apps_install_root }}"
    state: directory
    mode: "0755"

- name: Check whether the pinned ags-apps unit is already installed
  ansible.builtin.stat:
    path: "{{ ags_apps_unit_marker }}"
  register: ags_apps_unit_check

- name: Clone the pinned ags-apps unit (shallow, anonymous HTTPS)
  ansible.builtin.git:
    repo: "{{ ags_apps_repo_url }}"
    dest: "{{ ags_apps_unit_dir }}"
    version: "{{ ags_apps_version }}"
    depth: 1
    single_branch: true
  register: ags_apps_clone
  retries: 3
  delay: 5
  until: ags_apps_clone is succeeded
  when:
    - not ansible_check_mode
    - not ags_apps_unit_check.stat.exists

- name: Remove the clone's .git (deploy the unit as a source tree, not a checkout)
  ansible.builtin.file:
    path: "{{ ags_apps_unit_dir }}/.git"
    state: absent
  when: not ansible_check_mode

- name: Record the pinned bar version
  ansible.builtin.copy:
    content: "{{ ags_apps_version }}\n"
    dest: "{{ ags_apps_pin_file }}"
    mode: "0644"
    force: true

- name: Ensure the spine config root exists for the live-bar link
  ansible.builtin.file:
    path: "{{ ags_apps_spine_config_dir }}"
    state: directory
    mode: "0755"

- name: Ensure the per-unit node_modules dir exists
  ansible.builtin.file:
    path: "{{ ags_apps_resolution_dir }}"
    state: directory
    mode: "0755"

- name: Point the per-unit resolution shortcut at the pinned platform unit
  ansible.builtin.file:
    src: "{{ ags_apps_platform_unit_dir }}"
    dest: "{{ ags_apps_resolution_shortcut }}"
    state: link
    force: true

- name: Check whether the live-bar path already exists
  ansible.builtin.stat:
    path: "{{ ags_apps_live_bar_link }}"
    follow: false
  register: ags_apps_live_bar_check

- name: List the live-bar path's children when it is a real dir
  ansible.builtin.find:
    paths:
      - "{{ ags_apps_live_bar_link }}"
    file_type: any
    hidden: true
  register: ags_apps_live_bar_children
  when:
    - ags_apps_live_bar_check.stat.exists
    - not ags_apps_live_bar_check.stat.islnk | default(false)

# Capture the pre-existing pointer target BEFORE the live-bar link is (re)pointed
# at this unit. On a version bump the live-bar link is ALREADY a symlink into the
# previous unit, whose bar/colors.css is a symlink to the runtime pointer — that
# target must be inherited so the new unit's pointer resolves. On a fresh host
# (no live bar, an empty dir, or a real-dir legacy bridge) there is nothing to
# inherit and the runtime state pointer is the fallback. readlink is read-only,
# so `check_mode: false` keeps the probe live under --check (the run stays dry);
# `failed_when: false` makes every non-symlink/missing case fall back instead of
# aborting.
- name: Read the live bar's pre-existing runtime colors.css pointer target
  ansible.builtin.command:
    argv:
      - readlink
      - "{{ ags_apps_live_bar_link }}/colors.css"
  register: ags_apps_pre_colors_readlink
  changed_when: false
  failed_when: false
  check_mode: false

- name: Remove the live-bar path when it is an empty real dir
  ansible.builtin.file:
    path: "{{ ags_apps_live_bar_link }}"
    state: absent
  when:
    - not ansible_check_mode
    - ags_apps_live_bar_check.stat.exists
    - not ags_apps_live_bar_check.stat.islnk | default(false)
    - ags_apps_live_bar_children.matched | default(0) == 0

- name: Determine the legacy-bridge backup path for this run
  ansible.builtin.set_fact:
    ags_apps_backup_path: "{{ ags_apps_backup_root }}/{{ lookup('pipe', 'date +%Y%m%dT%H%M%S') }}"
  when:
    - ags_apps_live_bar_check.stat.exists
    - not ags_apps_live_bar_check.stat.islnk | default(false)
    - (ags_apps_live_bar_children.matched | default(0)) != 0

- name: Ensure the bridge-backup root exists
  ansible.builtin.file:
    path: "{{ ags_apps_backup_root }}"
    state: directory
    mode: "0755"
  when:
    - ags_apps_live_bar_check.stat.exists
    - not ags_apps_live_bar_check.stat.islnk | default(false)
    - (ags_apps_live_bar_children.matched | default(0)) != 0

- name: Move aside a non-empty legacy bridge dir blocking the live-bar link
  ansible.builtin.command:
    argv:
      - mv
      - "{{ ags_apps_live_bar_link }}"
      - "{{ ags_apps_backup_path }}"
  changed_when: true
  when:
    - not ansible_check_mode
    - ags_apps_live_bar_check.stat.exists
    - not ags_apps_live_bar_check.stat.islnk | default(false)
    - (ags_apps_live_bar_children.matched | default(0)) != 0

- name: Deploy the unit's bar as the live bar
  ansible.builtin.file:
    src: "{{ ags_apps_bar_dir }}"
    dest: "{{ ags_apps_live_bar_link }}"
    state: link
    force: true

# UNCONDITIONAL + IDEMPOTENT (the regression fix). Runs on EVERY deploy — a
# version bump repoints the live-bar symlink at a NEW unit dir that never
# carried the runtime pointer, so this cannot be gated on the live-bar path
# being a real dir (that gate silently skipped the seed on every bump, leaving
# <unit>/bar/colors.css dangling; wlogout's @import then failed and GTK dropped
# the whole stylesheet — no wallpaper, no icons). The target is the pre-existing
# pointer's target when the probe found one (version bump: inherit the old
# unit's target), else the runtime state pointer (fresh host). `file state=link
# force=true` converges in one run, reports changed only when it actually
# creates/repoints, and is fully check-mode safe (no `not ansible_check_mode`
# gate needed).
- name: Ensure the unit bar carries the runtime colors.css pointer
  ansible.builtin.file:
    src: "{{ ags_apps_colors_pointer_source }}"
    dest: "{{ ags_apps_bar_dir }}/colors.css"
    state: link
    force: true
  vars:
    ags_apps_colors_pointer_source: >-
      {{ (ags_apps_pre_colors_readlink.rc | default(1) == 0
          and (ags_apps_pre_colors_readlink.stdout | trim) | length > 0)
         | ternary(ags_apps_pre_colors_readlink.stdout | trim,
                   ags_apps_runtime_colors_pointer) }}

# The clipboard overlay deploys the same way as the bar (ags-apps-bar-first
# slice 3): a symlink into the unit's hypr-pano/ dir, with the SAME
# migrate-then-symlink discipline for a pre-existing real dir (empty -> removed,
# non-empty -> moved aside to a timestamped backup, never deleted). It differs
# from the bar in ONE way: hypr-pano owns NO runtime pointer inside its spine
# dir — its palette is applied through the platform theme adapter, which reads
# the BAR's <install>/config/ags/colors.css — so there is nothing to seed
# before the move and the live-bar link's seed step has no analogue here.
# Both links share the bridge-backup root; the pano backup is suffixed so a run
# that displaces BOTH legacy dirs cannot collide on the timestamp.
- name: Check whether the live-pano path already exists
  ansible.builtin.stat:
    path: "{{ ags_apps_live_pano_link }}"
    follow: false
  register: ags_apps_live_pano_check

- name: List the live-pano path's children when it is a real dir
  ansible.builtin.find:
    paths:
      - "{{ ags_apps_live_pano_link }}"
    file_type: any
    hidden: true
  register: ags_apps_live_pano_children
  when:
    - ags_apps_live_pano_check.stat.exists
    - not ags_apps_live_pano_check.stat.islnk | default(false)

- name: Remove the live-pano path when it is an empty real dir
  ansible.builtin.file:
    path: "{{ ags_apps_live_pano_link }}"
    state: absent
  when:
    - not ansible_check_mode
    - ags_apps_live_pano_check.stat.exists
    - not ags_apps_live_pano_check.stat.islnk | default(false)
    - ags_apps_live_pano_children.matched | default(0) == 0

- name: Determine the legacy-pano-bridge backup path for this run
  ansible.builtin.set_fact:
    ags_apps_pano_backup_path: "{{ ags_apps_backup_root }}/{{ lookup('pipe', 'date +%Y%m%dT%H%M%S') }}-hypr-pano"
  when:
    - ags_apps_live_pano_check.stat.exists
    - not ags_apps_live_pano_check.stat.islnk | default(false)
    - (ags_apps_live_pano_children.matched | default(0)) != 0

- name: Ensure the bridge-backup root exists for the live-pano link
  ansible.builtin.file:
    path: "{{ ags_apps_backup_root }}"
    state: directory
    mode: "0755"
  when:
    - ags_apps_live_pano_check.stat.exists
    - not ags_apps_live_pano_check.stat.islnk | default(false)
    - (ags_apps_live_pano_children.matched | default(0)) != 0

- name: Move aside a non-empty legacy pano bridge dir blocking the live-pano link
  ansible.builtin.command:
    argv:
      - mv
      - "{{ ags_apps_live_pano_link }}"
      - "{{ ags_apps_pano_backup_path }}"
  changed_when: true
  when:
    - not ansible_check_mode
    - ags_apps_live_pano_check.stat.exists
    - not ags_apps_live_pano_check.stat.islnk | default(false)
    - (ags_apps_live_pano_children.matched | default(0)) != 0

- name: Deploy the unit's hypr-pano as the live clipboard overlay
  ansible.builtin.file:
    src: "{{ ags_apps_hypr_pano_dir }}"
    dest: "{{ ags_apps_live_pano_link }}"
    state: link
    force: true

# The notification overlay deploys the same way (slice 4): a symlink into the
# unit's notifications/ dir, with the SAME migrate-then-symlink discipline for a
# pre-existing real dir (empty -> removed, non-empty -> moved aside to a
# timestamped backup, never deleted). Like hypr-pano it owns NO runtime pointer
# inside its spine dir — its palette is applied through the platform theme
# adapter, which reads the BAR's <install>/config/ags/colors.css — so there is
# nothing to seed before the move. The backup is suffixed so a run that
# displaces MULTIPLE legacy dirs cannot collide on the timestamp.
- name: Check whether the live-notifications path already exists
  ansible.builtin.stat:
    path: "{{ ags_apps_live_notifications_link }}"
    follow: false
  register: ags_apps_live_notifications_check

- name: List the live-notifications path's children when it is a real dir
  ansible.builtin.find:
    paths:
      - "{{ ags_apps_live_notifications_link }}"
    file_type: any
    hidden: true
  register: ags_apps_live_notifications_children
  when:
    - ags_apps_live_notifications_check.stat.exists
    - not ags_apps_live_notifications_check.stat.islnk | default(false)

- name: Remove the live-notifications path when it is an empty real dir
  ansible.builtin.file:
    path: "{{ ags_apps_live_notifications_link }}"
    state: absent
  when:
    - not ansible_check_mode
    - ags_apps_live_notifications_check.stat.exists
    - not ags_apps_live_notifications_check.stat.islnk | default(false)
    - ags_apps_live_notifications_children.matched | default(0) == 0

- name: Determine the legacy-notifications-bridge backup path for this run
  ansible.builtin.set_fact:
    ags_apps_notifications_backup_path: "{{ ags_apps_backup_root }}/{{ lookup('pipe', 'date +%Y%m%dT%H%M%S') }}-notifications"
  when:
    - ags_apps_live_notifications_check.stat.exists
    - not ags_apps_live_notifications_check.stat.islnk | default(false)
    - (ags_apps_live_notifications_children.matched | default(0)) != 0

- name: Ensure the bridge-backup root exists for the live-notifications link
  ansible.builtin.file:
    path: "{{ ags_apps_backup_root }}"
    state: directory
    mode: "0755"
  when:
    - ags_apps_live_notifications_check.stat.exists
    - not ags_apps_live_notifications_check.stat.islnk | default(false)
    - (ags_apps_live_notifications_children.matched | default(0)) != 0

- name: Move aside a non-empty legacy notifications bridge dir blocking the live-notifications link
  ansible.builtin.command:
    argv:
      - mv
      - "{{ ags_apps_live_notifications_link }}"
      - "{{ ags_apps_notifications_backup_path }}"
  changed_when: true
  when:
    - not ansible_check_mode
    - ags_apps_live_notifications_check.stat.exists
    - not ags_apps_live_notifications_check.stat.islnk | default(false)
    - (ags_apps_live_notifications_children.matched | default(0)) != 0

- name: Deploy the unit's notifications as the live notification overlay
  ansible.builtin.file:
    src: "{{ ags_apps_notifications_dir }}"
    dest: "{{ ags_apps_live_notifications_link }}"
    state: link
    force: true

# The capture-tool GUI deploys the same way (slice 5): a symlink into the unit's
# capture-tool/ dir, with the SAME migrate-then-symlink discipline for a
# pre-existing real dir (empty -> removed, non-empty -> moved aside to a
# timestamped backup, never deleted). Like hypr-pano and notifications it owns NO
# runtime pointer inside its spine dir — its palette is applied through the
# platform theme adapter, which reads the BAR's <install>/config/ags/colors.css —
# so there is nothing to seed before the move. The backup is suffixed so a run
# that displaces MULTIPLE legacy dirs cannot collide on the timestamp. The GUI's
# icons.json is generated through this link by compositor_configs, exactly like
# the bar's; the Python backend ships in the unit (ags-apps v0.4.0) and this role
# links it into the user bin dir (below), so nothing stays in-repo. The `capture`
# AGS instance entry stays in gui_tools.
- name: Check whether the live-capture path already exists
  ansible.builtin.stat:
    path: "{{ ags_apps_live_capture_link }}"
    follow: false
  register: ags_apps_live_capture_check

- name: List the live-capture path's children when it is a real dir
  ansible.builtin.find:
    paths:
      - "{{ ags_apps_live_capture_link }}"
    file_type: any
    hidden: true
  register: ags_apps_live_capture_children
  when:
    - ags_apps_live_capture_check.stat.exists
    - not ags_apps_live_capture_check.stat.islnk | default(false)

- name: Remove the live-capture path when it is an empty real dir
  ansible.builtin.file:
    path: "{{ ags_apps_live_capture_link }}"
    state: absent
  when:
    - not ansible_check_mode
    - ags_apps_live_capture_check.stat.exists
    - not ags_apps_live_capture_check.stat.islnk | default(false)
    - ags_apps_live_capture_children.matched | default(0) == 0

- name: Determine the legacy-capture-bridge backup path for this run
  ansible.builtin.set_fact:
    ags_apps_capture_backup_path: "{{ ags_apps_backup_root }}/{{ lookup('pipe', 'date +%Y%m%dT%H%M%S') }}-capture-tool"
  when:
    - ags_apps_live_capture_check.stat.exists
    - not ags_apps_live_capture_check.stat.islnk | default(false)
    - (ags_apps_live_capture_children.matched | default(0)) != 0

- name: Ensure the bridge-backup root exists for the live-capture link
  ansible.builtin.file:
    path: "{{ ags_apps_backup_root }}"
    state: directory
    mode: "0755"
  when:
    - ags_apps_live_capture_check.stat.exists
    - not ags_apps_live_capture_check.stat.islnk | default(false)
    - (ags_apps_live_capture_children.matched | default(0)) != 0

- name: Move aside a non-empty legacy capture bridge dir blocking the live-capture link
  ansible.builtin.command:
    argv:
      - mv
      - "{{ ags_apps_live_capture_link }}"
      - "{{ ags_apps_capture_backup_path }}"
  changed_when: true
  when:
    - not ansible_check_mode
    - ags_apps_live_capture_check.stat.exists
    - not ags_apps_live_capture_check.stat.islnk | default(false)
    - (ags_apps_live_capture_children.matched | default(0)) != 0

- name: Deploy the unit's capture-tool as the live capture GUI
  ansible.builtin.file:
    src: "{{ ags_apps_capture_tool_dir }}"
    dest: "{{ ags_apps_live_capture_link }}"
    state: link
    force: true

# The capture-tool CLI is now part of the SAME unit (ags-apps v0.4.0). It is not
# copied: the bin entry is a symlink into the pinned unit, so the controller the
# GUI shells out to is always exactly the tag that ships the GUI (one version,
# one source of truth). A pre-existing real file from the retired cli_tools copy
# is replaced by `force: true` on the first run.
- name: Ensure the capture-tool CLI bin dir exists
  ansible.builtin.file:
    path: "{{ ags_apps_bin_dir | trim }}"
    state: directory
    mode: "0755"

- name: Install the unit's capture-tool backend as the CLI entry point
  ansible.builtin.file:
    src: "{{ ags_apps_capture_tool_backend }}"
    dest: "{{ ags_apps_capture_tool_bin_link }}"
    state: link
    force: true

# Relocated from the cli_tools role when the backend moved into the unit: the
# cli_tools playbook runs BEFORE ags-apps, so the assertion belongs here, after
# the symlink exists. `command -v` is a shell builtin (see cli_tools header) and
# the check is a read-only probe; under --check the link was not created, so the
# probe is gated to keep bootstrap --check dry.
- name: Verify capture-tool is on PATH
  ansible.builtin.shell: "command -v capture-tool"
  environment:
    PATH: "{{ ags_apps_bin_dir | trim }}:{{ ansible_facts.env.PATH }}"
  changed_when: false
  when: not ansible_check_mode

# The wallpaper selector deploys the same way (slice 6): a symlink into the
# unit's wallpaper-selector/ dir, with the SAME migrate-then-symlink discipline
# for a pre-existing real dir (empty -> removed, non-empty -> moved aside to a
# timestamped backup, never deleted). Like hypr-pano/notifications/capture-tool
# it owns NO runtime pointer inside its spine dir — its palette is applied
# through the platform theme adapter, which reads the BAR's
# <install>/config/ags/colors.css — so there is nothing to seed before the move.
