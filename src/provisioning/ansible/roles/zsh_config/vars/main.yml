# Zsh-config role vars (Story 3.4 / shell wiring).
#
# Resolves every variable the .zshrc.j2 template consumes to a real path.
# Distro-specific plugin FILE locations are resolved here via the
# `ansible_os_family` fact (Arch vs Debian differ), mirroring the NFR-3
# isolation discipline: group_vars/all.yml carries the tunable shell dirs +
# fonts, group_vars/{arch,debian-family}.yml carries the package NAMES, and
# THIS role resolves the installed plugin file paths.

# zsh_config_spine_dir: where the rendered .zshrc lands (config-in-spine home).
#   Trim lock: consumes the same validated {{ install_dir | trim }} value the
#   fail-loud first-task assert enforces.
zsh_config_spine_dir: "{{ install_dir | trim }}/config/zsh"

# zsh_config_template_root: where the .zshrc.j2 source lives. It is a
#   REPO-CONFIG template (dotfiles/config/zsh/.zshrc.j2), not a role-internal
#   one (unlike the settings-role templates) — mirror of the config_copies
#   repo-root pattern.
zsh_config_template_root: "{{ playbook_dir }}/../../../.."

# zsh_config_xdg_state_home: the state home the runtime owns ($XDG_STATE_HOME,
#   AD-5: <state>/dotfiles/) — the rendered .zshrc reads the runtime's
#   current/colors.sequences pointer from it (gt-3-2). Provisioning only
#   REFERENCES the path in the rendered consumer config; it never WRITES
#   under the state root (the pointers are runtime writes). Identical
#   derivation to verify_xdg_state_home / filesystem_xdg_state_home — F4
#   lock: ansible_facts.env, NOT the deprecated top-level ansible_env fact.
zsh_config_xdg_state_home: "{{ ansible_facts.env.XDG_STATE_HOME | default(ansible_facts.env.HOME | default(ansible_facts.user_dir) + '/.local/state', true) }}"

# zsh_config_state_current_dir: the runtime-owned current/ pointer dir.
#   AD-5: the state root is ALWAYS <XDG_STATE_HOME>/dotfiles/. Trim lock
#   (stray-whitespace XDG values bit Story 1.11) — mirror of
#   verify_state_current_dir / compositor_configs_state_current_dir; one XDG
#   read per role, downstream consumption is this derived var.
zsh_config_state_current_dir: "{{ zsh_config_xdg_state_home | trim }}/dotfiles/current"

# ── Plugin file paths (distro-resolved) ─────────────────────────────────────
# Each is the FILE the .zshrc.j2 `{% if VAR %}` block sources. Empty string =
# plugin absent → block omitted. Arch paths verified 2026-08-16.
_zsh_config_arch:
  syntax_highlighting: /usr/share/zsh/plugins/zsh-syntax-highlighting/zsh-syntax-highlighting.zsh
  autosuggestions: /usr/share/zsh/plugins/zsh-autosuggestions/zsh-autosuggestions.zsh
  history_substring_search: /usr/share/zsh/plugins/zsh-history-substring-search/zsh-history-substring-search.zsh
  fzf_key_bindings: /usr/share/fzf/key-bindings.zsh
  fzf_completion: /usr/share/fzf/completion.zsh

_zsh_config_debian:
  syntax_highlighting: /usr/share/zsh-syntax-highlighting/zsh-syntax-highlighting.zsh
  autosuggestions: /usr/share/zsh-autosuggestions/zsh-autosuggestions.zsh
  history_substring_search: /usr/share/zsh-history-substring-search/zsh-history-substring-search.zsh
  fzf_key_bindings: /usr/share/doc/fzf/examples/key-bindings.zsh
  fzf_completion: /usr/share/doc/fzf/examples/completion.zsh

# Resolved for the running distro.
zsh_config_plugin_paths: "{{ _zsh_config_arch if ansible_facts['os_family'] == 'Archlinux' else _zsh_config_debian }}"
