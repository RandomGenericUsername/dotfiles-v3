# Zsh-config role vars (Story 3.4 / shell wiring).
#
# Resolves every variable the .zshrc.j2 template consumes to a real path.
# Distro-specific plugin FILE locations are resolved here via the
# `ansible_os_family` fact (Arch vs Debian differ), mirroring the NFR-3
# isolation discipline: group_vars/all.yml carries the tunable shell dirs +
# fonts, group_vars/{arch,debian-family}.yml carries the package NAMES, and
# THIS role resolves the installed plugin file paths.

# zsh_config_spine_dir: where the rendered .zshrc lands (config-in-spine home).
#   Trim lock: consumes the same validated {{ install_dir | trim }} value the
#   fail-loud first-task assert enforces.
zsh_config_spine_dir: "{{ install_dir | trim }}/config/zsh"

# zsh_config_login_shell: the login-shell binary the role converges on. The
#   unprivileged `getent passwd` probe reads the CURRENT shell, and the
#   privileged `user` task runs only when the two differ — so an already-zsh
#   host never escalates (unattended runs have no sudo password). Both Arch and
#   Debian install zsh here.
zsh_config_login_shell: /usr/bin/zsh

# zsh_config_legacy_template_path: the PRE-S3 residue this role removes. Before
#   the template moved to the pinned corpus, `config_copies` copied the whole
#   zsh dir into the spine, including `.zshrc.j2`. zsh reads `.zshrc` via
#   ZDOTDIR and never the template, so a stale `.j2` in the live config dir is
#   exactly the residue the split removes. `verify` asserts it stays absent.
zsh_config_legacy_template_path: "{{ zsh_config_spine_dir }}/.zshrc.j2"

# zsh_config_assets_pinned_tag / zsh_config_assets_templates_dir: the AD-6 mirror
#   of the assets pin and the `templates` class directory inside the pinned
#   checkout. S3: the .zshrc.j2 source is no longer authored here — it ships in
#   `dotfiles-assets` and is read from the checkout the assets role materialized
#   BEFORE this role runs (bootstrap order). Parity-locked to
#   dotfiles/provisioning/assets.yaml `assets.tag` by the required-var parity test
#   (tests/unit/test_template_vars_parity.py). Trim lock on the seam.
zsh_config_assets_pinned_tag: v0.5.0
zsh_config_assets_templates_dir: "{{ install_dir | trim }}/assets/{{ zsh_config_assets_pinned_tag }}/templates"

# zsh_config_xdg_state_home: the state home the runtime owns ($XDG_STATE_HOME,
#   AD-5: <state>/dotfiles/) — the rendered .zshrc reads the runtime's
#   current/colors.sequences pointer from it (gt-3-2). Provisioning only
#   REFERENCES the path in the rendered consumer config; it never WRITES
#   under the state root (the pointers are runtime writes). Identical
#   derivation to verify_xdg_state_home / filesystem_xdg_state_home — F4
#   lock: ansible_facts.env, NOT the deprecated top-level ansible_env fact.
zsh_config_xdg_state_home: "{{ ansible_facts.env.XDG_STATE_HOME | default(ansible_facts.env.HOME | default(ansible_facts.user_dir) + '/.local/state', true) }}"

# zsh_config_state_current_dir: the runtime-owned current/ pointer dir.
#   AD-5: the state root is ALWAYS <XDG_STATE_HOME>/dotfiles/. Trim lock
#   (stray-whitespace XDG values bit Story 1.11) — mirror of
#   verify_state_current_dir / compositor_configs_state_current_dir; one XDG
#   read per role, downstream consumption is this derived var.
zsh_config_state_current_dir: "{{ zsh_config_xdg_state_home | trim }}/dotfiles/current"

# zsh_config_xdg_config_home: the config home whose zsh subdir ZDOTDIR points
#   at. Identical derivation to config_links_xdg_config_home /
#   verify_xdg_config_home / filesystem_xdg_config_home: honors
#   $XDG_CONFIG_HOME with the spec default ~/.config. Uses
#   ansible_facts.env.* (F4 lock).
zsh_config_xdg_config_home: "{{ ansible_facts.env.XDG_CONFIG_HOME | default(ansible_facts.env.HOME | default(ansible_facts.user_dir) + '/.config', true) }}"

# zsh_config_zdotdir: the dir zsh must read startup files from. zsh looks in
#   $ZDOTDIR else $HOME; the rendered .zshrc lives at <spine>/config/zsh and is
#   exposed as ~/.config/zsh via config_links, so ZDOTDIR must point there —
#   without it zsh finds no .zshrc and shows zsh-newuser-install. Derived from
#   zsh_config_xdg_config_home with the trim lock — no second XDG resolution.
zsh_config_zdotdir: "{{ zsh_config_xdg_config_home | trim }}/zsh"

# zsh_config_zshenv_path: the shell-entry file zsh always reads from $HOME
#   (even when ZDOTDIR is set, ~/.zshenv runs first). A one-export pointer —
#   provisioning never places shell content in $HOME beyond this.
zsh_config_zshenv_path: "{{ ansible_facts.env.HOME }}/.zshenv"

# zsh_config_backup_root: where a pre-existing non-managed ~/.zshenv is moved
#   aside before the pointer replaces it. Mirrors config_links_backup_root
#   (timestamped subdir per run so re-runs never clobber a prior backup).
zsh_config_backup_root: "{{ zsh_config_xdg_config_home }}/.dotfiles-backups"

# ── Plugin file paths (distro-resolved) ─────────────────────────────────────
# Each is the FILE the .zshrc.j2 `{% if VAR %}` block sources. Empty string =
# plugin absent → block omitted. Arch paths verified 2026-08-16.
_zsh_config_arch:
  syntax_highlighting: /usr/share/zsh/plugins/zsh-syntax-highlighting/zsh-syntax-highlighting.zsh
  autosuggestions: /usr/share/zsh/plugins/zsh-autosuggestions/zsh-autosuggestions.zsh
  history_substring_search: /usr/share/zsh/plugins/zsh-history-substring-search/zsh-history-substring-search.zsh
  fzf_key_bindings: /usr/share/fzf/key-bindings.zsh
  fzf_completion: /usr/share/fzf/completion.zsh

_zsh_config_debian:
  syntax_highlighting: /usr/share/zsh-syntax-highlighting/zsh-syntax-highlighting.zsh
  autosuggestions: /usr/share/zsh-autosuggestions/zsh-autosuggestions.zsh
  history_substring_search: /usr/share/zsh-history-substring-search/zsh-history-substring-search.zsh
  fzf_key_bindings: /usr/share/doc/fzf/examples/key-bindings.zsh
  fzf_completion: /usr/share/doc/fzf/examples/completion.zsh

# Resolved for the running distro.
zsh_config_plugin_paths: "{{ _zsh_config_arch if ansible_facts['os_family'] == 'Archlinux' else _zsh_config_debian }}"
