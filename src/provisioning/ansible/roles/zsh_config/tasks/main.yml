# Zsh-config role (Story 3.4 / shell wiring) — renders the user's .zshrc from
# the authored Jinja template (dotfiles/config/zsh/.zshrc.j2) into the
# config-in-spine home <install>/config/zsh/.zshrc, resolving every template
# variable to the actual provisioned path.
#
# Previously the .zshrc.j2 was COPIED VERBATIM by config_copies, so zsh (via
# ZDOTDIR=~/.config/zsh) found no .zshrc and nothing loaded — no starship, no
# color scheme, no plugins. This role renders it (the settings-role `template`
# pattern) AFTER the plugin packages (packages role) and clone tools (zsh_tools
# role) are present.
#
# Design:
# - Runs AFTER packages + zsh_tools (plugins + clone tools exist) and BEFORE
#   config_links (so the rendered .zshrc is in the spine when ~/.config/zsh is
#   symlinked). The template vars resolve spine paths, distro plugin paths,
#   and the runtime state-root current dir (COLOR_SCHEME_CURRENT_DIR,
#   gt-3-2) — no palette dependency (the runtime owns the artifact).
# - Distro-specific plugin FILE paths resolve in vars/main.yml via the
#   ansible_os_family fact (Arch vs Debian differ) — mirror of the NFR-3
#   distro isolation discipline: group_vars carries package NAMES, this role
#   resolves the installed FILE locations. The template's `{% if %}` blocks are
#   fed the resolved path or empty, so absent plugins are omitted (clean
#   only-what's-real output).
# - The `template` module has full check-mode support (predicts changed without
#   writing) — no `when: not ansible_check_mode` gate needed.
# - The ~/.zshenv pointer (shell-entry seam): zsh reads $ZDOTDIR else $HOME,
#   so without ZDOTDIR the spine-rendered .zshrc (~/.config/zsh/.zshrc) is
#   invisible and fresh shells show zsh-newuser-install. This role owns the
#   one-line pointer file (user-scoped, no become); config_links owns only the
#   ~/.config/<name> symlinks and never touches $HOME dotfiles.
# - Pre-existing ~/.zshenv content is never destroyed: a file lacking our
#   managed marker is moved aside timestamped (mirror of the config_links
#   backup guard) before the pointer is written. An already-correct pointer is
#   a no-op (idempotent re-run).
# - User-scoped, with ONE privileged exception: changing the login shell
#   requires root (chsh authenticates via PAM on /dev/tty, which does not
#   exist under Ansible — an unprivileged chsh dies with "Authentication token
#   manipulation error" on every fresh bash machine). Only the login-shell
#   task below uses become; everything else stays unprivileged.

- name: Assert install_dir seam is provided
  ansible.builtin.assert:
    that: install_dir is defined and install_dir | trim | length > 0
    fail_msg: >-
      install_dir is undefined or empty — the zsh_config role requires the
      install_dir seam extra-var (the orchestrator resolves
      $XDG_DATA_HOME/dotfiles/; direct runs pass -e install_dir=...)

- name: Ensure zsh config dir exists in the spine
  ansible.builtin.file:
    path: "{{ zsh_config_spine_dir }}"
    state: directory

- name: Check pyenv is present (PYENV_CONFIGURED)
  ansible.builtin.stat:
    path: "{{ shell.pyenv_dir }}"
  register: zsh_config_pyenv_check

- name: Render .zshrc
  ansible.builtin.template:
    src: "{{ zsh_config_template_root }}/dotfiles/config/zsh/.zshrc.j2"
    dest: "{{ zsh_config_spine_dir }}/.zshrc"
  vars:
    STARSHIP_CONFIG: "{{ install_dir | trim }}/config/starship/starship.toml"
    COLOR_SCHEME_CURRENT_DIR: "{{ zsh_config_state_current_dir }}"
    OH_MY_ZSH_DIR: "{{ shell.oh_my_zsh_dir }}"
    NVM_DIR: "{{ shell.nvm_dir }}"
    PYENV_DIR: "{{ shell.pyenv_dir }}"
    PYENV_CONFIGURED: "{{ zsh_config_pyenv_check.stat.exists | default(false) }}"
    ZSH_SYNTAX_HIGHLIGHTING: "{{ zsh_config_plugin_paths.syntax_highlighting }}"
    ZSH_AUTOSUGGESTIONS: "{{ zsh_config_plugin_paths.autosuggestions }}"
    ZSH_HISTORY_SUBSTRING_SEARCH: "{{ zsh_config_plugin_paths.history_substring_search }}"
    FZF_KEY_BINDINGS: "{{ zsh_config_plugin_paths.fzf_key_bindings }}"
    FZF_COMPLETION: "{{ zsh_config_plugin_paths.fzf_completion }}"

- name: Check current ~/.zshenv state
  ansible.builtin.stat:
    path: "{{ zsh_config_zshenv_path }}"
    follow: false
  register: zsh_config_zshenv_check

- name: Check ~/.zshenv already carries our managed pointer
  ansible.builtin.command:
    argv:
      - grep
      - -q
      - DOTFILES_MANAGED_ZDOTDIR
      - "{{ zsh_config_zshenv_path }}"
  register: zsh_config_zshenv_marker
  changed_when: false
  failed_when: false
  when: zsh_config_zshenv_check.stat.exists

- name: Determine backup timestamp for ~/.zshenv
  ansible.builtin.set_fact:
    zsh_config_backup_ts: "{{ lookup('pipe', 'date +%Y%m%dT%H%M%S') }}"
  when:
    - zsh_config_zshenv_check.stat.exists
    - zsh_config_zshenv_marker.rc is defined
    - zsh_config_zshenv_marker.rc != 0

- name: Ensure backup root exists
  ansible.builtin.file:
    path: "{{ zsh_config_backup_root }}"
    state: directory
  when:
    - zsh_config_zshenv_check.stat.exists
    - zsh_config_zshenv_marker.rc is defined
    - zsh_config_zshenv_marker.rc != 0

- name: Back up pre-existing non-managed ~/.zshenv
  ansible.builtin.command:
    argv:
      - mv
      - "{{ zsh_config_zshenv_path }}"
      - "{{ zsh_config_backup_root }}/zshenv-{{ zsh_config_backup_ts }}"
  when:
    - zsh_config_zshenv_check.stat.exists
    - zsh_config_zshenv_marker.rc is defined
    - zsh_config_zshenv_marker.rc != 0
    - not ansible_check_mode

- name: Write managed ~/.zshenv pointer (ZDOTDIR)
  ansible.builtin.copy:
    dest: "{{ zsh_config_zshenv_path }}"
    content: |
      # DOTFILES_MANAGED_ZDOTDIR — provisioned by the zsh_config role. Points
      # zsh at the config-in-spine dir; do not hand-edit (re-rendered).
      export ZDOTDIR="{{ zsh_config_zdotdir }}"
  when: >-
    not zsh_config_zshenv_check.stat.exists
    or zsh_config_zshenv_marker.rc is not defined
    or zsh_config_zshenv_marker.rc != 0

- name: Ensure zsh is the login shell
  ansible.builtin.shell:
    cmd: |
      set -e
      # NOTE: this task runs become:true (root), so $USER is root — the login
      # user comes from the user_id fact (`ansible_facts['user_id']`), never
      # the environment.
      target_user="{{ ansible_facts['user_id'] }}"
      current="$(getent passwd "$target_user" 2>/dev/null | cut -d: -f7 || echo "")"
      if [ "$current" = "/bin/zsh" ] || [ "$current" = "/usr/bin/zsh" ]; then
        echo "already zsh ($current)"
        exit 0
      fi
      zsh_bin="$(command -v zsh 2>/dev/null || echo /bin/zsh)"
      if [ ! -x "$zsh_bin" ]; then echo "zsh not installed at $zsh_bin" >&2; exit 1; fi
      # Validate against /etc/shells (space-separated via tr).
      if ! tr ' ' '\n' < /etc/shells 2>/dev/null | grep -qxF "$zsh_bin"; then
        echo "not in /etc/shells: $zsh_bin" >&2; exit 1
      fi
      chsh -s "$zsh_bin" "$target_user"
  args:
    executable: /bin/bash
  become: true
  when: not ansible_check_mode
  tags: [login_shell]
  register: zsh_config_chsh
  changed_when: "'already zsh' not in zsh_config_chsh.stdout"
  failed_when: zsh_config_chsh.rc != 0
