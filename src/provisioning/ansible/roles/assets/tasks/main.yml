# Assets role (Story 2.6; pinned corpus since S1) — deploys the asset kinds into
# the install spine that the filesystem role (2.5) created (FR-17, chaining-spine.md):
# the wallpaper tarball, the icon-template / icon-mapping / csg-template
# directories, and the weg-effects catalog.
#
# S1 CUT-OVER (spine AD-6/AD-13): the icon/content corpus is no longer read from
# this checkout. The FIRST corpus task shallow-clones `assets_repo` at
# `assets_pinned_tag` into `<install>/assets/<tag>/`, removes the clone's .git,
# and writes `<install>/assets/pinned`; every corpus copy reads that checkout.
# A missing or mis-pinned checkout fails loud BEFORE the first copy (stat+assert),
# because synchronize against a missing src copies nothing and would leave the
# previous catalog in place.
#
# Design (locked in Story 2.6 Dev Notes):
# - The FIRST task is the fail-loud install_dir seam assert, copied verbatim
#   from the filesystem role (AC 8): install_dir is deliberately never defaulted
#   (group_vars/all.yml), so an undefined spine root must abort with a friendly
#   message before any task evaluates. Do NOT alias install_dir into a var —
#   lazy evaluation could surface a raw undefined-var error instead.
# - S5 (AD-12): after the clone and before the first copy, every class contract
#   is read from the checkout and its `schema_major` must equal
#   `assets_schema_support`. A corpus the consumer cannot parse fails naming the
#   file and the accepted window, never half-deploys.
# - THREE different module idempotency shapes live in one role (do NOT
#   cargo-cult a single pattern):
#   1. ansible.builtin.file `state: directory` (AC 9) owns idempotency +
#      check-mode natively. Exists because unarchive does NOT create its
#      `dest` ("The given path must exist. Base directory is not created by
#      this module") — the four deploy targets are re-ensured here so the role
#      is self-contained on a direct assets.yaml run.
#   2. ansible.builtin.unarchive (AC 2) with remote_src: true (the tarball is
#      already on the target — the repo is local). DELIBERATELY NO `creates:`
#      (AC 10, FR-18): replacing wallpapers.tar.gz must cause the next apply to
#      re-extract so Story 2.7 can regenerate the palette. Idempotency comes
#      from unarchive's natural re-extract-when-changed behavior.
#      Check-mode caveat: partial support for .tar.gz — the task is skipped
#      under --check; that keeps "dry-run must be dry" satisfied.
#   3. ansible.posix.synchronize (AC 3-5) loops the directory kinds with
#      delete: true — a MIRROR, not a merge: files deleted from the repo
#      (e.g. replaced icon template groups) must vanish from the spine on the
#      next apply, exactly as fresh installs see them. Every `source` ends
#      with `/` (contents-into-dest semantics, no accidental nested dir).
#      (2026-09-07: replaced ansible.builtin.copy, which merged only and left
#      stale deleted templates behind on converged hosts.)
#   4. ansible.builtin.command `weg dump-effects` (AC 6) is the 2.4
#      command+`creates:` pattern verbatim — the ONLY idempotency/dry-run
#      mechanism on command modules (filesystem check, not a registered rc).
# - default.png presence (AC 11) is a stat + assert PAIR, both gated
#   `when: not ansible_check_mode` (under --check the unarchive is skipped so
#   the file is not yet present; an assert alone cannot check file existence).
# - User-scoped privilege context: NO become/become_user anywhere (AC 12).
# - No composition-repo paths: every corpus source is an absolute path into the
#   pinned assets checkout ({{ assets_checkout_root }}/...), asserted present
#   before the first copy. The csg-templates source is the same shape for the
#   pinned csg checkout (spine AD-10).

- name: Assert install_dir seam is provided
  ansible.builtin.assert:
    that: install_dir is defined and install_dir | trim | length > 0
    fail_msg: >-
      install_dir is undefined or empty — the assets role requires the
      install_dir seam extra-var (the orchestrator resolves
      $XDG_DATA_HOME/dotfiles/; direct runs pass -e install_dir=...)

- name: Check for weg
  ansible.builtin.shell: command -v weg
  register: assets_weg_check
  changed_when: false
  failed_when: false
  environment:
    PATH: "{{ assets_weg_bin_dir }}:{{ ansible_facts.env.PATH }}"

- name: Ensure weg is available
  ansible.builtin.assert:
    that: assets_weg_check.rc == 0 and assets_weg_check.stdout | length > 0
    fail_msg: >-
      weg not found on PATH — the assets role requires weg, which the
      cli_tools role (Story 2.4) installs via uv tool install into
      ~/.local/bin; run the cli-tools playbook first (direct-run
      prerequisite, AC 9)
  when: not ansible_check_mode

# ── Pinned assets checkout (spine AD-6/AD-13) ──
# Shallow-clone repo@tag into <install>/assets/<tag>/, drop the clone's .git
# (it is deployed as data, not a working copy — the ags_apps unit discipline),
# and record the tag in <install>/assets/pinned. Check-mode discipline mirrors
# cli_tools/ags_apps: the stat probe runs under --check, the clone and .git
# removal are gated `when: not ansible_check_mode`, and the pin-file copy
# supports check mode (would-change, never writes).
- name: Ensure the pinned assets root exists
  ansible.builtin.file:
    path: "{{ install_dir | trim }}/assets"
    state: directory
    mode: "0755"

- name: Check whether the pinned assets checkout is already present
  ansible.builtin.stat:
    path: "{{ assets_checkout_root }}/icons/schema.json"
  register: assets_checkout

- name: Clone the pinned assets corpus at its tag (shallow, anonymous HTTPS)
  ansible.builtin.git:
    repo: "{{ assets_repo }}"
    dest: "{{ assets_checkout_root }}"
    version: "{{ assets_pinned_tag }}"
    depth: 1
    single_branch: true
  register: assets_clone
  retries: 3
  delay: 5
  until: assets_clone is succeeded
  when:
    - not ansible_check_mode
    - not assets_checkout.stat.exists

- name: Remove the pinned assets checkout's .git (deploy as data, not a working copy)
  ansible.builtin.file:
    path: "{{ assets_checkout_root }}/.git"
    state: absent
  when: not ansible_check_mode

- name: Record the pinned assets tag beside the checkout
  ansible.builtin.copy:
    content: "{{ assets_pinned_tag }}\n"
    dest: "{{ assets_pinned_file }}"
    mode: "0644"
    force: true

- name: Check the pinned assets corpus is present before any copy
  ansible.builtin.stat:
    path: "{{ assets_checkout_root }}/icons/schema.json"
  register: assets_checkout_present
  when: not ansible_check_mode

- name: Assert the pinned assets corpus is present before any copy
  ansible.builtin.assert:
    that: assets_checkout_present.stat.isreg | default(false)
    fail_msg: >-
      the pinned assets corpus is missing at {{ assets_checkout_root }} (no
      icons/schema.json) — the assets role clones
      {{ assets_repo }} at {{ assets_pinned_tag }} before copying, so a missing
      checkout means the clone failed or the pin is wrong. A copy from a missing
      src would silently deploy nothing.
  when: not ansible_check_mode

# ── AD-12: the contracts must be consumable BEFORE anything is deployed ──
# Every class contract states its `schema_major`; the consumer accepts exactly
# the values in `assets_schema_support` (configs/content ship no contract and
# have no entry). These tasks run after the clone/presence assert and BEFORE
# the first copy, so a corpus two majors ahead fails naming the file instead of
# half-deploying shapes the downstream renderer misreads. All probs are
# read-only (find/slurp report changed: false) and gated `not
# ansible_check_mode`, mirroring the presence probe above: a dry run never reads
# a checkout it did not fetch.
- name: Find the pinned template schema contracts
  ansible.builtin.find:
    paths: "{{ assets_checkout_root }}/templates"
    patterns: "*.vars.schema.json"
    recurse: true
    # HIDDEN is true on purpose: the zsh contract is `.zshrc.vars.schema.json`
    # (hidden), so the default `hidden: false` would silently skip one schema
    # the consumer renders against.
    hidden: true
    file_type: file
  register: assets_template_schema_files
  when: not ansible_check_mode

- name: Read the pinned icons schema contract
  ansible.builtin.slurp:
    src: "{{ assets_checkout_root }}/icons/schema.json"
  register: assets_icons_schema
  when: not ansible_check_mode

- name: Read the pinned desktop schema contract
  ansible.builtin.slurp:
    src: "{{ assets_checkout_root }}/desktop/desktop.yaml"
  register: assets_desktop_schema
  when: not ansible_check_mode

- name: Read every pinned template schema contract
  ansible.builtin.slurp:
    src: "{{ item.path }}"
  loop: "{{ assets_template_schema_files.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  register: assets_template_schemas
  when: not ansible_check_mode

- name: Assert the pinned icons schema_major is in the consumer support window
  ansible.builtin.assert:
    that: >-
      (assets_icons_schema.content | b64decode | from_json).schema_major
      == assets_schema_support.icons
    fail_msg: >-
      {{ assets_icons_schema.source }} declares schema_major
      {{ (assets_icons_schema.content | b64decode | from_json).schema_major }},
      but this consumer supports icons schema_major
      {{ assets_schema_support.icons }} (assets {{ assets_pinned_tag }}). The
      contract's major moves independently of the repo tag, so this is a corpus
      the installer cannot read — pin an assets tag whose icons contract is
      {{ assets_schema_support.icons }}, or widen `assets_schema_support`
      deliberately (a MAJOR bump of the consumer contract)
  when: not ansible_check_mode

- name: Assert the pinned desktop schema_major is in the consumer support window
  ansible.builtin.assert:
    that: >-
      (assets_desktop_schema.content | b64decode | from_yaml).schema_major
      == assets_schema_support.desktop
    fail_msg: >-
      {{ assets_desktop_schema.source }} declares schema_major
      {{ (assets_desktop_schema.content | b64decode | from_yaml).schema_major }},
      but this consumer supports desktop schema_major
      {{ assets_schema_support.desktop }} (assets {{ assets_pinned_tag }}). The
      contract's major moves independently of the repo tag, so this is a corpus
      the installer cannot read — pin an assets tag whose desktop contract is
      {{ assets_schema_support.desktop }}, or widen `assets_schema_support`
      deliberately (a MAJOR bump of the consumer contract)
  when: not ansible_check_mode

- name: Assert the pinned templates ship at least one schema contract
  ansible.builtin.assert:
    that: assets_template_schema_files.matched | int > 0
    fail_msg: >-
      no `<checkout>/templates/**/*.vars.schema.json` contract was found under
      {{ assets_checkout_root }}/templates — every template has shipped a
      sibling vars schema since v0.1.0, so an empty result means the checkout is
      partial or the tag is wrong. This consumer supports templates schema_major
      {{ assets_schema_support.templates }}
  when: not ansible_check_mode

- name: Assert every pinned template schema_major is in the consumer support window
  ansible.builtin.assert:
    that: >-
      (item.content | b64decode | from_json).schema_major
      == assets_schema_support.templates
    fail_msg: >-
      {{ item.source }} declares schema_major
      {{ (item.content | b64decode | from_json).schema_major }}, but this
      consumer supports templates schema_major
      {{ assets_schema_support.templates }} (assets {{ assets_pinned_tag }}).
      The contract's major moves independently of the repo tag, so this is a
      corpus the installer cannot read — pin an assets tag whose template
      contracts are {{ assets_schema_support.templates }}, or widen
      `assets_schema_support` deliberately (a MAJOR bump of the consumer
      contract)
  loop: "{{ assets_template_schemas.results | default([]) }}"
  loop_control:
    label: "{{ item.source }}"
  when: not ansible_check_mode

- name: Ensure asset deploy targets exist
  ansible.builtin.file:
    path: "{{ install_dir | trim }}/{{ item }}"
    state: directory
  loop: "{{ assets_deploy_dirs }}"

- name: Verify wallpapers tarball contains default.png
  ansible.builtin.shell: "tar -tzf '{{ assets_wallpapers_tarball }}' | grep -qx default.png"
  register: assets_wallpapers_tarball_check
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Assert wallpapers tarball contains default.png
  ansible.builtin.assert:
    that: assets_wallpapers_tarball_check.rc == 0
    fail_msg: >-
      default.png is missing from the wallpapers tarball — the tarball may
      have regressed (FR-18 regenerate semantics depend on it; a stale
      default.png on disk must not mask the omission)
  when: not ansible_check_mode

- name: Unpack wallpapers tarball
  ansible.builtin.unarchive:
    src: "{{ assets_wallpapers_tarball }}"
    dest: "{{ assets_wallpapers_dest }}"
    remote_src: true
  when: not ansible_check_mode

- name: Deploy directory asset kinds (mirror, prune deleted files)
  ansible.posix.synchronize:
    src: "{{ item.source }}"
    dest: "{{ install_dir | trim }}/{{ item.target }}"
    delete: true
  loop: "{{ assets_copies }}"
  when: not ansible_check_mode

# csg-templates reads the PINNED csg checkout (spine AD-10), which the
# cli_tools role materializes at <install>/cli-tools/csg/<tag>/ (bootstrap
# order: cli-tools.yaml before assets.yaml). The source is already absolute, so
# this loop is the same mirror WITHOUT the repo-root prefix. The stat/assert
# pair above makes a missing or mis-pinned checkout a named failure here rather
# than a silently empty deploy (synchronize against a missing src copies
# nothing and would leave the previous catalog in place).
- name: Check the pinned csg checkout template catalog exists
  ansible.builtin.stat:
    path: "{{ assets_csg_templates_source }}"
  register: assets_csg_templates_dir
  when: not ansible_check_mode

- name: Assert the pinned csg checkout template catalog is deployed
  ansible.builtin.assert:
    that: assets_csg_templates_dir.stat.isdir | default(false)
    fail_msg: >-
      the pinned csg template catalog is missing at
      {{ assets_csg_templates_source }} — the assets role copies it FROM the
      cli_tools checkout (spine AD-10), so the cli-tools playbook must have
      cloned csg at {{ assets_csg_pinned_tag }} first (bootstrap order:
      cli-tools.yaml before assets.yaml). A missing checkout means the csg pin
      was never fetched; re-run the cli-tools playbook
  when: not ansible_check_mode

- name: Deploy directory asset kinds that live in a pinned checkout (mirror, prune)
  ansible.posix.synchronize:
    src: "{{ item.source }}"
    dest: "{{ install_dir | trim }}/{{ item.target }}"
    delete: true
  loop: "{{ assets_checkout_copies }}"
  when: not ansible_check_mode

- name: Check default.png was unpacked
  ansible.builtin.stat:
    path: "{{ install_dir | trim }}/wallpapers/default.png"
  register: assets_default_png
  when: not ansible_check_mode

- name: Assert default.png is present
  ansible.builtin.assert:
    that: assets_default_png.stat.exists
    fail_msg: >-
      {{ install_dir | trim }}/wallpapers/default.png was not unpacked — the
      wallpapers tarball may have regressed (FR-18 regenerate semantics depend
      on it; Story 2.7 re-asserts the same presence)
  when: not ansible_check_mode

- name: Check WEG effects catalog
  ansible.builtin.stat:
    path: "{{ assets_weg_effects_target }}"
  register: assets_weg_catalog

- name: Emit WEG effects catalog
  ansible.builtin.command:
    argv:
      - weg
      - dump-effects
      - --output
      - "{{ assets_weg_effects_target }}"
  when: not assets_weg_catalog.stat.exists or assets_weg_catalog.stat.size == 0
  environment:
    PATH: "{{ assets_weg_bin_dir }}:{{ ansible_facts.env.PATH }}"
