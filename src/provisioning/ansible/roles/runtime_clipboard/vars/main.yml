# runtime_clipboard role vars (D1, Phase 5).
#
# runtime_clipboard_bin_dir: where `uv tool install` drops dotfiles-runtime,
#   resolved EXACTLY as uv does ($UV_TOOL_BIN_DIR -> $XDG_BIN_HOME ->
#   $HOME/.local/bin). Mirrors runtime_daemon_bin_dir so the unit's ExecStart
#   points at the binary provisioning actually installed.
runtime_clipboard_bin_dir: >-
  {{ ansible_facts.env.UV_TOOL_BIN_DIR
     | default(ansible_facts.env.XDG_BIN_HOME | default(ansible_facts.env.HOME + '/.local/bin', true), true) }}

# runtime_clipboard_unit_name: the --user unit file name.
runtime_clipboard_unit_name: dotfiles-runtime-clipboard.service

# runtime_clipboard_daemon_unit_name: the hub unit the clipboard job talks to.
#   The job healthily degrades with no hub, but ordering After it means a
#   normal login registers the job immediately instead of racing the daemon's
#   name acquisition.
runtime_clipboard_daemon_unit_name: dotfiles-runtime-daemon.service

# Supervision tuning (mirror of runtime_daemon; AD-33/C4):
# - Type=simple: the job owns no bus name, so there is nothing to gate
#   readiness on. The watcher must simply stay alive.
# - Restart=always: a crashed/quit watcher is always restarted so history
#   keeps accumulating without a manual toggle.
# - RestartSec + StartLimit keep a persistent failure from hot-looping.
runtime_clipboard_restart_sec: 5
runtime_clipboard_start_limit_interval_sec: 60
runtime_clipboard_start_limit_burst: 3
