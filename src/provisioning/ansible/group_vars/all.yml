# Shared, distro-agnostic settings for the dotfiles provisioning scaffold.
#
# This file is the seam for variables that apply to every host regardless of
# OS family. Keep it MINIMAL.
#
# `install_dir` is deliberately NOT defaulted here: the orchestrator seam
# always provides it via --extra-vars (use_cases `_seam_extra_vars`), and an
# undefined `install_dir` must FAIL LOUDLY in the renders (Story 2.11) rather
# than silently resolve to a default.
#
# Spine sub-path variables (e.g. spine_wallpapers_dir) are authored when the
# filesystem/assets/settings roles land (Stories 2.5-2.11) — do not guess them
# here.
#
# DOCUMENTED RUNTIME DEPENDENCIES (not installed by this chain):
# - podman OR docker — required by the container-mode CLIs. The cli_tools role
#   builds the csg image via `csg install` and the default_palette role runs
#   `csg generate` in container mode; both DETECT the engine at runtime
#   (podman preferred, then docker, then fail loud). Installing one is OUT OF
#   SCOPE for these roles — address it in the packages role (Story 2.3) /
#   fresh-machine bootstrap (Story 3.1) when dependency provisioning is done.
# - uv — required by the cli_tools role (`uv tool install`); pre-seeded by
#   bootstrap.sh (Story 3.1).
