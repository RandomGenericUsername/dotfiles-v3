# Debian-family (apt) — consumed by the packages role (Story 2.3).
# Filename matches the IFactReader.os_family() seam contract ("debian-family").
#
# Per-manager names resolve HERE, not in the manifest and not in Python
# (NFR-3 distro isolation). Font names verified against the Debian packages
# archive at implementation time (2026-08-09); hyprland/hyprpaper availability
# (not in Debian stable / Ubuntu default repos) is a packages role concern
# (third-party repo / PPA enablement), not resolved here — group_vars only
# carries the names. AGS is AUR-only (no Debian package): it must be built
# from source on Debian (packages role concern, deferred; same as hyprland).
packages:
  hyprland: hyprland
  hyprpaper: hyprpaper
  ags: aylurs-gtk-shell-git
  # Container engine for the csg container-mode chain (same rationale as Arch).
  # Debian package names; rootless podman deps.
  container_engine:
    - podman
    - slirp4netns
    - fuse-overlayfs
  fonts:
    - fonts-noto
    - fonts-noto-cjk
    - fonts-noto-color-emoji
  # Zsh shell plugins (Debian names; the zsh_config role resolves the
  # per-distro plugin FILE paths, which differ from Arch).
  zsh:
    - zsh-syntax-highlighting
    - zsh-autosuggestions
    - zsh-history-substring-search
    - fzf
    - exa
    - bat
    - starship
  # Display manager — SDDM + Qt6 (same rationale as Arch; SDDM Wayland greeter
  # avoids the X11-greater GPU freeze with Hyprland). Pixie theme installed by
  # the display_manager role.
  display_manager:
    - sddm
    - qt6-declarative
    - qt6-svg
