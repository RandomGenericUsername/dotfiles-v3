# Debian-family (apt) — consumed by the packages role (Story 2.3).
# Filename matches the IFactReader.os_family() seam contract ("debian-family").
#
# Per-manager names resolve HERE, not in the manifest and not in Python
# (NFR-3 distro isolation). Font names verified against the Debian packages
# archive at implementation time (2026-08-09); hyprland/hyprpaper availability
# (not in Debian stable / Ubuntu default repos) is a packages role concern
# (third-party repo / PPA enablement), not resolved here — group_vars only
# carries the names. AGS is AUR-only (no Debian package): it must be built
# from source on Debian (packages role concern, deferred; same as hyprland).
packages:
  hyprland: hyprland
  hyprpaper: hyprpaper
  networkmanager: networkmanager # NM backend for astal-network (bar); also gives nmtui/nmcli
  wifitui: wifitui # WiFi TUI (impala-style) launched from the bar's network widget
  librsvg: librsvg # SVG rendering (gdk-pixbuf loader) for AGS bar icons
  # uwsm: systemd-managed session launch (same rationale as Arch).
  uwsm: uwsm
  ags: aylurs-gtk-shell-git
  # AstalWp binding backing the AGS settings panel's audio routing (AUR-only
  # upstream; no Debian package — must be built from source like ags/hyprland, a
  # packages role concern, deferred). Kept as the upstream name so the logical
  # set matches Arch; packages_use_aur is false here so it is not AUR-installed.
  # Bluetooth needs no Astal binding — the panel talks BlueZ D-Bus directly.
  astal-wp: libastal-wireplumber-git # AstalWp — WirePlumber audio (settings panel volume)
  # BlueZ stack the panel's own bluetooth-service.ts talks to over D-Bus.
  # bluez-utils is merged into bluez on Debian — the sane distro mapping for the
  # logical bluez-utils entry.
  bluez: bluez
  bluez-utils: bluez
  ffmpeg: ffmpeg
  pipewire: pipewire
  wireplumber: wireplumber
  # Debian ships the BlueZ SPA in libspa-0.2-bluetooth (Arch: pipewire-audio) —
  # no Bluetooth audio sink exists without it (settings panel routing).
  pipewire-audio: libspa-0.2-bluetooth
  gpu-screen-recorder: gpu-screen-recorder
  wf-recorder: wf-recorder
  # Container engine for the csg container-mode chain (same rationale as Arch).
  # Debian package names; rootless podman deps.
  container_engine:
    - podman
    - slirp4netns
    - fuse-overlayfs
  fonts:
    - fonts-noto
    - fonts-noto-cjk
    - fonts-noto-color-emoji
  # Zsh shell plugins (Debian names; the zsh_config role resolves the
  # per-distro plugin FILE paths, which differ from Arch).
  zsh:
    - zsh-syntax-highlighting
    - zsh-autosuggestions
    - zsh-history-substring-search
    - fzf
    - exa
    - bat
    - starship
  terminal:
    - kitty
  btop: btop # System monitor (AGS bar icon launcher)
  thunderbird: thunderbird # Mail client (AGS bar icon launcher)
  # adw-gtk-theme intentionally ABSENT on Debian-family (Option A 2026-09-09):
  # no official package (adw-gtk3 README points at a 3rd-party repo). Debian
  # keeps its distro GTK theme; the config-links gtk-3.0 theme migration is
  # gated to the Arc-Dark value so it no-ops here.
  brightnessctl: brightnessctl # Screen backlight (XF86MonBrightness*)
  playerctl: playerctl # Media transport MPRIS (XF86AudioPlay/Next/Prev)
  wlogout: wlogout # Logout menu (AGS power-menu click target)
  rofi: rofi # Application launcher (SUPER+D)
  # Display manager — SDDM + Qt6 (same rationale as Arch; SDDM Wayland greeter
  # avoids the X11-greater GPU freeze with Hyprland). Pixie theme installed by
  # the display_manager role.
  display_manager:
    - sddm
    - qt6-declarative
    - qt6-svg
