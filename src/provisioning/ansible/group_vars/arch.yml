# Arch (pacman + AUR) — consumed by the packages role (Story 2.3).
# Filename matches the IFactReader.os_family() seam contract ("arch").
#
# Per-manager names resolve HERE, not in the manifest and not in Python
# (NFR-3 distro isolation). Names verified against pacman at implementation
# time (2026-08-09).
packages:
  hyprland: hyprland
  hyprpaper: hyprpaper
  networkmanager: networkmanager # NM backend for astal-network (bar); also gives nmtui/nmcli
  speedtest: speedtest-cli # Official Arch CLI; UI also supports Ookla JSON when its CLI is present
  nm-connection-editor: nm-connection-editor # standalone extra package (split from network-manager-applet); AGS Wi-Fi Settings footer target
  wifitui: wifitui # WiFi TUI (impala-style) launched from the bar's network widget
  librsvg: librsvg # SVG rendering (gdk-pixbuf loader) for AGS bar icons
  # uwsm: wraps the Hyprland session in a systemd user unit (hyprland-uwsm
  # desktop entry, shipped by the hyprland pkg) so dead sessions can't linger
  # and hold the DRM device — root cause of the SDDM login bounce loop.
  uwsm: uwsm
  # AGS (Aylur's GTK Shell v2) is AUR-only on Arch (correct-course 2026-08-18):
  # the AUR package name resolves here; the packages role routes it through the
  # aur_packages channel (kewlfft.aur.aur + yay), NOT ansible.builtin.package.
  ags: aylurs-gtk-shell-git
  # AstalWp binding backing the AGS settings panel's audio routing (AUR-only on
  # Arch, mirroring ags): the per-manager name resolves here and the packages
  # role routes it through aur_packages (kewlfft.aur.aur + yay), NOT
  # ansible.builtin.package. Bluetooth needs no Astal binding — the panel talks
  # BlueZ D-Bus directly.
  astal-wp: libastal-wireplumber-git # AstalWp — WirePlumber audio (settings panel volume)
  # BlueZ stack the panel's own bluetooth-service.ts talks to over D-Bus
  # (official repo) — the packages role enables + starts bluetooth.service
  # after install.
  bluez: bluez
  bluez-utils: bluez-utils # bluetoothctl + the bluetooth.service unit
  # The GTK Bluetooth manager: the target of the panel's "Bluetooth Settings"
  # row, and the only agent on the system that can answer a PIN/passkey
  # request (the panel's own agent is NoInputNoOutput / Just Works).
  blueman: blueman
  ffmpeg: ffmpeg
  pipewire: pipewire
  wireplumber: wireplumber
  # pipewire-audio ships the bluez5 SPA (libspa-bluez5.so) — without it
  # WirePlumber creates NO Bluetooth audio sink, so a connected headset has no
  # audio to route to (verified: the file is owned by this package, and the
  # Panel's audio routing is a no-op without it).
  pipewire-audio: pipewire-audio
  pipewire-pulse: pipewire-pulse # PulseAudio compatibility server (pavucontrol + Pulse clients)
  pavucontrol: pavucontrol       # GUI mixer (debugging reference for the AGS audio popup)
  gpu-screen-recorder: gpu-screen-recorder
  wf-recorder: wf-recorder
  # vainfo (libva-utils) — the VA-API codec probe. gpu-screen-recorder names it
  # verbatim in its own "your gpu does not support 'vpX'" failure, and the
  # capture tool cannot otherwise tell "this GPU cannot encode VP8" (a hardware
  # limit, WebM's gsr default codec) from "the VA driver is not wired up" (a
  # provisioning defect). From the launcher the two are indistinguishable: the
  # `start` call reports success and no file ever appears.
  libva-utils: libva-utils
  # Screenshot + clipboard stack (capture-tool shells grim/slurp/wl-copy;
  # the runtime clipboard watcher needs `wl-paste --watch`). These were
  # missing while verify stayed green — pinned in verify_system_binaries.
  capture:
    - grim
    - slurp
    - wl-clipboard
  # Session services the compositor autostart expects (autostart.lua starts
  # them at login): hyprpolkitagent (polkit agent) + the portal backends.
  # Absent units made those starts fail silently — broken auth dialogs and no
  # Hyprland portal backend (screen-share/screencast).
  portals:
    - hyprpolkitagent
    - xdg-desktop-portal-hyprland
    - xdg-desktop-portal-gtk
  # Screen-lock stack (documented must-haves). Presence only until lock/idle
  # binds + config land — no role consumes them yet.
  lock:
    - hyprlock
    - hypridle
  # dunst: installed ONLY to be masked (gui_tools masks it; the AGS overlay
  # owns notifications). verify's mask gate hard-requires the unit file, so an
  # undeclared dunst fails fresh machines without a host default.
  dunst: dunst
  # thunar: file manager launched by keybindings.lua — host-default luck only.
  thunar: thunar
  # xdg-utils: owns the `xdg-mime` and `xdg-open` binaries TWO provisioning
  # paths and two runtime consumers hard-depend on:
  #   * gui_tools runs `xdg-mime default thunar.desktop inode/directory` to pin
  #     the directory handler (with no explicit default the mime database
  #     resolved inode/directory to kitty-open.desktop, so the capture tool's
  #     "Show in folder" opened a terminal instead of a file manager);
  #   * verify gates `xdg-mime query default inode/directory` against that pin;
  #   * the capture tool's "Show in folder" and hypr-pano's URL opener shell
  #     `xdg-open`.
  # Undeclared, the gui_tools task failed outright (no such binary) and the
  # verify assert failed with it — a fresh machine could not reach the gate.
  xdg-utils: xdg-utils
  # Container engine for the csg container-mode chain (cli_tools builds the
  # image + runtime-seed runs csg generate under podman). DOCUMENTED DEPENDENCY — must be provisioned on
  # a fresh machine (VM-verified 2026-08-19: a fresh Arch cloud image has no
  # engine, so the csg image build aborts). slirp4netns + fuse-overlayfs make
  # rootless podman work out of the box.
  container_engine:
    - podman
    - slirp4netns
    - fuse-overlayfs
  fonts:
    - ttf-jetbrains-mono-nerd
    - noto-fonts
    - noto-fonts-cjk
    - noto-fonts-emoji
    - ttf-nerd-fonts-symbols
  # Zsh shell plugins (consumed by the packages role; the zsh_config role
  # resolves the per-distro plugin FILE paths). exa/bat/starship are the
  # shell aliases + prompt the rendered .zshrc wires.
  zsh:
    - zsh-syntax-highlighting
    - zsh-autosuggestions
    - zsh-history-substring-search
    - fzf
    - exa
    - bat
    - starship
  terminal:
    - kitty
  btop: btop # System monitor (AGS bar icon launcher)
  thunderbird: thunderbird # Mail client (AGS bar icon launcher)
  # GTK3 theme (extra repo — Option A 2026-09-09): adw-gtk3 unifies GTK3 apps
  # (thunar, wlogout, native menus/dialogs, thunderbird's native bits) with the
  # libadwaita design language the GTK4 apps already wear. Installed here so the
  # packages role makes it present; the theme switch itself is a gated one-time
  # settings.ini migration in the config-links role (gtk-3.0 dir).
  adw_gtk_theme: adw-gtk-theme
  power-options-gtk: power-options-gtk # Portable power management (AUR) — defacto, launched from battery widget
  hyprmod: hyprmod # Hyprland module manager (GTK4/libadwaita)
  nvm: nvm # Node Version Manager (extra repo) — build-time satisfier: tidal-hifi-git's
    # PKGBUILD getnvm() shells out to `makepkg -si --asdeps` (unflaggable, hangs on an
    # invisible pacman prompt) when neither `nvm` nor /usr/share/nvm/init-nvm.sh exists.
    # Installed here, the PKGBUILD sources the system script and never self-bootstraps.
  brightnessctl: brightnessctl # Screen backlight (XF86MonBrightness*)
  playerctl: playerctl # Media transport MPRIS (XF86AudioPlay/Next/Prev)
  wlogout: wlogout # Logout menu (AGS power-menu click target)
  rofi: rofi # Application launcher (Wayland fork, SUPER+D)
  # Display manager — SDDM + Qt6 (provisioned by the display_manager role with
  # the Pixie theme and a Wayland greeter; installed here too so the packages
  # role makes them present in the aggregate). X11 greeters grabbed the GPU and
  # froze Hyprland; SDDM's Wayland greeter avoids that.
  display_manager:
    - sddm
    - qt6-declarative
    - qt6-svg
  # AI development tools (provision-ai-ides-and-clis). AUR-only on Arch, so the
  # names resolve here and the packages role routes them through aur_packages
  # (kewlfft.aur.aur + yay), NOT ansible.builtin.package. Arch-only keys: a
  # Debian-family host does not receive these (documented scope). See
  # dotfiles/provisioning/packages.yaml for the logical manifest entries and
  # the pinned dotfiles-assets `desktop/applications/*.desktop` for the rofi
  # launch overrides (S4).
  antigravity-ide: antigravity-ide # Google Antigravity IDE (VS Code fork)
  windsurf: devin-desktop # Windsurf, rebranded "Devin Desktop" upstream
  vscode: visual-studio-code-bin # Microsoft build (Marketplace + Copilot)
  copilot-cli: github-copilot-cli # GitHub Copilot CLI (new @github/copilot)
  codex-cli: openai-codex-bin # OpenAI Codex CLI
