name: gates

# The repo's executable gates. "Reuse the existing architecture" and
# "the mock matches the code" are only real if something runs them.
#
# ALIGNMENT IS CHECKED, NOT ASSERTED. `make gates-ci` in the Makefile is the
# authoritative set, and it is NOT self-evident that the jobs here equal it: an
# earlier version of this header claimed this workflow "is the place a future
# change cannot quietly drop one", and no code made that true. It was measurably
# false — `bluetooth-mock-parity` sat in `gates-ci` and had no job, so it ran on
# every developer's machine and never once on a push. The `ci-gates-parity` job
# below runs `make ci-gates-parity`, which compares this file's job keys against
# the `gates-ci` target set and fails non-zero naming anything unmatched in
# EITHER direction. Renames and deliberate exclusions are declared in
# `scripts/ci-gates-parity.py` (`RENAMES`, `CI_ONLY_EXEMPT`, `CI_EXCLUDED_GATES`),
# so a difference is a reviewed entry rather than a gap a reader skips.
#
# Layout: one job per gate, so a failure names the gate that broke instead of
# hiding behind a combined command's exit code.
#
# WHICH GATES, AND WHY NOT MORE. This file carries one job per runner-capable
# gate; `make gates-ci` in the Makefile is the authoritative set. That set is now
# simply `GATES` with NO exclusions: the one gate that could not run on a stock
# `ubuntu-latest` runner was `capture-typecheck` (it needed `ags` on PATH plus the
# Astal/GIR libraries it describes, and `ags types` generates ~49 MB of
# machine-specific .d.ts from THIS host's GTK/Astal install), and it was RETIRED
# with the in-repo capture GUI (ags-apps-bar-first slice 5) — the GUI and its
# gates moved into the `ags-apps` unit. Listing an un-runnable gate here would not
# make it stricter — it would make every push red on a missing binary, which is how
# a broken gate trains people to ignore the gate list.
#
# The bar-dev gates that used to run on a `[self-hosted, linux]` runner were
# retired the same way with the in-repo bar bridge — the bar's own repo now owns
# them.
#
# Those differences are DECLARED entries, not absences: `ci-gates-parity`
# verifies every gate the `gates-ci` filter removes has a reason in
# `CI_EXCLUDED_GATES` (no stock job) or `CI_SELF_HOSTED_GATES` (excluded from the
# stock set but still run on a self-hosted runner), and that every declared entry
# still matches the tree. Both tables are empty today, so an exclusion cannot
# silently disappear, and a new gate cannot silently join one.
#
# `make gates` still runs all of them for a developer on a provisioned desktop.
# Nothing is dropped, only relocated: the honest statement is "this gate does not
# run in CI", never "this gate passes in CI".
#
# TRIGGER. This repository's default branch is `master` (`origin/HEAD ->
# origin/master`); `main` does not exist locally or on the remote, so a
# `push: branches: [main]` trigger can never fire. Every gate in this file had
# therefore only ever run by hand. `pull_request` is kept unfiltered so a PR from
# any branch is still checked.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  ansible-embedded-template-lint:
    name: ansible-embedded-template-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # uv, because the lint PARSES the YAML with PyYAML (both real offenders
      # are folded `>-` block scalars spanning two lines, so a line grep cannot
      # see them) and PyYAML ships with the provisioning project. Needs no
      # desktop stack.
      - uses: astral-sh/setup-uv@v5
        with:
          # Runtime requires >=3.14; pin the interpreter so uv selects a
          # CPython with a cp314 Pillow wheel instead of building 11.3.0 from
          # sdist on 3.15 (R-03).
          python-version: "3.14"
      - name: Ansible tree has no template nested in a Jinja string literal
        run: make ansible-embedded-template-lint

  # The bar deploys WHOLE as the pinned external `ags-apps` unit and the
  # platform is the external `ags-platform` bare specifier (spine AD-17). This
  # gate asserts that provisioning SHAPE: no stale per-file `dotfiles/config/ags/`
  # entry may remain in the manifest (a stale one templates INTO the unit tree
  # through the live-bar link), the retired in-place `platform/` dir must not
  # exist, and both unit roles must install their pinned unit + shortcut.
  #
  # uv, because the gate parses the deploy manifest as YAML with PyYAML (the same
  # runner capability `ansible-embedded-template-lint` uses). It
  # needs no desktop stack, so it runs on a stock runner and is in gates-ci.
  deploy-coverage:
    name: deploy-coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          # Runtime requires >=3.14; pin the interpreter so uv selects a
          # CPython with a cp314 Pillow wheel instead of building 11.3.0 from
          # sdist on 3.15 (R-03).
          python-version: "3.14"
      - name: The external bar + platform units are provisioned (bridge retired)
        run: make deploy-coverage

  ci-gates-parity:
    name: ci-gates-parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # uv, because the check PARSES the workflow as YAML (PyYAML ships with the
      # provisioning project — the same runner capability
      # `ansible-embedded-template-lint` uses above), rather than line-mangling
      # it. It needs no desktop stack.
      #
      # This job is the mechanism the header describes: it compares this file's
      # job keys against `make gates-ci` and fails non-zero naming anything
      # unmatched in either direction. It is itself a gate in that set, so the
      # check that proves the list is complete runs in the list it proves.
      - uses: astral-sh/setup-uv@v5
        with:
          # Runtime requires >=3.14; pin the interpreter so uv selects a
          # CPython with a cp314 Pillow wheel instead of building 11.3.0 from
          # sdist on 3.15 (R-03).
          python-version: "3.14"
      - name: Workflow jobs match `make gates-ci`
        run: make ci-gates-parity

  # The per-app contract drift + symbol suites, run from the ROOT gate (AD-19).
  # Each app's suite previously ran only via that app's own `make test`, which
  # nothing at the repo root invoked, so the suites rotted (the ICME drift suite
  # had been red since the speed-test contract gained ssid/server_name). They are
  # pure Node over the committed contract and the apps' pure modules -- no
  # desktop stack -- so this runs on a stock runner. Node 24 is pinned for native
  # .ts type-stripping, which is unflagged only from 22.18.
  per-app-drift-symbol-suites:
    name: per-app-drift-symbol-suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Per-app contract drift + symbol suites
        run: make per-app-drift-symbol-suites
