name: gates

# The repo's executable gates. "Reuse the existing architecture" and
# "the mock matches the code" are only real if something runs them, so this
# workflow is the place a future change cannot quietly drop one.
#
# Layout: one job per gate, so a failure names the gate that broke instead of
# hiding behind a combined command's exit code.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    name: contracts-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Run the event-contract drift gate
        run: make contracts-check

  wifi-mock-parity:
    name: wifi-mock-parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wi-Fi mock<->code parity
        run: python3 scripts/wifi-mock-parity.py

  speedtest-mock-parity:
    name: speedtest-mock-parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Speed-test mock<->code parity
        run: python3 scripts/speedtest-mock-parity.py

  speedtest-no-new-architecture:
    name: speedtest-no-new-architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Speed-test path reuses the existing seams
        run: python3 scripts/speedtest-no-new-architecture.py

  # Audio mock<->code parity: the owner-approved concept mock is the source of
  # truth for the redesigned panel's surface, so this gate is what makes that
  # claim mechanical rather than a review opinion -- the same role as the Wi-Fi
  # and speed-test parity gates above.
  #
  # The render gate (audio-panel-render.test.mjs) is NOT wired here yet: it is
  # in `make audio-panel-gates` and joins CI when the panel is confirmed
  # rendering live (tasks.md 6.6).
  audio-mock-parity:
    name: audio-mock-parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audio mock<->code parity
        run: python3 scripts/audio-mock-parity.py

  # Typecheck the AGS layer (tasks.md 6.5). `ags bundle` transpiles without
  # typechecking, which is how a mis-cased shorthand property in the composition
  # root passed every other gate and died on startup.
  #
  # Needs `ags types` for the GObject-introspection typings, so this is the one
  # gate that cannot run on a bare ubuntu-latest runner; it is wired to the
  # self-hosted runner where ags is installed. Until then `make ags-typecheck`
  # is the authoritative local run.
  ags-typecheck:
    name: ags-typecheck
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install TypeScript
        run: npm ci --no-save typescript@5.9.3 || npm i --no-save typescript@5.9.3
      - name: Typecheck the AGS layer
        run: make ags-typecheck
