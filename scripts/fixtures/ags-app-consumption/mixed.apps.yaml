# Fixture: one legacy owner and one standalone owner. The union is complete:
# every app appears exactly once and exactly one role owns each entry.
apps:
  - app: bar
    installDir: bar
    owner: legacy
    instance: ags
    configDir: ags
    configLink: ags
    spineLink: ags
    xdgLink: ags
    autostart: ags
    launch: always
    barPalettePointer: true
    cutoverId: REQ-015
  - app: hypr-pano
    installDir: hypr-pano
    owner: standalone
    repo: https://github.com/RandomGenericUsername/ags-clipboard.git
    tag: v0.1.0
    instance: hypr-pano
    configDir: ags-hypr-pano
    configLink: ags-hypr-pano
    spineLink: ags-hypr-pano
    xdgLink: ags-hypr-pano
    launcher: hypr-pano-ui
    autostart: hypr-pano
    launch: on-demand
    cutoverId: REQ-009
