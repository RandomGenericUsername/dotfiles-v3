<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Capture — Recording (GIF)</title>
<link rel="stylesheet" href="mockup.css" />
</head>
<body class="screen">
  <div class="capture-panel">
    <div class="mode-switch">
      <button data-mode="screenshot">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.2l.9-1.6A1.5 1.5 0 0 1 9 3.6h6a1.5 1.5 0 0 1 1.3.8l.9 1.6h1.3A2.5 2.5 0 0 1 21 8.5v9A2.5 2.5 0 0 1 18.5 20h-13A2.5 2.5 0 0 1 3 17.5z"/><circle cx="12" cy="13" r="3.4"/></svg>
        Screenshot
      </button>
      <button class="active" data-mode="recording">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="13" height="12" rx="2.5"/><path d="M15.5 10.5 21 7.8v8.4l-5.5-2.7z"/></svg>
        Recording
      </button>
    </div>

    <div class="settings">
      <div class="setting-block">
        <span class="setting-label">Capture target</span>
        <div class="targets">
          <button class="target selected">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v13a2 2 0 0 0 2 2h13"/><path d="M3 6h13a2 2 0 0 1 2 2v13"/></svg>
            Region
          </button>
          <button class="target">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="19" height="13" rx="2"/><path d="M9 20.5h6M12 17v3.5"/></svg>
            Screen
          </button>
          <button class="target">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="15" rx="2.5"/><path d="M3 9h18"/><path d="M6 6.8h.01M8.6 6.8h.01"/></svg>
            Window
          </button>
        </div>
      </div>

      <div class="setting-row">
        <span class="setting-label">Format</span>
        <div class="segments">
          <button class="segment">MP4</button>
          <button class="segment">WebM</button>
          <button class="segment selected">GIF</button>
        </div>
      </div>

      <div class="setting-row">
        <span class="setting-label">Frame rate</span>
        <div class="segments">
          <button class="segment">10</button>
          <button class="segment selected">15</button>
          <button class="segment">20</button>
          <button class="segment">30</button>
        </div>
      </div>

      <div class="setting-row">
        <span class="setting-label">Size</span>
        <div class="segments">
          <button class="segment selected">Original</button>
          <button class="segment">75%</button>
          <button class="segment">50%</button>
        </div>
      </div>

      <div class="setting-row">
        <span class="setting-label">Quality</span>
        <div class="segments">
          <button class="segment">Low</button>
          <button class="segment selected">Medium</button>
          <button class="segment">High</button>
        </div>
      </div>

      <div class="setting-row">
        <span class="setting-label">Duration</span>
        <div class="segments">
          <button class="segment">&#8734;</button>
          <button class="segment selected">10s</button>
          <button class="segment">30s</button>
          <button class="segment">60s</button>
        </div>
      </div>

      <!-- Audio row is gone entirely for GIF; a short note explains why. -->
      <div class="notice">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.4"/><circle cx="12" cy="7.8" r=".9" fill="currentColor" stroke="none"/></svg>
        <span>GIF has no audio track, so audio options are hidden. Keep GIFs short — files grow quickly.</span>
      </div>

      <button class="primary record">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5.6" fill="currentColor" stroke="none"/></svg>
        Start Recording
      </button>
    </div>

    <div class="panel-footer">
      <span><span class="kbd">Esc</span> cancel</span>
      <span>GIF mode &mdash; audio hardware is never opened</span>
    </div>
  </div>
</body>
</html>
