<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Capture — Screenshot</title>
<link rel="stylesheet" href="mockup.css" />
</head>
<body class="screen">
  <div class="capture-panel">
    <!-- Mode switch: the first question is "what am I doing?" -->
    <div class="mode-switch">
      <button class="active" data-mode="screenshot">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.2l.9-1.6A1.5 1.5 0 0 1 9 3.6h6a1.5 1.5 0 0 1 1.3.8l.9 1.6h1.3A2.5 2.5 0 0 1 21 8.5v9A2.5 2.5 0 0 1 18.5 20h-13A2.5 2.5 0 0 1 3 17.5z"/><circle cx="12" cy="13" r="3.4"/></svg>
        Screenshot
      </button>
      <button data-mode="recording">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="13" height="12" rx="2.5"/><path d="M15.5 10.5 21 7.8v8.4l-5.5-2.7z"/></svg>
        Recording
      </button>
    </div>

    <div class="settings">
      <!-- Targets are the objects you point at: promoted to tiles -->
      <div class="setting-block">
        <span class="setting-label">Capture target</span>
        <div class="targets">
          <button class="target selected">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v13a2 2 0 0 0 2 2h13"/><path d="M3 6h13a2 2 0 0 1 2 2v13"/></svg>
            Region
          </button>
          <button class="target">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="19" height="13" rx="2"/><path d="M9 20.5h6M12 17v3.5"/></svg>
            Screen
          </button>
          <button class="target">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="15" rx="2.5"/><path d="M3 9h18"/><path d="M6 6.8h.01M8.6 6.8h.01"/></svg>
            Window
          </button>
        </div>
      </div>

      <div class="setting-row">
        <span class="setting-label">Delay</span>
        <div class="segments">
          <button class="segment selected">None</button>
          <button class="segment">3s</button>
          <button class="segment">5s</button>
          <button class="segment">10s</button>
        </div>
      </div>

      <div class="setting-row">
        <span class="setting-label">Format</span>
        <div class="segments">
          <button class="segment selected">PNG</button>
          <button class="segment">JPEG</button>
        </div>
      </div>

      <div class="setting-row">
        <span class="setting-label">Output</span>
        <div class="segments">
          <button class="segment selected">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4.5" width="12" height="16" rx="2"/><path d="M9.4 4.5V3.6c0-.8.6-1.4 1.4-1.4h2.4c.8 0 1.4.6 1.4 1.4v.9"/><path d="M9.6 11.5h4.8M9.6 15h4.8"/></svg>
            Clipboard
          </button>
          <button class="segment">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5v11"/><path d="m7.5 10.5 4.5 4.5 4.5-4.5"/><path d="M5 20h14"/></svg>
            Save
          </button>
        </div>
      </div>

      <button class="primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.2l.9-1.6A1.5 1.5 0 0 1 9 3.6h6a1.5 1.5 0 0 1 1.3.8l.9 1.6h1.3A2.5 2.5 0 0 1 21 8.5v9A2.5 2.5 0 0 1 18.5 20h-13A2.5 2.5 0 0 1 3 17.5z"/><circle cx="12" cy="13" r="3.4"/></svg>
        Take Screenshot
      </button>
    </div>

    <div class="panel-footer">
      <span><span class="kbd">Esc</span> cancel &nbsp;·&nbsp; <span class="kbd">Enter</span> capture</span>
      <span>Remembers your last choices</span>
    </div>
  </div>
</body>
</html>
