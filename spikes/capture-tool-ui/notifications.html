<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Capture — Notifications</title>
<link rel="stylesheet" href="mockup.css" />
</head>
<body class="screen">
  <div class="toast-stack">
    <div class="toast">
      <div class="toast-thumb ok">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.2l.9-1.6A1.5 1.5 0 0 1 9 3.6h6a1.5 1.5 0 0 1 1.3.8l.9 1.6h1.3A2.5 2.5 0 0 1 21 8.5v9A2.5 2.5 0 0 1 18.5 20h-13A2.5 2.5 0 0 1 3 17.5z"/><circle cx="12" cy="13" r="3.4"/></svg>
      </div>
      <div>
        <div class="toast-title">Screenshot captured</div>
        <div class="toast-body">~/Pictures/Screenshots/screenshot_2026-08-28_16-50-21.png</div>
        <div class="toast-actions">
          <button>Copy again</button>
          <button>Open</button>
        </div>
      </div>
    </div>

    <div class="toast">
      <div class="toast-thumb ok">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="13" height="12" rx="2.5"/><path d="M15.5 10.5 21 7.8v8.4l-5.5-2.7z"/></svg>
      </div>
      <div>
        <div class="toast-title">Recording saved &middot; 00:42 &middot; 18.4 MB</div>
        <div class="toast-body">~/Videos/Recordings/recording_2026-08-28_16-54-02.mp4</div>
        <div class="toast-actions">
          <button>Open</button>
          <button>Show in folder</button>
        </div>
      </div>
    </div>

    <div class="toast">
      <div class="toast-thumb err">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 21 19.5H3z"/><path d="M12 10v4.2"/><circle cx="12" cy="17" r=".9" fill="currentColor" stroke="none"/></svg>
      </div>
      <div>
        <div class="toast-title">Capture failed</div>
        <div class="toast-body">Screen capture permission denied. Check Hyprland screencopy permissions.</div>
        <div class="toast-actions">
          <button>Details</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
